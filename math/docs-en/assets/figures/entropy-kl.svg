<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" role="img" aria-label="Entropy and KL divergence: how spread out a distribution is, and how far apart two are">
  <rect x="60.0" y="115.6" width="26.0" height="74.4" rx="3" class="blue" stroke-width="1"/>
  <rect x="94.0" y="166.0" width="26.0" height="24.0" rx="3" class="blue" stroke-width="1"/>
  <rect x="128.0" y="178.0" width="26.0" height="12.0" rx="3" class="blue" stroke-width="1"/>
  <rect x="162.0" y="184.0" width="26.0" height="6.0" rx="3" class="blue" stroke-width="1"/>
  <rect x="196.0" y="186.4" width="26.0" height="3.6" rx="3" class="blue" stroke-width="1"/>
  <line x1="54.0" y1="190.0" x2="228.0" y2="190.0" class="ln" stroke-width="1.1"/>
  <text x="141.0" y="210.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">Peaked distribution</text>
  <text x="141.0" y="230.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">Low entropy: confident</text>
  <rect x="280.0" y="158.8" width="26.0" height="31.2" rx="3" class="orange" stroke-width="1"/>
  <rect x="314.0" y="163.6" width="26.0" height="26.4" rx="3" class="orange" stroke-width="1"/>
  <rect x="348.0" y="166.0" width="26.0" height="24.0" rx="3" class="orange" stroke-width="1"/>
  <rect x="382.0" y="168.4" width="26.0" height="21.6" rx="3" class="orange" stroke-width="1"/>
  <rect x="416.0" y="173.2" width="26.0" height="16.8" rx="3" class="orange" stroke-width="1"/>
  <line x1="274.0" y1="190.0" x2="448.0" y2="190.0" class="ln" stroke-width="1.1"/>
  <text x="361.0" y="210.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">Flat distribution</text>
  <text x="361.0" y="230.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">High entropy: hesitant</text>
  <text x="370.0" y="246.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">Entropy H(p) = −Σ p log p</text>
  <rect x="470.0" y="70.0" width="180.0" height="120.0" rx="10" class="purple" stroke-width="1.3"/>
  <text x="560.0" y="96.0" class="purple-s" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="700">KL(p‖q)</text>
  <text x="560.0" y="122.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">= Σ p log(p / q)</text>
  <text x="560.0" y="148.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">Extra cost of using q instead of p</text>
  <text x="560.0" y="166.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">how many bits</text>
  <text x="560.0" y="222.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">Speculative decoding, distillation</text>
  <text x="560.0" y="242.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">and RL constraints all measure this</text>
</svg>
