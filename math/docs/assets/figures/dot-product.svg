  <text x="430.0" y="184.0" class="orange-s" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="700">b</text>
  <line x1="390.0" y1="90.0" x2="406.8" y2="182.4" class="ln" stroke-width="1.3" stroke-dasharray="4 4" stroke-opacity="0.6"/>
