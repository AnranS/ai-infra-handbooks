  <text x="525.0" y="91.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle">a · b = |a||b|cos θ</text>
  <text x="525.0" y="150.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">夹角越小，点积越大</text>
  <text x="525.0" y="172.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">垂直时点积为 0</text>
