<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" role="img" aria-label="文生图 pipeline 的三个部件：文本编码器算一次，去噪网络算几十次，VAE 解码一次">
  <rect x="20.0" y="40.0" width="90.0" height="40.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="65.0" y="60.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">提示词</text>
  <line x1="110.0" y1="60.0" x2="145.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="150.0,60.0 143.9,63.4 143.9,56.6" class="ah"/>
  <rect x="150.0" y="30.0" width="130.0" height="60.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="215.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="215.0" dy="-6.8">文本编码器</tspan><tspan x="215.0" dy="13.6">CLIP / T5</tspan></text>
  <text x="215.0" y="104.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="215.0" dy="-5.9">调用 1 次（CFG 再编码一次空提示词）</tspan><tspan x="215.0" dy="11.8">输出的条件向量整个过程不变 → 可缓存</tspan></text>
  <line x1="280.0" y1="60.0" x2="336.5" y2="116.5" class="ln" stroke-width="1.3"/>
  <polygon points="340.0,120.0 333.3,118.0 338.0,113.3" class="ah"/>
  <rect x="20.0" y="140.0" width="90.0" height="40.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="65.0" y="160.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="65.0" dy="-6.5">随机噪声</tspan><tspan x="65.0" dy="13.0">（种子）</tspan></text>
  <line x1="110.0" y1="160.0" x2="295.0" y2="160.0" class="ln" stroke-width="1.3"/>
  <polygon points="300.0,160.0 293.9,163.4 293.9,156.6" class="ah"/>
  <rect x="300.0" y="118.0" width="170.0" height="84.0" rx="9" class="blue" stroke-width="1.8"/>
  <text x="385.0" y="140.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">去噪网络</text>
  <text x="385.0" y="160.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">UNet / DiT</text>
  <text x="385.0" y="184.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">× N 步 × (CFG ? 2 : 1)</text>
  <path d="M 470 150 C 520 150 520 100 470 100 C 440 100 440 118 455 118" class="blue-l" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="600.0" y="96.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-5.9">每一步：预测 → 调度器更新 x_t</tspan><tspan x="600.0" dy="11.8">几乎全部计算量都在这里</tspan></text>
  <line x1="470.0" y1="170.0" x2="515.0" y2="170.0" class="ln" stroke-width="1.3"/>
  <polygon points="520.0,170.0 513.9,173.4 513.9,166.6" class="ah"/>
  <rect x="520.0" y="150.0" width="80.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="560.0" y="170.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">VAE 解码器</text>
  <line x1="600.0" y1="170.0" x2="635.0" y2="170.0" class="ln" stroke-width="1.3"/>
  <polygon points="640.0,170.0 633.9,173.4 633.9,166.6" class="ah"/>
  <rect x="640.0" y="150.0" width="50.0" height="40.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="665.0" y="170.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">图像</text>
  <text x="560.0" y="212.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="560.0" dy="-5.9">调用 1 次，但在像素分辨率上做卷积：</tspan><tspan x="560.0" dy="11.8">激活是潜空间的 64 倍，常是显存峰值</tspan></text>
  <text x="350.0" y="246.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">拆成三个阶段之后服务层才能做的事：文本编码批处理与缓存、去噪每卡一个请求、VAE 解码和下一个请求的去噪重叠、中途预览与取消</text>
</svg>
