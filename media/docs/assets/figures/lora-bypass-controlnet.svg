<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="LoRA 旁路 vs 融合；ControlNet 是去噪网络的一个副本编码器，每一步多跑半个网络，把条件特征加进主干的跳连">
  <text x="170.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">LoRA：旁路还是融合</text>
  <rect x="40.0" y="50.0" width="60.0" height="30.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="70.0" y="65.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">x</text>
  <line x1="100.0" y1="65.0" x2="145.0" y2="65.0" class="ln" stroke-width="1.2"/>
  <polygon points="150.0,65.0 143.9,68.4 143.9,61.6" class="ah"/>
  <rect x="150.0" y="50.0" width="90.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="195.0" y="65.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">W（基座）</text>
  <rect x="150.0" y="96.0" width="90.0" height="30.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="195.0" y="111.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">A·B（秩 r）</text>
  <line x1="100.0" y1="65.0" x2="146.3" y2="107.6" class="ln" stroke-width="1.1"/>
  <polygon points="150.0,111.0 143.2,109.3 147.8,104.4" class="ah"/>
  <circle cx="275.0" cy="65.0" r="11.0" class="green" stroke-width="1.3"/>
  <text x="275.0" y="65.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">+</text>
  <line x1="240.0" y1="65.0" x2="259.0" y2="65.0" class="ln" stroke-width="1.1"/>
  <polygon points="264.0,65.0 257.9,68.4 257.9,61.6" class="ah"/>
  <line x1="240.0" y1="111.0" x2="265.0" y2="78.0" class="ln" stroke-width="1.1"/>
  <polygon points="268.0,74.0 267.0,80.9 261.6,76.9" class="ah"/>
  <line x1="286.0" y1="65.0" x2="315.0" y2="65.0" class="ln" stroke-width="1.2"/>
  <polygon points="320.0,65.0 313.9,68.4 313.9,61.6" class="ah"/>
  <rect x="320.0" y="50.0" width="30.0" height="30.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="335.0" y="65.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">y</text>
  <text x="30.0" y="150.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle"><tspan x="30.0" dy="-16.7">旁路：多两个小矩阵乘（1%～2% FLOP），切换零成本，</tspan><tspan x="30.0" dy="11.2">多个 LoRA 可以同一 batch 混用</tspan><tspan x="30.0" dy="11.2">融合：W′ = W + A·B 一次性算进权重，推理零开销，</tspan><tspan x="30.0" dy="11.2">但换 LoRA 要重新算，量化和编译图都要重来</tspan></text>
  <line x1="370.0" y1="30.0" x2="370.0" y2="240.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="535.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">ControlNet：每步多半个网络</text>
  <rect x="390.0" y="50.0" width="110.0" height="110.0" rx="8" class="blue" stroke-width="1.2"/>
  <text x="445.0" y="68.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">去噪 UNet</text>
  <rect x="400.0" y="80.0" width="90.0" height="20.0" rx="3" class="blue" stroke-width="0.6"/>
  <text x="445.0" y="90.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">编码器</text>
  <rect x="400.0" y="106.0" width="90.0" height="20.0" rx="3" class="blue" stroke-width="0.6"/>
  <text x="445.0" y="116.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">中间</text>
  <rect x="400.0" y="132.0" width="90.0" height="20.0" rx="3" class="blue" stroke-width="0.6"/>
  <text x="445.0" y="142.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">解码器</text>
  <rect x="540.0" y="50.0" width="110.0" height="70.0" rx="8" class="orange" stroke-width="1.2"/>
  <text x="595.0" y="68.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">ControlNet</text>
  <rect x="550.0" y="80.0" width="90.0" height="20.0" rx="3" class="orange" stroke-width="0.6"/>
  <text x="595.0" y="90.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">编码器副本</text>
  <rect x="550.0" y="102.0" width="90.0" height="14.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="595.0" y="109.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">零卷积</text>
  <text x="595.0" y="140.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">输入：边缘 / 深度 / 姿态图</text>
  <line x1="550.0" y1="90.0" x2="499.0" y2="129.0" class="orange-l" stroke-width="1.4"/>
  <polygon points="495.0,132.0 497.8,125.6 501.9,131.0" class="orange-s"/>
  <text x="540.5" y="121.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">加到跳连</text>
  <text x="535.0" y="180.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="535.0" dy="-5.6">权重约为 UNet 的一半（SD 1.5：1.2 GB），每步再跑一次编码器：</tspan><tspan x="535.0" dy="11.2">算力 +40%～50%；多个 ControlNet 叠加就多跑多份</tspan></text>
  <text x="350.0" y="252.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">放置：LoRA 几十 MB 全部常驻；ControlNet 几 GB 按 LRU 常驻几个、其余放锁页内存按需搬，或按类型分实例</text>
</svg>
