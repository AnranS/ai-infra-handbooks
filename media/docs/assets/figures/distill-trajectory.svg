  <path d="M 200 128 C 350 70 500 60 620 80" class="green-l" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="30.0" y="210.0" class="tx" font-size="10" text-anchor="start" dominant-baseline="middle">蓝：老师，几十次网络调用，一步一步沿轨迹走　　橙：学生，从同一个起点一步到达同一个终点（一致性 / 分布匹配 / 对抗蒸馏）</text>
  <text x="30.0" y="232.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">绿：一致性要求轨迹上任意一点出发都到同一个终点；4～8 步版本就是把轨迹切成几段各跨一次</text>
  <text x="30.0" y="254.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">代价：多样性和可控性下降、对 LoRA / ControlNet 兼容变差、不能随意换调度器；引导蒸馏把 CFG 也烘进去，一步只算一次前向</text>
