<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" role="img" aria-label="序列并行的两种做法：Ulysses 用 all-to-all 在「切序列」和「切头」之间转换；Ring 让 K、V 块绕环传递">
  <text x="170.0" y="20.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">Ulysses（切头）</text>
  <text x="30.0" y="51.0" class="mu" font-size="10" text-anchor="start" dominant-baseline="middle">GPU 0</text>
  <rect x="80.0" y="40.0" width="60.0" height="22.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="110.0" y="51.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">序列块 0</text>
  <text x="110.0" y="72.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"></text>
  <rect x="220.0" y="40.0" width="70.0" height="22.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="255.0" y="51.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">所有序列·头0</text>
  <text x="30.0" y="81.0" class="mu" font-size="10" text-anchor="start" dominant-baseline="middle">GPU 1</text>
  <rect x="80.0" y="70.0" width="60.0" height="22.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="110.0" y="81.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">序列块 1</text>
  <text x="110.0" y="102.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"></text>
  <rect x="220.0" y="70.0" width="70.0" height="22.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="255.0" y="81.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">所有序列·头1</text>
  <text x="30.0" y="111.0" class="mu" font-size="10" text-anchor="start" dominant-baseline="middle">GPU 2</text>
  <rect x="80.0" y="100.0" width="60.0" height="22.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="110.0" y="111.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">序列块 2</text>
  <text x="110.0" y="132.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"></text>
  <rect x="220.0" y="100.0" width="70.0" height="22.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="255.0" y="111.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">所有序列·头2</text>
  <text x="30.0" y="141.0" class="mu" font-size="10" text-anchor="start" dominant-baseline="middle">GPU 3</text>
  <rect x="80.0" y="130.0" width="60.0" height="22.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="110.0" y="141.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">序列块 3</text>
  <text x="110.0" y="162.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"></text>
  <rect x="220.0" y="130.0" width="70.0" height="22.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="255.0" y="141.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">所有序列·头3</text>
  <line x1="140.0" y1="85.0" x2="215.0" y2="85.0" class="ln" stroke-width="1.4"/>
  <polygon points="220.0,85.0 213.9,88.4 213.9,81.6" class="ah"/>
  <text x="180.0" y="75.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">all-to-all</text>
  <text x="255.0" y="170.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="255.0" dy="-5.9">每张卡对自己的 1/4 个头</tspan><tspan x="255.0" dy="11.8">做完整序列的注意力</tspan></text>
  <line x1="220.0" y1="210.0" x2="145.0" y2="210.0" class="ln" stroke-width="1.4"/>
  <polygon points="140.0,210.0 146.1,206.6 146.1,213.4" class="ah"/>
  <text x="180.0" y="224.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">all-to-all 换回来</text>
  <text x="170.0" y="252.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="170.0" dy="-5.9">通信量 ∝ 序列长度 × d，一步两次；</tspan><tspan x="170.0" dy="11.8">要求头数能被卡数整除（Wan 40 头 → 最多 8 卡）</tspan></text>
  <line x1="350.0" y1="30.0" x2="350.0" y2="300.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="530.0" y="20.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">Ring（切序列，K、V 绕环）</text>
  <rect x="490.0" y="84.0" width="80.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="530.0" y="100.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="530.0" dy="-5.6">GPU 0</tspan><tspan x="530.0" dy="11.2">Q0·K0·V0</tspan></text>
  <rect x="570.0" y="144.0" width="80.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="610.0" y="160.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="610.0" dy="-5.6">GPU 1</tspan><tspan x="610.0" dy="11.2">Q1·K1·V1</tspan></text>
  <rect x="490.0" y="204.0" width="80.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="530.0" y="220.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="530.0" dy="-5.6">GPU 2</tspan><tspan x="530.0" dy="11.2">Q2·K2·V2</tspan></text>
  <rect x="410.0" y="144.0" width="80.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="450.0" y="160.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="450.0" dy="-5.6">GPU 3</tspan><tspan x="450.0" dy="11.2">Q3·K3·V3</tspan></text>
  <line x1="554.0" y1="118.0" x2="582.0" y2="139.0" class="orange-l" stroke-width="1.8"/>
  <polygon points="586.0,142.0 579.1,141.0 583.1,135.6" class="orange-s"/>
  <line x1="586.0" y1="178.0" x2="558.0" y2="199.0" class="orange-l" stroke-width="1.8"/>
  <polygon points="554.0,202.0 556.9,195.6 560.9,201.0" class="orange-s"/>
  <line x1="506.0" y1="202.0" x2="478.0" y2="181.0" class="orange-l" stroke-width="1.8"/>
  <polygon points="474.0,178.0 480.9,179.0 476.9,184.4" class="orange-s"/>
  <line x1="474.0" y1="142.0" x2="502.0" y2="121.0" class="orange-l" stroke-width="1.8"/>
  <polygon points="506.0,118.0 503.1,124.4 499.1,119.0" class="orange-s"/>
  <text x="530.0" y="160.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="530.0" dy="-5.9">K、V 块</tspan><tspan x="530.0" dy="11.8">逐站传递</tspan></text>
  <text x="530.0" y="262.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="530.0" dy="-5.9">每收到一块 K、V 就算一块分数，用 online softmax 累加；</tspan><tspan x="530.0" dy="11.8">传完一圈每张卡得到自己那段序列的完整输出</tspan></text>
  <text x="530.0" y="300.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">通信可以和计算重叠，对头数没要求；但卡多时环变长、延迟累加</text>
</svg>
