<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" role="img" aria-label="三个阶段三种放法：文本编码攒 batch 并缓存，去噪每卡一个请求，VAE 解码放到另一条 stream 和下一个请求的去噪重叠">
  <text x="100.0" y="24.0" class="tx" font-size="11.5" text-anchor="start" dominant-baseline="middle" font-weight="600">串行</text>
  <rect x="100.0" y="36.0" width="12.0" height="24.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="106.0" y="48.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"></text>
  <rect x="114.0" y="36.0" width="148.0" height="24.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="188.0" y="48.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">去噪</text>
  <rect x="264.0" y="36.0" width="38.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="283.0" y="48.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">VAE</text>
  <rect x="304.0" y="36.0" width="12.0" height="24.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="310.0" y="48.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"></text>
  <rect x="318.0" y="36.0" width="148.0" height="24.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="392.0" y="48.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">去噪</text>
  <rect x="468.0" y="36.0" width="38.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="487.0" y="48.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">VAE</text>
  <text x="518.0" y="50.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">每请求 = 文本 + 去噪 + VAE</text>
  <text x="100.0" y="100.0" class="tx" font-size="11.5" text-anchor="start" dominant-baseline="middle" font-weight="600">流水</text>
  <text x="60.0" y="126.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle"><tspan x="60.0" dy="-5.6">文本编码器</tspan><tspan x="60.0" dy="11.2">（批处理 + 缓存）</tspan></text>
  <rect x="180.0" y="114.0" width="12.0" height="22.0" rx="3" class="green" stroke-width="0.8"/>
  <rect x="194.0" y="114.0" width="12.0" height="22.0" rx="3" class="green" stroke-width="0.8"/>
  <text x="60.0" y="160.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle">去噪（主力卡）</text>
  <rect x="210.0" y="148.0" width="148.0" height="24.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="284.0" y="160.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">请求 1 去噪</text>
  <rect x="360.0" y="148.0" width="148.0" height="24.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="434.0" y="160.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">请求 2 去噪</text>
  <rect x="510.0" y="148.0" width="148.0" height="24.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="584.0" y="160.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">请求 3 去噪</text>
  <text x="60.0" y="196.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle"><tspan x="60.0" dy="-5.6">VAE 解码</tspan><tspan x="60.0" dy="11.2">（另一条 stream / 卡）</tspan></text>
  <rect x="360.0" y="184.0" width="38.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="379.0" y="196.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">1</text>
  <rect x="510.0" y="184.0" width="38.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="529.0" y="196.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="350.0" y="236.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">稳态下每个请求只占 max(去噪, VAE) 的时间：SDXL 从 3.25 s 到 2.9 s（省一成），少步模型（去噪 0.15 s、VAE 0.3 s）下 VAE 反而成了瓶颈，要分块或分卡</text>
</svg>
