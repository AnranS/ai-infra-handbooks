<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="一张 1024² 的图在各层表示里有多少个数：像素 → VAE 潜变量 → DiT token">
  <rect x="40.0" y="50.0" width="120.0" height="120.0" rx="4" class="gray" stroke-width="1.4"/>
  <text x="100.0" y="30.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">像素</text>
  <text x="100.0" y="164.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1024 × 1024 × 3</text>
  <text x="100.0" y="184.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">3,145,728 个数</text>
  <line x1="168.0" y1="110.0" x2="217.0" y2="110.0" class="ln" stroke-width="1.2"/>
  <polygon points="222.0,110.0 215.9,113.4 215.9,106.6" class="ah"/>
  <text x="195.0" y="100.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">VAE 编码（×1/8 边长）</text>
  <rect x="230.0" y="80.0" width="60.0" height="60.0" rx="4" class="blue" stroke-width="1.4"/>
  <text x="260.0" y="30.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">SD VAE 潜变量（f8，4 通道）</text>
  <text x="260.0" y="164.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">128 × 128 × 4</text>
  <text x="260.0" y="184.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">65,536 个数（1/48）</text>
  <line x1="298.0" y1="110.0" x2="377.0" y2="110.0" class="ln" stroke-width="1.2"/>
  <polygon points="382.0,110.0 375.9,113.4 375.9,106.6" class="ah"/>
  <rect x="390.0" y="80.0" width="60.0" height="60.0" rx="4" class="green" stroke-width="1.4"/>
  <text x="420.0" y="30.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">FLUX VAE 潜变量（f8，16 通道）</text>
  <text x="420.0" y="164.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">128 × 128 × 16</text>
  <text x="420.0" y="184.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">262,144 个数（1/12）</text>
  <line x1="458.0" y1="110.0" x2="551.0" y2="110.0" class="ln" stroke-width="1.2"/>
  <polygon points="556.0,110.0 549.9,113.4 549.9,106.6" class="ah"/>
  <text x="507.0" y="100.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">打包 2×2</text>
  <rect x="564.0" y="94.0" width="32.0" height="32.0" rx="4" class="orange" stroke-width="1.4"/>
  <rect x="564.0" y="94.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="564.0" y="102.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="564.0" y="110.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="564.0" y="118.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="572.0" y="94.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="572.0" y="102.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="572.0" y="110.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="572.0" y="118.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="580.0" y="94.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="580.0" y="102.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="580.0" y="110.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="580.0" y="118.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="588.0" y="94.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="588.0" y="102.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="588.0" y="110.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <rect x="588.0" y="118.0" width="7.0" height="7.0" rx="1" class="orange" stroke-width="0.6"/>
  <text x="580.0" y="30.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">DiT token（patch 2×2）</text>
  <text x="580.0" y="164.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">64 × 64 = 4096 个</text>
  <text x="580.0" y="184.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">每个 64 维</text>
  <text x="350.0" y="214.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">去噪网络在潜变量 / token 上跑几十步，便宜；VAE 解码只跑一次，却回到像素面积，激活是潜空间的 64 倍——显存峰值在这里</text>
</svg>
