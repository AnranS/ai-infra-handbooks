site_name: 图像与视频生成推理手册
site_url: https://anrans.github.io/ai-infra-handbooks/media/
site_description: 扩散与流匹配模型的推理与服务：pipeline 解剖、算力与显存账、少步、缓存、量化、多卡并行、视频推理与生成服务的调度
copyright: 示例代码全部在 CPU 上用最小配置实际运行，输出与页面逐行核对
repo_url: https://github.com/AnranS/ai-infra-handbooks
repo_name: AnranS/ai-infra-handbooks
edit_uri: edit/main/media/docs/

theme:
  name: material
  custom_dir: ../theme
  language: zh
  font: false
  icon:
    logo: material/image-multiple
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  book: media

hooks:
  - ../hooks/figures.py
  - ../hooks/notebooks.py
  - ../hooks/crosslinks.py
  - ../hooks/practice.py
  - ../hooks/bookhero.py
  - ../hooks/meta.py
  - ../hooks/i18n.py

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - assets/stylesheets/aig.css
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首页: index.md
  - 基础:
      - 扩散与流匹配：推理视角: basics/diffusion-inference.md
      - 一张图是怎么生成的：pipeline 解剖: basics/pipeline-anatomy.md
      - 去噪网络：从 UNet 到 DiT: basics/unet-to-dit.md
      - VAE 与潜空间: basics/vae-latent.md
      - 采样器与调度器: basics/schedulers.md
  - 性能:
      - 推理的算账：FLOP、带宽与一步要多久: perf/accounting.md
      - 显存与 offload：把 FLUX 塞进 16 GB: perf/memory.md
      - 算子加速：注意力、编译与融合: perf/kernels.md
      - 少步生成：蒸馏把 50 步变成 4 步: perf/distillation.md
      - 特征缓存：相邻两步长得太像了: perf/caching.md
      - 量化：扩散模型和 LLM 不一样的地方: perf/quantization.md
      - 多卡并行：把一步摊到几张卡上: perf/parallel.md
  - 视频:
      - 视频生成模型的结构：时空注意力与 3D VAE: video/architecture.md
      - 视频推理的瓶颈：十万 token 的注意力: video/bottleneck.md
      - 长视频与一致性：分段、滑窗与自回归: video/long-video.md
  - 服务:
      - 生成服务的调度：异构请求、阶段流水与长任务: serving/scheduling.md
      - 多 LoRA、ControlNet 与 IP-Adapter 的服务: serving/lora-controlnet.md
      - 引擎选型与部署：diffusers、ComfyUI、xDiT 与推理框架: serving/deploy.md
      - 评测与压测：延迟、吞吐、质量与可复现: serving/benchmark.md
      - 面试与作品：把这本书变成你的东西: serving/career.md
