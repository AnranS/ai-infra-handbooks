<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" role="img" aria-label="FlashAttention: attention computed in tiles, never writing out the N × N score matrix">
  <rect x="30.0" y="40.0" width="60.0" height="180.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="60.0" y="232.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle">Q</text>
  <rect x="30.0" y="100.0" width="60.0" height="36.0" rx="3" class="blue" stroke-width="2"/>
  <text x="60.0" y="118.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">Qᵢ</text>
  <rect x="140.0" y="40.0" width="60.0" height="180.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="170.0" y="232.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle">K、V</text>
  <rect x="140.0" y="44.0" width="60.0" height="40.0" rx="3" class="orange" stroke-width="1.2"/>
  <text x="170.0" y="64.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Kⱼ,Vⱼ</text>
  <rect x="140.0" y="88.0" width="60.0" height="40.0" rx="3" class="orange" stroke-width="2.2"/>
  <text x="170.0" y="108.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Kⱼ,Vⱼ</text>
  <rect x="140.0" y="132.0" width="60.0" height="40.0" rx="3" class="orange" stroke-width="1.2"/>
  <text x="170.0" y="152.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Kⱼ,Vⱼ</text>
  <rect x="140.0" y="176.0" width="60.0" height="40.0" rx="3" class="orange" stroke-width="1.2"/>
  <text x="170.0" y="196.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Kⱼ,Vⱼ</text>
  <line x1="90.0" y1="118.0" x2="135.1" y2="109.0" class="ln" stroke-width="1.4"/>
  <polygon points="140.0,108.0 134.6,112.5 133.3,105.9" class="ah"/>
  <rect x="260.0" y="70.0" width="220.0" height="110.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="370.0" y="125.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="370.0" dy="-28.5">in shared memory / registers:</tspan><tspan x="370.0" dy="14.3">Sᵢⱼ = Qᵢ Kⱼᵀ</tspan><tspan x="370.0" dy="14.3">online softmax: update the row max m</tspan><tspan x="370.0" dy="14.3">and denominator l, and rescale the output</tspan><tspan x="370.0" dy="14.3">Oᵢ ← Oᵢ·e^(m_old−m) + P Vⱼ</tspan></text>
  <line x1="200.0" y1="108.0" x2="255.1" y2="119.0" class="ln" stroke-width="1.4"/>
  <polygon points="260.0,120.0 253.3,122.1 254.6,115.5" class="ah"/>
  <line x1="480.0" y1="125.0" x2="535.0" y2="125.0" class="ln" stroke-width="1.4"/>
  <polygon points="540.0,125.0 533.9,128.4 533.9,121.6" class="ah"/>
  <rect x="540.0" y="100.0" width="130.0" height="50.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="605.0" y="125.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle"><tspan x="605.0" dy="-7.4">only Oᵢ is</tspan><tspan x="605.0" dy="14.9">written back to memory</tspan></text>
  <text x="350.0" y="256.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">Memory traffic drops from O(N²) to O(N²d²/M) (M = on-chip capacity); the arithmetic is unchanged but no longer bandwidth-bound</text>
</svg>
