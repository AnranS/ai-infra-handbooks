<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="few-step distillation: the teacher takes dozens of small steps along the ODE trajectory while the student learns to jump from any point to the endpoint in one step (or a few) — the step count is no longer the solver's accuracy problem">
