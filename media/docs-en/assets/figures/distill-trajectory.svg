  <polygon points="550.0,82.0 544.1,85.7 543.7,79.0" class="blue-s"/>
  <line x1="550.0" y1="82.0" x2="615.0" y2="80.1" class="blue-l" stroke-width="1.4"/>
  <polygon points="620.0,80.0 614.0,83.5 613.8,76.8" class="blue-s"/>
  <circle cx="60.0" cy="180.0" r="4.0" class="blue-s" stroke-width="0"/>
  <circle cx="130.0" cy="150.0" r="4.0" class="blue-s" stroke-width="0"/>
