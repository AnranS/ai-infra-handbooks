  <circle cx="620.0" cy="80.0" r="4.0" class="blue-s" stroke-width="0"/>
  <text x="100.0" y="190.0" class="mu" font-size="10" text-anchor="start" dominant-baseline="middle">noise x_T</text>
  <text x="620.0" y="62.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">data x_0</text>
  <path d="M 60 180 C 200 60 450 40 620 80" class="orange-l" stroke-width="2.4" stroke-dasharray="7 4"/>
  <polygon points="620.0,80.0 614.4,85.8 612.2,78.4" class="orange-s"/>
  <path d="M 200 128 C 350 70 500 60 620 80" class="green-l" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="30.0" y="210.0" class="tx" font-size="10" text-anchor="start" dominant-baseline="middle">blue: the teacher, dozens of calls, step by step　　orange: the student, one step from start to end (consistency / distribution / adversarial)</text>
  <text x="30.0" y="232.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">green: consistency requires every point on the trajectory to reach the same endpoint; a 4 to 8 step version cuts it into segments and jumps each</text>
  <text x="30.0" y="254.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">the cost: less diversity and control, worse LoRA / ControlNet compatibility, no swapping the scheduler; guidance distillation bakes guidance in too</text>
</svg>
