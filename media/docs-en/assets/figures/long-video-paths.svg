<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="the three routes for long video: segments joined continue from the condition frames; a sliding window blends in the overlap; autoregression caches the earlier blocks' K and V, bidirectional within a block and causal between blocks">
  <text x="30.0" y="54.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="600">① segments joined by a condition</text>
  <rect x="240.0" y="40.0" width="138.0" height="26.0" rx="4" class="orange" stroke-width="0.9"/>
  <text x="309.0" y="53.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">segment 1</text>
  <rect x="380.0" y="40.0" width="138.0" height="26.0" rx="4" class="orange" stroke-width="0.9"/>
  <text x="449.0" y="53.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">segment 2</text>
  <rect x="370.0" y="42.0" width="8.0" height="22.0" rx="2" class="red" stroke-width="0.6"/>
  <rect x="520.0" y="40.0" width="138.0" height="26.0" rx="4" class="orange" stroke-width="0.9"/>
  <text x="589.0" y="53.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">segment 3</text>
  <rect x="510.0" y="42.0" width="8.0" height="22.0" rx="2" class="red" stroke-width="0.6"/>
  <text x="30.0" y="88.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">the previous segment's last few frames condition the next; a linear cost, relies on the condition frames, drifts easily (red: the condition frames)</text>
  <text x="30.0" y="138.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="600">② a sliding window / overlapped denoising</text>
  <rect x="240.0" y="124.0" width="166.0" height="26.0" rx="4" class="blue" stroke-width="0.9"/>
  <text x="323.0" y="137.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">segment 1</text>
  <rect x="352.0" y="130.0" width="166.0" height="26.0" rx="4" class="blue" stroke-width="0.9"/>
  <text x="435.0" y="143.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">segment 2</text>
  <rect x="464.0" y="124.0" width="166.0" height="26.0" rx="4" class="blue" stroke-width="0.9"/>
  <text x="547.0" y="137.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">segment 3</text>
  <text x="30.0" y="172.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">the window slides along time with the two sides' results blended in the overlap; pays the overlap's fraction more computation, and is smoother</text>
  <text x="30.0" y="222.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="600">③ autoregressive (block-causal)</text>
  <rect x="240.0" y="208.0" width="138.0" height="26.0" rx="4" class="green" stroke-width="0.9"/>
  <text x="309.0" y="221.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">segment 1</text>
  <rect x="380.0" y="208.0" width="138.0" height="26.0" rx="4" class="green" stroke-width="0.9"/>
  <text x="449.0" y="221.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">segment 2</text>
  <line x1="352.0" y1="248.0" x2="395.1" y2="237.2" class="green-l" stroke-width="1.2"/>
  <polygon points="400.0,236.0 394.9,240.8 393.2,234.2" class="green-s"/>
  <rect x="520.0" y="208.0" width="138.0" height="26.0" rx="4" class="green" stroke-width="0.9"/>
  <text x="589.0" y="221.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">segment 3</text>
  <line x1="492.0" y1="248.0" x2="535.1" y2="237.2" class="green-l" stroke-width="1.2"/>
  <polygon points="540.0,236.0 534.9,240.8 533.2,234.2" class="green-s"/>
  <text x="30.0" y="256.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">bidirectional within a block, causal between, caching earlier blocks' K and V; trained to fight drift (green arrows: reading earlier blocks' KV)</text>
  <text x="350.0" y="286.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">one generation's attention is quadratic and segmenting makes it linear; the real price is drift — colour, identity and motion wander as error accumulates</text>
</svg>
