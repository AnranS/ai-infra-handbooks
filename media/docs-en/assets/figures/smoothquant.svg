<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="SmoothQuant: divide a few channels' outliers out of the activations and multiply the same amount into the weights, leaving the matrix multiply's result unchanged">
  <text x="100.0" y="60.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">the activation X's per-channel scale</text>
  <line x1="30.0" y1="120.0" x2="180.0" y2="120.0" class="ln" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="36.0" y="115.0" width="13.0" height="5.0" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="54.0" y="114.0" width="13.0" height="6.0" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="72.0" y="116.0" width="13.0" height="4.0" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="90.0" y="75.0" width="13.0" height="45.0" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="108.0" y="114.5" width="13.0" height="5.5" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="126.0" y="115.5" width="13.0" height="4.5" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="144.0" y="82.5" width="13.0" height="37.5" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="162.0" y="115.0" width="13.0" height="5.0" rx="2" class="orange" stroke-width="0.8"/>
  <text x="270.0" y="60.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">W's corresponding rows</text>
  <line x1="200.0" y1="120.0" x2="350.0" y2="120.0" class="ln" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="206.0" y="100.0" width="13.0" height="20.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="224.0" y="98.0" width="13.0" height="22.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="242.0" y="102.0" width="13.0" height="18.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="260.0" y="100.0" width="13.0" height="20.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="278.0" y="96.0" width="13.0" height="24.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="296.0" y="104.0" width="13.0" height="16.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="314.0" y="100.0" width="13.0" height="20.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="332.0" y="98.0" width="13.0" height="22.0" rx="2" class="blue" stroke-width="0.8"/>
  <text x="30.0" y="142.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">two outlier channels stretch X's quantization step 9 times and flatten every other channel</text>
  <line x1="380.0" y1="85.0" x2="415.0" y2="85.0" class="ln" stroke-width="1.4"/>
  <polygon points="420.0,85.0 413.9,88.4 413.9,81.6" class="ah"/>
  <text x="400.0" y="75.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">X / s，W × s</text>
  <text x="500.0" y="60.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">X̂ = X · diag(s)⁻¹</text>
  <line x1="430.0" y1="120.0" x2="580.0" y2="120.0" class="ln" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="436.0" y="115.0" width="13.0" height="5.0" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="454.0" y="114.5" width="13.0" height="5.5" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="472.0" y="116.0" width="13.0" height="4.0" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="490.0" y="105.0" width="13.0" height="15.0" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="508.0" y="114.8" width="13.0" height="5.2" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="526.0" y="115.5" width="13.0" height="4.5" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="544.0" y="106.3" width="13.0" height="13.7" rx="2" class="orange" stroke-width="0.8"/>
  <rect x="562.0" y="115.0" width="13.0" height="5.0" rx="2" class="orange" stroke-width="0.8"/>
  <text x="630.0" y="60.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">Ŵ = diag(s) · W</text>
  <line x1="560.0" y1="120.0" x2="710.0" y2="120.0" class="ln" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="566.0" y="100.0" width="13.0" height="20.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="584.0" y="95.9" width="13.0" height="24.1" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="602.0" y="102.0" width="13.0" height="18.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="620.0" y="60.0" width="13.0" height="60.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="638.0" y="94.8" width="13.0" height="25.2" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="656.0" y="104.0" width="13.0" height="16.0" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="674.0" y="65.2" width="13.0" height="54.8" rx="2" class="blue" stroke-width="0.8"/>
  <rect x="692.0" y="98.0" width="13.0" height="22.0" rx="2" class="blue" stroke-width="0.8"/>
  <text x="670.0" y="164.0" class="mu" font-size="9.5" text-anchor="end" dominant-baseline="middle">s_j = max|X_j|^α / max|W_j|^(1−α), with α usually 0.5: each side carries half the difficulty</text>
  <text x="350.0" y="196.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">X̂ · Ŵ = X · diag(s)⁻¹ · diag(s) · W = X · W: exactly equivalent in the arithmetic, only now both sides quantize well</text>
  <text x="350.0" y="226.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">s is computed offline in calibration and merged into the previous layer's norm weights, so inference adds no operator; in diffusion it also varies per timestep</text>
</svg>
