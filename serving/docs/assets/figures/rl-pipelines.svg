<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="三种 RL 流水：同步等整批；一步异步用上一版权重生成下一批；全异步槽位一空就开新样本，训练端凑够一批就更新">
  <text x="80.0" y="54.0" class="tx" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="600">同步</text>
  <rect x="100.0" y="40.0" width="178.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="189.0" y="53.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">生成</text>
  <rect x="280.0" y="40.0" width="48.0" height="26.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="304.0" y="53.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">训练</text>
  <rect x="330.0" y="40.0" width="178.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="419.0" y="53.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">生成</text>
  <rect x="510.0" y="40.0" width="48.0" height="26.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="534.0" y="53.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">训练</text>
  <text x="575.0" y="54.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle">多数时间在等长尾</text>
  <text x="80.0" y="116.0" class="tx" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="600">一步异步</text>
  <rect x="100.0" y="102.0" width="178.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="189.0" y="115.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">生成 i+1</text>
  <rect x="280.0" y="102.0" width="178.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="369.0" y="115.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">生成 i+2</text>
  <rect x="460.0" y="102.0" width="98.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="509.0" y="115.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">生成 i+3</text>
  <rect x="220.0" y="132.0" width="50.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="245.0" y="139.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">训 1</text>
  <rect x="400.0" y="132.0" width="50.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="425.0" y="139.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">训 2</text>
  <text x="575.0" y="116.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle">样本落后一个版本</text>
  <text x="80.0" y="178.0" class="tx" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="600">全异步</text>
  <rect x="100.0" y="164.0" width="458.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="329.0" y="177.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">槽位不断开新样本……</text>
  <rect x="190.0" y="194.0" width="45.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="212.5" y="201.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">训</text>
  <rect x="300.0" y="194.0" width="45.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="322.5" y="201.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">训</text>
  <rect x="400.0" y="194.0" width="45.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="422.5" y="201.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">训</text>
  <rect x="500.0" y="194.0" width="45.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="522.5" y="201.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">训</text>
  <text x="575.0" y="178.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle">凑够一批就训</text>
  <text x="350.0" y="228.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">异步的代价是样本陈旧（off-policy）：要靠重要性采样或限制落后版本数；权重同步从秒级（NCCL 广播）到分钟级（走存储）决定能异步到什么程度</text>
</svg>
