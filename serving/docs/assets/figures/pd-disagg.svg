<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="PD 分离：prefill 和 decode 在不同的 GPU 组上">
  <rect x="16.0" y="90.0" width="100.0" height="60.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="66.0" y="120.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle"><tspan x="66.0" dy="-7.4">路由 /</tspan><tspan x="66.0" dy="14.9">调度器</tspan></text>
  <rect x="170.0" y="40.0" width="180.0" height="70.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="260.0" y="75.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle"><tspan x="260.0" dy="-14.9">Prefill 实例</tspan><tspan x="260.0" dy="14.9">算力受限：大矩阵乘</tspan><tspan x="260.0" dy="14.9">关心 TTFT</tspan></text>
  <rect x="510.0" y="40.0" width="180.0" height="70.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="600.0" y="75.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-14.9">Decode 实例</tspan><tspan x="600.0" dy="14.9">访存受限：读权重和 KV</tspan><tspan x="600.0" dy="14.9">关心 TPOT</tspan></text>
  <line x1="116.0" y1="110.0" x2="165.6" y2="82.4" class="ln" stroke-width="1.4"/>
  <polygon points="170.0,80.0 166.3,85.9 163.0,80.0" class="ah"/>
  <line x1="350.0" y1="75.0" x2="505.0" y2="75.0" class="ln" stroke-width="1.4"/>
  <polygon points="510.0,75.0 503.9,78.4 503.9,71.6" class="ah"/>
  <text x="430.0" y="55.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="430.0" dy="-7.1">KV Cache</tspan><tspan x="430.0" dy="14.3">（RDMA / NVLink）</tspan></text>
  <rect x="170.0" y="160.0" width="520.0" height="44.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="430.0" y="182.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">两边各自选择并行方式和实例数（xPyD）：prefill 和 decode 不再互相干扰</text>
  <line x1="600.0" y1="110.0" x2="600.0" y2="155.0" class="ln" stroke-width="1.4" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  <polygon points="600.0,160.0 596.6,153.9 603.4,153.9" class="ah"/>
  <line x1="260.0" y1="110.0" x2="260.0" y2="155.0" class="ln" stroke-width="1.4" stroke-dasharray="4 4" stroke-opacity="0.6"/>
  <polygon points="260.0,160.0 256.6,153.9 263.4,153.9" class="ah"/>
  <text x="360.0" y="232.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">代价：KV 的传输（每 token 几十到几百 KB）、两套实例的容量规划</text>
