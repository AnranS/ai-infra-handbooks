<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="多硬件支持的分层：引擎逻辑不变，Platform 类把设备名、通信后端、注意力后端、图模式这些差异收进插件">
  <rect x="30.0" y="36.0" width="640.0" height="28.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="350.0" y="50.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">调度器、KV 管理、API：和硬件无关</text>
  <rect x="70.0" y="72.0" width="560.0" height="28.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="350.0" y="86.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Platform 抽象：device_type、dispatch_key、集合通信、可见设备、注意力后端选择</text>
  <rect x="110.0" y="108.0" width="480.0" height="28.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="350.0" y="122.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">平台插件：CUDA / ROCm / XPU / 昇腾（vllm-ascend）</text>
  <rect x="150.0" y="144.0" width="400.0" height="28.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="350.0" y="158.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">kernel：FlashAttention / aiter / 昇腾注意力；MoE、量化、图模式</text>
  <text x="350.0" y="190.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">接入一种新硬件要做的：实现 Platform 的几十个钩子、提供注意力和 MoE kernel、通信后端（HCCL / RCCL / XCCL）、图模式或等价物</text>
  <text x="350.0" y="214.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">差别最大的不在表层属性，在 kernel 的覆盖面和性能：没有对应的融合 kernel 时，同样的引擎在新硬件上可能慢好几倍</text>
</svg>
