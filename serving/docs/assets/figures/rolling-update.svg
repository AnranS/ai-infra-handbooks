  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">maxSurge：最多比期望多几个（先起新的再杀旧的，要多占显存）；maxUnavailable：最多少几个（先杀旧的再起新的，容量掉）</text>
  <text x="350.0" y="174.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">三种探针：startup 给权重加载留足时间（否则被判成挂了反复重启）；readiness 决定接不接流量；liveness 决定要不要重启</text>
  <text x="350.0" y="198.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">优雅退出：收到 SIGTERM 先从 Service 摘掉、把在途请求生成完再退出，terminationGracePeriodSeconds 要比最长回答还长</text>
  <text x="350.0" y="222.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">扩缩容按排队请求数 / KV 使用率，不按 CPU；PodDisruptionBudget 挡住运维一次拿走太多副本</text>
</svg>
