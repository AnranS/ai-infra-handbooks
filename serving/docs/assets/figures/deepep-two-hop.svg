  <line x1="107.0" y1="104.0" x2="462.0" y2="104.0" class="orange-l" stroke-width="2.2"/>
  <polygon points="467.0,104.0 460.9,107.4 460.9,100.6" class="orange-s"/>
  <text x="350.0" y="36.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">① RDMA：同轨，每个目标节点只发一份（一个 token 最多去 4 个节点）</text>
  <line x1="467.0" y1="124.0" x2="586.0" y2="139.4" class="green-l" stroke-width="1.8"/>
  <polygon points="591.0,140.0 584.5,142.6 585.3,135.9" class="green-s"/>
  <text x="569.0" y="132.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">② NVLink 转发</text>
  <text x="350.0" y="222.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">机间带宽（50 GB/s）比 NVLink（450 GB/s）贵 9 倍，所以去重发给节点、再在节点内分发；节点受限路由保证每个 token 最多跨 4 个节点</text>
  <text x="350.0" y="246.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">低延迟模式（decode）：固定槽位、纯 RDMA、无 CPU 同步，牺牲带宽换几十微秒的延迟；kernel 内通信靠 NVSHMEM 的 put / signal</text>
</svg>
