<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="RDMA 的 verbs 模型：注册内存、建队列对，发送方 post 一个工作请求，网卡直接 DMA 到对方的内存，CPU 不参与搬运">
  <text x="170.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">发送方（prefill 实例）</text>
  <rect x="40.0" y="40.0" width="120.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="100.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="100.0" dy="-5.9">GPU 显存</tspan><tspan x="100.0" dy="11.8">KV 块（已注册 MR）</tspan></text>
  <rect x="180.0" y="40.0" width="120.0" height="60.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="240.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="240.0" dy="-5.9">CPU</tspan><tspan x="240.0" dy="11.8">只负责 post / 收完成</tspan></text>
  <rect x="40.0" y="130.0" width="260.0" height="36.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="170.0" y="148.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">QP：发送队列 SQ + 接收队列 RQ　　CQ：完成队列</text>
  <rect x="100.0" y="190.0" width="140.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="170.0" y="210.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">网卡（RNIC）</text>
  <line x1="100.0" y1="100.0" x2="100.0" y2="130.0" class="ln" stroke-width="1.2"/>
  <line x1="170.0" y1="166.0" x2="170.0" y2="190.0" class="ln" stroke-width="1.2"/>
  <text x="530.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">接收方（decode 实例）</text>
  <rect x="400.0" y="40.0" width="120.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="460.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="460.0" dy="-5.9">GPU 显存</tspan><tspan x="460.0" dy="11.8">KV 块（已注册 MR）</tspan></text>
  <rect x="540.0" y="40.0" width="120.0" height="60.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="600.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-5.9">CPU</tspan><tspan x="600.0" dy="11.8">只负责 post / 收完成</tspan></text>
  <rect x="400.0" y="130.0" width="260.0" height="36.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="530.0" y="148.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">QP：发送队列 SQ + 接收队列 RQ　　CQ：完成队列</text>
  <rect x="460.0" y="190.0" width="140.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="530.0" y="210.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">网卡（RNIC）</text>
  <line x1="460.0" y1="100.0" x2="460.0" y2="130.0" class="ln" stroke-width="1.2"/>
  <line x1="530.0" y1="166.0" x2="530.0" y2="190.0" class="ln" stroke-width="1.2"/>
  <line x1="200.0" y1="210.0" x2="455.0" y2="210.0" class="orange-l" stroke-width="2.2"/>
  <polygon points="460.0,210.0 453.9,213.4 453.9,206.6" class="orange-s"/>
  <text x="330.0" y="198.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">RDMA WRITE：网卡到网卡，直接写进对方注册过的内存</text>
  <text x="330.0" y="246.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">① ibv_reg_mr 注册内存（固定页、拿到 lkey/rkey）　② 建 QP、交换地址与 rkey　③ ibv_post_send 一个 WR　④ 对方内存被写入，CQ 里出现完成事件</text>
  <text x="330.0" y="270.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">GPUDirect RDMA：网卡直接读写 GPU 显存，不经过主机内存；注册内存很慢（毫秒级），所以 KV 池要预先注册、反复复用</text>
  <text x="330.0" y="292.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">小消息多了会撞上网卡的消息速率上限：传 KV 要攒成大块，或者让 GPU 自己发起（IBGDA）</text>
</svg>
