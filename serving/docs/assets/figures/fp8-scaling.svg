  <text x="485.0" y="99.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">128²</text>
  <text x="430.0" y="128.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">每 128×128 的块一个缩放：离群值只影响一块</text>
  <rect x="540.0" y="40.0" width="130.0" height="70.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="605.0" y="75.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="605.0" dy="-16.7">DeepGEMM：</tspan><tspan x="605.0" dy="11.2">FP8 Tensor Core 乘</tspan><tspan x="605.0" dy="11.2">每 128 个 K 在 fp32 里</tspan><tspan x="605.0" dy="11.2">乘缩放后累加</tspan></text>
  <line x1="30.0" y1="150.0" x2="670.0" y2="150.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="350.0" y="172.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">按张量一个缩放时，一个离群值把整个张量的步长撑大；按块缩放把影响局限在 128 个数里，精度接近 bf16——DeepSeek-V3 全程 FP8 的基础</text>
  <text x="350.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">MoE 的分组 GEMM：各专家的 token 数不同，把它们拼成一个大矩阵、按专家分段，一次 kernel 启动算完所有专家；token 要先按专家排序</text>
  <text x="350.0" y="220.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Hopper 的 FP8 累加器精度有限（约 14 位），所以每 128 个 K 就要把部分和搬到 fp32 寄存器里——DeepGEMM 用 CUDA 核心做这一步</text>
</svg>
