<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="不重启地换权重：在两步之间暂停调度，把检查点转成 kernel 的格式后原地写进同一块显存，CUDA Graph 记住的地址才不会失效">
  <rect x="20.0" y="40.0" width="120.0" height="60.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.9">调度器暂停</tspan><tspan x="80.0" dy="11.8">在两步之间</tspan></text>
  <line x1="140.0" y1="70.0" x2="151.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="156.0,70.0 149.9,73.4 149.9,66.6" class="ah"/>
  <rect x="156.0" y="40.0" width="120.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="216.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="216.0" dy="-5.9">新权重到达</tspan><tspan x="216.0" dy="11.8">（训练器广播 / 对象存储）</tspan></text>
  <line x1="276.0" y1="70.0" x2="287.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="292.0,70.0 285.9,73.4 285.9,66.6" class="ah"/>
  <rect x="292.0" y="40.0" width="120.0" height="60.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="352.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-11.8">转换格式</tspan><tspan x="352.0" dy="11.8">合并 QKV、重排 GQA、</tspan><tspan x="352.0" dy="11.8">量化、按 TP 切分</tspan></text>
  <line x1="412.0" y1="70.0" x2="423.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="428.0,70.0 421.9,73.4 421.9,66.6" class="ah"/>
  <rect x="428.0" y="40.0" width="120.0" height="60.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="488.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-5.9">原地拷贝进</tspan><tspan x="488.0" dy="11.8">同一块显存</tspan></text>
  <line x1="548.0" y1="70.0" x2="559.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="564.0,70.0 557.9,73.4 557.9,66.6" class="ah"/>
  <rect x="564.0" y="40.0" width="120.0" height="60.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="624.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" dy="-5.9">恢复调度</tspan><tspan x="624.0" dy="11.8">在途请求继续</tspan></text>
  <text x="350.0" y="124.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">在途请求的 KV 还是旧权重算出来的：短的让它跑完，长的要么接受轻微不一致，要么丢弃重算——取决于用途</text>
  <line x1="30.0" y1="146.0" x2="670.0" y2="146.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="120.0" y="170.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">为什么不能 new 一块显存</text>
  <rect x="40.0" y="186.0" width="160.0" height="60.0" rx="7" class="red" stroke-width="1.3"/>
  <text x="120.0" y="216.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="120.0" dy="-11.8">CUDA Graph 回放时</tspan><tspan x="120.0" dy="11.8">只认录制时的指针</tspan><tspan x="120.0" dy="11.8">新地址 = 用旧权重</tspan></text>
  <text x="430.0" y="170.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">RL 训练的闭环</text>
  <rect x="270.0" y="186.0" width="110.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="325.0" y="216.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="325.0" dy="-5.9">训练器</tspan><tspan x="325.0" dy="11.8">（FSDP / Megatron）</tspan></text>
  <line x1="380.0" y1="206.0" x2="445.0" y2="206.0" class="ln" stroke-width="1.3"/>
  <polygon points="450.0,206.0 443.9,209.4 443.9,202.6" class="ah"/>
  <text x="415.0" y="196.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">参数广播（NCCL / RDMA）</text>
  <rect x="450.0" y="186.0" width="110.0" height="60.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="505.0" y="216.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="505.0" dy="-5.9">推理引擎</tspan><tspan x="505.0" dy="11.8">（rollout）</tspan></text>
  <line x1="450.0" y1="236.0" x2="385.0" y2="236.0" class="ln" stroke-width="1.3"/>
  <polygon points="380.0,236.0 386.1,232.6 386.1,239.4" class="ah"/>
  <text x="415.0" y="248.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">采样结果</text>
  <text x="620.0" y="216.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="620.0" dy="-5.9">每几分钟一轮，</tspan><tspan x="620.0" dy="11.8">更新要秒级完成</tspan></text>
</svg>
