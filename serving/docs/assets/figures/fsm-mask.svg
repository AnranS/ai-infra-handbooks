<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="语法约束解码：自动机的当前状态决定允许的 token 集合，掩码加到 logits 上再采样，选中的 token 推进状态">
  <rect x="30.0" y="40.0" width="112.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="86.0" y="57.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">{"city": "</text>
  <line x1="142.0" y1="57.0" x2="157.0" y2="57.0" class="ln" stroke-width="1.2"/>
  <polygon points="162.0,57.0 155.9,60.4 155.9,53.6" class="ah"/>
  <rect x="162.0" y="40.0" width="112.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="218.0" y="57.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">字符串</text>
  <line x1="274.0" y1="57.0" x2="289.0" y2="57.0" class="ln" stroke-width="1.2"/>
  <polygon points="294.0,57.0 287.9,60.4 287.9,53.6" class="ah"/>
  <rect x="294.0" y="40.0" width="112.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="350.0" y="57.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">", "temp_c": </text>
  <line x1="406.0" y1="57.0" x2="421.0" y2="57.0" class="ln" stroke-width="1.2"/>
  <polygon points="426.0,57.0 419.9,60.4 419.9,53.6" class="ah"/>
  <rect x="426.0" y="40.0" width="112.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="482.0" y="57.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">整数</text>
  <line x1="538.0" y1="57.0" x2="553.0" y2="57.0" class="ln" stroke-width="1.2"/>
  <polygon points="558.0,57.0 551.9,60.4 551.9,53.6" class="ah"/>
  <rect x="558.0" y="40.0" width="112.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="614.0" y="57.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">"}</text>
  <text x="350.0" y="24.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">模板的状态机：字面量段和字段段交替</text>
  <rect x="60.0" y="110.0" width="100.0" height="34.0" rx="6" class="orange" stroke-width="1.6"/>
  <text x="110.0" y="127.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">当前状态：整数</text>
  <line x1="160.0" y1="127.0" x2="215.0" y2="127.0" class="ln" stroke-width="1.3"/>
  <polygon points="220.0,127.0 213.9,130.4 213.9,123.6" class="ah"/>
  <text x="190.0" y="111.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="190.0" dy="-5.6">沿词表前缀树</tspan><tspan x="190.0" dy="11.2">算允许集合</tspan></text>
  <rect x="225.0" y="110.0" width="48.0" height="34.0" rx="5" class="green" stroke-width="1.4"/>
  <text x="249.0" y="127.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">123</text>
  <text x="249.0" y="158.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">允许</text>
  <rect x="279.0" y="110.0" width="48.0" height="34.0" rx="5" class="gray" stroke-width="0.8"/>
  <text x="303.0" y="127.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"> 45</text>
  <text x="303.0" y="158.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">−∞</text>
  <rect x="333.0" y="110.0" width="48.0" height="34.0" rx="5" class="green" stroke-width="1.4"/>
  <text x="357.0" y="127.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">-7</text>
  <text x="357.0" y="158.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">允许</text>
  <rect x="387.0" y="110.0" width="48.0" height="34.0" rx="5" class="gray" stroke-width="0.8"/>
  <text x="411.0" y="127.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">晴</text>
  <text x="411.0" y="158.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">−∞</text>
  <rect x="441.0" y="110.0" width="48.0" height="34.0" rx="5" class="gray" stroke-width="0.8"/>
  <text x="465.0" y="127.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">}</text>
  <text x="465.0" y="158.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">−∞</text>
  <rect x="495.0" y="110.0" width="48.0" height="34.0" rx="5" class="green" stroke-width="1.4"/>
  <text x="519.0" y="127.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">2</text>
  <text x="519.0" y="158.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">允许</text>
  <rect x="549.0" y="110.0" width="48.0" height="34.0" rx="5" class="gray" stroke-width="0.8"/>
  <text x="573.0" y="127.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">abc</text>
  <text x="573.0" y="158.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">−∞</text>
  <rect x="603.0" y="110.0" width="48.0" height="34.0" rx="5" class="green" stroke-width="1.4"/>
  <text x="627.0" y="127.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">,</text>
  <text x="627.0" y="158.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">允许</text>
  <text x="350.0" y="184.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">掩码：不允许的 token 的 logit 设为 −∞，允许的 token 之间相对概率不变，模型在格式允许的范围内自由发挥</text>
  <line x1="350.0" y1="196.0" x2="350.0" y2="209.0" class="ln" stroke-width="1.2"/>
  <polygon points="350.0,214.0 346.6,207.9 353.4,207.9" class="ah"/>
  <rect x="230.0" y="214.0" width="240.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="350.0" y="229.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">采样 → 选中 "-7" → 状态推进（整数段仍可继续或进入下一段）</text>
  <text x="350.0" y="262.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">每一步都要算一遍允许集合：词表 15 万、状态机可能上千个状态，所以要预编译、缓存每个状态的掩码，并在 GPU 上并行应用</text>
</svg>
