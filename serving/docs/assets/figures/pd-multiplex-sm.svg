<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="同一张卡上 prefill 与 decode 的三种共存方式：时间上交替、空间上切 SM（green context）、分到不同的卡">
  <text x="120.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">时间上交替</text>
  <rect x="30.0" y="40.0" width="180.0" height="22.0" rx="3" class="gray" stroke-width="0.8"/>
  <rect x="30.0" y="40.0" width="70.0" height="22.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="65.0" y="51.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">prefill</text>
  <rect x="100.0" y="40.0" width="18.0" height="22.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="109.0" y="51.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">d</text>
  <rect x="118.0" y="40.0" width="60.0" height="22.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="148.0" y="51.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">prefill</text>
  <rect x="178.0" y="40.0" width="32.0" height="22.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="194.0" y="51.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">d</text>
  <text x="120.0" y="78.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">整卡轮流用：prefill 一来 decode 就被卡住</text>
  <text x="120.0" y="96.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">（分块 prefill：切小块混进 decode，每步都变慢一点）</text>
  <text x="350.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">空间上切 SM（PD 复用）</text>
  <rect x="260.0" y="40.0" width="180.0" height="22.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="350.0" y="51.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">prefill：104 个 SM</text>
  <rect x="260.0" y="66.0" width="180.0" height="14.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="350.0" y="73.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">decode：28 个 SM</text>
  <text x="350.0" y="100.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="350.0" dy="-5.9">两条流各占一块 SM，同时跑：</tspan><tspan x="350.0" dy="11.8">decode 只和 prefill 争带宽与 L2，不被整段卡住</tspan></text>
  <text x="580.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">分到不同的卡（PD 分离）</text>
  <rect x="500.0" y="40.0" width="76.0" height="40.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="538.0" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">prefill 实例</text>
  <rect x="600.0" y="40.0" width="76.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="638.0" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">decode 实例</text>
  <line x1="576.0" y1="60.0" x2="595.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="600.0,60.0 593.9,63.4 593.9,56.6" class="ah"/>
  <text x="588.0" y="51.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">传 KV</text>
  <text x="588.0" y="100.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="588.0" dy="-5.9">互不干扰，但要 RDMA / NVLink 传 KV，</tspan><tspan x="588.0" dy="11.8">还要维护 xPyD 配比</tspan></text>
  <line x1="30.0" y1="130.0" x2="670.0" y2="130.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="350.0" y="152.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">green context（CUDA 12.4+）：cuDevSmResourceSplitByCount 把 SM 切成几份，各建一个上下文和流，kernel 只在自己那份 SM 上跑</text>
  <text x="350.0" y="178.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">切分档位是调节旋钮：prefill 分得多 → 新请求的 TTFT 短；decode 分得多 → TPOT 稳。SGLang 的 PD 复用还让 prefill 每轮只跑几层，给 decode 让路</text>
  <text x="350.0" y="204.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">值不值：相比分块 prefill，decode 的 P99 TPOT 明显更稳；相比 PD 分离，不多买卡、不传 KV；代价是 prefill 变慢、两边都受带宽和 L2 的干扰</text>
  <text x="350.0" y="230.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">什么时候用：单卡或少卡部署、提示词中等长度、对 TPOT 抖动敏感的场景</text>
</svg>
