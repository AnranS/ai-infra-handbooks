  <text x="390.0" y="150.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">每个节点分到相同数量的组，组的负载之和尽量相等</text>
  <line x1="500.0" y1="80.0" x2="535.0" y2="80.0" class="ln" stroke-width="1.3"/>
  <polygon points="540.0,80.0 533.9,83.4 533.9,76.6" class="ah"/>
  <text x="620.0" y="22.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">③ 节点内复制热门专家</text>
  <rect x="545.0" y="44.0" width="32.0" height="24.0" rx="4" class="orange" stroke-width="1.3"/>
