  <rect x="380.0" y="102.0" width="34.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="397.0" y="114.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">组 7</text>
  <rect x="420.0" y="102.0" width="34.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="437.0" y="114.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">组 2</text>
