  <text x="390.0" y="22.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">② 组打包到节点（分层策略）</text>
  <rect x="280.0" y="44.0" width="220.0" height="40.0" rx="6" class="gray" stroke-width="1"/>
