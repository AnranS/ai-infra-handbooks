<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="多 LoRA 服务：基座矩阵乘所有 token 一起算，LoRA 的小矩阵按各自的适配器分组计算，再加回去">
  <rect x="30.0" y="50.0" width="110.0" height="150.0" rx="7" class="gray" stroke-width="1.2"/>
  <text x="85.0" y="40.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">一个混合 batch</text>
  <rect x="40.0" y="58.0" width="90.0" height="18.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="85.0" y="67.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">请求 1，适配器 3</text>
  <rect x="40.0" y="81.0" width="90.0" height="18.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="85.0" y="90.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">请求 2，适配器 5</text>
  <rect x="40.0" y="104.0" width="90.0" height="18.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="85.0" y="113.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">请求 3，适配器 3</text>
  <rect x="40.0" y="127.0" width="90.0" height="18.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="85.0" y="136.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">请求 4，适配器 0</text>
  <rect x="40.0" y="150.0" width="90.0" height="18.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="85.0" y="159.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">请求 5，适配器 7</text>
  <rect x="40.0" y="173.0" width="90.0" height="18.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="85.0" y="182.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">请求 6，适配器 5</text>
  <line x1="140.0" y1="125.0" x2="175.0" y2="125.0" class="ln" stroke-width="1.3"/>
  <polygon points="180.0,125.0 173.9,128.4 173.9,121.6" class="ah"/>
  <rect x="180.0" y="60.0" width="150.0" height="50.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="255.0" y="85.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="255.0" dy="-6.2">基座 GEMM</tspan><tspan x="255.0" dy="12.4">x · W（全部 token 一次）</tspan></text>
  <rect x="180.0" y="140.0" width="150.0" height="50.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="255.0" y="165.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="255.0" dy="-6.2">LoRA 分支</tspan><tspan x="255.0" dy="12.4">x · A_i · B_i（按适配器）</tspan></text>
  <line x1="330.0" y1="85.0" x2="375.8" y2="115.2" class="ln" stroke-width="1.2"/>
  <polygon points="380.0,118.0 373.0,117.4 376.7,111.8" class="ah"/>
  <line x1="330.0" y1="165.0" x2="375.8" y2="134.8" class="ln" stroke-width="1.2"/>
  <polygon points="380.0,132.0 376.7,138.2 373.0,132.6" class="ah"/>
  <circle cx="392.0" cy="125.0" r="12.0" class="green" stroke-width="1.3"/>
  <text x="392.0" y="125.0" class="tx" font-size="14" text-anchor="middle" dominant-baseline="middle">+</text>
  <line x1="404.0" y1="125.0" x2="435.0" y2="125.0" class="ln" stroke-width="1.3"/>
  <polygon points="440.0,125.0 433.9,128.4 433.9,121.6" class="ah"/>
  <rect x="440.0" y="100.0" width="80.0" height="50.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="480.0" y="125.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">y</text>
  <text x="600.0" y="70.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-5.9">SGMV：同一适配器的 token 排在一起，</tspan><tspan x="600.0" dy="11.8">每一段一次小矩阵乘（prefill 友好）</tspan></text>
  <text x="600.0" y="125.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-5.9">BGMV：每个 token 按编号取自己的 A、B，</tspan><tspan x="600.0" dy="11.8">逐 token 矩阵 × 向量（decode 友好）</tspan></text>
  <text x="600.0" y="180.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-5.9">秩 r 只有 8～64：LoRA 分支的 FLOP</tspan><tspan x="600.0" dy="11.8">是基座的 1%～2%，显存按适配器数线性增长</tspan></text>
  <text x="350.0" y="230.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">适配器像 KV 一样要调度：常用的常驻显存，冷的放 CPU 按需搬；同一步里适配器种类太多会让 SGMV 的段变碎</text>
</svg>
