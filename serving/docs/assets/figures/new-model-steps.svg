<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" role="img" aria-label="接入一个新模型的五步：找差别 → 照参考实现写 → 逐层对齐 → 端到端指标 → 精度评测；每一步都有可量化的通过标准">
  <rect x="20.0" y="40.0" width="120.0" height="36.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="80.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">① 找差别</text>
  <text x="80.0" y="110.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.3">和已支持的最近模型比 config、</tspan><tspan x="80.0" dy="10.5">权重名、注意力 / MoE 的变体</tspan></text>
  <rect x="156.0" y="40.0" width="120.0" height="36.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="216.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">② 照参考实现写</text>
  <text x="216.0" y="110.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="216.0" dy="-5.3">transformers 的实现是真相；</tspan><tspan x="216.0" dy="10.5">按引擎的 Linear / Attention 抽象改</tspan></text>
  <rect x="292.0" y="40.0" width="120.0" height="36.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="352.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">③ 逐层对齐</text>
  <text x="352.0" y="110.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-5.3">同一输入，每一层输出</tspan><tspan x="352.0" dy="10.5">和参考实现的最大误差 &lt; 阈值</tspan></text>
  <rect x="428.0" y="40.0" width="120.0" height="36.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="488.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">④ 端到端</text>
  <text x="488.0" y="110.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-5.3">贪心输出一致；</tspan><tspan x="488.0" dy="10.5">TTFT / TPOT 对得上估算</tspan></text>
  <rect x="564.0" y="40.0" width="120.0" height="36.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="624.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">⑤ 精度评测</text>
  <text x="624.0" y="110.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" dy="-5.3">几个基准的分数</tspan><tspan x="624.0" dy="10.5">和官方对齐</tspan></text>
  <line x1="140.0" y1="58.0" x2="151.0" y2="58.0" class="ln" stroke-width="1.2"/>
  <polygon points="156.0,58.0 149.9,61.4 149.9,54.6" class="ah"/>
  <line x1="276.0" y1="58.0" x2="287.0" y2="58.0" class="ln" stroke-width="1.2"/>
  <polygon points="292.0,58.0 285.9,61.4 285.9,54.6" class="ah"/>
  <line x1="412.0" y1="58.0" x2="423.0" y2="58.0" class="ln" stroke-width="1.2"/>
  <polygon points="428.0,58.0 421.9,61.4 421.9,54.6" class="ah"/>
  <line x1="548.0" y1="58.0" x2="559.0" y2="58.0" class="ln" stroke-width="1.2"/>
  <polygon points="564.0,58.0 557.9,61.4 557.9,54.6" class="ah"/>
  <text x="350.0" y="160.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">权重名映射和 QKV 合并是最常出错的地方；逐层对齐要在 fp32 下做，bf16 的误差会把真正的 bug 掩盖掉</text>
  <text x="350.0" y="184.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">在框架里落地：注册模型类、写权重加载器、挑注意力后端、补 CUDA Graph 的形状、加一条 CI 的精度测试</text>
</svg>
