<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="同一行结果为什么会随 batch 变：kernel 按请求数选切分方式，加法顺序变了，浮点结果就变了">
  <text x="170.0" y="22.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">batch 小：split-K = 4，占满 SM</text>
  <rect x="40.0" y="40.0" width="58.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="69.0" y="53.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">段 1</text>
  <line x1="69.0" y1="66.0" x2="145.3" y2="94.3" class="ln" stroke-width="1"/>
  <polygon points="150.0,96.0 143.1,97.0 145.4,90.7" class="ah"/>
  <rect x="106.0" y="40.0" width="58.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="135.0" y="53.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">段 2</text>
  <line x1="135.0" y1="66.0" x2="156.8" y2="92.2" class="ln" stroke-width="1"/>
  <polygon points="160.0,96.0 153.5,93.4 158.7,89.1" class="ah"/>
  <rect x="172.0" y="40.0" width="58.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="201.0" y="53.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">段 3</text>
  <line x1="201.0" y1="66.0" x2="173.6" y2="92.5" class="ln" stroke-width="1"/>
  <polygon points="170.0,96.0 172.1,89.3 176.8,94.2" class="ah"/>
  <rect x="238.0" y="40.0" width="58.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="267.0" y="53.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">段 4</text>
  <line x1="267.0" y1="66.0" x2="184.7" y2="94.4" class="ln" stroke-width="1"/>
  <polygon points="180.0,96.0 184.7,90.8 186.9,97.2" class="ah"/>
  <rect x="100.0" y="96.0" width="130.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="165.0" y="109.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">((s1 + s2) + s3) + s4</text>
  <text x="170.0" y="140.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">= 0.30000001</text>
  <text x="520.0" y="22.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">batch 大：不切分，顺序累加</text>
  <rect x="400.0" y="40.0" width="240.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="520.0" y="53.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">整段 K 一次累加</text>
  <line x1="520.0" y1="66.0" x2="520.0" y2="91.0" class="ln" stroke-width="1"/>
  <polygon points="520.0,96.0 516.6,89.9 523.4,89.9" class="ah"/>
  <rect x="455.0" y="96.0" width="130.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="520.0" y="109.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">按 k 从头加到尾</text>
  <text x="520.0" y="140.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">= 0.29999998</text>
  <line x1="350.0" y1="30.0" x2="350.0" y2="150.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="350.0" y="170.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">同一个请求、同样的输入，和谁一起进 batch 决定了它的结果——这就是推理结果不逐位一致的根源之一</text>
  <text x="350.0" y="192.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">batch 无关（batch-invariant）kernel：切分方式固定，不随负载变；归约顺序固定；注意力的分块策略也固定</text>
  <text x="350.0" y="214.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">代价是放弃按形状选最优配置，吞吐降一到两成；强化学习要它，是因为训练侧和推理侧算出的概率必须对得上</text>
</svg>
