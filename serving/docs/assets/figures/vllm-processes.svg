<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="vLLM 的进程结构：API server 进程做分词 / 反分词，EngineCore 进程只管调度与 KV，Worker 进程（每卡一个）跑模型">
  <rect x="30.0" y="40.0" width="160.0" height="120.0" rx="9" class="green" stroke-width="1.2"/>
  <text x="110.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">API server 进程</text>
  <text x="110.0" y="108.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="110.0" dy="-16.7">FastAPI 路由</tspan><tspan x="110.0" dy="11.2">AsyncLLM</tspan><tspan x="110.0" dy="11.2">InputProcessor（分词）</tspan><tspan x="110.0" dy="11.2">OutputProcessor（反分词）</tspan></text>
  <rect x="270.0" y="40.0" width="160.0" height="120.0" rx="9" class="blue" stroke-width="1.2"/>
  <text x="350.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">EngineCore 进程</text>
  <text x="350.0" y="108.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="350.0" dy="-16.7">输入线程 → input_queue</tspan><tspan x="350.0" dy="11.2">主线程：busy loop</tspan><tspan x="350.0" dy="11.2">Scheduler + KVCacheManager</tspan><tspan x="350.0" dy="11.2">输出线程 ← output_queue</tspan></text>
  <rect x="510.0" y="40.0" width="160.0" height="120.0" rx="9" class="orange" stroke-width="1.2"/>
  <text x="590.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">Worker 进程 × N</text>
  <text x="590.0" y="108.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="590.0" dy="-11.2">GPUModelRunner</tspan><tspan x="590.0" dy="11.2">模型 + 注意力后端</tspan><tspan x="590.0" dy="11.2">Sampler</tspan></text>
  <line x1="190.0" y1="90.0" x2="265.0" y2="90.0" class="ln" stroke-width="1.4"/>
  <polygon points="270.0,90.0 263.9,93.4 263.9,86.6" class="ah"/>
  <text x="230.0" y="80.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">ZMQ + msgpack</text>
  <line x1="270.0" y1="120.0" x2="195.0" y2="120.0" class="ln" stroke-width="1.4"/>
  <polygon points="190.0,120.0 196.1,116.6 196.1,123.4" class="ah"/>
  <line x1="430.0" y1="90.0" x2="505.0" y2="90.0" class="ln" stroke-width="1.4"/>
  <polygon points="510.0,90.0 503.9,93.4 503.9,86.6" class="ah"/>
  <text x="470.0" y="80.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">共享内存消息队列（广播）</text>
  <line x1="510.0" y1="120.0" x2="435.0" y2="120.0" class="ln" stroke-width="1.4"/>
  <polygon points="430.0,120.0 436.1,116.6 436.1,123.4" class="ah"/>
  <text x="350.0" y="190.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">把 CPU 重活（HTTP、分词）和调度分到不同进程，GPU 调度循环不被 Python 的 GIL 和 HTTP 处理卡住；单卡时 Worker 直接在 EngineCore 进程里</text>
  <text x="350.0" y="214.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">数据并行：每个 DP rank 一个 EngineCore，前端做负载均衡；读源码从 EngineCore.step() 和 Scheduler.schedule() 两条主线开始</text>
</svg>
