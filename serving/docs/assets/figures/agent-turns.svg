<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" role="img" aria-label="Agent 会话里的 prefill 与 decode">
  <text x="500.0" y="26.0" class="tx" font-size="19" text-anchor="middle" dominant-baseline="middle" font-weight="700">Agent 会话里 prefill 和 decode 怎么切换</text>
  <text x="500.0" y="50.0" class="mu" font-size="12.5" text-anchor="middle" dominant-baseline="middle">用 Qwen3.5 的真实聊天模板算出来的 token 数：3 个工具定义，模型调 2 次工具后回答，用户再追问一句</text>
  <text x="20.0" y="86.0" class="tx" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="700">① 一个会话的时间线：每"调一次模型"就是一个新请求，先 prefill 再 decode，停在工具调用上</text>
  <text x="20.0" y="118.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="600">Agent 框架</text>
  <text x="20.0" y="170.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="600">推理引擎</text>
  <text x="20.0" y="188.0" class="mu" font-size="11" text-anchor="start" dominant-baseline="middle">（这个会话）</text>
  <rect x="110.0" y="152.0" width="212.5" height="34.0" rx="3" class="orange" stroke-width="0.8"/>
  <rect x="322.5" y="152.0" width="31.1" height="34.0" rx="3" class="blue" stroke-width="0.8"/>
  <text x="216.3" y="210.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">prefill 506</text>
  <text x="216.3" y="228.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">冷启动</text>
  <text x="338.1" y="140.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">decode 74</text>
  <rect x="110.0" y="100.0" width="243.6" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="231.8" y="115.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">调模型</text>
  <rect x="359.6" y="100.0" width="74.0" height="30.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="396.6" y="115.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">执行搜索</text>
  <text x="396.6" y="170.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">GPU 去服务</text>
  <text x="396.6" y="186.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">别的请求</text>
  <rect x="439.6" y="152.0" width="81.1" height="34.0" rx="3" class="orange" stroke-width="0.8"/>
  <rect x="520.7" y="152.0" width="44.9" height="34.0" rx="3" class="blue" stroke-width="0.8"/>
  <text x="480.1" y="210.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">prefill 193</text>
  <text x="480.1" y="228.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">命中缓存 580</text>
  <text x="543.1" y="140.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">decode 107</text>
  <rect x="439.6" y="100.0" width="126.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="502.6" y="115.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">调模型</text>
  <rect x="571.6" y="100.0" width="74.0" height="30.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="608.6" y="115.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">执行代码</text>
  <text x="608.6" y="170.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">GPU 去服务</text>
  <text x="608.6" y="186.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">别的请求</text>
  <rect x="651.6" y="152.0" width="7.6" height="34.0" rx="3" class="orange" stroke-width="0.8"/>
  <rect x="659.2" y="152.0" width="19.7" height="34.0" rx="3" class="blue" stroke-width="0.8"/>
  <text x="655.4" y="210.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">prefill 18</text>
  <text x="655.4" y="228.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">命中缓存 880</text>
  <text x="669.0" y="140.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">decode 47</text>
  <rect x="651.6" y="100.0" width="46.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="674.6" y="115.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">调模型</text>
  <rect x="703.6" y="100.0" width="74.0" height="30.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="740.6" y="115.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">用户读完再问</text>
  <text x="740.6" y="170.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">GPU 去服务</text>
  <text x="740.6" y="186.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">别的请求</text>
  <rect x="783.6" y="152.0" width="134.4" height="34.0" rx="3" class="orange" stroke-width="0.8"/>
  <rect x="918.0" y="152.0" width="16.8" height="34.0" rx="3" class="blue" stroke-width="0.8"/>
  <text x="850.8" y="210.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">prefill 320</text>
  <text x="850.8" y="228.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">命中缓存 504</text>
  <text x="926.4" y="140.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">decode …</text>
  <rect x="783.6" y="100.0" width="151.2" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="859.2" y="115.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">调模型</text>
  <text x="110.0" y="254.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">橙 = prefill（一次算一段），蓝 = decode（一个 token 一步）。每次 decode 都停在模型吐出的 &lt;/tool_call&gt; 或 &lt;|im_end|&gt; 上，请求就结束了。</text>
  <text x="110.0" y="276.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">第 4 个请求只命中 504：模板会把上一轮的 &lt;think&gt; 思考删掉，历史变了，前缀在第一个 assistant 回合处断开。</text>
  <line x1="20.0" y1="296.0" x2="980.0" y2="296.0" class="ln" stroke-width="0.6" stroke-opacity="0.3"/>
  <text x="20.0" y="320.0" class="tx" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="700">② 每次请求要 prefill 多少：前缀缓存把大部分都省了</text>
  <text x="150.0" y="352.0" class="tx" font-size="12" text-anchor="end" dominant-baseline="middle">用户提问</text>
  <rect x="160.0" y="338.0" width="227.7" height="13.0" rx="2" class="gray" stroke-width="0.6"/>
  <text x="393.7" y="345.0" class="mu" font-size="11" text-anchor="start" dominant-baseline="middle">整段提示词 506</text>
  <rect x="160.0" y="353.0" width="227.7" height="13.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="393.7" y="360.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle">实际 prefill 506</text>
  <text x="150.0" y="390.0" class="tx" font-size="12" text-anchor="end" dominant-baseline="middle">工具结果 1 回来</text>
  <rect x="160.0" y="376.0" width="347.9" height="13.0" rx="2" class="gray" stroke-width="0.6"/>
  <text x="513.9" y="383.0" class="mu" font-size="11" text-anchor="start" dominant-baseline="middle">整段提示词 773</text>
  <rect x="160.0" y="391.0" width="86.9" height="13.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="252.9" y="398.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle">实际 prefill 193</text>
  <text x="150.0" y="428.0" class="tx" font-size="12" text-anchor="end" dominant-baseline="middle">工具结果 2 回来</text>
  <rect x="160.0" y="414.0" width="404.1" height="13.0" rx="2" class="gray" stroke-width="0.6"/>
  <text x="570.1" y="421.0" class="mu" font-size="11" text-anchor="start" dominant-baseline="middle">整段提示词 898</text>
  <rect x="160.0" y="429.0" width="8.1" height="13.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="174.1" y="436.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle">实际 prefill 18</text>
  <text x="150.0" y="466.0" class="tx" font-size="12" text-anchor="end" dominant-baseline="middle">用户追问</text>
  <rect x="160.0" y="452.0" width="370.8" height="13.0" rx="2" class="gray" stroke-width="0.6"/>
  <text x="536.8" y="459.0" class="mu" font-size="11" text-anchor="start" dominant-baseline="middle">整段提示词 824</text>
  <rect x="160.0" y="467.0" width="144.0" height="13.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="310.0" y="474.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle">实际 prefill 320</text>
  <text x="750.0" y="352.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle">四次加起来：</text>
  <text x="750.0" y="376.0" class="mu" font-size="12.5" text-anchor="start" dominant-baseline="middle">整段提示词 3001 token</text>
  <text x="750.0" y="400.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="700">实际 prefill 1037 token</text>
  <text x="750.0" y="432.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">系统提示词 + 工具定义 486 token</text>
  <text x="750.0" y="452.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">是所有会话共享的，真实服务里</text>
  <text x="750.0" y="472.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">第一次请求一般也能命中</text>
  <line x1="20.0" y1="500.0" x2="980.0" y2="500.0" class="ln" stroke-width="0.6" stroke-opacity="0.3"/>
  <text x="20.0" y="524.0" class="tx" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="700">③ 引擎里一个请求怎么走（SGLang 这类引擎，每个调度步都在跑这个循环）</text>
  <rect x="20.0" y="546.0" width="80.0" height="52.0" rx="8" class="gray" stroke-width="1.3"/>
  <text x="60.0" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">请求到达</text>
  <line x1="100.0" y1="572.0" x2="109.0" y2="572.0" class="ln" stroke-width="1.4"/>
  <polygon points="114.0,572.0 107.9,575.4 107.9,568.6" class="ah"/>
  <rect x="114.0" y="546.0" width="145.0" height="52.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="186.5" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="186.5" dy="-6.5">查基数树</tspan><tspan x="186.5" dy="13.0">找最长的已缓存前缀</tspan></text>
  <line x1="259.0" y1="572.0" x2="268.0" y2="572.0" class="ln" stroke-width="1.4"/>
  <polygon points="273.0,572.0 266.9,575.4 266.9,568.6" class="ah"/>
  <rect x="273.0" y="546.0" width="215.0" height="52.0" rx="8" class="orange" stroke-width="1.3"/>
  <text x="380.5" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="380.5" dy="-6.5">只 prefill 没命中的部分</tspan><tspan x="380.5" dy="13.0">长的切块，和别人的 decode 交替跑</tspan></text>
  <line x1="488.0" y1="572.0" x2="497.0" y2="572.0" class="ln" stroke-width="1.4"/>
  <polygon points="502.0,572.0 495.9,575.4 495.9,568.6" class="ah"/>
  <rect x="502.0" y="546.0" width="115.0" height="52.0" rx="8" class="orange" stroke-width="1.3"/>
  <text x="559.5" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="559.5" dy="-6.5">采样出第一个 token</tspan><tspan x="559.5" dy="13.0">（TTFT）</tspan></text>
  <line x1="617.0" y1="572.0" x2="626.0" y2="572.0" class="ln" stroke-width="1.4"/>
  <polygon points="631.0,572.0 624.9,575.4 624.9,568.6" class="ah"/>
  <rect x="631.0" y="546.0" width="155.0" height="52.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="708.5" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="708.5" dy="-6.5">进 decode 批</tspan><tspan x="708.5" dy="13.0">和别的请求一起，每步 1 个</tspan></text>
  <line x1="786.0" y1="572.0" x2="795.0" y2="572.0" class="ln" stroke-width="1.4"/>
  <polygon points="800.0,572.0 793.9,575.4 793.9,568.6" class="ah"/>
  <rect x="800.0" y="546.0" width="165.0" height="52.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="882.5" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="882.5" dy="-6.5">吐出停止符</tspan><tspan x="882.5" dy="13.0">&lt;/tool_call&gt;、&lt;|im_end|&gt;</tspan></text>
  <line x1="882.0" y1="598.0" x2="882.0" y2="617.0" class="ln" stroke-width="1.4"/>
  <polygon points="882.0,622.0 878.6,615.9 885.4,615.9" class="ah"/>
  <rect x="690.0" y="624.0" width="290.0" height="46.0" rx="8" class="green" stroke-width="1.3"/>
  <text x="835.0" y="647.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="835.0" dy="-7.1">结束：KV 和状态插回基数树</tspan><tspan x="835.0" dy="14.3">留给这个会话的下一步</tspan></text>
  <path d="M 690.0 647.0 L 60.0 647.0 L 60.0 598.0" class="ln" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="60.0,598.0 63.4,604.1 56.6,604.1" class="ah"/>
  <text x="380.0" y="638.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">Agent 框架执行工具，拿到结果拼进历史，再发下一个请求</text>
  <line x1="20.0" y1="690.0" x2="980.0" y2="690.0" class="ln" stroke-width="0.6" stroke-opacity="0.3"/>
  <text x="20.0" y="714.0" class="tx" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="700">④ 两个和 agent 场景特别相关的地方</text>
  <rect x="20.0" y="730.0" width="470.0" height="150.0" rx="10" class="blue" stroke-width="1.0"/>
  <text x="36.0" y="752.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="700">Qwen3.5 是混合模型：线性注意力层的状态截不开</text>
  <text x="36.0" y="778.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">全注意力层的 KV：任意位置都能截断复用</text>
  <text x="36.0" y="800.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">线性注意力的记忆表：是前文的"总结"，截不开；</text>
  <text x="36.0" y="822.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">只有存了检查点的位置能复用，命中点落在两个检查点</text>
  <text x="36.0" y="844.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">之间，就得从前一个检查点重算</text>
  <text x="36.0" y="866.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">本章的模拟里，新一轮因此要从头 prefill 824 个，而不是 320 个</text>
  <rect x="510.0" y="730.0" width="470.0" height="150.0" rx="10" class="orange" stroke-width="1.0"/>
  <text x="526.0" y="752.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="700">PD 分离部署时，每一步都要再走一遍 prefill</text>
  <text x="526.0" y="778.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">prefill 实例算出新的 KV，传给 decode 实例接着生成</text>
  <text x="526.0" y="800.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">下一步的前缀要在 prefill 那边能找到，所以要：</text>
  <text x="526.0" y="822.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">· 把同一个会话路由到有它缓存的机器</text>
  <text x="526.0" y="844.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">· 或者用共享的多级 KV 存储（显存、内存、SSD）</text>
  <text x="526.0" y="866.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">工具结果往往只有几十到几百 token，算得快、搬得也快</text>
</svg>
