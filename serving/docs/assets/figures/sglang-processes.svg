<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="SGLang 的进程结构：TokenizerManager 在主进程，每个 TP rank 一个 Scheduler 进程（调度和模型执行在同一进程），反分词单独一个进程">
  <rect x="30.0" y="40.0" width="160.0" height="120.0" rx="9" class="green" stroke-width="1.2"/>
  <text x="110.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">主进程</text>
  <text x="110.0" y="108.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="110.0" dy="-11.2">HTTP 服务（FastAPI）</tspan><tspan x="110.0" dy="11.2">TokenizerManager</tspan><tspan x="110.0" dy="11.2">分词、对话模板、多模态预处理</tspan></text>
  <rect x="270.0" y="40.0" width="160.0" height="120.0" rx="9" class="blue" stroke-width="1.2"/>
  <text x="350.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">Scheduler 进程 × TP</text>
  <text x="350.0" y="108.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="350.0" dy="-11.2">event_loop_overlap / normal</tspan><tspan x="350.0" dy="11.2">接收请求 → 组批 → run_batch</tspan><tspan x="350.0" dy="11.2">TpModelWorker → ModelRunner</tspan></text>
  <rect x="510.0" y="40.0" width="160.0" height="120.0" rx="9" class="orange" stroke-width="1.2"/>
  <text x="590.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">DetokenizerManager 进程</text>
  <text x="590.0" y="108.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="590.0" dy="-5.6">增量反分词</tspan><tspan x="590.0" dy="11.2">停止字符串</tspan></text>
  <line x1="190.0" y1="90.0" x2="265.0" y2="90.0" class="ln" stroke-width="1.4"/>
  <polygon points="270.0,90.0 263.9,93.4 263.9,86.6" class="ah"/>
  <text x="230.0" y="80.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">ZMQ</text>
  <line x1="430.0" y1="90.0" x2="505.0" y2="90.0" class="ln" stroke-width="1.4"/>
  <polygon points="510.0,90.0 503.9,93.4 503.9,86.6" class="ah"/>
  <text x="470.0" y="80.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">ZMQ</text>
  <line x1="510.0" y1="130.0" x2="195.0" y2="130.0" class="ln" stroke-width="1.4"/>
  <polygon points="190.0,130.0 196.1,126.6 196.1,133.4" class="ah"/>
  <text x="350.0" y="142.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">结果回到 TokenizerManager，再流式返回客户端</text>
  <text x="350.0" y="190.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">和 vLLM 最大的差别：没有单独的 Engine 进程，每个 TP rank 的 Scheduler 各自调度出相同的批次；overlap 模式让 CPU 调度和 GPU 前向错开一步</text>
  <text x="350.0" y="214.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">读源码从 Scheduler.event_loop_overlap() 和 get_next_batch_to_run() 开始；KV 内存与基数树前缀缓存在 mem_cache 目录</text>
</svg>
