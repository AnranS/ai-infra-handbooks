<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="一张卡怎么到达容器：驱动在节点上，device plugin 把卡登记成资源，调度器按 requests 选节点，容器运行时把设备文件挂进去">
  <rect x="20.0" y="50.0" width="120.0" height="70.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="85.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.9">节点：NVIDIA 驱动</tspan><tspan x="80.0" dy="11.8">/dev/nvidia0..7</tspan></text>
  <line x1="140.0" y1="85.0" x2="151.0" y2="85.0" class="ln" stroke-width="1.3"/>
  <polygon points="156.0,85.0 149.9,88.4 149.9,81.6" class="ah"/>
  <rect x="156.0" y="50.0" width="120.0" height="70.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="216.0" y="85.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="216.0" dy="-11.8">device plugin</tspan><tspan x="216.0" dy="11.8">向 kubelet 登记</tspan><tspan x="216.0" dy="11.8">nvidia.com/gpu: 8</tspan></text>
  <line x1="276.0" y1="85.0" x2="287.0" y2="85.0" class="ln" stroke-width="1.3"/>
  <polygon points="292.0,85.0 285.9,88.4 285.9,81.6" class="ah"/>
  <rect x="292.0" y="50.0" width="120.0" height="70.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="352.0" y="85.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-11.8">调度器</tspan><tspan x="352.0" dy="11.8">按 requests 选节点</tspan><tspan x="352.0" dy="11.8">（拓扑、亲和、污点）</tspan></text>
  <line x1="412.0" y1="85.0" x2="423.0" y2="85.0" class="ln" stroke-width="1.3"/>
  <polygon points="428.0,85.0 421.9,88.4 421.9,81.6" class="ah"/>
  <rect x="428.0" y="50.0" width="120.0" height="70.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="488.0" y="85.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-11.8">kubelet + 容器运行时</tspan><tspan x="488.0" dy="11.8">把设备文件、驱动库</tspan><tspan x="488.0" dy="11.8">挂进容器</tspan></text>
  <line x1="548.0" y1="85.0" x2="559.0" y2="85.0" class="ln" stroke-width="1.3"/>
  <polygon points="564.0,85.0 557.9,88.4 557.9,81.6" class="ah"/>
  <rect x="564.0" y="50.0" width="120.0" height="70.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="624.0" y="85.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" dy="-11.8">Pod 里的进程</tspan><tspan x="624.0" dy="11.8">nvidia-smi 看到</tspan><tspan x="624.0" dy="11.8">分到的那几张</tspan></text>
  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">GPU 只能按整卡申请、不能超卖；分到哪几张卡决定了 NVLink 是否连通——TP=4 的实例要同一个 NVSwitch 域里的 4 张卡</text>
  <text x="350.0" y="174.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">切分一张卡：MIG 把一张卡切成几个硬隔离的实例（各有自己的 SM 和显存），时间片则是分时复用、没有显存隔离</text>
  <text x="350.0" y="198.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">让 GPU 节点只跑该跑的东西：污点 + 容忍、节点亲和；驱动升级要先把节点排空（drain）</text>
</svg>
