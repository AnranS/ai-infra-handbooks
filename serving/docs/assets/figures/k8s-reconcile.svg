<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" role="img" aria-label="Kubernetes 的控制器模式：你声明期望状态，控制器不断比较期望与实际，差多少就补多少——apply 之后「什么都没发生」是正常的">
  <rect x="30.0" y="50.0" width="130.0" height="60.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="95.0" y="80.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="95.0" dy="-6.2">期望状态</tspan><tspan x="95.0" dy="12.4">（YAML：3 个副本）</tspan></text>
  <line x1="160.0" y1="80.0" x2="215.0" y2="80.0" class="ln" stroke-width="1.3"/>
  <polygon points="220.0,80.0 213.9,83.4 213.9,76.6" class="ah"/>
  <text x="190.0" y="70.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">kubectl apply</text>
  <rect x="220.0" y="50.0" width="150.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="295.0" y="80.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="295.0" dy="-6.2">API Server + etcd</tspan><tspan x="295.0" dy="12.4">（唯一的真相来源）</tspan></text>
  <line x1="370.0" y1="80.0" x2="425.0" y2="80.0" class="ln" stroke-width="1.3"/>
  <polygon points="430.0,80.0 423.9,83.4 423.9,76.6" class="ah"/>
  <text x="400.0" y="70.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">watch</text>
  <rect x="430.0" y="40.0" width="160.0" height="80.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="510.0" y="80.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="510.0" dy="-11.8">控制器 reconcile 循环</tspan><tspan x="510.0" dy="11.8">读期望 → 看实际 → 补差</tspan><tspan x="510.0" dy="11.8">（创建 / 删除 Pod）</tspan></text>
  <line x1="510.0" y1="120.0" x2="510.0" y2="155.0" class="ln" stroke-width="1.3"/>
  <polygon points="510.0,160.0 506.6,153.9 513.4,153.9" class="ah"/>
  <text x="534.0" y="140.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">动作</text>
  <rect x="430.0" y="160.0" width="160.0" height="50.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="510.0" y="185.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="510.0" dy="-6.2">实际状态</tspan><tspan x="510.0" dy="12.4">（节点上跑着的 Pod）</tspan></text>
  <line x1="430.0" y1="185.0" x2="305.0" y2="185.0" class="ln" stroke-width="1.2"/>
  <polygon points="300.0,185.0 306.1,181.6 306.1,188.4" class="ah"/>
  <text x="365.0" y="175.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">kubelet 上报状态</text>
  <path d="M 300 185 C 250 185 250 110 290 110" class="ln" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="350.0" y="240.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">每一种对象都有自己的控制器：Deployment 管副本数，Service 管流量，LeaderWorkerSet 管一组互相认识的 Pod；出问题先看对象的 status 和 events</text>
</svg>
