site_name: 推理系统手册
site_url: https://anrans.github.io/ai-infra-handbooks/serving/
site_description: 面向推理岗：从零写一个推理引擎，读懂 vLLM 与 SGLang，掌握分布式推理、性能工程与面试
copyright: 示例代码均在 CPU 上实际运行，并与参考实现逐项核对；源码导读基于 vLLM 0.30.0 与 SGLang 0.5.20
repo_url: https://github.com/AnranS/ai-infra-handbooks
repo_name: AnranS/ai-infra-handbooks
edit_uri: edit/main/serving/docs/

theme:
  name: material
  custom_dir: ../theme
  language: zh
  font: false
  icon:
    logo: material/brain
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  book: serving

hooks:
  - ../hooks/crosslinks.py
  - ../hooks/practice.py

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - assets/katex/katex.min.css
  - assets/stylesheets/aig.css
  - assets/extra.css

extra_javascript:
  - assets/katex/katex.min.js
  - assets/katex/auto-render.min.js
  - assets/katex-init.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首页: index.md
  - 推理引擎全景:
      - 一个请求的一生: engine/overview.md
  - 从零写一个推理引擎:
      - 分页 KV Cache: engine/paged-kv.md
      - 变长批处理与一次混合前向: engine/batch-layout.md
      - 调度器：连续批处理、分块 prefill 与抢占: engine/scheduler.md
      - 前缀缓存：哈希块与基数树: engine/prefix-cache.md
      - 采样器、流式输出与 OpenAI 接口: engine/sampler-api.md
      - CUDA Graphs 与 torch.compile: engine/graphs-compile.md
  - 源码导读:
      - vLLM V1: source/vllm.md
      - SGLang: source/sglang.md
  - 分布式推理:
      - 张量并行：从零实现: distributed/tensor-parallel.md
      - 专家并行与 DP Attention: distributed/expert-parallel.md
      - 流水线并行与上下文并行: distributed/pp-cp.md
      - PD 分离与 KV 传输: distributed/pd-disagg.md
      - KV 分层缓存与卸载: distributed/kv-offload.md
  - 通信与存储:
      - GPU 互联与网络：NVLink、PCIe 与 RDMA 网络: comm/interconnect.md
      - 集合通信：NCCL 的算法、协议与定制 all-reduce: comm/nccl.md
      - RDMA 编程模型：verbs、单边操作与内存注册: comm/rdma.md
      - NVSHMEM 与 DeepEP：GPU 发起的通信: comm/nvshmem-deepep.md
      - KV 传输引擎与分布式 KV 存储: comm/kv-storage.md
  - 性能工程:
      - 压测、SLO 与容量规划: perf/benchmark.md
      - Profiling 推理引擎: perf/profiling.md
      - 量化部署实战: perf/quantization-deploy.md
  - 进阶专题:
      - 投机解码进阶：树形草稿与 EAGLE: topics/speculative.md
      - 长上下文、KV 淘汰与稀疏注意力: topics/long-context.md
      - 结构化输出与工具调用: topics/structured-output.md
      - 多模态推理: topics/multimodal.md
      - RL 训练中的推理: topics/rl-rollout.md
  - 前沿专题：大规模 MoE 推理:
      - MLA 推理：两条计算路径与 FlashMLA: moe/mla.md
      - FP8 细粒度量化与分组 GEMM：DeepGEMM: moe/fp8-gemm.md
      - 大规模 EP 部署：分层 EPLB、DP 注意力的负载与双 batch 重叠: moe/ep-deploy.md
      - MTP 与稀疏注意力：NSA 与 DSA: moe/mtp-sparse.md
      - 复盘：一个公开的大规模 MoE 推理系统: moe/case-study.md
  - 前沿专题：分离式架构、长上下文与 RL 推理:
      - 分离式架构的全局调度：KV 感知路由、xPyD 配比与过载控制: frontier/disagg-sched.md
      - 线性注意力与混合架构的推理: frontier/linear-attn.md
      - 超大 MoE 的低比特推理：INT4、FP4 与量化感知训练: frontier/low-bit.md
      - RL 推理系统：异步 rollout、策略陈旧度与权重同步: frontier/rl-async.md
  - 生产与生态:
      - 生产部署与运维：Kubernetes、模型加载、弹性与发布: ops/deploy.md
      - 推理框架选型：vLLM、SGLang、TensorRT-LLM、LMDeploy 与端侧框架: ops/frameworks.md
      - 多 LoRA 服务：分段矩阵乘与适配器调度: ops/multi-lora.md
      - 端侧推理：llama.cpp 与 GGUF、MLX、ExecuTorch: ops/edge.md
  - 求职:
      - 推理岗面试题库: career/interview.md
      - 手撕代码题: career/coding.md
      - 系统设计题: career/system-design.md
      - 系统设计参考答案（一）：MoE、KV 缓存池、网关、多 LoRA、RL: career/design-answers-1.md
      - 系统设计参考答案（二）：长上下文、投机解码、结构化输出、可观测性、多地域: career/design-answers-2.md
      - 模拟面试：评分表与复盘: career/mock-interview.md
      - 模拟面试套卷: career/mock-exams.md
      - 作品集、简历与学习计划: career/projects.md
      - 作品指南：设计文档、里程碑与开源贡献: career/portfolio-guide.md
      - 硬件与生态速查: career/hardware.md
