<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" role="img" aria-label="the shapes of multi-machine instances on Kubernetes: LeaderWorkerSet treats a group of Pods that know each other as one instance; PD disaggregation is two groups of instances plus routing">
  <text x="170.0" y="22.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">LeaderWorkerSet: one instance = leader + workers</text>
  <rect x="30.0" y="40.0" width="280.0" height="110.0" rx="8" class="gray" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="45.0" y="56.0" width="80.0" height="36.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="85.0" y="74.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="85.0" dy="-5.6">leader Pod</tspan><tspan x="85.0" dy="11.2">rank 0</tspan></text>
  <rect x="140.0" y="56.0" width="50.0" height="36.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="165.0" y="74.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="165.0" dy="-5.3">worker</tspan><tspan x="165.0" dy="10.5">rank 1</tspan></text>
  <rect x="196.0" y="56.0" width="50.0" height="36.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="221.0" y="74.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="221.0" dy="-5.3">worker</tspan><tspan x="221.0" dy="10.5">rank 2</tspan></text>
  <rect x="252.0" y="56.0" width="50.0" height="36.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="277.0" y="74.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="277.0" dy="-5.3">worker</tspan><tspan x="277.0" dy="10.5">rank 3</tspan></text>
  <text x="170.0" y="112.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">stable host names let members find each other: TP / PP groups across Pods</text>
  <text x="170.0" y="132.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">created and restarted as a group (gang); one missing member = not ready</text>
  <text x="510.0" y="22.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">the shape of PD disaggregation</text>
  <rect x="360.0" y="40.0" width="100.0" height="44.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="410.0" y="62.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="410.0" dy="-5.6">gateway / routing</tspan><tspan x="410.0" dy="11.2">(choosing instances, the ratio)</tspan></text>
  <rect x="480.0" y="100.0" width="100.0" height="44.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="530.0" y="122.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">prefill instances ×P</text>
  <line x1="410.0" y1="84.0" x2="525.0" y2="99.3" class="ln" stroke-width="1.1"/>
  <polygon points="530.0,100.0 523.5,102.5 524.4,95.8" class="ah"/>
  <rect x="590.0" y="100.0" width="100.0" height="44.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="640.0" y="122.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">decode instances ×D</text>
  <line x1="450.0" y1="84.0" x2="635.0" y2="99.6" class="ln" stroke-width="1.1"/>
  <polygon points="640.0,100.0 633.6,102.8 634.2,96.1" class="ah"/>
  <line x1="580.0" y1="122.0" x2="585.0" y2="122.0" class="ln" stroke-width="1.2"/>
  <polygon points="590.0,122.0 583.9,125.4 583.9,118.6" class="ah"/>
  <text x="535.0" y="160.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">KV goes from P to D over RDMA</text>
  <line x1="30.0" y1="180.0" x2="670.0" y2="180.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="350.0" y="200.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">how a request finds an instance: a Service only round-robins at L4, while inference picks by prefix cache and load, so it needs its own gateway in front</text>
  <text x="350.0" y="224.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the stateful parts: model weights (a PVC or object storage + a local cache), the local disk for KV offloading, routing tables; none should die with a Pod</text>
  <text x="350.0" y="248.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the unit of scaling is a whole instance (a group of Pods), not a single Pod; rolling releases go by group with probes, so half an instance never takes traffic</text>
</svg>
