<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="why the same row's result changes with the batch: kernels choose the split by the number of requests, the order of additions changes, and so does the floating-point result">
  <text x="170.0" y="22.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">small batch: split-K = 4, filling the SMs</text>
  <rect x="40.0" y="40.0" width="58.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="69.0" y="53.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">segment 1</text>
  <line x1="69.0" y1="66.0" x2="145.3" y2="94.3" class="ln" stroke-width="1"/>
  <polygon points="150.0,96.0 143.1,97.0 145.4,90.7" class="ah"/>
  <rect x="106.0" y="40.0" width="58.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="135.0" y="53.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">segment 2</text>
  <line x1="135.0" y1="66.0" x2="156.8" y2="92.2" class="ln" stroke-width="1"/>
  <polygon points="160.0,96.0 153.5,93.4 158.7,89.1" class="ah"/>
  <rect x="172.0" y="40.0" width="58.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="201.0" y="53.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">segment 3</text>
  <line x1="201.0" y1="66.0" x2="173.6" y2="92.5" class="ln" stroke-width="1"/>
  <polygon points="170.0,96.0 172.1,89.3 176.8,94.2" class="ah"/>
  <rect x="238.0" y="40.0" width="58.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="267.0" y="53.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">segment 4</text>
  <line x1="267.0" y1="66.0" x2="184.7" y2="94.4" class="ln" stroke-width="1"/>
  <polygon points="180.0,96.0 184.7,90.8 186.9,97.2" class="ah"/>
  <rect x="100.0" y="96.0" width="130.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="165.0" y="109.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">((s1 + s2) + s3) + s4</text>
  <text x="170.0" y="140.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">= 0.30000001</text>
  <text x="520.0" y="22.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">large batch: no split, accumulate in order</text>
  <rect x="400.0" y="40.0" width="240.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="520.0" y="53.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">accumulate the whole K at once</text>
  <line x1="520.0" y1="66.0" x2="520.0" y2="91.0" class="ln" stroke-width="1"/>
  <polygon points="520.0,96.0 516.6,89.9 523.4,89.9" class="ah"/>
  <rect x="455.0" y="96.0" width="130.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="520.0" y="109.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">accumulate along k from start to end</text>
  <text x="520.0" y="140.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">= 0.29999998</text>
  <line x1="350.0" y1="30.0" x2="350.0" y2="150.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="350.0" y="170.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">for the same request with the same input, who it batches with decides its result; this is one root of inference results not being bitwise identical</text>
  <text x="350.0" y="192.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">batch-invariant kernels: the split is fixed and doesn't change with load; the reduction order is fixed; attention's tiling is fixed too</text>
  <text x="350.0" y="214.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the cost is giving up the best configuration per shape, 10%–20% less throughput; RL needs it because training and inference probabilities must agree</text>
</svg>
