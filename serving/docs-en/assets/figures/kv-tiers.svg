<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="tiers of the KV Cache: the lower, the larger the capacity and the lower the bandwidth; block hashes are the key running through every tier">
  <rect x="180.0" y="30.0" width="340.0" height="50.0" rx="8" class="blue" stroke-width="1.4"/>
  <text x="350.0" y="46.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">L1  GPU memory</text>
  <text x="350.0" y="66.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">capacity 80 GB per GPU　bandwidth 3.35 TB/s</text>
  <text x="650.0" y="55.0" class="mu" font-size="9.5" text-anchor="end" dominant-baseline="middle">the KV in use + the hottest prefix cache</text>
  <line x1="300.0" y1="80.0" x2="300.0" y2="95.0" class="ln" stroke-width="1.3"/>
  <polygon points="300.0,100.0 296.6,93.9 303.4,93.9" class="ah"/>
  <text x="180.0" y="90.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">write down on eviction (write-back), or write once computed (write-through)</text>
  <line x1="400.0" y1="100.0" x2="400.0" y2="85.0" class="ln" stroke-width="1.3"/>
  <polygon points="400.0,80.0 403.4,86.1 396.6,86.1" class="ah"/>
  <text x="510.0" y="90.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">on a hit, prefetch and read layer by layer, computing as it arrives</text>
  <rect x="130.0" y="100.0" width="440.0" height="50.0" rx="8" class="green" stroke-width="1.4"/>
  <text x="350.0" y="116.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">L2  CPU memory</text>
  <text x="350.0" y="136.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">capacity hundreds of GB to 1 TB　bandwidth about 50 GB/s over PCIe</text>
  <text x="650.0" y="125.0" class="mu" font-size="9.5" text-anchor="end" dominant-baseline="middle">a prefix cache shared within the machine; pages must be pinned for DMA</text>
  <line x1="300.0" y1="150.0" x2="300.0" y2="165.0" class="ln" stroke-width="1.3"/>
  <polygon points="300.0,170.0 296.6,163.9 303.4,163.9" class="ah"/>
  <text x="180.0" y="160.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">write down on eviction (write-back), or write once computed (write-through)</text>
  <line x1="400.0" y1="170.0" x2="400.0" y2="155.0" class="ln" stroke-width="1.3"/>
  <polygon points="400.0,150.0 403.4,156.1 396.6,156.1" class="ah"/>
  <text x="510.0" y="160.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">on a hit, prefetch and read layer by layer, computing as it arrives</text>
  <rect x="80.0" y="170.0" width="540.0" height="50.0" rx="8" class="orange" stroke-width="1.4"/>
  <text x="350.0" y="186.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">L3  SSD / distributed storage</text>
  <text x="350.0" y="206.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">capacity TB to PB　bandwidth about 7 GB/s for local NVMe; 50 GB/s over the network</text>
  <text x="650.0" y="195.0" class="mu" font-size="9.5" text-anchor="end" dominant-baseline="middle">shared across machines and instances (Mooncake Store, 3FS, LMCache)</text>
  <text x="350.0" y="250.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">read back or recompute? reading = KV bytes / bandwidth, recomputing = tokens × prefill cost; short prefixes recompute faster, long ones read faster</text>
</svg>
