<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" role="img" aria-label="speculative decoding: the draft model guesses a few tokens and the target model verifies them at once">
  <text x="90.0" y="24.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle">the draft (a small model / an MTP head) generates 4 tokens one by one</text>
  <rect x="90.0" y="40.0" width="70.0" height="34.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="125.0" y="57.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">Beijing</text>
  <rect x="170.0" y="40.0" width="70.0" height="34.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="205.0" y="57.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">yes</text>
  <rect x="250.0" y="40.0" width="70.0" height="34.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="285.0" y="57.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">China</text>
  <rect x="330.0" y="40.0" width="70.0" height="34.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="365.0" y="57.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">'s</text>
  <line x1="245.0" y1="78.0" x2="245.0" y2="107.0" class="ln" stroke-width="1.4"/>
  <polygon points="245.0,112.0 241.6,105.9 248.4,105.9" class="ah"/>
  <text x="258.0" y="95.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">the target model: one forward pass covers these 4 positions (plus the next)</text>
  <rect x="90.0" y="116.0" width="70.0" height="34.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="125.0" y="133.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">✓ Beijing</text>
  <rect x="170.0" y="116.0" width="70.0" height="34.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="205.0" y="133.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">✓ is</text>
  <rect x="250.0" y="116.0" width="70.0" height="34.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="285.0" y="133.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">✓ China</text>
  <rect x="330.0" y="116.0" width="70.0" height="34.0" rx="7" class="red" stroke-width="1.3"/>
  <text x="365.0" y="133.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">✗ the</text>
  <line x1="365.0" y1="154.0" x2="365.0" y2="175.0" class="ln" stroke-width="1.4"/>
  <polygon points="365.0,180.0 361.6,173.9 368.4,173.9" class="ah"/>
  <rect x="330.0" y="184.0" width="70.0" height="34.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="365.0" y="201.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">capital</text>
  <text x="420.0" y="150.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle"><tspan x="420.0" dy="-14.3">the 4th is rejected: a token is resampled</tspan><tspan x="420.0" dy="14.3">from the corrected distribution to replace it,</tspan><tspan x="420.0" dy="14.3">and every later draft is discarded</tspan></text>
  <text x="350.0" y="244.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle">this step advanced 4 tokens (3 accepted + 1 corrected) with only 1 forward pass of the target model</text>
  <text x="350.0" y="270.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">rejection sampling keeps the output distribution identical to the target alone; gains depend on acceptance and verification cost</text>
</svg>
