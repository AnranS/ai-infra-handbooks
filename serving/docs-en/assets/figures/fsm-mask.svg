<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="grammar-constrained decoding: the automaton's current state determines the allowed token set, the mask is added to the logits before sampling, and the chosen token advances the state">
