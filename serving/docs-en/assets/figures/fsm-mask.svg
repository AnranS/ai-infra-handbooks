  <rect x="162.0" y="40.0" width="112.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="218.0" y="57.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">string</text>
