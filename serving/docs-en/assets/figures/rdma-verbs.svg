<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="RDMA's verbs model: register memory, build queue pairs; the sender posts a work request and the NIC DMAs straight into the peer's memory, with no CPU moving data">
  <text x="170.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">the sender (the prefill instance)</text>
  <rect x="40.0" y="40.0" width="120.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="100.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="100.0" dy="-5.9">GPU memory</tspan><tspan x="100.0" dy="11.8">KV blocks (a registered MR)</tspan></text>
  <rect x="180.0" y="40.0" width="120.0" height="60.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="240.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="240.0" dy="-5.9">CPU</tspan><tspan x="240.0" dy="11.8">only posts / reaps completions</tspan></text>
  <rect x="40.0" y="130.0" width="260.0" height="36.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="170.0" y="148.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">QP: send queue SQ + receive queue RQ　　CQ: completion queue</text>
  <rect x="100.0" y="190.0" width="140.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="170.0" y="210.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">NIC (RNIC)</text>
  <line x1="100.0" y1="100.0" x2="100.0" y2="130.0" class="ln" stroke-width="1.2"/>
  <line x1="170.0" y1="166.0" x2="170.0" y2="190.0" class="ln" stroke-width="1.2"/>
  <text x="530.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">the receiver (the decode instance)</text>
  <rect x="400.0" y="40.0" width="120.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="460.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="460.0" dy="-5.9">GPU memory</tspan><tspan x="460.0" dy="11.8">KV blocks (a registered MR)</tspan></text>
  <rect x="540.0" y="40.0" width="120.0" height="60.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="600.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-5.9">CPU</tspan><tspan x="600.0" dy="11.8">only posts / reaps completions</tspan></text>
  <rect x="400.0" y="130.0" width="260.0" height="36.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="530.0" y="148.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">QP: send queue SQ + receive queue RQ　　CQ: completion queue</text>
  <rect x="460.0" y="190.0" width="140.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="530.0" y="210.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">NIC (RNIC)</text>
  <line x1="460.0" y1="100.0" x2="460.0" y2="130.0" class="ln" stroke-width="1.2"/>
  <line x1="530.0" y1="166.0" x2="530.0" y2="190.0" class="ln" stroke-width="1.2"/>
  <line x1="200.0" y1="210.0" x2="455.0" y2="210.0" class="orange-l" stroke-width="2.2"/>
  <polygon points="460.0,210.0 453.9,213.4 453.9,206.6" class="orange-s"/>
  <text x="330.0" y="198.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">RDMA WRITE: NIC to NIC, written straight into the peer's registered memory</text>
  <text x="330.0" y="246.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">① register memory (pinned, lkey/rkey)　② build a QP, exchange addresses　③ post a WR　④ the peer's memory is written, a completion lands in CQ</text>
  <text x="330.0" y="270.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">GPUDirect RDMA: the NIC reads and writes GPU memory directly; registration is slow, so the KV pool is registered once and reused</text>
  <text x="330.0" y="292.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">many small messages hit the NIC's message rate limit: KV transfers must be batched into large chunks, or issued by the GPU itself (IBGDA)</text>
</svg>
