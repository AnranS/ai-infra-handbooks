<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="how a GPU reaches a container: the driver is on the node, the device plugin registers the GPU as a resource, the scheduler picks a node by requests, and the container runtime mounts the device files in">
  <rect x="20.0" y="50.0" width="120.0" height="70.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="85.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.9">node: the NVIDIA driver</tspan><tspan x="80.0" dy="11.8">/dev/nvidia0..7</tspan></text>
  <line x1="140.0" y1="85.0" x2="151.0" y2="85.0" class="ln" stroke-width="1.3"/>
  <polygon points="156.0,85.0 149.9,88.4 149.9,81.6" class="ah"/>
  <rect x="156.0" y="50.0" width="120.0" height="70.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="216.0" y="85.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="216.0" dy="-11.8">device plugin</tspan><tspan x="216.0" dy="11.8">registers with the kubelet</tspan><tspan x="216.0" dy="11.8">nvidia.com/gpu: 8</tspan></text>
  <line x1="276.0" y1="85.0" x2="287.0" y2="85.0" class="ln" stroke-width="1.3"/>
  <polygon points="292.0,85.0 285.9,88.4 285.9,81.6" class="ah"/>
  <rect x="292.0" y="50.0" width="120.0" height="70.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="352.0" y="85.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-11.8">scheduler</tspan><tspan x="352.0" dy="11.8">picks a node by requests</tspan><tspan x="352.0" dy="11.8">(topology, affinity, taints)</tspan></text>
  <line x1="412.0" y1="85.0" x2="423.0" y2="85.0" class="ln" stroke-width="1.3"/>
  <polygon points="428.0,85.0 421.9,88.4 421.9,81.6" class="ah"/>
  <rect x="428.0" y="50.0" width="120.0" height="70.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="488.0" y="85.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-11.8">kubelet + container runtime</tspan><tspan x="488.0" dy="11.8">mount the device files and</tspan><tspan x="488.0" dy="11.8">driver libraries into the container</tspan></text>
  <line x1="548.0" y1="85.0" x2="559.0" y2="85.0" class="ln" stroke-width="1.3"/>
  <polygon points="564.0,85.0 557.9,88.4 557.9,81.6" class="ah"/>
  <rect x="564.0" y="50.0" width="120.0" height="70.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="624.0" y="85.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" dy="-11.8">processes in the Pod</tspan><tspan x="624.0" dy="11.8">nvidia-smi shows</tspan><tspan x="624.0" dy="11.8">the GPUs it was given</tspan></text>
  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">GPUs are requested whole with no overcommit; which GPUs you get decides NVLink connectivity, so TP=4 needs 4 in one NVSwitch domain</text>
  <text x="350.0" y="174.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">splitting one GPU: MIG gives hardware-isolated instances (own SMs and memory), while time slicing shares it in turns with no memory isolation</text>
  <text x="350.0" y="198.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">keeping GPU nodes for what belongs there: taints + tolerations, node affinity; drain a node before upgrading its driver</text>
</svg>
