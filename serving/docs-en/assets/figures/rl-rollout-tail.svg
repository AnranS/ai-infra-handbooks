<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="one RL step: the inference pool generates a batch of answers → compute rewards → train → sync weights; the few longest answers in a batch set the whole step's time (the long tail)">
  <rect x="30.0" y="40.0" width="140.0" height="50.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="100.0" y="65.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="100.0" dy="-6.2">rollout</tspan><tspan x="100.0" dy="12.4">sampling by the inference engine</tspan></text>
  <line x1="170.0" y1="65.0" x2="190.0" y2="65.0" class="ln" stroke-width="1.3"/>
  <polygon points="195.0,65.0 188.9,68.4 188.9,61.6" class="ah"/>
  <rect x="195.0" y="40.0" width="140.0" height="50.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="265.0" y="65.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="265.0" dy="-6.2">reward</tspan><tspan x="265.0" dy="12.4">verifier / reward model</tspan></text>
  <line x1="335.0" y1="65.0" x2="355.0" y2="65.0" class="ln" stroke-width="1.3"/>
  <polygon points="360.0,65.0 353.9,68.4 353.9,61.6" class="ah"/>
  <rect x="360.0" y="40.0" width="140.0" height="50.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="430.0" y="65.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="430.0" dy="-6.2">training</tspan><tspan x="430.0" dy="12.4">one policy gradient step</tspan></text>
  <line x1="500.0" y1="65.0" x2="520.0" y2="65.0" class="ln" stroke-width="1.3"/>
  <polygon points="525.0,65.0 518.9,68.4 518.9,61.6" class="ah"/>
  <rect x="525.0" y="40.0" width="140.0" height="50.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="595.0" y="65.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="595.0" dy="-6.2">weight sync</tspan><tspan x="595.0" dy="12.4">trainer → inference pool</tspan></text>
  <path d="M 650 90 C 650 120 60 120 100 90" class="ln" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="100.0" y="130.0" class="tx" font-size="10" text-anchor="start" dominant-baseline="middle" font-weight="600">the lengths of a batch of 512 answers</text>
  <rect x="100.0" y="142.0" width="63.0" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="148.5" width="126.0" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="155.0" width="84.0" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="161.5" width="189.0" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="168.0" width="105.0" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="174.5" width="147.0" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="181.0" width="75.6" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="187.5" width="117.6" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="194.0" width="92.4" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="200.5" width="168.0" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="207.0" width="126.0" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="213.5" width="420.0" height="5.0" rx="1" class="red" stroke-width="0"/>
  <rect x="100.0" y="220.0" width="109.2" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <rect x="100.0" y="226.5" width="138.6" height="5.0" rx="1" class="blue" stroke-width="0"/>
  <text x="100.0" y="244.0" class="tx" font-size="10" text-anchor="start" dominant-baseline="middle">the red one is longest: other slots emptied long ago, yet the step waits for it, dropping utilization to 30%–40%</text>
  <text x="350.0" y="264.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">remedies: async pipelines, truncating long outputs, scheduling by length; inconsistent probabilities need importance correction or batch-invariant kernels</text>
</svg>
