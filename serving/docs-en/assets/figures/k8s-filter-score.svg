<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="kube-scheduler's two phases: take a Pod from the queue → filter feasible nodes → score them → pick the highest → bind">
  <rect x="30.0" y="70.0" width="90.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="75.0" y="90.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="75.0" dy="-5.9">a Pod to schedule</tspan><tspan x="75.0" dy="11.8">needing 4 GPUs</tspan></text>
  <line x1="120.0" y1="90.0" x2="155.0" y2="90.0" class="ln" stroke-width="1.3"/>
  <polygon points="160.0,90.0 153.9,93.4 153.9,86.6" class="ah"/>
  <rect x="160.0" y="36.0" width="130.0" height="28.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="225.0" y="50.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">node A: 8 GPUs free</text>
  <line x1="290.0" y1="50.0" x2="335.0" y2="50.0" class="ln" stroke-width="1.1"/>
  <polygon points="340.0,50.0 333.9,53.4 333.9,46.6" class="ah"/>
  <rect x="340.0" y="36.0" width="90.0" height="28.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="385.0" y="50.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">score 92</text>
  <rect x="160.0" y="72.0" width="130.0" height="28.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="225.0" y="86.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">node B: 2 GPUs free</text>
  <text x="312.0" y="86.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">✗</text>
  <rect x="160.0" y="108.0" width="130.0" height="28.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="225.0" y="122.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">node C: 4 GPUs free</text>
  <line x1="290.0" y1="122.0" x2="335.0" y2="122.0" class="ln" stroke-width="1.1"/>
  <polygon points="340.0,122.0 333.9,125.4 333.9,118.6" class="ah"/>
  <rect x="340.0" y="108.0" width="90.0" height="28.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="385.0" y="122.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">score 70</text>
  <rect x="160.0" y="144.0" width="130.0" height="28.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="225.0" y="158.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">node D: tainted</text>
  <text x="312.0" y="158.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">✗</text>
  <text x="160.0" y="190.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">filter (predicate): enough resources, affinity, taints / tolerations</text>
  <text x="160.0" y="206.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">score: least / most allocated, image locality, topology spreading</text>
  <line x1="430.0" y1="50.0" x2="485.8" y2="87.2" class="ln" stroke-width="1.3"/>
  <polygon points="490.0,90.0 483.0,89.4 486.8,83.8" class="ah"/>
  <rect x="490.0" y="70.0" width="90.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="535.0" y="90.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="535.0" dy="-5.9">bind to A</tspan><tspan x="535.0" dy="11.8">write nodeName</tspan></text>
  <text x="590.0" y="150.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle"><tspan x="590.0" dy="-16.7">GPUs: whole cards only,</tspan><tspan x="590.0" dy="11.2">one NVSwitch domain,</tspan><tspan x="590.0" dy="11.2">gang scheduling for</tspan><tspan x="590.0" dy="11.2">multi-Pod instances</tspan></text>
  <text x="350.0" y="236.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">preemption: evict lower-priority Pods when a high-priority one doesn't fit; queues: training jobs wait for a whole group instead of competing with online</text>
</svg>
