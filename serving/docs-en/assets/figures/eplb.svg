  <text x="39.0" y="122.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E0</text>
  <rect x="54.0" y="56.0" width="18.0" height="54.0" rx="2" class="orange" stroke-width="0.8"/>
  <text x="63.0" y="122.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E1</text>
  <rect x="78.0" y="98.0" width="18.0" height="12.0" rx="2" class="blue" stroke-width="0.8"/>
  <text x="87.0" y="122.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E2</text>
  <rect x="102.0" y="86.0" width="18.0" height="24.0" rx="2" class="blue" stroke-width="0.8"/>
  <text x="111.0" y="122.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E3</text>
  <rect x="126.0" y="68.0" width="18.0" height="42.0" rx="2" class="orange" stroke-width="0.8"/>
  <text x="135.0" y="122.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E4</text>
  <rect x="150.0" y="98.0" width="18.0" height="12.0" rx="2" class="blue" stroke-width="0.8"/>
  <text x="159.0" y="122.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E5</text>
  <rect x="174.0" y="38.0" width="18.0" height="72.0" rx="2" class="orange" stroke-width="0.8"/>
  <text x="183.0" y="122.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E6</text>
  <rect x="198.0" y="92.0" width="18.0" height="18.0" rx="2" class="blue" stroke-width="0.8"/>
  <text x="207.0" y="122.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E7</text>
  <text x="120.0" y="140.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">orange: hot experts</text>
  <line x1="230.0" y1="80.0" x2="265.0" y2="80.0" class="ln" stroke-width="1.3"/>
  <polygon points="270.0,80.0 263.9,83.4 263.9,76.6" class="ah"/>
  <text x="390.0" y="22.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">② pack groups onto nodes (the hierarchical policy)</text>
  <rect x="280.0" y="44.0" width="220.0" height="40.0" rx="6" class="gray" stroke-width="1"/>
  <text x="300.0" y="64.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">node 0</text>
  <rect x="340.0" y="52.0" width="34.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="357.0" y="64.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">group 1</text>
  <rect x="380.0" y="52.0" width="34.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="397.0" y="64.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">group 6</text>
  <rect x="420.0" y="52.0" width="34.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="437.0" y="64.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">group 3</text>
  <rect x="460.0" y="52.0" width="34.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="477.0" y="64.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">group 4</text>
  <rect x="280.0" y="94.0" width="220.0" height="40.0" rx="6" class="gray" stroke-width="1"/>
  <text x="300.0" y="114.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">node 1</text>
  <rect x="340.0" y="102.0" width="34.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="357.0" y="114.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">group 0</text>
  <rect x="380.0" y="102.0" width="34.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="397.0" y="114.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">group 7</text>
  <rect x="420.0" y="102.0" width="34.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="437.0" y="114.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">group 2</text>
  <rect x="460.0" y="102.0" width="34.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="477.0" y="114.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">group 5</text>
  <text x="390.0" y="150.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">each node gets the same number of groups, with the groups' total loads as close as possible</text>
  <line x1="500.0" y1="80.0" x2="535.0" y2="80.0" class="ln" stroke-width="1.3"/>
  <polygon points="540.0,80.0 533.9,83.4 533.9,76.6" class="ah"/>
  <text x="620.0" y="22.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">③ replicate hot experts</text>
  <rect x="545.0" y="44.0" width="32.0" height="24.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="561.0" y="56.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E6</text>
  <rect x="581.0" y="44.0" width="32.0" height="24.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="597.0" y="56.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E6′</text>
  <rect x="617.0" y="44.0" width="32.0" height="24.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="633.0" y="56.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E1</text>
  <rect x="653.0" y="44.0" width="32.0" height="24.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="669.0" y="56.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E1′</text>
  <rect x="545.0" y="76.0" width="32.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="561.0" y="88.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E4</text>
  <rect x="581.0" y="76.0" width="32.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="597.0" y="88.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E0</text>
  <rect x="617.0" y="76.0" width="32.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="633.0" y="88.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E3</text>
  <rect x="653.0" y="76.0" width="32.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="669.0" y="88.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">E2</text>
  <text x="620.0" y="125.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">with replicas, loads are close</text>
  <line x1="30.0" y1="170.0" x2="670.0" y2="170.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="350.0" y="190.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="350.0" dy="-6.2">group-limited routing: 256 experts in 8 groups, first picking 4 groups by group score, then 8 experts within them</tspan><tspan x="350.0" dy="12.4">a token crosses at most 4 nodes, capping the inter-machine all-to-all traffic</tspan></text>
  <text x="350.0" y="228.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="350.0" dy="-5.9">hierarchical keeps "a group on one node", saving inter-machine bandwidth; global ignores nodes, balancing better with more cross-machine traffic</tspan><tspan x="350.0" dy="11.8">prefill (large batches, bandwidth-sensitive) and decode (latency-sensitive) pick different policies</tspan></text>
  <text x="350.0" y="262.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">load statistics roll forward and experts are rearranged every few minutes with weights moved live; DP attention still has unequal KV per rank (next section)</text>
</svg>
