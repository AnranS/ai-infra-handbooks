<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="EPLB: pack expert groups onto nodes by load, replicate the hottest experts within each node, then spread the experts over the GPUs; redundant replicas even out the hot/cold difference">
