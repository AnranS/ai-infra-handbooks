  <text x="602.0" y="36.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">t4</text>
  <rect x="606.0" y="48.0" width="46.0" height="22.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="629.0" y="59.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">new</text>
  <rect x="606.0" y="74.0" width="46.0" height="22.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="629.0" y="85.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">new</text>
  <rect x="606.0" y="100.0" width="46.0" height="22.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="629.0" y="111.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">new</text>
  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">maxSurge: how many above the desired count (new before old, extra memory); maxUnavailable: how many below (old before new, less capacity)</text>
  <text x="350.0" y="174.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">three probes: startup leaves time for loading weights (or liveness restarts it forever); readiness decides traffic; liveness decides restarts</text>
  <text x="350.0" y="198.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">graceful shutdown: on SIGTERM leave the Service, finish in-flight requests, then exit; the grace period must exceed the longest answer</text>
  <text x="350.0" y="222.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">scale on queued requests / KV usage, not CPU; a PodDisruptionBudget keeps operations from taking too many replicas at once</text>
</svg>
