  <polygon points="296.0,80.0 289.9,83.4 289.9,76.6" class="ah"/>
  <text x="346.0" y="36.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">t2</text>
  <rect x="296.0" y="48.0" width="46.0" height="22.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="319.0" y="59.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">old</text>
