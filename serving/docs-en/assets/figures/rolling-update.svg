  <line x1="400.0" y1="80.0" x2="419.0" y2="80.0" class="ln" stroke-width="1.1"/>
  <polygon points="424.0,80.0 417.9,83.4 417.9,76.6" class="ah"/>
  <text x="474.0" y="36.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">t3</text>
  <rect x="424.0" y="48.0" width="46.0" height="22.0" rx="3" class="gray" stroke-width="1.3"/>
