<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="changing weights without restarting: pause scheduling between two steps, convert the checkpoint into the kernel format and write it in place into the same memory, so the addresses CUDA Graphs remember stay valid">
  <rect x="20.0" y="40.0" width="120.0" height="60.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.9">the scheduler pauses</tspan><tspan x="80.0" dy="11.8">between two steps</tspan></text>
  <line x1="140.0" y1="70.0" x2="151.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="156.0,70.0 149.9,73.4 149.9,66.6" class="ah"/>
  <rect x="156.0" y="40.0" width="120.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="216.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="216.0" dy="-5.9">new weights arrive</tspan><tspan x="216.0" dy="11.8">(broadcast by the trainer / from object storage)</tspan></text>
  <line x1="276.0" y1="70.0" x2="287.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="292.0,70.0 285.9,73.4 285.9,66.6" class="ah"/>
  <rect x="292.0" y="40.0" width="120.0" height="60.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="352.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-11.8">convert the format</tspan><tspan x="352.0" dy="11.8">merge QKV, reorder GQA,</tspan><tspan x="352.0" dy="11.8">quantize, split by TP</tspan></text>
  <line x1="412.0" y1="70.0" x2="423.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="428.0,70.0 421.9,73.4 421.9,66.6" class="ah"/>
  <rect x="428.0" y="40.0" width="120.0" height="60.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="488.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-5.9">copy in place into</tspan><tspan x="488.0" dy="11.8">the same memory</tspan></text>
  <line x1="548.0" y1="70.0" x2="559.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="564.0,70.0 557.9,73.4 557.9,66.6" class="ah"/>
  <rect x="564.0" y="40.0" width="120.0" height="60.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="624.0" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" dy="-5.9">resume scheduling</tspan><tspan x="624.0" dy="11.8">in-flight requests continue</tspan></text>
  <text x="350.0" y="124.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">in-flight requests' KV came from the old weights: let short ones finish, and either accept slight inconsistency for long ones or recompute them</text>
  <line x1="30.0" y1="146.0" x2="670.0" y2="146.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="120.0" y="170.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">why you can't allocate new memory</text>
  <rect x="40.0" y="186.0" width="160.0" height="60.0" rx="7" class="red" stroke-width="1.3"/>
  <text x="120.0" y="216.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="120.0" dy="-11.8">on CUDA Graph replay</tspan><tspan x="120.0" dy="11.8">only the captured pointers count</tspan><tspan x="120.0" dy="11.8">a new address = the old weights</tspan></text>
  <text x="430.0" y="170.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">the loop of RL training</text>
  <rect x="270.0" y="186.0" width="110.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="325.0" y="216.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="325.0" dy="-5.9">trainer</tspan><tspan x="325.0" dy="11.8">(FSDP / Megatron)</tspan></text>
  <line x1="380.0" y1="206.0" x2="445.0" y2="206.0" class="ln" stroke-width="1.3"/>
  <polygon points="450.0,206.0 443.9,209.4 443.9,202.6" class="ah"/>
  <text x="415.0" y="196.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">broadcasting the parameters (NCCL / RDMA)</text>
  <rect x="450.0" y="186.0" width="110.0" height="60.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="505.0" y="216.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="505.0" dy="-5.9">inference engine</tspan><tspan x="505.0" dy="11.8">(rollout)</tspan></text>
  <line x1="450.0" y1="236.0" x2="385.0" y2="236.0" class="ln" stroke-width="1.3"/>
  <polygon points="380.0,236.0 386.1,232.6 386.1,239.4" class="ah"/>
  <text x="415.0" y="248.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">the sampled result</text>
  <text x="620.0" y="216.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="620.0" dy="-5.9">one round every few minutes,</tspan><tspan x="620.0" dy="11.8">with the update finishing in seconds</tspan></text>
</svg>
