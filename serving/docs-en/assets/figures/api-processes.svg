<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="an OpenAI-compatible streaming service: the HTTP process receives requests, tokenizes and streams; the engine process emits a batch of tokens per step; incremental detokenization turns tokens into text fragments that never retract">
  <rect x="30.0" y="50.0" width="150.0" height="90.0" rx="8" class="green" stroke-width="1.3"/>
  <text x="105.0" y="95.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-11.8">HTTP process</tspan><tspan x="105.0" dy="11.8">FastAPI + asyncio</tspan><tspan x="105.0" dy="11.8">tokenization, SSE streaming</tspan></text>
  <rect x="275.0" y="50.0" width="150.0" height="90.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="350.0" y="95.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="350.0" dy="-11.8">engine process</tspan><tspan x="350.0" dy="11.8">scheduling + forward pass + sampling</tspan><tspan x="350.0" dy="11.8">1 token per request per step</tspan></text>
  <rect x="520.0" y="50.0" width="150.0" height="90.0" rx="8" class="orange" stroke-width="1.3"/>
  <text x="595.0" y="95.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="595.0" dy="-11.8">incremental detokenization</tspan><tspan x="595.0" dy="11.8">wait for a definite UTF-8 boundary</tspan><tspan x="595.0" dy="11.8">before emitting a text fragment</tspan></text>
  <line x1="180.0" y1="80.0" x2="270.0" y2="80.0" class="ln" stroke-width="1.3"/>
  <polygon points="275.0,80.0 268.9,83.4 268.9,76.6" class="ah"/>
  <text x="227.5" y="70.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">request (token ids)</text>
  <line x1="425.0" y1="95.0" x2="515.0" y2="95.0" class="ln" stroke-width="1.3"/>
  <polygon points="520.0,95.0 513.9,98.4 513.9,91.6" class="ah"/>
  <text x="472.5" y="85.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">a stream of token ids</text>
  <line x1="520.0" y1="120.0" x2="185.0" y2="120.0" class="ln" stroke-width="1.3"/>
  <polygon points="180.0,120.0 186.1,116.6 186.1,123.4" class="ah"/>
  <text x="350.0" y="132.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">text fragment → data: {...}</text>
  <text x="350.0" y="172.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">why multiple processes: HTTP, JSON and tokenization run under the GIL and slow every engine step; split apart, tokens travel over ZMQ / shared memory</text>
  <text x="350.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">stop conditions: EOS, max_tokens, stop strings (matched after detokenization, possibly spanning tokens); cancellation frees the KV in the engine</text>
  <text x="350.0" y="218.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">batched sampling: temperature, top-k, top-p and penalties differ per request and must be vectorized into one kernel; logprobs come before sampling</text>
</svg>
