<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" width="660" role="img" aria-label="a radix tree: requests sharing a prefix reuse the same KV">
  <rect x="260.0" y="16.0" width="140.0" height="36.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="330.0" y="34.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">root</text>
  <rect x="230.0" y="80.0" width="200.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="330.0" y="100.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">the system prompt (shared by every request)</text>
  <rect x="30.0" y="156.0" width="170.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="115.0" y="176.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">user A: the first turn's question</text>
  <rect x="250.0" y="156.0" width="160.0" height="40.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="330.0" y="176.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">user B: a question</text>
  <rect x="460.0" y="156.0" width="180.0" height="40.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="550.0" y="176.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">few-shot examples + the question</text>
  <rect x="30.0" y="228.0" width="170.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="115.0" y="248.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">A's answer + turn two</text>
  <rect x="236.0" y="228.0" width="90.0" height="40.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="281.0" y="248.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">answer (sample 1)</text>
  <rect x="334.0" y="228.0" width="90.0" height="40.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="379.0" y="248.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">answer (sample 2)</text>
  <line x1="330.0" y1="52.0" x2="330.0" y2="75.0" class="ln" stroke-width="1.4"/>
  <polygon points="330.0,80.0 326.6,73.9 333.4,73.9" class="ah"/>
  <line x1="305.0" y1="120.0" x2="119.9" y2="155.1" class="ln" stroke-width="1.4"/>
  <polygon points="115.0,156.0 120.4,151.5 121.7,158.2" class="ah"/>
  <line x1="330.0" y1="120.0" x2="330.0" y2="151.0" class="ln" stroke-width="1.4"/>
  <polygon points="330.0,156.0 326.6,149.9 333.4,149.9" class="ah"/>
  <line x1="355.0" y1="120.0" x2="545.1" y2="155.1" class="ln" stroke-width="1.4"/>
  <polygon points="550.0,156.0 543.4,158.2 544.6,151.6" class="ah"/>
  <line x1="115.0" y1="196.0" x2="115.0" y2="223.0" class="ln" stroke-width="1.4"/>
  <polygon points="115.0,228.0 111.6,221.9 118.4,221.9" class="ah"/>
  <line x1="315.0" y1="196.0" x2="284.6" y2="224.6" class="ln" stroke-width="1.4"/>
  <polygon points="281.0,228.0 283.2,221.3 287.8,226.3" class="ah"/>
  <line x1="345.0" y1="196.0" x2="375.4" y2="224.6" class="ln" stroke-width="1.4"/>
  <polygon points="379.0,228.0 372.2,226.3 376.8,221.3" class="ah"/>
  <text x="118.0" y="284.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">a conversation grows along one path</text>
  <text x="330.0" y="284.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">parallel sampling forks here</text>
  <text x="550.0" y="236.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="550.0" dy="-14.3">the hit part of the prefix needs no prefill;</tspan><tspan x="550.0" dy="14.3">when space runs short, evict leaves</tspan><tspan x="550.0" dy="14.3">by LRU</tspan></text>
</svg>
