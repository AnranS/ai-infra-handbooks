  <text x="350.0" y="258.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">each token activates only its top-k experts; traffic ∝ tokens × k × hidden, and libraries like DeepEP optimize these two all-to-alls</text>
