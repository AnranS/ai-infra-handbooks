<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" role="img" aria-label="five steps to onboard a new model: find the differences → write it from the reference → align layer by layer → end-to-end metrics → accuracy evaluation; each step has a quantifiable pass criterion">
  <rect x="20.0" y="40.0" width="120.0" height="36.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="80.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">① find the differences</text>
  <text x="80.0" y="110.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-10.5">compare config, weight names,</tspan><tspan x="80.0" dy="10.5">attention / MoE variants with</tspan><tspan x="80.0" dy="10.5">the closest supported model</tspan></text>
  <rect x="156.0" y="40.0" width="120.0" height="36.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="216.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">② write it following the reference</text>
  <text x="216.0" y="110.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="216.0" dy="-5.3">transformers' implementation is the truth;</tspan><tspan x="216.0" dy="10.5">adapt it to the engine's Linear / Attention abstractions</tspan></text>
  <rect x="292.0" y="40.0" width="120.0" height="36.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="352.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">③ align layer by layer</text>
  <text x="352.0" y="110.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-5.3">for the same input, each layer's output</tspan><tspan x="352.0" dy="10.5">is within the threshold of the reference</tspan></text>
  <rect x="428.0" y="40.0" width="120.0" height="36.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="488.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">④ end to end</text>
  <text x="488.0" y="110.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-5.3">greedy outputs match;</tspan><tspan x="488.0" dy="10.5">TTFT / TPOT match the estimates</tspan></text>
  <rect x="564.0" y="40.0" width="120.0" height="36.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="624.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">⑤ accuracy evaluation</text>
  <text x="624.0" y="110.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" dy="-5.3">scores on a few benchmarks</tspan><tspan x="624.0" dy="10.5">match the official ones</tspan></text>
  <line x1="140.0" y1="58.0" x2="151.0" y2="58.0" class="ln" stroke-width="1.2"/>
  <polygon points="156.0,58.0 149.9,61.4 149.9,54.6" class="ah"/>
  <line x1="276.0" y1="58.0" x2="287.0" y2="58.0" class="ln" stroke-width="1.2"/>
  <polygon points="292.0,58.0 285.9,61.4 285.9,54.6" class="ah"/>
  <line x1="412.0" y1="58.0" x2="423.0" y2="58.0" class="ln" stroke-width="1.2"/>
  <polygon points="428.0,58.0 421.9,61.4 421.9,54.6" class="ah"/>
  <line x1="548.0" y1="58.0" x2="559.0" y2="58.0" class="ln" stroke-width="1.2"/>
  <polygon points="564.0,58.0 557.9,61.4 557.9,54.6" class="ah"/>
  <text x="350.0" y="160.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">weight name mapping and QKV merging are where mistakes happen most; align layer by layer in fp32, since bf16's error hides the real bugs</text>
  <text x="350.0" y="184.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">landing it in the framework: register the model class, write the weight loader, pick an attention backend, add CUDA Graph shapes and a CI accuracy test</text>
</svg>
