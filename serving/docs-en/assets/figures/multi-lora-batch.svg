<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="multi-LoRA serving: the base matrix multiply runs for all tokens together, while LoRA's small matrices are computed in groups by adapter and added back">
  <rect x="30.0" y="50.0" width="110.0" height="150.0" rx="7" class="gray" stroke-width="1.2"/>
  <text x="85.0" y="40.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">one mixed batch</text>
  <rect x="40.0" y="58.0" width="90.0" height="18.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="85.0" y="67.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">request 1, adapter 3</text>
  <rect x="40.0" y="81.0" width="90.0" height="18.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="85.0" y="90.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">request 2, adapter 5</text>
  <rect x="40.0" y="104.0" width="90.0" height="18.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="85.0" y="113.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">request 3, adapter 3</text>
  <rect x="40.0" y="127.0" width="90.0" height="18.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="85.0" y="136.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">request 4, adapter 0</text>
  <rect x="40.0" y="150.0" width="90.0" height="18.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="85.0" y="159.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">request 5, adapter 7</text>
  <rect x="40.0" y="173.0" width="90.0" height="18.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="85.0" y="182.0" class="tx" font-size="7.5" text-anchor="middle" dominant-baseline="middle">request 6, adapter 5</text>
  <line x1="140.0" y1="125.0" x2="175.0" y2="125.0" class="ln" stroke-width="1.3"/>
  <polygon points="180.0,125.0 173.9,128.4 173.9,121.6" class="ah"/>
  <rect x="180.0" y="60.0" width="150.0" height="50.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="255.0" y="85.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="255.0" dy="-6.2">base GEMM</tspan><tspan x="255.0" dy="12.4">x · W (all tokens at once)</tspan></text>
  <rect x="180.0" y="140.0" width="150.0" height="50.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="255.0" y="165.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="255.0" dy="-6.2">LoRA branch</tspan><tspan x="255.0" dy="12.4">x · A_i · B_i (per adapter)</tspan></text>
  <line x1="330.0" y1="85.0" x2="375.8" y2="115.2" class="ln" stroke-width="1.2"/>
  <polygon points="380.0,118.0 373.0,117.4 376.7,111.8" class="ah"/>
  <line x1="330.0" y1="165.0" x2="375.8" y2="134.8" class="ln" stroke-width="1.2"/>
  <polygon points="380.0,132.0 376.7,138.2 373.0,132.6" class="ah"/>
  <circle cx="392.0" cy="125.0" r="12.0" class="green" stroke-width="1.3"/>
  <text x="392.0" y="125.0" class="tx" font-size="14" text-anchor="middle" dominant-baseline="middle">+</text>
  <line x1="404.0" y1="125.0" x2="435.0" y2="125.0" class="ln" stroke-width="1.3"/>
  <polygon points="440.0,125.0 433.9,128.4 433.9,121.6" class="ah"/>
  <rect x="440.0" y="100.0" width="80.0" height="50.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="480.0" y="125.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">y</text>
  <text x="600.0" y="70.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-11.8">SGMV: same-adapter tokens together,</tspan><tspan x="600.0" dy="11.8">one small matmul per segment</tspan><tspan x="600.0" dy="11.8">(prefill-friendly)</tspan></text>
  <text x="600.0" y="125.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-5.9">BGMV: each token gathers its own A, B,</tspan><tspan x="600.0" dy="11.8">matrix × vector per token (decode)</tspan></text>
  <text x="600.0" y="180.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-17.7">rank r is only 8–64: the LoRA</tspan><tspan x="600.0" dy="11.8">branch is 1%–2% of the base's</tspan><tspan x="600.0" dy="11.8">FLOPs; memory grows with the</tspan><tspan x="600.0" dy="11.8">number of adapters</tspan></text>
  <text x="350.0" y="230.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">adapters are scheduled like KV: common ones stay in GPU memory, cold ones come from the CPU; too many kinds per step fragments SGMV's segments</text>
</svg>
