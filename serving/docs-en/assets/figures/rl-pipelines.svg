<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="three RL pipelines: synchronous waits for the whole batch; one-step asynchronous generates the next batch with the previous weights; fully asynchronous starts a new sample as soon as a slot frees, and the training side updates once it has a batch">
  <text x="80.0" y="54.0" class="tx" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="600">synchronous</text>
  <rect x="100.0" y="40.0" width="178.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="189.0" y="53.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">generate</text>
  <rect x="280.0" y="40.0" width="48.0" height="26.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="304.0" y="53.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">training</text>
  <rect x="330.0" y="40.0" width="178.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="419.0" y="53.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">generate</text>
  <rect x="510.0" y="40.0" width="48.0" height="26.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="534.0" y="53.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">training</text>
  <text x="575.0" y="54.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle">mostly waiting on the tail</text>
  <text x="80.0" y="116.0" class="tx" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="600">1-step async</text>
  <rect x="100.0" y="102.0" width="178.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="189.0" y="115.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">generate i+1</text>
  <rect x="280.0" y="102.0" width="178.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="369.0" y="115.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">generate i+2</text>
  <rect x="460.0" y="102.0" width="98.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="509.0" y="115.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">generate i+3</text>
  <rect x="220.0" y="132.0" width="50.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="245.0" y="139.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">train 1</text>
  <rect x="400.0" y="132.0" width="50.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="425.0" y="139.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">train 2</text>
  <text x="575.0" y="116.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle">samples lag one version</text>
  <text x="80.0" y="178.0" class="tx" font-size="11" text-anchor="end" dominant-baseline="middle" font-weight="600">full async</text>
  <rect x="100.0" y="164.0" width="458.0" height="26.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="329.0" y="177.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">slots keep starting new samples...</text>
  <rect x="190.0" y="194.0" width="45.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="212.5" y="201.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">train</text>
  <rect x="300.0" y="194.0" width="45.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="322.5" y="201.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">train</text>
  <rect x="400.0" y="194.0" width="45.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="422.5" y="201.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">train</text>
  <rect x="500.0" y="194.0" width="45.0" height="14.0" rx="2" class="green" stroke-width="0.6"/>
  <text x="522.5" y="201.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">train</text>
  <text x="575.0" y="178.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle">train once a batch is ready</text>
  <text x="350.0" y="228.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">asynchrony costs stale samples: fix with importance sampling or a staleness cap; weight sync in seconds (NCCL) or minutes (storage) sets the limit</text>
</svg>
