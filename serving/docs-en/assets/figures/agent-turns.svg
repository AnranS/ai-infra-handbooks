<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" width="1000" role="img" aria-label="Prefill and decode in an agent session">
  <text x="500.0" y="26.0" class="tx" font-size="19" text-anchor="middle" dominant-baseline="middle" font-weight="700">How prefill and decode alternate in an agent session</text>
  <text x="500.0" y="50.0" class="mu" font-size="12.5" text-anchor="middle" dominant-baseline="middle">Token counts from Qwen3.5's real chat template: 3 tool definitions, 2 tool calls before the answer, then one follow-up</text>
  <text x="20.0" y="86.0" class="tx" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="700">① One session's timeline: every model call is a new request: prefill, then decode, stop at the tool call</text>
  <text x="20.0" y="118.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="600">Framework</text>
  <text x="20.0" y="170.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="600">Engine</text>
  <text x="20.0" y="188.0" class="mu" font-size="11" text-anchor="start" dominant-baseline="middle">(this session)</text>
  <rect x="110.0" y="152.0" width="212.5" height="34.0" rx="3" class="orange" stroke-width="0.8"/>
  <rect x="322.5" y="152.0" width="31.1" height="34.0" rx="3" class="blue" stroke-width="0.8"/>
  <text x="216.3" y="210.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">prefill 506</text>
  <text x="216.3" y="228.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">cold start</text>
  <text x="338.1" y="140.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">decode 74</text>
  <rect x="110.0" y="100.0" width="243.6" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="231.8" y="115.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">call</text>
  <rect x="359.6" y="100.0" width="74.0" height="30.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="396.6" y="115.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">search</text>
  <text x="396.6" y="170.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">the GPU serves</text>
  <text x="396.6" y="186.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">other requests</text>
  <rect x="439.6" y="152.0" width="81.1" height="34.0" rx="3" class="orange" stroke-width="0.8"/>
  <rect x="520.7" y="152.0" width="44.9" height="34.0" rx="3" class="blue" stroke-width="0.8"/>
  <text x="480.1" y="210.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">prefill 193</text>
  <text x="480.1" y="228.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">cache hit 580</text>
  <text x="543.1" y="140.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">decode 107</text>
  <rect x="439.6" y="100.0" width="126.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="502.6" y="115.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">call</text>
  <rect x="571.6" y="100.0" width="74.0" height="30.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="608.6" y="115.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">run code</text>
  <text x="608.6" y="170.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">the GPU serves</text>
  <text x="608.6" y="186.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">other requests</text>
  <rect x="651.6" y="152.0" width="7.6" height="34.0" rx="3" class="orange" stroke-width="0.8"/>
  <rect x="659.2" y="152.0" width="19.7" height="34.0" rx="3" class="blue" stroke-width="0.8"/>
  <text x="655.4" y="210.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">prefill 18</text>
  <text x="655.4" y="228.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">cache hit 880</text>
  <text x="669.0" y="140.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">decode 47</text>
  <rect x="651.6" y="100.0" width="46.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="674.6" y="115.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">call</text>
  <rect x="703.6" y="100.0" width="74.0" height="30.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="740.6" y="115.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">follow-up</text>
  <text x="740.6" y="170.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">the GPU serves</text>
  <text x="740.6" y="186.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">other requests</text>
  <rect x="783.6" y="152.0" width="134.4" height="34.0" rx="3" class="orange" stroke-width="0.8"/>
  <rect x="918.0" y="152.0" width="16.8" height="34.0" rx="3" class="blue" stroke-width="0.8"/>
  <text x="850.8" y="210.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">prefill 320</text>
  <text x="850.8" y="228.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">cache hit 504</text>
  <text x="926.4" y="140.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">decode …</text>
  <rect x="783.6" y="100.0" width="151.2" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="859.2" y="115.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">call</text>
  <text x="110.0" y="254.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">Orange = prefill (a stretch at once), blue = decode (one token per step). Decode stops at the model's &lt;/tool_call&gt; or &lt;|im_end|&gt;, ending the request.</text>
  <text x="110.0" y="276.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">Request 4 hits only 504: the template deletes the last round's &lt;think&gt;, so the prefix breaks at the first assistant turn.</text>
  <line x1="20.0" y1="296.0" x2="980.0" y2="296.0" class="ln" stroke-width="0.6" stroke-opacity="0.3"/>
  <text x="20.0" y="320.0" class="tx" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="700">② How much each request prefills: the prefix cache saves most of it</text>
  <text x="150.0" y="352.0" class="tx" font-size="12" text-anchor="end" dominant-baseline="middle">user asks</text>
  <rect x="160.0" y="338.0" width="227.7" height="13.0" rx="2" class="gray" stroke-width="0.6"/>
  <text x="393.7" y="345.0" class="mu" font-size="11" text-anchor="start" dominant-baseline="middle">full prompt 506</text>
  <rect x="160.0" y="353.0" width="227.7" height="13.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="393.7" y="360.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle">actually prefilled 506</text>
  <text x="150.0" y="390.0" class="tx" font-size="12" text-anchor="end" dominant-baseline="middle">tool result 1 back</text>
  <rect x="160.0" y="376.0" width="347.9" height="13.0" rx="2" class="gray" stroke-width="0.6"/>
  <text x="513.9" y="383.0" class="mu" font-size="11" text-anchor="start" dominant-baseline="middle">full prompt 773</text>
  <rect x="160.0" y="391.0" width="86.9" height="13.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="252.9" y="398.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle">actually prefilled 193</text>
  <text x="150.0" y="428.0" class="tx" font-size="12" text-anchor="end" dominant-baseline="middle">tool result 2 back</text>
  <rect x="160.0" y="414.0" width="404.1" height="13.0" rx="2" class="gray" stroke-width="0.6"/>
  <text x="570.1" y="421.0" class="mu" font-size="11" text-anchor="start" dominant-baseline="middle">full prompt 898</text>
  <rect x="160.0" y="429.0" width="8.1" height="13.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="174.1" y="436.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle">actually prefilled 18</text>
  <text x="150.0" y="466.0" class="tx" font-size="12" text-anchor="end" dominant-baseline="middle">follow-up</text>
  <rect x="160.0" y="452.0" width="370.8" height="13.0" rx="2" class="gray" stroke-width="0.6"/>
  <text x="536.8" y="459.0" class="mu" font-size="11" text-anchor="start" dominant-baseline="middle">full prompt 824</text>
  <rect x="160.0" y="467.0" width="144.0" height="13.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="310.0" y="474.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle">actually prefilled 320</text>
  <text x="750.0" y="352.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle">All four together:</text>
  <text x="750.0" y="376.0" class="mu" font-size="12.5" text-anchor="start" dominant-baseline="middle">full prompts 3001 tokens</text>
  <text x="750.0" y="400.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="700">actually prefilled 1037 tokens</text>
  <text x="750.0" y="432.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">System prompt + tools: 486 tokens</text>
  <text x="750.0" y="452.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">are shared by all sessions; in a real</text>
  <text x="750.0" y="472.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">service the first request usually hits too</text>
  <line x1="20.0" y1="500.0" x2="980.0" y2="500.0" class="ln" stroke-width="0.6" stroke-opacity="0.3"/>
  <text x="20.0" y="524.0" class="tx" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="700">③ A request's path through the engine (in SGLang-like engines, every scheduling step runs this loop)</text>
  <rect x="20.0" y="546.0" width="80.0" height="52.0" rx="8" class="gray" stroke-width="1.3"/>
  <text x="60.0" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="60.0" dy="-6.5">request</tspan><tspan x="60.0" dy="13.0">arrives</tspan></text>
  <line x1="100.0" y1="572.0" x2="109.0" y2="572.0" class="ln" stroke-width="1.4"/>
  <polygon points="114.0,572.0 107.9,575.4 107.9,568.6" class="ah"/>
  <rect x="114.0" y="546.0" width="145.0" height="52.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="186.5" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="186.5" dy="-6.5">look up the radix tree</tspan><tspan x="186.5" dy="13.0">for the longest cached prefix</tspan></text>
  <line x1="259.0" y1="572.0" x2="268.0" y2="572.0" class="ln" stroke-width="1.4"/>
  <polygon points="273.0,572.0 266.9,575.4 266.9,568.6" class="ah"/>
  <rect x="273.0" y="546.0" width="215.0" height="52.0" rx="8" class="orange" stroke-width="1.3"/>
  <text x="380.5" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="380.5" dy="-6.5">prefill only the missed part;</tspan><tspan x="380.5" dy="13.0">long ones chunked among decodes</tspan></text>
  <line x1="488.0" y1="572.0" x2="497.0" y2="572.0" class="ln" stroke-width="1.4"/>
  <polygon points="502.0,572.0 495.9,575.4 495.9,568.6" class="ah"/>
  <rect x="502.0" y="546.0" width="115.0" height="52.0" rx="8" class="orange" stroke-width="1.3"/>
  <text x="559.5" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="559.5" dy="-6.5">sample the first token</tspan><tspan x="559.5" dy="13.0">(TTFT)</tspan></text>
  <line x1="617.0" y1="572.0" x2="626.0" y2="572.0" class="ln" stroke-width="1.4"/>
  <polygon points="631.0,572.0 624.9,575.4 624.9,568.6" class="ah"/>
  <rect x="631.0" y="546.0" width="155.0" height="52.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="708.5" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="708.5" dy="-6.5">join the decode batch,</tspan><tspan x="708.5" dy="13.0">one token per step with others</tspan></text>
  <line x1="786.0" y1="572.0" x2="795.0" y2="572.0" class="ln" stroke-width="1.4"/>
  <polygon points="800.0,572.0 793.9,575.4 793.9,568.6" class="ah"/>
  <rect x="800.0" y="546.0" width="165.0" height="52.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="882.5" y="572.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="882.5" dy="-6.5">emits a stop token</tspan><tspan x="882.5" dy="13.0">&lt;/tool_call&gt;, &lt;|im_end|&gt;</tspan></text>
  <line x1="882.0" y1="598.0" x2="882.0" y2="617.0" class="ln" stroke-width="1.4"/>
  <polygon points="882.0,622.0 878.6,615.9 885.4,615.9" class="ah"/>
  <rect x="690.0" y="624.0" width="290.0" height="46.0" rx="8" class="green" stroke-width="1.3"/>
  <text x="835.0" y="647.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="835.0" dy="-7.1">done: KV and state go back into the tree</tspan><tspan x="835.0" dy="14.3">for this session's next step</tspan></text>
  <path d="M 690.0 647.0 L 60.0 647.0 L 60.0 598.0" class="ln" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="60.0,598.0 63.4,604.1 56.6,604.1" class="ah"/>
  <text x="380.0" y="638.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">the framework runs the tool, appends the result, sends the next request</text>
  <line x1="20.0" y1="690.0" x2="980.0" y2="690.0" class="ln" stroke-width="0.6" stroke-opacity="0.3"/>
  <text x="20.0" y="714.0" class="tx" font-size="14" text-anchor="start" dominant-baseline="middle" font-weight="700">④ Two things that matter especially for agents</text>
  <rect x="20.0" y="730.0" width="470.0" height="150.0" rx="10" class="blue" stroke-width="1.0"/>
  <text x="36.0" y="752.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="700">Qwen3.5 is hybrid: linear-layer state cannot be cut</text>
  <text x="36.0" y="778.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">full-attention KV: reusable when cut at any position</text>
  <text x="36.0" y="800.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">the linear memory table summarizes the prefix, cannot be cut;</text>
  <text x="36.0" y="822.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">reusable only where a checkpoint was saved; a hit between</text>
  <text x="36.0" y="844.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">two checkpoints, recompute from the earlier one</text>
  <text x="36.0" y="866.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">in this chapter's simulation the new round prefills 824, not 320</text>
  <rect x="510.0" y="730.0" width="470.0" height="150.0" rx="10" class="orange" stroke-width="1.0"/>
  <text x="526.0" y="752.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="700">With PD disaggregation, every step goes through prefill again</text>
  <text x="526.0" y="778.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">the prefill instance computes new KV, the decode instance generates</text>
  <text x="526.0" y="800.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">the next step's prefix must be found on the prefill side, so:</text>
  <text x="526.0" y="822.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">· route the session to the machine holding its cache</text>
  <text x="526.0" y="844.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">· or use a shared tiered KV store (GPU, host memory, SSD)</text>
  <text x="526.0" y="866.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">tool results are often tens to hundreds of tokens: quick to compute and move</text>
</svg>
