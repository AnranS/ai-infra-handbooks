  <text x="485.0" y="99.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle">128²</text>
  <text x="430.0" y="128.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">one scale per 128×128 block: an outlier affects only one block</text>
  <rect x="540.0" y="40.0" width="130.0" height="70.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="605.0" y="75.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="605.0" dy="-16.7">DeepGEMM:</tspan><tspan x="605.0" dy="11.2">FP8 Tensor Core multiply</tspan><tspan x="605.0" dy="11.2">every 128 of K, multiply the scales</tspan><tspan x="605.0" dy="11.2">in fp32 and accumulate</tspan></text>
  <line x1="30.0" y1="150.0" x2="670.0" y2="150.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="350.0" y="172.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">one scale per tensor lets an outlier stretch the step size; block scaling confines it to 128 numbers, with accuracy near bf16: the basis of V3's FP8</text>
  <text x="350.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">MoE's grouped GEMM: experts get different token counts, concatenated into one matrix segmented by expert, computed in one launch; sort by expert first</text>
  <text x="350.0" y="220.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Hopper's FP8 accumulator has about 14 bits of precision, so every 128 of K the partial sum moves to fp32; DeepGEMM does it on CUDA cores</text>
</svg>
