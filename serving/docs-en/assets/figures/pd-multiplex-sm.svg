<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="three ways for prefill and decode to coexist on one GPU: alternating in time, splitting SMs in space (green contexts), or going to different GPUs">
  <text x="120.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">alternating in time</text>
  <rect x="30.0" y="40.0" width="180.0" height="22.0" rx="3" class="gray" stroke-width="0.8"/>
  <rect x="30.0" y="40.0" width="70.0" height="22.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="65.0" y="51.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">prefill</text>
  <rect x="100.0" y="40.0" width="18.0" height="22.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="109.0" y="51.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">d</text>
  <rect x="118.0" y="40.0" width="60.0" height="22.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="148.0" y="51.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">prefill</text>
  <rect x="178.0" y="40.0" width="32.0" height="22.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="194.0" y="51.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">d</text>
  <text x="120.0" y="78.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">whole GPU in turns: prefill stalls decode</text>
  <text x="120.0" y="96.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="120.0" dy="-5.6">(chunked prefill: small chunks mixed into decode,</tspan><tspan x="120.0" dy="11.2">slowing every step a little)</tspan></text>
  <text x="350.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">splitting SMs in space (PD multiplexing)</text>
  <rect x="260.0" y="40.0" width="180.0" height="22.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="350.0" y="51.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">prefill: 104 SMs</text>
  <rect x="260.0" y="66.0" width="180.0" height="14.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="350.0" y="73.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">decode: 28 SMs</text>
  <text x="350.0" y="100.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="350.0" dy="-5.9">the two streams each own a share of the SMs and run at once:</tspan><tspan x="350.0" dy="11.8">decode only competes with prefill for bandwidth and L2, never stalling for a whole step</tspan></text>
  <text x="580.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">on different GPUs (PD disaggregation)</text>
  <rect x="500.0" y="40.0" width="76.0" height="40.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="538.0" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">prefill instance</text>
  <rect x="600.0" y="40.0" width="76.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="638.0" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">decode instance</text>
  <line x1="576.0" y1="60.0" x2="595.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="600.0,60.0 593.9,63.4 593.9,56.6" class="ah"/>
  <text x="588.0" y="51.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">transfer KV</text>
  <text x="588.0" y="100.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="588.0" dy="-5.9">no interference, but KV travels over</tspan><tspan x="588.0" dy="11.8">RDMA / NVLink, and xPyD must be tuned</tspan></text>
  <line x1="30.0" y1="130.0" x2="670.0" y2="130.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="350.0" y="152.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">green contexts (CUDA 12.4+): cuDevSmResourceSplitByCount splits the SMs, each part with its own stream, and kernels stay on their own SMs</text>
  <text x="350.0" y="178.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the split level is the dial: more SMs to prefill → shorter TTFT; more to decode → steadier TPOT. PD multiplexing also runs only a few prefill layers per round</text>
  <text x="350.0" y="204.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">is it worth it: decode's P99 TPOT beats chunked prefill; no extra GPUs or KV transfer unlike PD disaggregation; prefill slows and both share bandwidth</text>
  <text x="350.0" y="230.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">when to use it: deployments on one or a few GPUs, medium-length prompts, scenarios sensitive to TPOT jitter</text>
</svg>
