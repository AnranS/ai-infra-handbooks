<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="two kinds of native sparse attention: NSA uses compression, selection and a sliding window with gating; DSA uses a lightweight indexer to pick 2048 tokens per query before MLA">
  <text x="170.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">NSA (three branches + gating)</text>
  <rect x="30.0" y="44.0" width="70.0" height="34.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="65.0" y="61.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">query</text>
  <line x1="100.0" y1="61.0" x2="125.0" y2="61.0" class="ln" stroke-width="1.1"/>
  <polygon points="130.0,61.0 123.9,64.4 123.9,57.6" class="ah"/>
  <rect x="130.0" y="44.0" width="190.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="225.0" y="61.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">compression branch: each stretch of tokens is compressed into one coarse key-value, giving a global overview</text>
  <line x1="320.0" y1="61.0" x2="337.9" y2="100.4" class="ln" stroke-width="1.1"/>
  <polygon points="340.0,105.0 334.4,100.8 340.5,98.0" class="ah"/>
  <line x1="100.0" y1="61.0" x2="127.2" y2="100.9" class="ln" stroke-width="1.1"/>
  <polygon points="130.0,105.0 123.8,101.8 129.3,98.0" class="ah"/>
  <rect x="130.0" y="88.0" width="190.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="225.0" y="105.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">selection branch: pick the most relevant blocks by compression scores, for the details</text>
  <line x1="320.0" y1="105.0" x2="335.0" y2="105.0" class="ln" stroke-width="1.1"/>
  <polygon points="340.0,105.0 333.9,108.4 333.9,101.6" class="ah"/>
  <line x1="100.0" y1="61.0" x2="128.4" y2="144.3" class="ln" stroke-width="1.1"/>
  <polygon points="130.0,149.0 124.8,144.3 131.2,142.1" class="ah"/>
  <rect x="130.0" y="132.0" width="190.0" height="34.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="225.0" y="149.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">sliding-window branch: the most recent tokens, for local detail</text>
  <line x1="320.0" y1="149.0" x2="337.9" y2="109.6" class="ln" stroke-width="1.1"/>
  <polygon points="340.0,105.0 340.5,112.0 334.4,109.2" class="ah"/>
  <rect x="340.0" y="88.0" width="50.0" height="34.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="365.0" y="105.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="365.0" dy="-5.9">gating</tspan><tspan x="365.0" dy="11.8">weighting</tspan></text>
  <text x="175.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="175.0" dy="-11.8">all three branches see only a few tokens:</tspan><tspan x="175.0" dy="11.8">far below full attention's cost</tspan><tspan x="175.0" dy="11.8">learned during training (natively), kernels in blocks</tspan></text>
  <line x1="410.0" y1="30.0" x2="410.0" y2="240.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="555.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">DSA (lightning indexer + MLA)</text>
  <rect x="430.0" y="44.0" width="70.0" height="34.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="465.0" y="61.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">query</text>
  <line x1="500.0" y1="61.0" x2="525.0" y2="61.0" class="ln" stroke-width="1.1"/>
  <polygon points="530.0,61.0 523.9,64.4 523.9,57.6" class="ah"/>
  <rect x="530.0" y="44.0" width="150.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="605.0" y="61.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="605.0" dy="-5.3">the indexer: 64 heads × 128 dims (FP8)</tspan><tspan x="605.0" dy="10.5">scores every past token</tspan></text>
  <line x1="605.0" y1="78.0" x2="605.0" y2="95.0" class="ln" stroke-width="1.1"/>
  <polygon points="605.0,100.0 601.6,93.9 608.4,93.9" class="ah"/>
  <text x="645.0" y="89.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">top-2048</text>
  <rect x="530.0" y="100.0" width="150.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="605.0" y="117.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="605.0" dy="-5.3">MLA attention over only</tspan><tspan x="605.0" dy="10.5">the 2048 selected tokens</tspan></text>
  <text x="555.0" y="160.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="555.0" dy="-11.8">the indexer costs only 16K FLOPs per (query, key) pair,</tspan><tspan x="555.0" dy="11.8">while MLA costs 278K; the longer the context, the more it saves</tspan><tspan x="555.0" dy="11.8">(about 30× the decode compute at 128K)</tspan></text>
  <text x="555.0" y="215.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the cache stores 132 extra bytes of indexer keys per token</text>
  <text x="350.0" y="262.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">new demands on engines: attention kernels must gather KV by index, block tables must express sparse selection, prefix caching and speculation must adapt</text>
  <text x="350.0" y="284.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">both are sparse from training (natively), not pruned afterwards, so accuracy barely drops, unlike after-the-fact eviction (StreamingLLM)</text>
</svg>
