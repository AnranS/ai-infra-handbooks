<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" role="img" aria-label="two-hop dispatch in DeepEP's high-throughput mode: a token first goes over RDMA to the GPU in the same position on the target node (one copy per node), then over NVLink to the GPUs that actually hold the experts">
