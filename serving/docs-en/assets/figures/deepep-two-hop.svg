  <rect x="179.0" y="140.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="205.0" y="160.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">GPU 6</text>
  <rect x="241.0" y="140.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="267.0" y="160.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">GPU 7</text>
  <rect x="400.0" y="50.0" width="260.0" height="150.0" rx="10" class="gray" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="530.0" y="68.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">node 1</text>
  <rect x="415.0" y="84.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="441.0" y="104.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle"><tspan x="441.0" dy="-5.0">GPU 0</tspan><tspan x="441.0" dy="9.9">experts 16...</tspan></text>
  <rect x="477.0" y="84.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="503.0" y="104.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle"><tspan x="503.0" dy="-5.0">GPU 1</tspan><tspan x="503.0" dy="9.9">experts 20...</tspan></text>
  <rect x="539.0" y="84.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="565.0" y="104.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle"><tspan x="565.0" dy="-5.0">GPU 2</tspan><tspan x="565.0" dy="9.9">experts 24...</tspan></text>
  <rect x="601.0" y="84.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
