  <rect x="55.0" y="140.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="81.0" y="160.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">GPU 4</text>
  <rect x="117.0" y="140.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
