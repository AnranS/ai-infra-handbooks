  <rect x="415.0" y="140.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="441.0" y="160.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">GPU 4</text>
  <rect x="477.0" y="140.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="503.0" y="160.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">GPU 5</text>
  <rect x="539.0" y="140.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="565.0" y="160.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">GPU 6</text>
  <rect x="601.0" y="140.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="627.0" y="160.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">GPU 7</text>
  <line x1="107.0" y1="104.0" x2="462.0" y2="104.0" class="orange-l" stroke-width="2.2"/>
  <polygon points="467.0,104.0 460.9,107.4 460.9,100.6" class="orange-s"/>
  <text x="350.0" y="36.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">① RDMA: same rail, one copy per target node (a token goes to at most 4 nodes)</text>
  <line x1="467.0" y1="124.0" x2="586.0" y2="139.4" class="green-l" stroke-width="1.8"/>
  <polygon points="591.0,140.0 584.5,142.6 585.3,135.9" class="green-s"/>
  <text x="569.0" y="132.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">② NVLink forwarding</text>
  <text x="350.0" y="222.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">inter-machine bandwidth (50 GB/s) costs 9× NVLink's; send one copy per node and distribute within it; node-limited routing caps a token at 4 nodes</text>
  <text x="350.0" y="246.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">low-latency mode (decode): fixed slots, pure RDMA, no CPU sync, trading bandwidth for tens of microseconds; in-kernel put / signal via NVSHMEM</text>
</svg>
