  <text x="81.0" y="104.0" class="tx" font-size="8" text-anchor="middle" dominant-baseline="middle"><tspan x="81.0" dy="-5.0">GPU 0</tspan><tspan x="81.0" dy="9.9">experts 0...</tspan></text>
  <rect x="117.0" y="84.0" width="52.0" height="40.0" rx="5" class="blue" stroke-width="1.3"/>
