<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" role="img" aria-label="Two kinds of interface: an ABC through inheritance (nominal subtyping, checked at run time) and a Protocol through shape (structural subtyping, checked statically), with duck typing at the root of both">
  <text x="180.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">an ABC: explicit inheritance</text>
  <rect x="100.0" y="40.0" width="160.0" height="30.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="180.0" y="55.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">class Reader(ABC)</text>
  <rect x="100.0" y="90.0" width="160.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="180.0" y="105.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">class FileReader(Reader)</text>
  <line x1="180.0" y1="90.0" x2="180.0" y2="75.0" class="ln" stroke-width="1.2"/>
  <polygon points="180.0,70.0 183.4,76.1 176.6,76.1" class="ah"/>
  <text x="180.0" y="140.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="180.0" dy="-16.7">Inheritance; a missing abstract method</tspan><tspan x="180.0" dy="11.2">raises at instantiation; isinstance works.</tspan><tspan x="180.0" dy="11.2">A third party's class cannot be declared</tspan><tspan x="180.0" dy="11.2">your ABC, short of register</tspan></text>
  <line x1="350.0" y1="30.0" x2="350.0" y2="170.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="530.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">a Protocol: only the shape</text>
  <rect x="430.0" y="40.0" width="200.0" height="30.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="530.0" y="55.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">class SupportsRead(Protocol): read()</text>
  <rect x="430.0" y="90.0" width="200.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="530.0" y="105.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">any class with a read() counts</text>
  <line x1="530.0" y1="90.0" x2="530.0" y2="75.0" class="ln" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polygon points="530.0,70.0 533.4,76.1 526.6,76.1" class="ah"/>
  <text x="530.0" y="140.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="530.0" dy="-22.3">No inheritance; mypy matches by</tspan><tspan x="530.0" dy="11.2">method signature, so third-party and</tspan><tspan x="530.0" dy="11.2">built-in types satisfy it naturally.</tspan><tspan x="530.0" dy="11.2">isinstance needs runtime_checkable</tspan><tspan x="530.0" dy="11.2">and checks only the method names</tspan></text>
  <text x="350.0" y="190.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Choosing: a framework interface for others takes an ABC (enforced, with defaults); a parameter saying "I just need these methods" takes a Protocol</text>
  <text x="350.0" y="210.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">In an inference framework: plugin points like the attention back end use an ABC; a utility's parameters use a Protocol (SupportsIndex, Iterable)</text>
</svg>
