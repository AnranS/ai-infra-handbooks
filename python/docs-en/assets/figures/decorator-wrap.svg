<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="A decorator is f = deco(f): calling f enters the wrapper, which calls the original; in a stack the nearest wraps first and the outermost runs first">
  <text x="130.0" y="24.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan x="130.0" dy="-13.0">@timer</tspan><tspan x="130.0" dy="13.0">@retry</tspan><tspan x="130.0" dy="13.0">def f(): ...</tspan></text>
  <text x="130.0" y="72.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">equivalent to f = timer(retry(f))</text>
  <rect x="300.0" y="40.0" width="360.0" height="130.0" rx="10" class="blue" stroke-width="1.2"/>
  <text x="480.0" y="58.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">timer's wrapper (outermost, runs first)</text>
  <rect x="320.0" y="70.0" width="320.0" height="85.0" rx="8" class="orange" stroke-width="1.2"/>
  <text x="480.0" y="88.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">retry's wrapper</text>
  <rect x="340.0" y="100.0" width="280.0" height="42.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="480.0" y="121.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="480.0" dy="-5.6">the original f</tspan><tspan x="480.0" dy="11.2">(functools.wraps carries __name__ and __doc__ outward)</tspan></text>
  <line x1="230.0" y1="105.0" x2="295.0" y2="105.0" class="ln" stroke-width="1.4"/>
  <polygon points="300.0,105.0 293.9,108.4 293.9,101.6" class="ah"/>
  <text x="265.0" y="95.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">call f(...)</text>
  <text x="350.0" y="195.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">A decorator with arguments has one more level: @retry(times=3) returns the real decorator, which wraps the function; as a class, __call__ is the wrapper</text>
  <text x="350.0" y="216.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">The decorator runs once at definition and the wrapper runs on every call - do no heavy work in the wrapper</text>
</svg>
