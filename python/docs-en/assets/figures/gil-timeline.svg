<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" role="img" aria-label="The GIL: threads make CPU-bound work no faster, and I/O-bound work faster">
  <text x="30.0" y="30.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="600">CPU-bound: two threads take the GIL in turn, for the same total time as one</text>
  <text x="110.0" y="56.0" class="mu" font-size="11" text-anchor="end" dominant-baseline="middle">thread 1</text>
  <rect x="120.0" y="46.0" width="480.0" height="20.0" rx="3" class="gray" stroke-width="0"/>
  <rect x="120.0" y="46.0" width="77.0" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="158.5" y="56.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <rect x="274.0" y="46.0" width="77.0" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="312.5" y="56.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <rect x="428.0" y="46.0" width="77.0" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="466.5" y="56.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <text x="110.0" y="82.0" class="mu" font-size="11" text-anchor="end" dominant-baseline="middle">thread 2</text>
  <rect x="120.0" y="72.0" width="480.0" height="20.0" rx="3" class="gray" stroke-width="0"/>
  <rect x="197.0" y="72.0" width="77.0" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="235.5" y="82.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <rect x="351.0" y="72.0" width="77.0" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="389.5" y="82.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <rect x="505.0" y="72.0" width="77.0" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="543.5" y="82.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <text x="120.0" y="110.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">Only one thread runs bytecode at a time, and switching costs extra</text>
  <text x="30.0" y="130.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="600">I/O-bound: the GIL is released while waiting, so the two threads really overlap</text>
  <text x="110.0" y="156.0" class="mu" font-size="11" text-anchor="end" dominant-baseline="middle">thread 1</text>
  <rect x="120.0" y="146.0" width="480.0" height="20.0" rx="3" class="gray" stroke-width="0"/>
  <rect x="120.0" y="146.0" width="38.5" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="139.2" y="156.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <rect x="158.5" y="146.0" width="231.0" height="20.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="274.0" y="156.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">waiting on I/O</text>
  <rect x="389.5" y="146.0" width="38.5" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="408.8" y="156.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <text x="110.0" y="182.0" class="mu" font-size="11" text-anchor="end" dominant-baseline="middle">thread 2</text>
  <rect x="120.0" y="172.0" width="480.0" height="20.0" rx="3" class="gray" stroke-width="0"/>
  <rect x="158.5" y="172.0" width="38.5" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="177.8" y="182.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <rect x="197.0" y="172.0" width="231.0" height="20.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="312.5" y="182.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">waiting on I/O</text>
  <rect x="428.0" y="172.0" width="38.5" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="447.2" y="182.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <text x="120.0" y="210.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">socket.recv, time.sleep, reading a file and NumPy's large computations all release the GIL</text>
  <text x="30.0" y="230.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="600">Several processes: each has its own GIL, which is what makes CPU-bound work truly parallel</text>
  <text x="110.0" y="256.0" class="mu" font-size="11" text-anchor="end" dominant-baseline="middle">process 1</text>
  <rect x="120.0" y="246.0" width="480.0" height="20.0" rx="3" class="gray" stroke-width="0"/>
  <rect x="120.0" y="246.0" width="231.0" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="235.5" y="256.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <text x="110.0" y="282.0" class="mu" font-size="11" text-anchor="end" dominant-baseline="middle">process 2</text>
  <rect x="120.0" y="272.0" width="480.0" height="20.0" rx="3" class="gray" stroke-width="0"/>
  <rect x="120.0" y="272.0" width="231.0" height="20.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="235.5" y="282.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">run</text>
  <text x="120.0" y="310.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">The same work in half the wall-clock time; the cost is serializing data across</text>
  <text x="600.0" y="322.0" class="mu" font-size="11" text-anchor="end" dominant-baseline="middle">time -&gt;</text>
</svg>
