<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="obj.attr 的查找顺序：先看类的 MRO 里有没有数据描述符（property）→ 实例字典 → 非数据描述符 / 类属性 → __getattr__ 兜底">
  <rect x="20.0" y="44.0" width="150.0" height="64.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="95.0" y="76.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="95.0" dy="-10.5">① type(obj) 的 MRO</tspan><tspan x="95.0" dy="10.5">找到数据描述符？</tspan><tspan x="95.0" dy="10.5">（有 __set__：property）</tspan></text>
  <text x="95.0" y="126.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">调用它的 __get__</text>
  <line x1="170.0" y1="76.0" x2="185.0" y2="76.0" class="ln" stroke-width="1.2"/>
  <polygon points="190.0,76.0 183.9,79.4 183.9,72.6" class="ah"/>
  <text x="180.0" y="67.0" class="mu" font-size="8" text-anchor="middle" dominant-baseline="middle">没找到</text>
  <rect x="190.0" y="44.0" width="150.0" height="64.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="265.0" y="76.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="265.0" dy="-5.3">② obj.__dict__</tspan><tspan x="265.0" dy="10.5">实例自己的属性</tspan></text>
  <text x="265.0" y="126.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">直接返回</text>
  <line x1="340.0" y1="76.0" x2="355.0" y2="76.0" class="ln" stroke-width="1.2"/>
  <polygon points="360.0,76.0 353.9,79.4 353.9,72.6" class="ah"/>
  <text x="350.0" y="67.0" class="mu" font-size="8" text-anchor="middle" dominant-baseline="middle">没找到</text>
  <rect x="360.0" y="44.0" width="150.0" height="64.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="435.0" y="76.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="435.0" dy="-10.5">③ MRO 里的</tspan><tspan x="435.0" dy="10.5">非数据描述符 / 类属性</tspan><tspan x="435.0" dy="10.5">（函数 → 绑定成方法）</tspan></text>
  <text x="435.0" y="126.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">函数的 __get__ 产生方法</text>
  <line x1="510.0" y1="76.0" x2="525.0" y2="76.0" class="ln" stroke-width="1.2"/>
  <polygon points="530.0,76.0 523.9,79.4 523.9,72.6" class="ah"/>
  <text x="520.0" y="67.0" class="mu" font-size="8" text-anchor="middle" dominant-baseline="middle">没找到</text>
  <rect x="530.0" y="44.0" width="150.0" height="64.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="605.0" y="76.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="605.0" dy="-5.3">④ __getattr__</tspan><tspan x="605.0" dy="10.5">兜底</tspan></text>
  <text x="605.0" y="126.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">没有就 AttributeError</text>
  <text x="350.0" y="166.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">所以 property 不会被实例字典里的同名值遮住（它在第 ① 步），而方法可以被实例属性覆盖（它在第 ③ 步）</text>
  <text x="350.0" y="190.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">描述符就是"访问属性时跑一段代码"的协议：property、方法、classmethod、__slots__、ORM 字段都是描述符</text>
  <text x="350.0" y="212.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">__getattribute__ 拦截一切（慎用），__getattr__ 只在找不到时才调；元类改的是"类本身怎么创建"，和属性查找是两回事</text>
</svg>
