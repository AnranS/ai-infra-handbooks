<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" role="img" aria-label="名字是贴在对象上的标签，不是装值的盒子">
  <text x="30.0" y="24.0" class="tx" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600">可变对象：两个名字指向同一个列表</text>
  <rect x="40.0" y="44.0" width="80.0" height="30.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="59.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle">a</text>
  <rect x="40.0" y="88.0" width="80.0" height="30.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="103.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle">b</text>
  <rect x="230.0" y="56.0" width="170.0" height="50.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="315.0" y="81.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="315.0" dy="-7.1">[1, 2, 3, 4]</tspan><tspan x="315.0" dy="14.3">id = 0x7f…a0</tspan></text>
  <line x1="120.0" y1="59.0" x2="225.0" y2="73.3" class="ln" stroke-width="1.5"/>
  <polygon points="230.0,74.0 223.5,76.5 224.4,69.8" class="ah"/>
  <line x1="120.0" y1="103.0" x2="225.0" y2="88.7" class="ln" stroke-width="1.5"/>
  <polygon points="230.0,88.0 224.4,92.2 223.5,85.5" class="ah"/>
  <text x="430.0" y="66.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">b = a 不复制任何东西；</text>
  <text x="430.0" y="86.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">b.append(4) 之后 a 也变了。</text>
  <text x="30.0" y="150.0" class="tx" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600">不可变对象：给名字重新贴标签，不改动对象</text>
  <rect x="40.0" y="170.0" width="80.0" height="30.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="185.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle">x</text>
  <rect x="40.0" y="214.0" width="80.0" height="30.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="229.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle">y</text>
  <rect x="230.0" y="164.0" width="110.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="285.0" y="181.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle">1</text>
  <rect x="230.0" y="210.0" width="110.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="285.0" y="227.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle">2</text>
  <line x1="120.0" y1="185.0" x2="225.0" y2="181.2" class="ln" stroke-width="1.5"/>
  <polygon points="230.0,181.0 224.0,184.6 223.7,177.9" class="ah"/>
  <line x1="120.0" y1="229.0" x2="225.0" y2="227.1" class="ln" stroke-width="1.5"/>
  <polygon points="230.0,227.0 223.9,230.5 223.8,223.7" class="ah"/>
  <text x="360.0" y="181.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">y = x 之后 y += 1 做的是</text>
  <text x="360.0" y="201.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">「算出新对象 2，再让 y 指向它」，</text>
  <text x="360.0" y="221.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">对象 1 一点没动，所以 x 还是 1。</text>
  <rect x="30.0" y="268.0" width="620.0" height="36.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="340.0" y="286.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">赋值 = 让名字指向对象；== 比的是值，is 比的是「同一个对象」；函数传参传的也是这条标签</text>
</svg>
