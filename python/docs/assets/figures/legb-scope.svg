<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="名字查找的顺序 LEGB：局部 → 外层函数 → 全局 → 内置；闭包把外层变量装进 cell，函数离开定义处后仍能访问">
  <rect x="30.0" y="36.0" width="640.0" height="24.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="350.0" y="48.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">Builtins：len、print</text>
  <rect x="80.0" y="66.0" width="540.0" height="24.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="350.0" y="78.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">Global：模块里的名字</text>
  <rect x="130.0" y="96.0" width="440.0" height="24.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="350.0" y="108.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">Enclosing：外层函数的局部变量（闭包 cell）</text>
  <rect x="180.0" y="126.0" width="340.0" height="24.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="350.0" y="138.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">Local：当前函数的局部变量</text>
  <line x1="350.0" y1="165.0" x2="350.0" y2="155.0" class="ln" stroke-width="1.2"/>
  <polygon points="350.0,150.0 353.4,156.1 346.6,156.1" class="ah"/>
  <text x="350.0" y="178.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">查找从最里层开始，找不到往外一层；赋值默认创建局部名字（要改外层的用 nonlocal，改全局的用 global）</text>
  <text x="350.0" y="202.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">闭包：内层函数引用了外层变量，Python 把这些变量放进 cell，函数对象的 __closure__ 指着它们——装饰器、回调、工厂函数都靠这个</text>
  <text x="350.0" y="222.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">经典的坑：循环里定义的 lambda 都引用同一个 cell，循环结束后全是最后一个值；用默认参数 i=i 固定下来</text>
</svg>
