<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="装饰器就是 f = deco(f)：调用 f 时先进包装函数，包装函数再调原函数；叠加时离函数最近的先包、最外层的先执行">
  <text x="130.0" y="24.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan x="130.0" dy="-13.0">@timer</tspan><tspan x="130.0" dy="13.0">@retry</tspan><tspan x="130.0" dy="13.0">def f(): ...</tspan></text>
  <text x="130.0" y="72.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">等价于 f = timer(retry(f))</text>
  <rect x="300.0" y="40.0" width="360.0" height="130.0" rx="10" class="blue" stroke-width="1.2"/>
  <text x="480.0" y="58.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">timer 的包装函数（最外层，先执行）</text>
  <rect x="320.0" y="70.0" width="320.0" height="85.0" rx="8" class="orange" stroke-width="1.2"/>
  <text x="480.0" y="88.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">retry 的包装函数</text>
  <rect x="340.0" y="100.0" width="280.0" height="42.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="480.0" y="121.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="480.0" dy="-5.6">原函数 f</tspan><tspan x="480.0" dy="11.2">（functools.wraps 把 __name__、__doc__ 搬到外层）</tspan></text>
  <line x1="230.0" y1="105.0" x2="295.0" y2="105.0" class="ln" stroke-width="1.4"/>
  <polygon points="300.0,105.0 293.9,108.4 293.9,101.6" class="ah"/>
  <text x="265.0" y="95.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">调用 f(...)</text>
  <text x="350.0" y="195.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">带参数的装饰器多一层：@retry(times=3) 先调用 retry(times=3) 得到真正的装饰器，再去包函数；用类实现时 __call__ 就是包装函数</text>
  <text x="350.0" y="216.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">装饰器只在定义时跑一次，包装函数在每次调用时跑——别在包装函数里做重活</text>
</svg>
