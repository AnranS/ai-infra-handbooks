<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="异常的层级：except 匹配的是"是不是这个类或其子类"——捕获 Exception 会吞掉几乎一切，捕获 BaseException 连 Ctrl-C 都吞">
  <line x1="350.0" y1="52.0" x2="120.0" y2="83.0" class="ln" stroke-width="1.1"/>
  <line x1="350.0" y1="52.0" x2="260.0" y2="83.0" class="ln" stroke-width="1.1"/>
  <line x1="350.0" y1="52.0" x2="470.0" y2="83.0" class="ln" stroke-width="1.1"/>
  <line x1="470.0" y1="107.0" x2="318.0" y2="138.0" class="ln" stroke-width="1.1"/>
  <line x1="470.0" y1="107.0" x2="428.0" y2="138.0" class="ln" stroke-width="1.1"/>
  <line x1="470.0" y1="107.0" x2="538.0" y2="138.0" class="ln" stroke-width="1.1"/>
  <line x1="470.0" y1="107.0" x2="648.0" y2="138.0" class="ln" stroke-width="1.1"/>
  <line x1="428.0" y1="162.0" x2="428.0" y2="188.0" class="ln" stroke-width="1.1"/>
  <line x1="318.0" y1="162.0" x2="318.0" y2="188.0" class="ln" stroke-width="1.1"/>
  <rect x="300.0" y="28.0" width="100.0" height="24.0" rx="5" class="red" stroke-width="1.3"/>
  <text x="350.0" y="40.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">BaseException</text>
  <rect x="70.0" y="83.0" width="100.0" height="24.0" rx="5" class="red" stroke-width="1.3"/>
  <text x="120.0" y="95.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">SystemExit</text>
  <rect x="210.0" y="83.0" width="100.0" height="24.0" rx="5" class="red" stroke-width="1.3"/>
  <text x="260.0" y="95.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">KeyboardInterrupt</text>
  <rect x="420.0" y="83.0" width="100.0" height="24.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="470.0" y="95.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">Exception</text>
  <rect x="268.0" y="138.0" width="100.0" height="24.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="318.0" y="150.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">ValueError</text>
  <rect x="378.0" y="138.0" width="100.0" height="24.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="428.0" y="150.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">OSError</text>
  <rect x="488.0" y="138.0" width="100.0" height="24.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="538.0" y="150.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">KeyError</text>
  <rect x="598.0" y="138.0" width="100.0" height="24.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="648.0" y="150.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">RuntimeError</text>
  <rect x="378.0" y="188.0" width="100.0" height="24.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="428.0" y="200.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">FileNotFoundError</text>
  <rect x="268.0" y="188.0" width="100.0" height="24.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="318.0" y="200.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">UnicodeError</text>
  <text x="120.0" y="200.0" class="mu" font-size="9" text-anchor="start" dominant-baseline="middle"><tspan x="120.0" dy="-11.2">自定义异常继承 Exception，</tspan><tspan x="120.0" dy="11.2">按领域建一棵小树，</tspan><tspan x="120.0" dy="11.2">调用方按需要的粒度 except</tspan></text>
  <text x="350.0" y="230.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">except 的顺序从具体到一般；finally 总会执行；上下文管理器的 __exit__ 收到异常三元组，返回 True 才吞掉</text>
</svg>
