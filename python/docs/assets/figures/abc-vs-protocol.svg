<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" role="img" aria-label="两种"接口"：ABC 靠继承（名义子类型，运行时检查），Protocol 靠形状（结构子类型，静态检查），鸭子类型是两者的根">
  <text x="180.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">ABC：显式继承</text>
  <rect x="100.0" y="40.0" width="160.0" height="30.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="180.0" y="55.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">class Reader(ABC)</text>
  <rect x="100.0" y="90.0" width="160.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="180.0" y="105.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">class FileReader(Reader)</text>
  <line x1="180.0" y1="90.0" x2="180.0" y2="75.0" class="ln" stroke-width="1.2"/>
  <polygon points="180.0,70.0 183.4,76.1 176.6,76.1" class="ah"/>
  <text x="180.0" y="140.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="180.0" dy="-5.6">继承；缺抽象方法时实例化就报错；isinstance 可用</tspan><tspan x="180.0" dy="11.2">第三方的类不能被你声明成你的 ABC（除非 register）</tspan></text>
  <line x1="350.0" y1="30.0" x2="350.0" y2="170.0" class="ln" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.4"/>
  <text x="530.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">Protocol：只看形状</text>
  <rect x="430.0" y="40.0" width="200.0" height="30.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="530.0" y="55.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">class SupportsRead(Protocol): read()</text>
  <rect x="430.0" y="90.0" width="200.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="530.0" y="105.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">任何有 read() 的类都算</text>
  <line x1="530.0" y1="90.0" x2="530.0" y2="75.0" class="ln" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polygon points="530.0,70.0 533.4,76.1 526.6,76.1" class="ah"/>
  <text x="530.0" y="140.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="530.0" dy="-5.6">不用继承，mypy 按方法签名匹配；第三方类、内置类型天然满足</tspan><tspan x="530.0" dy="11.2">runtime_checkable 才能 isinstance，且只查方法名</tspan></text>
  <text x="350.0" y="190.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">怎么选：给别人实现的框架接口用 ABC（强制、带默认实现）；描述"我只需要它有这些方法"的参数类型用 Protocol；标准库的 collections.abc 两者兼备</text>
  <text x="350.0" y="210.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">推理框架里：注意力后端、Platform 这类插件点多用 ABC；工具函数的参数类型多用 Protocol（SupportsIndex、Iterable）</text>
</svg>
