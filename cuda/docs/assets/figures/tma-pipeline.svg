<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="Hopper 的异步流水：生产者 warp 用 TMA 发起整块拷贝，mbarrier 计数到达，消费者 warp 组用 wgmma 算上一级的数据">
  <text x="120.0" y="22.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">共享内存的多级缓冲</text>
  <rect x="30.0" y="40.0" width="180.0" height="28.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="120.0" y="54.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">级 0：wgmma 正在算</text>
  <rect x="30.0" y="76.0" width="180.0" height="28.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="120.0" y="90.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">级 1：TMA 正在填</text>
  <rect x="30.0" y="112.0" width="180.0" height="28.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="120.0" y="126.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">级 2：TMA 正在填</text>
  <rect x="30.0" y="148.0" width="180.0" height="28.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="120.0" y="162.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">级 3：空，等释放</text>
  <text x="120.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="120.0" dy="-5.9">每级一个 mbarrier：</tspan><tspan x="120.0" dy="11.8">TMA 搬完自动 arrive，消费者 wait</tspan></text>
  <rect x="270.0" y="40.0" width="170.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="355.0" y="70.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="355.0" dy="-11.2">生产者 warp（1 个）</tspan><tspan x="355.0" dy="11.2">cp.async.bulk.tensor</tspan><tspan x="355.0" dy="11.2">给出坐标，硬件按张量映射搬整块</tspan></text>
  <rect x="270.0" y="124.0" width="170.0" height="60.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="355.0" y="154.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="355.0" dy="-11.2">消费者 warp 组（2～3 个）</tspan><tspan x="355.0" dy="11.2">wgmma.mma_async</tspan><tspan x="355.0" dy="11.2">直接从共享内存读 A、B</tspan></text>
  <line x1="440.0" y1="70.0" x2="495.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="500.0,70.0 493.9,73.4 493.9,66.6" class="ah"/>
  <text x="470.0" y="61.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">arrive</text>
  <line x1="440.0" y1="154.0" x2="495.0" y2="154.0" class="ln" stroke-width="1.3"/>
  <polygon points="500.0,154.0 493.9,157.4 493.9,150.6" class="ah"/>
  <text x="470.0" y="145.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">释放</text>
  <rect x="500.0" y="40.0" width="170.0" height="144.0" rx="7" class="gray" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="585.0" y="60.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">全局内存 → 共享内存</text>
  <text x="585.0" y="84.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="585.0" dy="-11.2">TMA：一条指令搬一个</tspan><tspan x="585.0" dy="11.2">多维 tile，地址计算</tspan><tspan x="585.0" dy="11.2">和边界处理都在硬件里</tspan></text>
  <text x="585.0" y="140.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="585.0" dy="-5.6">寄存器几乎不参与搬运，</tspan><tspan x="585.0" dy="11.2">线程只负责发起和等待</tspan></text>
  <text x="350.0" y="234.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">warp 专门化：搬数据的和算的是不同 warp，各自用 setmaxnreg 调寄存器配额；搬运的延迟完全藏在计算后面</text>
  <text x="350.0" y="258.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">cp.async（Ampere）是每个线程搬自己那几个元素、靠 commit/wait 分组；TMA 把整块搬运交给硬件，线程块集群还能把 tile 多播给邻居</text>
  <text x="350.0" y="282.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Blackwell 再进一步：tcgen05 的 mma 从 tensor memory 读写累加器，寄存器压力进一步下降</text>
</svg>
