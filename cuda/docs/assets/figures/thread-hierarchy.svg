<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" role="img" aria-label="线程层次：grid → block → warp → thread">
  <rect x="20.0" y="30.0" width="250.0" height="200.0" rx="10" class="gray" stroke-width="1.3"/>
  <text x="145.0" y="46.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">grid（一次 kernel 启动）</text>
  <rect x="35.0" y="64.0" width="70.0" height="66.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="70.0" y="97.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="70.0" dy="-6.8">block</tspan><tspan x="70.0" dy="13.6">(0,0)</tspan></text>
  <rect x="113.0" y="64.0" width="70.0" height="66.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="148.0" y="97.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="148.0" dy="-6.8">block</tspan><tspan x="148.0" dy="13.6">(1,0)</tspan></text>
  <rect x="191.0" y="64.0" width="70.0" height="66.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="226.0" y="97.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="226.0" dy="-6.8">block</tspan><tspan x="226.0" dy="13.6">(2,0)</tspan></text>
  <rect x="35.0" y="144.0" width="70.0" height="66.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="70.0" y="177.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="70.0" dy="-6.8">block</tspan><tspan x="70.0" dy="13.6">(0,1)</tspan></text>
  <rect x="113.0" y="144.0" width="70.0" height="66.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="148.0" y="177.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="148.0" dy="-6.8">block</tspan><tspan x="148.0" dy="13.6">(1,1)</tspan></text>
  <rect x="191.0" y="144.0" width="70.0" height="66.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="226.0" y="177.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="226.0" dy="-6.8">block</tspan><tspan x="226.0" dy="13.6">(2,1)</tspan></text>
  <line x1="270.0" y1="130.0" x2="325.0" y2="130.0" class="ln" stroke-width="1.4"/>
  <polygon points="330.0,130.0 323.9,133.4 323.9,126.6" class="ah"/>
  <rect x="330.0" y="30.0" width="180.0" height="200.0" rx="10" class="blue" stroke-width="1.3"/>
  <text x="420.0" y="46.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">一个 block（最多 1024 线程）</text>
  <rect x="345.0" y="64.0" width="150.0" height="32.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="420.0" y="80.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">warp 0：32 个线程</text>
  <rect x="345.0" y="104.0" width="150.0" height="32.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="420.0" y="120.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">warp 1：32 个线程</text>
  <rect x="345.0" y="144.0" width="150.0" height="32.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="420.0" y="160.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">warp 2：32 个线程</text>
  <rect x="345.0" y="184.0" width="150.0" height="32.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="420.0" y="200.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">warp 3：32 个线程</text>
  <line x1="510.0" y1="130.0" x2="555.0" y2="130.0" class="ln" stroke-width="1.4"/>
  <polygon points="560.0,130.0 553.9,133.4 553.9,126.6" class="ah"/>
  <text x="620.0" y="96.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="620.0" dy="-14.3">warp 里的 32 个线程</tspan><tspan x="620.0" dy="14.3">同一时刻执行同一条指令</tspan><tspan x="620.0" dy="14.3">（SIMT）</tspan></text>
  <text x="620.0" y="170.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="620.0" dy="-21.4">一个 block 只在</tspan><tspan x="620.0" dy="14.3">一个 SM 上运行，</tspan><tspan x="620.0" dy="14.3">可以用共享内存和</tspan><tspan x="620.0" dy="14.3">__syncthreads()</tspan></text>
</svg>
