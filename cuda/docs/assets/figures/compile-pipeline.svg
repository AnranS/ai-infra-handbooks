<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="torch.compile 的三层：Dynamo 从字节码里抓出图，AOT Autograd 把前向和反向变成算子图，Inductor 融合并生成 Triton / C++ kernel">
  <rect x="20.0" y="40.0" width="120.0" height="40.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Python 函数</text>
  <text x="80.0" y="110.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.9">eager 代码</tspan><tspan x="80.0" dy="11.8">（含控制流）</tspan></text>
  <line x1="140.0" y1="60.0" x2="151.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="156.0,60.0 149.9,63.4 149.9,56.6" class="ah"/>
  <rect x="156.0" y="40.0" width="120.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="216.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Dynamo</text>
  <text x="216.0" y="110.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="216.0" dy="-5.9">改字节码，抓 FX 图</tspan><tspan x="216.0" dy="11.8">遇到不支持的就 graph break</tspan></text>
  <line x1="276.0" y1="60.0" x2="287.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="292.0,60.0 285.9,63.4 285.9,56.6" class="ah"/>
  <rect x="292.0" y="40.0" width="120.0" height="40.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="352.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">AOT Autograd</text>
  <text x="352.0" y="110.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-5.9">展开成 ATen 算子图</tspan><tspan x="352.0" dy="11.8">前向 + 反向</tspan></text>
  <line x1="412.0" y1="60.0" x2="423.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="428.0,60.0 421.9,63.4 421.9,56.6" class="ah"/>
  <rect x="428.0" y="40.0" width="120.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="488.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Inductor</text>
  <text x="488.0" y="110.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-5.9">融合、调度、</tspan><tspan x="488.0" dy="11.8">生成 Triton / C++</tspan></text>
  <line x1="548.0" y1="60.0" x2="559.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="564.0,60.0 557.9,63.4 557.9,56.6" class="ah"/>
  <rect x="564.0" y="40.0" width="120.0" height="40.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="624.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">kernel</text>
  <text x="624.0" y="110.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" dy="-5.9">少量大 kernel</tspan><tspan x="624.0" dy="11.8">+ 启动代码</tspan></text>
  <text x="350.0" y="160.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">guard：Dynamo 记下图成立的条件（张量形状、dtype、Python 对象的属性），下次调用先检查 guard，不符就重新编译</text>
  <text x="350.0" y="184.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">推理引擎常用 mode="reduce-overhead"（配 CUDA Graph）或只编译小算子的融合，形状分桶避免反复重编译</text>
  <text x="350.0" y="208.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">融合省下的是访存：几个逐元素算子变成一个 kernel，中间结果不再写回显存</text>
</svg>
