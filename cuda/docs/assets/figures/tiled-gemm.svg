<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" role="img" aria-label="分块矩阵乘：每个 block 把 A、B 的小块搬进共享内存，反复使用">
  <rect x="40.0" y="90.0" width="160.0" height="120.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="120.0" y="222.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">A（M × K）</text>
  <rect x="40.0" y="130.0" width="160.0" height="30.0" rx="2" class="blue" stroke-width="1.6"/>
  <rect x="230.0" y="20.0" width="120.0" height="160.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="290.0" y="194.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">B（K × N）</text>
  <rect x="290.0" y="20.0" width="30.0" height="160.0" rx="2" class="orange" stroke-width="1.6"/>
  <rect x="380.0" y="90.0" width="120.0" height="120.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="440.0" y="222.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">C（M × N）</text>
  <rect x="440.0" y="130.0" width="30.0" height="30.0" rx="2" class="green" stroke-width="1.8"/>
  <text x="560.0" y="70.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">沿 K 方向逐块推进：</text>
  <text x="560.0" y="96.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="560.0" dy="-7.1">① 搬 A、B 的一小块</tspan><tspan x="560.0" dy="14.3">进共享内存</tspan></text>
  <text x="560.0" y="146.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="560.0" dy="-7.1">② 每个元素被复用</tspan><tspan x="560.0" dy="14.3"> tile 边长次</tspan></text>
  <text x="560.0" y="196.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="560.0" dy="-7.1">③ 累加到寄存器里的</tspan><tspan x="560.0" dy="14.3">C 小块，最后写回</tspan></text>
  <text x="340.0" y="268.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">访存量从 O(MNK) 降到 O(MNK / tile)：算术强度随 tile 增大，才能从访存受限变成算力受限</text>
</svg>
