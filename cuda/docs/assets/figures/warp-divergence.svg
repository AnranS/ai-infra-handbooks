  <text x="360.0" y="180.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">两段时间加起来，warp 一共跑了 A + B 的全部指令：分歧越均匀、分支越长，浪费越大（这里 A 时只有 1/4 的 lane 在干活）</text>
  <text x="360.0" y="204.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">Volta 之后每个线程有独立的 PC，分歧的两路可以交错，但仍不能同时执行；让分支按 warp 对齐（lane 整组走同一路）才没有代价</text>
