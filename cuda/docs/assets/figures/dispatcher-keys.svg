<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="一次 torch.add 怎么走到 kernel：按张量的 dispatch key 一层层分发——Autograd、Autocast、后端（CUDA / CPU / Meta）">
  <rect x="30.0" y="50.0" width="120.0" height="40.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="90.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">torch.add(a, b)</text>
  <line x1="150.0" y1="70.0" x2="185.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="190.0,70.0 183.9,73.4 183.9,66.6" class="ah"/>
  <rect x="190.0" y="50.0" width="108.0" height="40.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="244.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">Autograd</text>
  <text x="244.0" y="116.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="244.0" dy="-5.9">记录反向</tspan><tspan x="244.0" dy="11.8">（训练时）</tspan></text>
  <line x1="298.0" y1="70.0" x2="310.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="315.0,70.0 308.9,73.4 308.9,66.6" class="ah"/>
  <rect x="315.0" y="50.0" width="108.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="369.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">Autocast</text>
  <text x="369.0" y="116.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="369.0" dy="-5.9">混合精度</tspan><tspan x="369.0" dy="11.8">改 dtype</tspan></text>
  <line x1="423.0" y1="70.0" x2="435.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="440.0,70.0 433.9,73.4 433.9,66.6" class="ah"/>
  <rect x="440.0" y="50.0" width="108.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="494.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">后端：CUDA</text>
  <text x="494.0" y="116.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="494.0" dy="-5.9">选 kernel</tspan><tspan x="494.0" dy="11.8">（dtype、布局）</tspan></text>
  <line x1="548.0" y1="70.0" x2="560.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="565.0,70.0 558.9,73.4 558.9,66.6" class="ah"/>
  <rect x="565.0" y="50.0" width="108.0" height="40.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="619.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">kernel</text>
  <text x="619.0" y="116.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="619.0" dy="-5.9">add_kernel</tspan><tspan x="619.0" dy="11.8">&lt;float&gt;</tspan></text>
  <text x="350.0" y="160.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">dispatch key 是张量上的一组位：按优先级取最高的那个先处理，处理完再把自己去掉、重新分发（redispatch）</text>
  <text x="350.0" y="184.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">注册自定义算子 = 给某个 key 注册一个实现：TORCH_LIBRARY_IMPL(myops, CUDA, m)；Meta / fake tensor 只算形状不算值，编译器靠它推导</text>
  <text x="350.0" y="208.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">一次分发几微秒：decode 一步上千个小算子时这就是可观的开销，所以要 CUDA Graph 或者把小算子融合掉</text>
  <text x="350.0" y="232.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">推理引擎里的自定义 kernel（FlashInfer、vLLM 的 custom ops）都是通过这套机制接进 PyTorch 的</text>
</svg>
