  <rect x="638.0" y="50.0" width="23.0" height="24.0" rx="3" class="gray" stroke-width="0.5"/>
  <text x="649.5" y="62.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">×</text>
  <rect x="38.0" y="44.0" width="209.0" height="36.0" rx="5" class="gray" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="144.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="144.0" dy="-5.6">program_id = 0</tspan><tspan x="144.0" dy="11.2">offsets = 0 × BLOCK + arange(BLOCK)</tspan></text>
  <rect x="246.0" y="44.0" width="209.0" height="36.0" rx="5" class="gray" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="352.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-5.6">program_id = 1</tspan><tspan x="352.0" dy="11.2">offsets = 1 × BLOCK + arange(BLOCK)</tspan></text>
  <rect x="454.0" y="44.0" width="209.0" height="36.0" rx="5" class="gray" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="560.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="560.0" dy="-5.6">program_id = 2</tspan><tspan x="560.0" dy="11.2">offsets = 2 × BLOCK + arange(BLOCK)</tspan></text>
  <text x="560.0" y="128.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">× = 越界，mask = offsets &lt; n 挡住</text>
  <text x="350.0" y="160.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">tl.load(ptr + offsets, mask) → 算 → tl.store：线程怎么分、怎么合并访问、怎么用共享内存，编译器决定；程序员只写"一块"的逻辑</text>
  <text x="350.0" y="184.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">矩阵乘就是二维的 program 网格，每个 program 算 C 的一个 BLOCK_M × BLOCK_N，沿 K 循环累加——和 CUDA 的 block tile 一一对应</text>
  <text x="350.0" y="208.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">autotune 在几组 BLOCK 大小、num_warps、num_stages 里挑最快的；融合 softmax、注意力、量化 GEMM 都是几十行</text>
</svg>
