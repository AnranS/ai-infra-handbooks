<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="PDL：下一个 kernel 的序言（加载权重、算地址）提前上场，和上一个 kernel 的尾巴重叠；griddepcontrol 在真正要用数据时才等">
  <text x="60.0" y="24.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="600">普通</text>
  <rect x="60.0" y="36.0" width="200.0" height="24.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="160.0" y="48.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">kernel 1</text>
  <rect x="275.0" y="36.0" width="60.0" height="24.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="305.0" y="48.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">空隙</text>
  <rect x="335.0" y="36.0" width="200.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="435.0" y="48.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">kernel 2（序言 + 主体）</text>
  <text x="60.0" y="100.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="600">PDL</text>
  <rect x="60.0" y="112.0" width="200.0" height="24.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="160.0" y="124.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">kernel 1　　　launch_dependents →</text>
  <rect x="200.0" y="142.0" width="100.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="250.0" y="154.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">kernel 2 序言</text>
  <rect x="300.0" y="142.0" width="160.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="380.0" y="154.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">wait → 主体</text>
  <line x1="260.0" y1="128.0" x2="295.3" y2="140.3" class="ln" stroke-width="1.1"/>
  <polygon points="300.0,142.0 293.1,143.2 295.3,136.8" class="ah"/>
  <text x="560.0" y="128.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="560.0" dy="-5.9">空隙 = 启动延迟 + 尾部</tspan><tspan x="560.0" dy="11.8">只剩几 µs 的真正依赖</tspan></text>
  <text x="350.0" y="190.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">decode 一步几百个小 kernel，每个 2～5 µs 的空隙累计起来可占三成；PDL 把空隙压到接近零，CUDA Graph 里也能用</text>
  <text x="350.0" y="214.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">再往前一步是 megakernel：整个前向写进一个常驻 kernel，block 之间用全局内存的计数器同步，没有启动、没有空隙，但要自己做调度</text>
</svg>
