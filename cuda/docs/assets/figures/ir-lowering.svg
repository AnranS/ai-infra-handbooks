<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="编译器的层层下降：图级 IR 做融合与布局，循环级 IR 做分块与交换，最后生成目标代码——每一层只关心自己那层的优化">
  <rect x="60.0" y="36.0" width="220.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="170.0" y="53.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">图级 IR（算子图）</text>
  <text x="480.0" y="53.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">算子融合、常量折叠、布局选择、内存规划</text>
  <line x1="170.0" y1="70.0" x2="170.0" y2="77.0" class="ln" stroke-width="1.2"/>
  <polygon points="170.0,82.0 166.6,75.9 173.4,75.9" class="ah"/>
  <text x="216.0" y="76.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">lowering</text>
  <rect x="60.0" y="82.0" width="220.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="170.0" y="99.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">循环级 IR（嵌套循环）</text>
  <text x="480.0" y="99.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">分块（tiling）、循环交换、向量化、并行映射</text>
  <line x1="170.0" y1="116.0" x2="170.0" y2="123.0" class="ln" stroke-width="1.2"/>
  <polygon points="170.0,128.0 166.6,121.9 173.4,121.9" class="ah"/>
  <text x="216.0" y="122.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">lowering</text>
  <rect x="60.0" y="128.0" width="220.0" height="34.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="170.0" y="145.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">目标 IR（LLVM / PTX）</text>
  <text x="480.0" y="145.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">寄存器分配、指令选择、调度</text>
  <line x1="170.0" y1="162.0" x2="170.0" y2="169.0" class="ln" stroke-width="1.2"/>
  <polygon points="170.0,174.0 166.6,167.9 173.4,167.9" class="ah"/>
  <text x="216.0" y="168.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">lowering</text>
  <rect x="60.0" y="174.0" width="220.0" height="34.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="170.0" y="191.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">机器码</text>
  <text x="480.0" y="191.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">SASS / 可执行文件</text>
  <text x="350.0" y="232.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">MLIR 把"多层 IR + 各层的 pass"做成了通用框架：Triton、TVM、IREE 都是这个形状；Inductor 的调度器相当于循环级那一层</text>
</svg>
