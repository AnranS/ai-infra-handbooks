<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="Hopper's asynchronous pipeline: a producer warp issues whole-tile copies through TMA, an mbarrier counts arrivals, and a consumer warp group runs wgmma on the previous stage's data">
  <text x="120.0" y="22.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">multi-stage buffering in shared memory</text>
  <rect x="30.0" y="40.0" width="180.0" height="28.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="120.0" y="54.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">stage 0: wgmma computing</text>
  <rect x="30.0" y="76.0" width="180.0" height="28.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="120.0" y="90.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">stage 1: TMA filling</text>
  <rect x="30.0" y="112.0" width="180.0" height="28.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="120.0" y="126.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">stage 2: TMA filling</text>
  <rect x="30.0" y="148.0" width="180.0" height="28.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="120.0" y="162.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">stage 3: empty, awaiting release</text>
  <text x="120.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="120.0" dy="-5.9">one mbarrier per stage:</tspan><tspan x="120.0" dy="11.8">TMA arrives on completion, the consumer waits</tspan></text>
  <rect x="270.0" y="40.0" width="170.0" height="60.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="355.0" y="70.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="355.0" dy="-11.2">producer warp (1)</tspan><tspan x="355.0" dy="11.2">cp.async.bulk.tensor</tspan><tspan x="355.0" dy="11.2">gives coordinates; hardware moves the whole tile</tspan></text>
  <rect x="270.0" y="124.0" width="170.0" height="60.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="355.0" y="154.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="355.0" dy="-11.2">consumer warp groups (2-3)</tspan><tspan x="355.0" dy="11.2">wgmma.mma_async</tspan><tspan x="355.0" dy="11.2">reads A and B straight from shared memory</tspan></text>
  <line x1="440.0" y1="70.0" x2="495.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="500.0,70.0 493.9,73.4 493.9,66.6" class="ah"/>
  <text x="470.0" y="61.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">arrive</text>
  <line x1="440.0" y1="154.0" x2="495.0" y2="154.0" class="ln" stroke-width="1.3"/>
  <polygon points="500.0,154.0 493.9,157.4 493.9,150.6" class="ah"/>
  <text x="470.0" y="145.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">release</text>
  <rect x="500.0" y="40.0" width="170.0" height="144.0" rx="7" class="gray" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="585.0" y="60.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">global memory to shared memory</text>
  <text x="585.0" y="84.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="585.0" dy="-11.2">TMA: one instruction moves a</tspan><tspan x="585.0" dy="11.2">multidimensional tile, with address</tspan><tspan x="585.0" dy="11.2">math and bounds done in hardware</tspan></text>
  <text x="585.0" y="140.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="585.0" dy="-5.6">registers barely take part,</tspan><tspan x="585.0" dy="11.2">threads only issue and wait</tspan></text>
  <text x="350.0" y="234.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">Warp specialization: moving and computing live in different warps, each tuning registers with setmaxnreg, hiding transfers behind the compute</text>
  <text x="350.0" y="258.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">cp.async (Ampere) has each thread move its own elements, grouped by commit/wait; TMA hands the tile to hardware, and a cluster can multicast it</text>
  <text x="350.0" y="282.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Blackwell goes further: tcgen05's mma reads and writes the accumulator in tensor memory, cutting register pressure again</text>
</svg>
