<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="PDL: the next kernel's prologue (loading weights, computing addresses) starts early and overlaps the previous kernel's tail; griddepcontrol waits only when the data is really needed">
  <text x="60.0" y="24.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="600">plain</text>
  <rect x="60.0" y="36.0" width="200.0" height="24.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="160.0" y="48.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">kernel 1</text>
  <rect x="275.0" y="36.0" width="60.0" height="24.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="305.0" y="48.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">gap</text>
  <rect x="335.0" y="36.0" width="200.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="435.0" y="48.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">kernel 2 (prologue + body)</text>
  <text x="60.0" y="100.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle" font-weight="600">PDL</text>
  <rect x="60.0" y="112.0" width="200.0" height="24.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="160.0" y="124.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">kernel 1　　　launch_dependents →</text>
  <rect x="200.0" y="142.0" width="100.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="250.0" y="154.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">kernel 2 prologue</text>
  <rect x="300.0" y="142.0" width="160.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="380.0" y="154.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">wait, then the body</text>
  <line x1="260.0" y1="128.0" x2="295.3" y2="140.3" class="ln" stroke-width="1.1"/>
  <polygon points="300.0,142.0 293.1,143.2 295.3,136.8" class="ah"/>
  <text x="560.0" y="128.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="560.0" dy="-5.9">gap = launch latency + tail;</tspan><tspan x="560.0" dy="11.8">only a few µs of it is a real dependency</tspan></text>
  <text x="350.0" y="190.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">A decode step is hundreds of small kernels, and 2-5 µs of gap each adds up to a third; PDL cuts the gaps to near zero, inside CUDA Graph too</text>
  <text x="350.0" y="214.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Further still is the megakernel: the whole forward in one resident kernel, blocks syncing through global counters; no launches, no gaps, but you schedule it</text>
</svg>
