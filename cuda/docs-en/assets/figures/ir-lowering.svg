<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="A compiler lowering layer by layer: the graph-level IR fuses and chooses layouts, the loop-level IR tiles and interchanges, and the last layer generates target code, each minding only its own optimizations">
  <rect x="60.0" y="36.0" width="220.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="170.0" y="53.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">graph-level IR (op graph)</text>
  <text x="480.0" y="53.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">operator fusion, constant folding, layout choice, memory planning</text>
  <line x1="170.0" y1="70.0" x2="170.0" y2="77.0" class="ln" stroke-width="1.2"/>
  <polygon points="170.0,82.0 166.6,75.9 173.4,75.9" class="ah"/>
  <text x="216.0" y="76.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">lowering</text>
  <rect x="60.0" y="82.0" width="220.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="170.0" y="99.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">loop-level IR (nested loops)</text>
  <text x="480.0" y="99.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">tiling, loop interchange, vectorization, parallel mapping</text>
  <line x1="170.0" y1="116.0" x2="170.0" y2="123.0" class="ln" stroke-width="1.2"/>
  <polygon points="170.0,128.0 166.6,121.9 173.4,121.9" class="ah"/>
  <text x="216.0" y="122.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">lowering</text>
  <rect x="60.0" y="128.0" width="220.0" height="34.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="170.0" y="145.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">target IR (LLVM / PTX)</text>
  <text x="480.0" y="145.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">register allocation, instruction selection, scheduling</text>
  <line x1="170.0" y1="162.0" x2="170.0" y2="169.0" class="ln" stroke-width="1.2"/>
  <polygon points="170.0,174.0 166.6,167.9 173.4,167.9" class="ah"/>
  <text x="216.0" y="168.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">lowering</text>
  <rect x="60.0" y="174.0" width="220.0" height="34.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="170.0" y="191.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">machine code</text>
  <text x="480.0" y="191.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">SASS / executable</text>
  <text x="350.0" y="232.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">MLIR makes "layered IRs plus passes" a general framework: Triton, TVM and IREE share this shape, and Inductor's scheduler is the loop-level layer</text>
</svg>
