<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="torch.compile's three layers: Dynamo captures a graph from the bytecode, AOT Autograd turns forward and backward into an op graph, and Inductor fuses and generates Triton / C++ kernels">
  <rect x="20.0" y="40.0" width="120.0" height="40.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Python function</text>
  <text x="80.0" y="110.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.9">eager code</tspan><tspan x="80.0" dy="11.8">(with control flow)</tspan></text>
  <line x1="140.0" y1="60.0" x2="151.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="156.0,60.0 149.9,63.4 149.9,56.6" class="ah"/>
  <rect x="156.0" y="40.0" width="120.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="216.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Dynamo</text>
  <text x="216.0" y="110.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="216.0" dy="-5.9">rewrite the bytecode, capture an FX graph,</tspan><tspan x="216.0" dy="11.8">and graph break on anything unsupported</tspan></text>
  <line x1="276.0" y1="60.0" x2="287.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="292.0,60.0 285.9,63.4 285.9,56.6" class="ah"/>
  <rect x="292.0" y="40.0" width="120.0" height="40.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="352.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">AOT Autograd</text>
  <text x="352.0" y="110.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-5.9">expanded into an ATen op graph</tspan><tspan x="352.0" dy="11.8">forward + backward</tspan></text>
  <line x1="412.0" y1="60.0" x2="423.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="428.0,60.0 421.9,63.4 421.9,56.6" class="ah"/>
  <rect x="428.0" y="40.0" width="120.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="488.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Inductor</text>
  <text x="488.0" y="110.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-5.9">fuse, schedule,</tspan><tspan x="488.0" dy="11.8">generate Triton / C++</tspan></text>
  <line x1="548.0" y1="60.0" x2="559.0" y2="60.0" class="ln" stroke-width="1.3"/>
  <polygon points="564.0,60.0 557.9,63.4 557.9,56.6" class="ah"/>
  <rect x="564.0" y="40.0" width="120.0" height="40.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="624.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">kernel</text>
  <text x="624.0" y="110.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" dy="-5.9">a few large kernels</tspan><tspan x="624.0" dy="11.8">+ launch code</tspan></text>
  <text x="350.0" y="160.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">Guards: Dynamo records what the graph assumes (shapes, dtypes, object attributes) and rechecks it on the next call, recompiling if it fails</text>
  <text x="350.0" y="184.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Inference engines use mode="reduce-overhead" (with CUDA Graph) or compile only small-op fusions, bucketing shapes to avoid recompiles</text>
  <text x="350.0" y="208.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">What fusion saves is memory traffic: several elementwise ops become one kernel and the intermediates never reach memory</text>
</svg>
