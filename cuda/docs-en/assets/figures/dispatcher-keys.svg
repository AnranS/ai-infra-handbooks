<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="How one torch.add reaches a kernel: dispatched layer by layer on the tensor's dispatch keys, through Autograd, Autocast and the backend (CUDA / CPU / Meta)">
  <rect x="30.0" y="50.0" width="120.0" height="40.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="90.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">torch.add(a, b)</text>
  <line x1="150.0" y1="70.0" x2="185.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="190.0,70.0 183.9,73.4 183.9,66.6" class="ah"/>
  <rect x="190.0" y="50.0" width="108.0" height="40.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="244.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">Autograd</text>
  <text x="244.0" y="116.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="244.0" dy="-5.9">record the backward</tspan><tspan x="244.0" dy="11.8">(training only)</tspan></text>
  <line x1="298.0" y1="70.0" x2="310.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="315.0,70.0 308.9,73.4 308.9,66.6" class="ah"/>
  <rect x="315.0" y="50.0" width="108.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="369.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">Autocast</text>
  <text x="369.0" y="116.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="369.0" dy="-5.9">mixed precision</tspan><tspan x="369.0" dy="11.8">changes the dtype</tspan></text>
  <line x1="423.0" y1="70.0" x2="435.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="440.0,70.0 433.9,73.4 433.9,66.6" class="ah"/>
  <rect x="440.0" y="50.0" width="108.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="494.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">backend: CUDA</text>
  <text x="494.0" y="116.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="494.0" dy="-5.9">pick a kernel</tspan><tspan x="494.0" dy="11.8">(dtype, layout)</tspan></text>
  <line x1="548.0" y1="70.0" x2="560.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="565.0,70.0 558.9,73.4 558.9,66.6" class="ah"/>
  <rect x="565.0" y="50.0" width="108.0" height="40.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="619.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">kernel</text>
  <text x="619.0" y="116.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="619.0" dy="-5.9">add_kernel</tspan><tspan x="619.0" dy="11.8">&lt;float&gt;</tspan></text>
  <text x="350.0" y="160.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">A dispatch key is a set of bits on the tensor: the highest-priority one is handled first, then removes itself and redispatches</text>
  <text x="350.0" y="184.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">A custom op registers an implementation for one key: TORCH_LIBRARY_IMPL(myops, CUDA, m); the Meta / fake tensor gives shapes, not values</text>
  <text x="350.0" y="208.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">A few microseconds per dispatch: with a thousand small ops in one decode step that is real overhead, which is why CUDA Graph or fusion is needed</text>
  <text x="350.0" y="232.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">The custom kernels in inference engines (FlashInfer, vLLM's custom ops) all enter PyTorch through this mechanism</text>
</svg>
