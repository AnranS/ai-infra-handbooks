<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="The CUDA library landscape, from hand-written kernels to calling a library: the higher the abstraction the less work and the harder to reach peak. High-performance GEMM and attention nearly always land in the middle layer">
  <rect x="30.0" y="36.0" width="640.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="350.0" y="51.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">call a library: cuBLAS / cuDNN / cuFFT / NCCL</text>
  <text x="350.0" y="72.0" class="mu" font-size="1" text-anchor="middle" dominant-baseline="middle"></text>
  <rect x="70.0" y="76.0" width="560.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="350.0" y="91.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">template libraries: CUTLASS / CuTe, CUB, Thrust, libcu++</text>
  <text x="350.0" y="112.0" class="mu" font-size="1" text-anchor="middle" dominant-baseline="middle"></text>
  <rect x="110.0" y="116.0" width="480.0" height="30.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="350.0" y="131.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">DSL：Triton、TileLang、CuTe DSL</text>
  <text x="350.0" y="152.0" class="mu" font-size="1" text-anchor="middle" dominant-baseline="middle"></text>
  <rect x="150.0" y="156.0" width="400.0" height="30.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="350.0" y="171.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">hand-written CUDA / PTX: mma.sync, cp.async, TMA</text>
  <text x="350.0" y="192.0" class="mu" font-size="1" text-anchor="middle" dominant-baseline="middle"></text>
  <text x="674.0" y="51.0" class="mu" font-size="1" text-anchor="middle" dominant-baseline="middle"></text>
  <text x="634.0" y="91.0" class="mu" font-size="1" text-anchor="middle" dominant-baseline="middle"></text>
  <text x="594.0" y="131.0" class="mu" font-size="1" text-anchor="middle" dominant-baseline="middle"></text>
  <text x="554.0" y="171.0" class="mu" font-size="1" text-anchor="middle" dominant-baseline="middle"></text>
  <text x="350.0" y="200.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Everything enters PyTorch the same way: register the op with torch.library, then a custom autograd (only needed for training)</text>
  <text x="350.0" y="216.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">mind the stream, the dtype and contiguity, then register a torch.compile custom op so the compiler knows it</text>
  <text x="350.0" y="234.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">How to choose: torch.compile first, Triton when that is not enough, CUTLASS for GEMM-shaped work, and hand-written PTX only for the hottest of hot spots</text>
</svg>
