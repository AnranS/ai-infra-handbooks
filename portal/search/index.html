<style>
  main .wrap { max-width: 860px; padding-top: 48px; padding-bottom: 72px; }
  h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 22px; color: var(--muted); font-size: 14.5px; }
  .box { position: relative; }
  .box svg { position: absolute; left: 16px; top: 50%; width: 20px; height: 20px; transform: translateY(-50%); stroke: var(--faint); fill: none; stroke-width: 2; }
  #q { width: 100%; font: inherit; font-size: 17px; padding: 14px 16px 14px 46px; border: 1px solid var(--line); border-radius: 14px;
       background: var(--surface); color: var(--fg); box-shadow: var(--shadow); outline: none; }
  #q:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent); }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 6px; }
  .filters button { font: inherit; font-size: 13px; padding: 4px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
  .filters button.on { color: #fff; background: var(--blue); border-color: var(--blue); }
  .filters button small { opacity: .75; margin-left: 3px; }
  #meta { font-size: 13px; color: var(--faint); margin: 10px 0 4px; min-height: 18px; }
  #results { list-style: none; margin: 0; padding: 0; }
  #results li { border-bottom: 1px solid var(--line); }
  #results a { display: block; padding: 14px 4px; color: inherit; }
  #results a:hover .t, #results a:focus .t { color: var(--blue); }
  .t { font-size: 16px; font-weight: 600; color: var(--fg); }
  .t span { color: var(--muted); font-weight: 500; }
  .badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 6px; margin-right: 8px; vertical-align: 2px;
           color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
  .s { margin-top: 4px; font-size: 13.5px; color: var(--text); line-height: 1.7; overflow-wrap: anywhere; }
  mark { background: color-mix(in srgb, #ffcc00 45%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
  .empty { padding: 28px 0; color: var(--muted); font-size: 14px; }
  .hint { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .hint a { font-size: 13px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
</style>
