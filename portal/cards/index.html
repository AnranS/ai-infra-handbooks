<style>
  main .wrap { max-width: 920px; padding-top: 40px; padding-bottom: 72px; }
  h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: -0.02em; }
  .lead { margin: 0 0 20px; color: var(--muted); font-size: 15px; line-height: 1.8; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .bar select, .bar input[type=search] { font: inherit; font-size: 13.5px; padding: 6px 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .bar input[type=search] { flex: 1; min-width: 180px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13.5px; padding: 6px 12px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--blue); color: #fff; }
  .stats { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin: 6px 0 18px; }
  .stats b { color: var(--fg); font-size: 15px; margin-right: 3px; }
  .tools { margin-left: auto; display: flex; gap: 8px; }
  .btn { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer; }
  .btn:hover { border-color: var(--blue); color: var(--blue); }
  .card { border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); padding: 22px 26px; }
  .meta { font-size: 12.5px; color: var(--faint); margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .meta a { color: var(--muted); }
  .meta a:hover { color: var(--blue); }
  .tag { font-size: 11.5px; padding: 1px 8px; border-radius: 6px; background: color-mix(in srgb, var(--blue) 10%, transparent); color: var(--blue); }
  .tag.iv { background: color-mix(in srgb, #d4380d 12%, transparent); color: #d4380d; }
  .q, .a { font-size: 15px; line-height: 1.85; color: var(--text); }
  .q p, .a p { margin: 0 0 10px; }
  .a { border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 16px; }
  .q pre, .a pre { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; font-size: 13px; line-height: 1.65; }
  .q code, .a code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
  .q p code, .a p code, .a li code, .q li code { background: color-mix(in srgb, var(--blue) 8%, transparent); padding: 1px 5px; border-radius: 5px; }
  .q table, .a table { border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
  .q th, .q td, .a th, .a td { border: 1px solid var(--line); padding: 5px 8px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  .rate { flex: 1; min-width: 110px; font: inherit; padding: 10px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--fg); }
  .rate small { display: block; color: var(--faint); font-size: 12px; margin-top: 2px; }
  .rate:hover { border-color: var(--blue); }
  .rate.again { color: #d4380d; } .rate.hard { color: #c77700; } .rate.good { color: #1f9d55; } .rate.easy { color: var(--blue); }
  .show { width: 100%; font: inherit; font-size: 15px; padding: 12px; border-radius: 12px; border: 0; background: var(--blue); color: #fff; cursor: pointer; }
  .empty { text-align: center; color: var(--muted); padding: 48px 12px; line-height: 1.9; }
  .keys { font-size: 12px; color: var(--faint); margin-top: 12px; }
  .list details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 12px 16px; margin-bottom: 10px; }
  .list summary { cursor: pointer; list-style: none; }
  .list summary::-webkit-details-marker { display: none; }
  .list summary .q { font-size: 14.5px; }
  .list .more { font-size: 13px; color: var(--muted); margin-top: 18px; text-align: center; }
</style>
</head>

<main>
  <div class="wrap">
    <h1>学习卡</h1>
    <p class="lead">从七本手册各章的练习和面试题库里抽出的题目与答案，共 <span id="total">…</span> 张。按间隔重复复习：答不上来的明天再见，记住了的隔几天、几周再出现。复习记录只保存在本浏览器，可以在<a href="../roadmap/">学习路线图</a>导出、导入全站进度；也可以导出到 Anki。</p>
    <div class="bar">
      <div class="seg" role="group" aria-label="模式">
        <button type="button" data-mode="review" aria-pressed="true">复习</button>
        <button type="button" data-mode="browse" aria-pressed="false">浏览</button>
      </div>
      <select id="book" aria-label="手册"><option value="all">全部手册</option></select>
      <select id="kind" aria-label="类型"><option value="all">练习和面试题</option><option value="练习">只看练习</option><option value="面试题">只看面试题</option></select>
      <select id="src" aria-label="新卡来源" title="新卡按学习路线图的顺序出现；也可以只出已经标为已学的章节"><option value="all">新卡：按路线图顺序</option><option value="done">新卡：只出已学的章节</option></select>
      <input type="search" id="q" placeholder="搜索题目或章节（浏览模式）">
    </div>
    <div class="stats" id="stats"></div>
    <div id="view"></div>
  </div>
</main>

<script>
  document.getElementById("theme").addEventListener("click", function () {
    var root = document.documentElement;
    var dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("aig-theme", root.dataset.theme); } catch (e) {}
  });
</script>
