<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" role="img" aria-label="three tiers: the value in the GPU pool, the host_value in the CPU pool, and pages indexed by content hash in remote storage; HiCacheController's writing and reading threads move them asynchronously">
  <rect x="20.0" y="40.0" width="200.0" height="110.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="120.0" y="58.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">GPU: a RadixCache node's value</text>
  <text x="120.0" y="100.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="120.0" dy="-16.7">a hit → use it directly</tspan><tspan x="120.0" dy="11.2">memory full → leaf LRU eviction</tspan><tspan x="120.0" dy="11.2">a backed-up node only frees GPU memory</tspan><tspan x="120.0" dy="11.2">(the node stays with an empty value)</tspan></text>
  <rect x="260.0" y="40.0" width="200.0" height="110.0" rx="8" class="green" stroke-width="1.3"/>
  <text x="360.0" y="58.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">CPU: a node's host_value</text>
  <text x="360.0" y="100.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" dy="-16.7">pinned memory laid out like the GPU pool</tspan><tspan x="360.0" dy="11.2">write_through / selective / write_back</tspan><tspan x="360.0" dy="11.2">moved back only above load_back_threshold</tspan><tspan x="360.0" dy="11.2">memory full → evict_host</tspan></text>
  <rect x="500.0" y="40.0" width="200.0" height="110.0" rx="8" class="orange" stroke-width="1.3"/>
  <text x="600.0" y="58.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">storage: pages by content hash</text>
  <text x="600.0" y="100.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-16.7">3FS, Mooncake Store, NIXL, files…</tspan><tspan x="600.0" dy="11.2">key = a chained page hash</tspan><tspan x="600.0" dy="11.2">shared across instances</tspan><tspan x="600.0" dy="11.2">prefetching (storage_prefetch)</tspan></text>
  <line x1="220.0" y1="80.0" x2="255.0" y2="80.0" class="ln" stroke-width="1.4"/>
  <polygon points="260.0,80.0 253.9,83.4 253.9,76.6" class="ah"/>
  <text x="240.0" y="71.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">write</text>
  <line x1="260.0" y1="110.0" x2="225.0" y2="110.0" class="ln" stroke-width="1.4"/>
  <polygon points="220.0,110.0 226.1,106.6 226.1,113.4" class="ah"/>
  <text x="240.0" y="122.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">load_back</text>
  <line x1="460.0" y1="80.0" x2="495.0" y2="80.0" class="ln" stroke-width="1.4"/>
  <polygon points="500.0,80.0 493.9,83.4 493.9,76.6" class="ah"/>
  <text x="480.0" y="71.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">set</text>
  <line x1="500.0" y1="110.0" x2="465.0" y2="110.0" class="ln" stroke-width="1.4"/>
  <polygon points="460.0,110.0 466.1,106.6 466.1,113.4" class="ah"/>
  <text x="480.0" y="122.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">get / prefetch</text>
  <rect x="140.0" y="180.0" width="440.0" height="60.0" rx="8" class="bx" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="360.0" y="198.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">HiCacheController（managers/cache_controller.py）</text>
  <text x="360.0" y="224.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" dy="-5.6">a write queue and thread, a read queue and thread;</tspan><tspan x="360.0" dy="11.2">a CacheOperation can be merged or split; a LayerDoneCounter lets the forward wait layer by layer</tspan></text>
  <text x="360.0" y="262.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" dy="-5.8">#2771 the CPU pool (2025-01-07) → #2804 the controller (01-10) → #2693 the main PR (02-23) → #7704 the storage prototype (07-18)</tspan><tspan x="360.0" dy="11.5">→ #9053 node hashes (08-11) → #10190 pluggable eviction (09)</tspan></text>
  <text x="360.0" y="290.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">reconciliations: TP consistency (#4082), the MLA pool (#4009), page alignment (#4581), DP attention (#7159), PD reusing a remote cache (the #8211 series)</text>
</svg>
