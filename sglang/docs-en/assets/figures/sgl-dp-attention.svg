<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" role="img" aria-label="two kinds of parallelism under MLA: under TP every rank holds a complete copy of the latent KV; DP attention has each rank manage its own requests and its own KV, gathering the tokens only at the MoE layer">
  <text x="180.0" y="24.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">tensor parallelism (TP=4)</text>
  <rect x="30.0" y="40.0" width="70.0" height="60.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="65.0" y="54.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">rank 0</text>
  <text x="65.0" y="80.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="65.0" dy="-5.5">the whole KV</tspan><tspan x="65.0" dy="10.9">(duplicated)</tspan></text>
  <rect x="108.0" y="40.0" width="70.0" height="60.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="143.0" y="54.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">rank 1</text>
  <text x="143.0" y="80.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="143.0" dy="-5.5">the whole KV</tspan><tspan x="143.0" dy="10.9">(duplicated)</tspan></text>
  <rect x="186.0" y="40.0" width="70.0" height="60.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="221.0" y="54.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">rank 2</text>
  <text x="221.0" y="80.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="221.0" dy="-5.5">the whole KV</tspan><tspan x="221.0" dy="10.9">(duplicated)</tspan></text>
  <rect x="264.0" y="40.0" width="70.0" height="60.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="299.0" y="54.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">rank 3</text>
  <text x="299.0" y="80.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="299.0" dy="-5.5">the whole KV</tspan><tspan x="299.0" dy="10.9">(duplicated)</tspan></text>
  <text x="180.0" y="120.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">split by head, but MLA has one latent vector: 4 identical KVs</text>
  <text x="540.0" y="24.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">DP attention（DP=4）</text>
  <rect x="400.0" y="40.0" width="70.0" height="60.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="435.0" y="54.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">rank 0</text>
  <text x="435.0" y="80.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="435.0" dy="-5.5">request group 0</tspan><tspan x="435.0" dy="10.9">its own KV</tspan></text>
  <rect x="478.0" y="40.0" width="70.0" height="60.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="513.0" y="54.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">rank 1</text>
  <text x="513.0" y="80.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="513.0" dy="-5.5">request group 1</tspan><tspan x="513.0" dy="10.9">its own KV</tspan></text>
  <rect x="556.0" y="40.0" width="70.0" height="60.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="591.0" y="54.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">rank 2</text>
  <text x="591.0" y="80.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="591.0" dy="-5.5">request group 2</tspan><tspan x="591.0" dy="10.9">its own KV</tspan></text>
  <rect x="634.0" y="40.0" width="70.0" height="60.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="669.0" y="54.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">rank 3</text>
  <text x="669.0" y="80.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="669.0" dy="-5.5">request group 3</tspan><tspan x="669.0" dy="10.9">its own KV</tspan></text>
  <text x="540.0" y="120.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">each rank schedules and attends alone; no duplicated KV, a 4x larger batch</text>
  <rect x="400.0" y="150.0" width="300.0" height="36.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="550.0" y="168.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">MoE / dense FFN: all-gather the tokens → compute → scatter back</text>
  <line x1="435.0" y1="100.0" x2="435.0" y2="145.0" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="435.0,150.0 431.6,143.9 438.4,143.9" class="ah"/>
  <line x1="513.0" y1="100.0" x2="513.0" y2="145.0" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="513.0,150.0 509.6,143.9 516.4,143.9" class="ah"/>
  <line x1="591.0" y1="100.0" x2="591.0" y2="145.0" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="591.0,150.0 587.6,143.9 594.4,143.9" class="ah"/>
  <line x1="669.0" y1="100.0" x2="669.0" y2="145.0" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="669.0,150.0 665.6,143.9 672.4,143.9" class="ah"/>
  <text x="360.0" y="214.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">synchronised each step: all_gather the token counts (the gather's shape); an idle rank keeps step with an IDLE batch; all_reduce(MIN) before a graph replays</text>
  <text x="360.0" y="236.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">#1970 (2024-11-16) Support DP MLA, #2061 CUDA graphs, #2096 more conservative admission; the v0.4 blog: DeepSeek's decode throughput 1.9x</text>
  <text x="360.0" y="262.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">EP (#2371, 12-06) then splits the MoE's experts across ranks: DP attention plus EP became the standard shape for deploying DeepSeek</text>
</svg>
