<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" role="img" aria-label="landing mid-edge: before the fix it recursed further and took another context's KV as a hit; after the fix it splits at the fork and stops">
  <text x="160.0" y="30.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">before: tree has Hello_L.A.! → world; query Hello_world</text>
  <circle cx="160.0" cy="60.0" r="10.0" class="gray" stroke-width="1.3"/>
  <text x="160.0" y="60.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">root</text>
  <line x1="160.0" y1="70.0" x2="160.0" y2="120.0" class="red-l" stroke-width="2"/>
  <text x="174.0" y="95.0" class="tx" font-size="10" text-anchor="start" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Hello_L.A.!</text>
  <circle cx="160.0" cy="120.0" r="9.0" class="bx" stroke-width="1.2"/>
  <line x1="160.0" y1="129.0" x2="160.0" y2="180.0" class="red-l" stroke-width="2"/>
  <text x="174.0" y="154.5" class="tx" font-size="10" text-anchor="start" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">world</text>
  <circle cx="160.0" cy="180.0" r="9.0" class="bx" stroke-width="1.2"/>
  <text x="160.0" y="232.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a hit = Hello_ + world (11)</text>
  <text x="160.0" y="256.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">it forked mid-edge yet recursed on: world's KV is from another sequence</text>
  <text x="520.0" y="30.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">after the fix (#7, 2024-01-16)</text>
  <circle cx="520.0" cy="60.0" r="10.0" class="gray" stroke-width="1.3"/>
  <text x="520.0" y="60.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">root</text>
  <line x1="520.0" y1="70.0" x2="520.0" y2="110.0" class="green-l" stroke-width="2"/>
  <text x="534.0" y="90.0" class="tx" font-size="10" text-anchor="start" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Hello_</text>
  <circle cx="520.0" cy="110.0" r="9.0" class="bx" stroke-width="1.2"/>
  <line x1="520.0" y1="119.0" x2="520.0" y2="160.0" class="ln" stroke-width="1.4"/>
  <text x="534.0" y="139.5" class="tx" font-size="10" text-anchor="start" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">L.A.!</text>
  <circle cx="520.0" cy="160.0" r="9.0" class="bx" stroke-width="1.2"/>
  <line x1="520.0" y1="169.0" x2="520.0" y2="210.0" class="ln" stroke-width="1.4"/>
  <text x="534.0" y="189.5" class="tx" font-size="10" text-anchor="start" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">world</text>
  <circle cx="520.0" cy="210.0" r="9.0" class="bx" stroke-width="1.2"/>
  <text x="520.0" y="232.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a hit = Hello_ (6)</text>
  <text x="520.0" y="256.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the edge is cut at the fork, a new node takes the first half; the match ends</text>
  <text x="360.0" y="278.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the two lines fixed: split and stop as soon as prefix_len &lt; len(c_key); append the whole child.value and then recurse when the whole edge hits</text>
</svg>
