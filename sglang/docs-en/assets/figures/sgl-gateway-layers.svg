<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" width="720" role="img" aria-label="where the gateway sits: clients → sgl-model-gateway (protocol conversion, parsing, picking an instance by policy, service discovery, observability) → several engine instances (HTTP or gRPC) → each instance's DP controller and schedulers">
  <rect x="20.0" y="30.0" width="680.0" height="26.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="360.0" y="43.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">clients: OpenAI / Anthropic / the native protocol</text>
  <line x1="360.0" y1="56.0" x2="360.0" y2="71.0" class="ln" stroke-width="1.4"/>
  <polygon points="360.0,76.0 356.6,69.9 363.4,69.9" class="ah"/>
  <rect x="20.0" y="76.0" width="680.0" height="96.0" rx="9" class="purple" stroke-width="1.3"/>
  <text x="360.0" y="94.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">sgl-model-gateway (Rust, about 95 thousand lines, released separately as gateway-v*)</text>
  <rect x="30.0" y="108.0" width="130.0" height="56.0" rx="6" class="bx" stroke-width="1.3"/>
  <text x="95.0" y="136.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="95.0" dy="-5.3">routers/</tspan><tspan x="95.0" dy="10.5">HTTP、PD、gRPC、OpenAI</tspan></text>
  <rect x="170.0" y="108.0" width="130.0" height="56.0" rx="6" class="bx" stroke-width="1.3"/>
  <text x="235.0" y="136.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="235.0" dy="-15.8">policies/</tspan><tspan x="235.0" dy="10.5">round robin, random,</tspan><tspan x="235.0" dy="10.5">cache-aware, power-of-two,</tspan><tspan x="235.0" dy="10.5">PD combinations</tspan></text>
  <rect x="310.0" y="108.0" width="130.0" height="56.0" rx="6" class="bx" stroke-width="1.3"/>
  <text x="375.0" y="136.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="375.0" dy="-10.5">the parsers</tspan><tspan x="375.0" dy="10.5">tool calls, reasoning segments</tspan><tspan x="375.0" dy="10.5">(in Rust)</tspan></text>
  <rect x="450.0" y="108.0" width="130.0" height="56.0" rx="6" class="bx" stroke-width="1.3"/>
  <text x="515.0" y="136.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="515.0" dy="-10.5">service_discovery</tspan><tspan x="515.0" dy="10.5">Kubernetes labels</tspan><tspan x="515.0" dy="10.5">instances added and removed</tspan></text>
  <rect x="590.0" y="108.0" width="130.0" height="56.0" rx="6" class="bx" stroke-width="1.3"/>
  <text x="655.0" y="136.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="655.0" dy="-10.5">observability / wasm</tspan><tspan x="655.0" dy="10.5">metrics, tracing</tspan><tspan x="655.0" dy="10.5">the plugin layer</tspan></text>
  <line x1="120.0" y1="172.0" x2="120.0" y2="193.0" class="ln" stroke-width="1.4"/>
  <polygon points="120.0,198.0 116.6,191.9 123.4,191.9" class="ah"/>
  <line x1="360.0" y1="172.0" x2="360.0" y2="193.0" class="ln" stroke-width="1.4"/>
  <polygon points="360.0,198.0 356.6,191.9 363.4,191.9" class="ah"/>
  <line x1="600.0" y1="172.0" x2="600.0" y2="193.0" class="ln" stroke-width="1.4"/>
  <polygon points="600.0,198.0 596.6,191.9 603.4,191.9" class="ah"/>
  <text x="240.0" y="186.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">HTTP or gRPC (#10283)</text>
  <rect x="20.0" y="198.0" width="200.0" height="40.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="120.0" y="218.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="120.0" dy="-5.5">engine instance 0</tspan><tspan x="120.0" dy="10.9">the DP controller → schedulers x (PP x TP)</tspan></text>
  <rect x="260.0" y="198.0" width="200.0" height="40.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="360.0" y="218.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" dy="-5.5">engine instance 1</tspan><tspan x="360.0" dy="10.9">the DP controller → schedulers x (PP x TP)</tspan></text>
  <rect x="500.0" y="198.0" width="200.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="600.0" y="218.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-5.5">prefill / decode instances</tspan><tspan x="600.0" dy="10.9">(PD-aware routing)</tspan></text>
  <text x="360.0" y="258.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" dy="-5.6">2024-10 rust/ (round robin, random) → 11 cache-aware over approximate radix trees → 12 renamed sgl-router, 0.1.0 dynamic scaling</tspan><tspan x="360.0" dy="11.2">→ 2025-07 #7987 the policy split from the router → 08 PD routing, parsers → 12 renamed sgl-model-gateway</tspan></text>
  <text x="360.0" y="288.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">rust/ holds six more crates compiled on demand (the radix tree, template rendering, multimodal, gRPC, the service layer) inside the Python package</text>
</svg>
