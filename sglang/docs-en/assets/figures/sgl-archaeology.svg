<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" role="img" aria-label="this book's archaeology workflow: pin the baseline → find the active periods from the commits per month → locate the directories with a module-by-quarter heat table → the first appearance (directory, file, keyword, -S) → read the version of the day → read the PRs, roadmaps and blogs for the why">
  <rect x="20.0" y="40.0" width="104.0" height="70.0" rx="8" class="gray" stroke-width="1.3"/>
  <text x="72.0" y="75.0" class="tx" font-size="8.6" text-anchor="middle" dominant-baseline="middle"><tspan x="72.0" dy="-10.7">pin the baseline</tspan><tspan x="72.0" dy="10.7">REF=29f6d408c0</tspan><tspan x="72.0" dy="10.7">check with merge-base</tspan></text>
  <line x1="124.0" y1="75.0" x2="131.0" y2="75.0" class="ln" stroke-width="1.4"/>
  <polygon points="136.0,75.0 129.9,78.4 129.9,71.6" class="ah"/>
  <rect x="136.0" y="40.0" width="104.0" height="70.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="188.0" y="75.0" class="tx" font-size="8.6" text-anchor="middle" dominant-baseline="middle"><tspan x="188.0" dy="-10.7">count commits</tspan><tspan x="188.0" dy="10.7">log --format=%ad</tspan><tspan x="188.0" dy="10.7">by month / year / author</tspan></text>
  <line x1="240.0" y1="75.0" x2="247.0" y2="75.0" class="ln" stroke-width="1.4"/>
  <polygon points="252.0,75.0 245.9,78.4 245.9,71.6" class="ah"/>
  <rect x="252.0" y="40.0" width="104.0" height="70.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="304.0" y="75.0" class="tx" font-size="8.6" text-anchor="middle" dominant-baseline="middle"><tspan x="304.0" dy="-10.7">the heat table</tspan><tspan x="304.0" dy="10.7">log --name-only</tspan><tspan x="304.0" dy="10.7">module x quarter</tspan></text>
  <line x1="356.0" y1="75.0" x2="363.0" y2="75.0" class="ln" stroke-width="1.4"/>
  <polygon points="368.0,75.0 361.9,78.4 361.9,71.6" class="ah"/>
  <rect x="368.0" y="40.0" width="104.0" height="70.0" rx="8" class="green" stroke-width="1.3"/>
  <text x="420.0" y="75.0" class="tx" font-size="8.6" text-anchor="middle" dominant-baseline="middle"><tspan x="420.0" dy="-10.7">the first appearance</tspan><tspan x="420.0" dy="10.7">log -- dir / --follow</tspan><tspan x="420.0" dy="10.7">grep the titles / -S</tspan></text>
  <line x1="472.0" y1="75.0" x2="479.0" y2="75.0" class="ln" stroke-width="1.4"/>
  <polygon points="484.0,75.0 477.9,78.4 477.9,71.6" class="ah"/>
  <rect x="484.0" y="40.0" width="104.0" height="70.0" rx="8" class="green" stroke-width="1.3"/>
  <text x="536.0" y="75.0" class="tx" font-size="8.6" text-anchor="middle" dominant-baseline="middle"><tspan x="536.0" dy="-10.7">read the version</tspan><tspan x="536.0" dy="10.7">show commit:path</tspan><tspan x="536.0" dy="10.7">show --stat -M</tspan></text>
  <line x1="588.0" y1="75.0" x2="595.0" y2="75.0" class="ln" stroke-width="1.4"/>
  <polygon points="600.0,75.0 593.9,78.4 593.9,71.6" class="ah"/>
  <rect x="600.0" y="40.0" width="104.0" height="70.0" rx="8" class="orange" stroke-width="1.3"/>
  <text x="652.0" y="75.0" class="tx" font-size="8.6" text-anchor="middle" dominant-baseline="middle"><tspan x="652.0" dy="-10.7">read what people wrote</tspan><tspan x="652.0" dy="10.7">PRs, roadmap issues</tspan><tspan x="652.0" dy="10.7">blogs, file headers</tspan></text>
  <rect x="20.0" y="136.0" width="680.0" height="44.0" rx="8" class="bx" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="360.0" y="158.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">checking: check_code.py reruns every script on a clone and re-cuts the quoted code by its title, line by line — change the REF and the numbers update</text>
  <text x="360.0" y="206.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">pitfalls: a tag may not be on main; --diff-filter=A misses a renamed file (use -M / --follow); a PR's number and its merge can be months apart</text>
  <text x="360.0" y="228.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">with squash merges the commit count ≈ the PR count; a repository that rebase-merges needs --first-parent</text>
</svg>
