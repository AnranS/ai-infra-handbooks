  <text x="360.0" y="282.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">blue: settled in the first code release and never touched; green: the performance engineering of H2 2024; orange: the method validated repeatedly from 2025</text>
  <text x="360.0" y="300.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">the replaced decisions (rpyc, nonzero allocation, its own jump-forward, vLLM's layers, VerlEngine) are not on the figure</text>
  <text x="360.0" y="318.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">the dependencies: ① holds up every later pool; ③ + ④ mean ⑥ can only be thread-level overlap; ⑦ and ⑩ need ⑤ first; large-scale EP's kernels need ⑧ first</text>
