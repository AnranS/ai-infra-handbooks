  <text x="360.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the first implementation: a request that can jump leaves the batch → its KV goes back into the tree → retokenize → re-admit as a new request (the prefix hits)</text>
  <text x="360.0" y="216.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">#4032 deleted this path from the scheduler in 2025-03; xgrammar provides find_jump_forward_string in C++ and SGLang keeps only the interface</text>
