<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" role="img" aria-label="the three batches and the attention backend: ScheduleBatch in the scheduling layer, ModelWorkerBatch handed across threads to the worker, ForwardBatch prepared on the GPU for one forward pass; the backend sees only ForwardBatch">
  <text x="120.0" y="24.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">the scheduler (managers/scheduler.py)</text>
  <text x="360.0" y="24.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">TpModelWorker（managers/tp_worker.py）</text>
  <text x="600.0" y="24.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">ModelRunner + the attention backend</text>
  <rect x="20.0" y="44.0" width="200.0" height="96.0" rx="8" class="green" stroke-width="1.3"/>
  <text x="120.0" y="62.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ScheduleBatch</text>
  <text x="120.0" y="104.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="120.0" dy="-16.7">reqs: List[Req]</tspan><tspan x="120.0" dy="11.2">the prefix matches, admission / retraction</tspan><tspan x="120.0" dy="11.2">new_token_ratio, the nodes' locks</tspan><tspan x="120.0" dy="11.2">(Python objects on the CPU)</tspan></text>
  <line x1="220.0" y1="92.0" x2="255.0" y2="92.0" class="ln" stroke-width="1.4"/>
  <polygon points="260.0,92.0 253.9,95.4 253.9,88.6" class="ah"/>
  <text x="240.0" y="154.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">① get_model_worker_batch()</text>
  <rect x="260.0" y="44.0" width="200.0" height="96.0" rx="8" class="blue" stroke-width="1.3"/>
  <text x="360.0" y="62.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ModelWorkerBatch</text>
  <text x="360.0" y="104.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" dy="-16.7">input_ids, seq_lens, the slots</tspan><tspan x="360.0" dy="11.2">sampling_info, forward_mode</tspan><tspan x="360.0" dy="11.2">only the fields the worker needs</tspan><tspan x="360.0" dy="11.2">can go into a queue for another thread</tspan></text>
  <line x1="460.0" y1="92.0" x2="495.0" y2="92.0" class="ln" stroke-width="1.4"/>
  <polygon points="500.0,92.0 493.9,95.4 493.9,88.6" class="ah"/>
  <text x="480.0" y="154.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">② ForwardBatch.init_new()</text>
  <rect x="500.0" y="44.0" width="200.0" height="96.0" rx="8" class="purple" stroke-width="1.3"/>
  <text x="600.0" y="62.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ForwardBatch</text>
  <text x="600.0" y="104.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-16.7">GPU tensors: positions, out_cache_loc</tspan><tspan x="600.0" dy="11.2">req_to_token_pool, token_to_kv_pool</tspan><tspan x="600.0" dy="11.2">the attn_backend's metadata</tspan><tspan x="600.0" dy="11.2">(rebuilt for each forward pass)</tspan></text>
  <rect x="500.0" y="170.0" width="200.0" height="70.0" rx="8" class="orange" stroke-width="1.3"/>
  <text x="600.0" y="188.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">AttentionBackend</text>
  <text x="600.0" y="220.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan x="600.0" dy="-10.9">init_forward_metadata(forward_batch)</tspan><tspan x="600.0" dy="10.9">init_*_cuda_graph(...)</tspan><tspan x="600.0" dy="10.9">forward_decode / forward_extend</tspan></text>
  <line x1="600.0" y1="140.0" x2="600.0" y2="165.0" class="ln" stroke-width="1.4"/>
  <polygon points="600.0,170.0 596.6,163.9 603.4,163.9" class="ah"/>
  <text x="360.0" y="200.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" dy="-5.9">overlapped scheduling: the scheduler keeps ScheduleBatch,</tspan><tspan x="360.0" dy="11.8">the forward thread takes ModelWorkerBatch</tspan></text>
  <text x="360.0" y="266.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle"><tspan x="360.0" dy="-5.8">2024-09-29 → 30: #1538 the scheduling code into scheduler.py, #1541 the execution layer stops seeing ScheduleBatch,</tspan><tspan x="360.0" dy="11.5">#1543 InputMetadata → ForwardBatch, #1544 ModelWorkerBatch introduced, #1547 the attention backend directory</tspan></text>
</svg>
