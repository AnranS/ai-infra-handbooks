<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" role="img" aria-label="one decode step of the EAGLEWorker: the draft model runs num_steps steps into a tree, the target model verifies the whole tree in one forward pass, and after the longest path is accepted the draft model extends once; the scheduler sees only "several tokens per step"">
  <rect x="20.0" y="40.0" width="150.0" height="50.0" rx="8" class="green" stroke-width="1.3"/>
  <text x="95.0" y="65.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="95.0" dy="-5.6">Scheduler</tspan><tspan x="95.0" dy="11.2">forward_batch_generation(batch)</tspan></text>
  <line x1="170.0" y1="65.0" x2="210.0" y2="65.0" class="ln" stroke-width="1.4"/>
  <polygon points="215.0,65.0 208.9,68.4 208.9,61.6" class="ah"/>
  <rect x="215.0" y="28.0" width="485.0" height="180.0" rx="10" class="bx" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="457.0" y="44.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EAGLEWorker(TpModelWorker)</text>
  <rect x="230.0" y="62.0" width="130.0" height="48.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="295.0" y="86.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="295.0" dy="-10.9">draft</tspan><tspan x="295.0" dy="10.9">the draft model x num_steps</tspan><tspan x="295.0" dy="10.9">top-k each step → a tree</tspan></text>
  <line x1="360.0" y1="86.0" x2="390.0" y2="86.0" class="ln" stroke-width="1.4"/>
  <polygon points="395.0,86.0 388.9,89.4 388.9,82.6" class="ah"/>
  <rect x="395.0" y="62.0" width="140.0" height="48.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="465.0" y="86.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="465.0" dy="-10.9">verify</tspan><tspan x="465.0" dy="10.9">one target forward pass</tspan><tspan x="465.0" dy="10.9">the tree mask → longest path</tspan></text>
  <line x1="535.0" y1="86.0" x2="565.0" y2="86.0" class="ln" stroke-width="1.4"/>
  <polygon points="570.0,86.0 563.9,89.4 563.9,82.6" class="ah"/>
  <rect x="570.0" y="62.0" width="120.0" height="48.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="630.0" y="86.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="630.0" dy="-10.9">draft extend</tspan><tspan x="630.0" dy="10.9">with the accepted tokens</tspan><tspan x="630.0" dy="10.9">update the draft state</tspan></text>
  <rect x="230.0" y="128.0" width="460.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="460.0" y="143.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">slots: batch x topk x num_steps allocated before drafting; only the accepted path survives</text>
  <rect x="230.0" y="166.0" width="220.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="340.0" y="181.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">the target TpModelWorker + the draft ModelRunner</text>
  <rect x="470.0" y="166.0" width="220.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="580.0" y="181.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">the draft model's own CUDA graphs</text>
  <line x1="215.0" y1="120.0" x2="175.0" y2="120.0" class="ln" stroke-width="1.4"/>
  <polygon points="170.0,120.0 176.1,116.6 176.1,123.4" class="ah"/>
  <text x="192.5" y="132.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">logits, accepted tokens, count</text>
  <text x="360.0" y="234.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">part 1 the draft model (#2640) → part 2 CUDA graphs and DP attention (#2684) → part 3 several tokens per step (#2709) → part 4 the worker (#2150)</text>
  <text x="360.0" y="256.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">the same interface later took MTP / NextN (#3582), n-gram, spec v2 (drafting and verification in the overlap) and 2026's methods: 60+ files</text>
  <text x="360.0" y="278.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">retraction has to free the tree's slots too (#2711); DP attention's gather shape follows the token count, not the request count (#2684)</text>
</svg>
