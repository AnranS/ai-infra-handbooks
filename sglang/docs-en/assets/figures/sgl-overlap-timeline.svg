<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" role="img" aria-label="overlapped scheduling's timeline: the scheduling thread launches batch N without waiting, handles batch N−1's result and forms batch N+1; the tokens not yet sampled in N+1 stand in as negative numbers, resolved on the GPU by the forward thread">
  <text x="60.0" y="60.0" class="tx" font-size="10.5" text-anchor="start" dominant-baseline="middle" font-weight="600">scheduling thread</text>
  <text x="60.0" y="150.0" class="tx" font-size="10.5" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="60.0" dy="-6.5">the forward thread</tspan><tspan x="60.0" dy="13.0">(its CUDA stream)</tspan></text>
  <rect x="150.0" y="44.0" width="95.0" height="32.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="197.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">handle N−1</text>
  <rect x="250.0" y="44.0" width="75.0" height="32.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="287.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">form N+1</text>
  <rect x="330.0" y="44.0" width="65.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="362.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">launch N+1</text>
  <rect x="400.0" y="44.0" width="95.0" height="32.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="447.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">handle N</text>
  <rect x="500.0" y="44.0" width="75.0" height="32.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="537.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">form N+2</text>
  <rect x="580.0" y="44.0" width="65.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="612.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">launch N+2</text>
  <rect x="150.0" y="134.0" width="175.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="237.5" y="150.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">forward N (on the GPU)</text>
  <rect x="330.0" y="134.0" width="245.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="452.5" y="150.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">forward N+1</text>
  <rect x="580.0" y="134.0" width="120.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="640.0" y="150.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">forward N+2 …</text>
  <line x1="395.0" y1="76.0" x2="395.0" y2="129.0" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="395.0,134.0 391.6,127.9 398.4,127.9" class="ah"/>
  <text x="406.0" y="100.0" class="mu" font-size="8.5" text-anchor="start" dominant-baseline="middle">input_queue</text>
  <line x1="325.0" y1="166.0" x2="396.8" y2="79.8" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="400.0,76.0 398.7,82.9 393.5,78.6" class="ah"/>
  <text x="318.0" y="112.0" class="mu" font-size="8.5" text-anchor="end" dominant-baseline="middle">the copy_done event</text>
  <rect x="150.0" y="196.0" width="550.0" height="80.0" rx="8" class="bx" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="425.0" y="214.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">future tokens: batch N's sample is not out when N+1 is formed</text>
  <text x="425.0" y="246.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan x="425.0" dy="-5.6">the scheduling thread writes −(ct+1) … −(ct+bs) into N+1's input_ids; the forward thread fills</tspan><tspan x="425.0" dy="11.2">future_token_ids_map after N, and N+1 resolves with where(ids &lt; 0, map[−ids], ids)</tspan></text>
  <text x="360.0" y="300.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">no gaps on the GPU; everything reading tokens must handle a placeholder (retraction, constrained decoding, logprobs, mixed batches)</text>
</svg>
