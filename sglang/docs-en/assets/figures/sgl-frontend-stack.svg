<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" role="img" aria-label="the frontend's four layers: the program → the IR → the executor → the backend; the tracer extracts the constant prefix and the compiler executes the traced graph in dependency order">
  <rect x="30.0" y="30.0" width="470.0" height="52.0" rx="8" class="green" stroke-width="1.2"/>
  <text x="265.0" y="46.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">the program</text>
  <text x="265.0" y="67.0" class="tx" font-size="9.3" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan x="265.0" dy="-5.8">@sgl.function</tspan><tspan x="265.0" dy="11.5">s += system(...) + gen("a") ; s.fork(2) ; select(choices)</tspan></text>
  <line x1="265.0" y1="82.0" x2="265.0" y2="90.0" class="ln" stroke-width="1.4"/>
  <polygon points="265.0,95.0 261.6,88.9 268.4,88.9" class="ah"/>
  <rect x="30.0" y="95.0" width="470.0" height="52.0" rx="8" class="blue" stroke-width="1.2"/>
  <text x="265.0" y="111.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">IR（lang/ir.py）</text>
  <text x="265.0" y="132.0" class="tx" font-size="9.3" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">SglExprList：Constant、Gen、Select、Image、RoleBegin/End、Fork、Variable</text>
  <line x1="265.0" y1="147.0" x2="265.0" y2="155.0" class="ln" stroke-width="1.4"/>
  <polygon points="265.0,160.0 261.6,153.9 268.4,153.9" class="ah"/>
  <rect x="30.0" y="160.0" width="470.0" height="52.0" rx="8" class="purple" stroke-width="1.2"/>
  <text x="265.0" y="176.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">the executor (lang/interpreter.py)</text>
  <text x="265.0" y="197.0" class="tx" font-size="9.3" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">StreamExecutor: a background thread and queue; an Event per variable</text>
  <line x1="265.0" y1="212.0" x2="265.0" y2="220.0" class="ln" stroke-width="1.4"/>
  <polygon points="265.0,225.0 261.6,218.9 268.4,218.9" class="ah"/>
  <rect x="30.0" y="225.0" width="470.0" height="62.0" rx="8" class="orange" stroke-width="1.2"/>
  <text x="265.0" y="241.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">the backend (backend/runtime_endpoint.py)</text>
  <text x="265.0" y="267.0" class="tx" font-size="9.3" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan x="265.0" dy="-5.8">/generate: max_new_tokens=0 to warm up, normalized_logprob to score</tspan><tspan x="265.0" dy="11.5">/concate_and_append_request: a branch's KV spliced back into the trunk</tspan></text>
  <rect x="30.0" y="292.0" width="470.0" height="16.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="265.0" y="300.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">SRT: three kinds of process + RadixCache (chapter 2)</text>
  <rect x="530.0" y="30.0" width="170.0" height="110.0" rx="8" class="bx" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="615.0" y="48.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">the tracer (lang/tracer.py)</text>
  <text x="615.0" y="92.0" class="tx" font-size="9.3" text-anchor="middle" dominant-baseline="middle"><tspan x="615.0" dy="-17.3">run with dummy arguments</tspan><tspan x="615.0" dy="11.5">→ a chain of primitives</tspan><tspan x="615.0" dy="11.5">→ the constant head = the prefix</tspan><tspan x="615.0" dy="11.5">→ pin_program warms the cache</tspan></text>
  <rect x="530.0" y="160.0" width="170.0" height="90.0" rx="8" class="bx" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="615.0" y="178.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">the compiler (lang/compiler.py)</text>
  <text x="615.0" y="216.0" class="tx" font-size="9.3" text-anchor="middle" dominant-baseline="middle"><tspan x="615.0" dy="-11.5">the traced graph</tspan><tspan x="615.0" dy="11.5">→ topologically sorted</tspan><tspan x="615.0" dy="11.5">→ one executor per forked branch</tspan></text>
  <line x1="500.0" y1="56.0" x2="525.0" y2="56.0" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="530.0,56.0 523.9,59.4 523.9,52.6" class="ah"/>
  <line x1="530.0" y1="205.0" x2="504.2" y2="188.7" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="500.0,186.0 507.0,186.4 503.4,192.1" class="ah"/>
</svg>
