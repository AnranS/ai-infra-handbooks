<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" role="img" aria-label="incremental detokenizing: everything before surr_offset is confirmed, [surr_offset, read_offset) is the surrounding tokens decoded alongside, and after read_offset are the new tokens">
