<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" role="img" aria-label="one step of the first version's scheduling: try to form a new extend batch, and failing that run 10 decode steps in a row on the running batch; admission rests on estimating the future demand">
  <rect x="20.0" y="30.0" width="120.0" height="44.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="52.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-6.2">new requests</tspan><tspan x="80.0" dy="12.4">→ forward_queue</tspan></text>
  <line x1="140.0" y1="52.0" x2="180.0" y2="52.0" class="ln" stroke-width="1.4"/>
  <polygon points="185.0,52.0 178.9,55.4 178.9,48.6" class="ah"/>
  <rect x="185.0" y="24.0" width="180.0" height="56.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="275.0" y="52.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="275.0" dy="-12.4">get_new_fill_batch</tspan><tspan x="275.0" dy="12.4">match the prefix → sort by the policy</tspan><tspan x="275.0" dy="12.4">→ admit one by one</tspan></text>
  <line x1="365.0" y1="52.0" x2="410.0" y2="52.0" class="ln" stroke-width="1.4"/>
  <polygon points="415.0,52.0 408.9,55.4 408.9,48.6" class="ah"/>
  <text x="390.0" y="43.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">formed</text>
  <rect x="415.0" y="30.0" width="140.0" height="44.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="485.0" y="52.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="485.0" dy="-6.2">forward_fill_batch</tspan><tspan x="485.0" dy="12.4">EXTEND forward + sampling</tspan></text>
  <line x1="555.0" y1="52.0" x2="590.0" y2="52.0" class="ln" stroke-width="1.4"/>
  <polygon points="595.0,52.0 588.9,55.4 588.9,48.6" class="ah"/>
  <rect x="595.0" y="30.0" width="105.0" height="44.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="647.5" y="52.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="647.5" dy="-6.2">merged into</tspan><tspan x="647.5" dy="12.4">running_batch</tspan></text>
  <line x1="275.0" y1="80.0" x2="275.0" y2="113.0" class="ln" stroke-width="1.4"/>
  <polygon points="275.0,118.0 271.6,111.9 278.4,111.9" class="ah"/>
  <text x="313.0" y="99.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">none</text>
  <rect x="185.0" y="118.0" width="180.0" height="44.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="275.0" y="140.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="275.0" dy="-6.2">forward_decode_batch x 10</tspan><tspan x="275.0" dy="12.4">one token per step</tspan></text>
  <line x1="365.0" y1="140.0" x2="410.0" y2="140.0" class="ln" stroke-width="1.4"/>
  <polygon points="415.0,140.0 408.9,143.4 408.9,136.6" class="ah"/>
  <rect x="415.0" y="118.0" width="140.0" height="44.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="485.0" y="140.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="485.0" dy="-12.4">handle_finished_requests</tspan><tspan x="485.0" dy="12.4">insert into the tree,</tspan><tspan x="485.0" dy="12.4">free the slots</tspan></text>
  <line x1="555.0" y1="140.0" x2="590.0" y2="140.0" class="ln" stroke-width="1.4"/>
  <polygon points="595.0,140.0 588.9,143.4 588.9,136.6" class="ah"/>
  <rect x="595.0" y="118.0" width="105.0" height="44.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="647.5" y="140.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="647.5" dy="-6.2">sent to</tspan><tspan x="647.5" dy="12.4">the detokenizer</tspan></text>
  <rect x="20.0" y="190.0" width="680.0" height="70.0" rx="9" class="bx" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="360.0" y="207.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">the admission test (model_rpc.py 236–285)</text>
  <text x="360.0" y="228.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">free slots + the tree's evictable tokens − Σ (remaining max_new_tokens x 0.4) = the space available</text>
  <text x="360.0" y="248.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">a request is admitted only if its new tokens plus max_new_tokens fit; the nodes that hit are locked, and it unlocks and gives up if it no longer fits</text>
</svg>
