<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" role="img" aria-label="a request's path under PD disaggregation: the load balancer assigns a bootstrap room and sends to both sides; the decode side handshakes and pre-allocates the KV; prefill sends each chunk by a one-sided RDMA write as it is computed; and once it arrives the decode side does a prebuilt extend into the ordinary loop">
  <rect x="20.0" y="30.0" width="110.0" height="40.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="75.0" y="50.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">client</text>
  <line x1="130.0" y1="50.0" x2="175.0" y2="50.0" class="ln" stroke-width="1.4"/>
  <polygon points="180.0,50.0 173.9,53.4 173.9,46.6" class="ah"/>
  <rect x="180.0" y="30.0" width="150.0" height="40.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="255.0" y="50.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="255.0" dy="-5.5">the load balancer</tspan><tspan x="255.0" dy="10.9">picks a P/D pair, assigns a room id</tspan></text>
  <path d="M 255.0 70.0 L 255.0 100.0 L 130.0 100.0 L 130.0 120.0" class="ln" stroke-width="1.4"/>
  <polygon points="130.0,120.0 126.6,113.9 133.4,113.9" class="ah"/>
  <path d="M 305.0 70.0 L 305.0 100.0 L 560.0 100.0 L 560.0 120.0" class="ln" stroke-width="1.4"/>
  <polygon points="560.0,120.0 556.6,113.9 563.4,113.9" class="ah"/>
  <rect x="20.0" y="120.0" width="300.0" height="130.0" rx="9" class="blue" stroke-width="1.3"/>
  <text x="170.0" y="138.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">the prefill server (prefill.py)</text>
  <rect x="35.0" y="152.0" width="270.0" height="26.0" rx="5" class="bx" stroke-width="1.3"/>
  <text x="170.0" y="165.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">PrefillBootstrapQueue: waiting for the decode side's handshake</text>
  <rect x="35.0" y="184.0" width="270.0" height="26.0" rx="5" class="bx" stroke-width="1.3"/>
  <text x="170.0" y="197.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">ordinary scheduling: each chunk computed → send_kv_chunk</text>
  <rect x="35.0" y="216.0" width="270.0" height="26.0" rx="5" class="bx" stroke-width="1.3"/>
  <text x="170.0" y="229.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">the inflight queue: the KV is freed when the transfer completes</text>
  <rect x="400.0" y="120.0" width="300.0" height="130.0" rx="9" class="green" stroke-width="1.3"/>
  <text x="550.0" y="138.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">the decode server (decode.py)</text>
  <rect x="415.0" y="152.0" width="270.0" height="26.0" rx="5" class="bx" stroke-width="1.3"/>
  <text x="550.0" y="165.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">DecodePreallocQueue: handshake, pre-allocate KV, send addresses</text>
  <rect x="415.0" y="184.0" width="270.0" height="26.0" rx="5" class="bx" stroke-width="1.3"/>
  <text x="550.0" y="197.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">DecodeTransferQueue: poll the receiver until the transfer is done</text>
  <rect x="415.0" y="216.0" width="270.0" height="26.0" rx="5" class="bx" stroke-width="1.3"/>
  <text x="550.0" y="229.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">a prebuilt extend → the ordinary decode loop</text>
  <line x1="320.0" y1="197.0" x2="395.0" y2="197.0" class="ln" stroke-width="1.4"/>
  <polygon points="400.0,197.0 393.9,200.4 393.9,193.6" class="ah"/>
  <text x="360.0" y="188.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">an RDMA write</text>
  <line x1="400.0" y1="165.0" x2="325.0" y2="165.0" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="320.0,165.0 326.1,161.6 326.1,168.4" class="ah"/>
  <text x="360.0" y="156.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">the handshake</text>
  <text x="360.0" y="213.0" class="mu" font-size="8" text-anchor="middle" dominant-baseline="middle">Mooncake / NIXL</text>
  <text x="360.0" y="274.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">the transfer interface base/conn.py: BaseKVManager / BaseKVSender (init, send, poll) / BaseKVReceiver (init, poll) / BaseKVBootstrapServer — one subdirectory per backend</text>
  <text x="360.0" y="294.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">#4654 (2025-03-21) 1410 lines → #4880 Mooncake → #5328 the backend abstraction → #5477 NIXL → #5608/#5609 overlap → #5435 DP attention + DeepEP</text>
  <text x="360.0" y="312.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">the blog's (05-05) three motives: prefill interrupting decode, DP attention's imbalance, DeepEP's two modes not coexisting</text>
</svg>
