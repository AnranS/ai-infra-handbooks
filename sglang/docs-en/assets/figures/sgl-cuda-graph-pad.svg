  <text x="280.0" y="73.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">16</text>
  <rect x="310.0" y="60.0" width="48.0" height="26.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="334.0" y="73.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">24</text>
  <rect x="364.0" y="60.0" width="48.0" height="26.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="388.0" y="73.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">32</text>
  <rect x="418.0" y="60.0" width="48.0" height="26.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="442.0" y="73.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">40</text>
