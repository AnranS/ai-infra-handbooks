<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" role="img" aria-label="replaying a CUDA graph: one graph per batch size in a fixed list at startup, the actual batch rounded up to the nearest, the extra slots padded with dummy requests and truncated after the replay">
  <text x="360.0" y="30.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">the captured batch sizes (v0.2.0: [1, 2, 4] + [8, 16, …, 128])</text>
