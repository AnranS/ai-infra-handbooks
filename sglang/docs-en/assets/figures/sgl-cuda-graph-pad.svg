  <rect x="424.0" y="130.0" width="24.0" height="24.0" rx="4" class="bx" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="452.0" y="130.0" width="24.0" height="24.0" rx="4" class="bx" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="480.0" y="130.0" width="24.0" height="24.0" rx="4" class="bx" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="518.0" y="142.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">← 3 dummy requests: seq_len=1, loc=0</text>
  <line x1="360.0" y1="160.0" x2="360.0" y2="175.0" class="ln" stroke-width="1.4"/>
  <polygon points="360.0,180.0 356.6,173.9 363.4,173.9" class="ah"/>
  <text x="360.0" y="194.0" class="tx" font-size="9.8" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">13 requests' ids / lens / out_cache_loc into the first 13 slots → graphs[16].replay() → output truncated to 13 rows</text>
  <text x="360.0" y="226.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">fixed buffers plus a shared graph memory pool: every graph shares one set of addresses, and a decode step goes from thousands of launches to one replay</text>
</svg>
