  <text x="550.0" y="73.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">56</text>
  <rect x="580.0" y="60.0" width="48.0" height="26.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="604.0" y="73.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">64</text>
