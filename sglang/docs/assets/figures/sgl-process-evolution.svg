  <text x="360.0" y="280.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">贯穿三个阶段的决定：调度与前向在同一进程；分词 → 调度 → 反分词 → 分词的 ZMQ 环；每个 TP rank 重复执行同一份调度、只广播输入</text>
  <text x="360.0" y="300.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">变化的是分发：rpyc 远程调用 → 控制进程内直接调用 + gloo 广播 → 对等的调度器进程 + DP 控制器（2025 年再加上流水线并行的 PP × TP）</text>
</svg>
