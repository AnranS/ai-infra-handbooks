  <text x="600.0" y="107.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">DP 控制器（dp_size &gt; 1 时）</text>
  <rect x="490.0" y="140.0" width="105.0" height="52.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="542.5" y="166.0" class="tx" font-size="8.6" text-anchor="middle" dominant-baseline="middle"><tspan x="542.5" dy="-10.7">Scheduler 进程 rank 0</tspan><tspan x="542.5" dy="10.7">event_loop_overlap</tspan><tspan x="542.5" dy="10.7">TpModelWorker</tspan></text>
  <line x1="543.0" y1="122.0" x2="543.0" y2="135.0" class="ln" stroke-width="1.4"/>
  <polygon points="543.0,140.0 539.6,133.9 546.4,133.9" class="ah"/>
