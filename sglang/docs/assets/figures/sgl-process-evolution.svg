  <rect x="490.0" y="226.0" width="220.0" height="28.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="600.0" y="240.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">反分词进程</text>
  <line x1="600.0" y1="192.0" x2="600.0" y2="221.0" class="ln" stroke-width="1.4"/>
