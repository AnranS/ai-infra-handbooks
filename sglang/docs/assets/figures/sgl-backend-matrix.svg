  <text x="360.0" y="210.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">2024-09 两个后端（FlashInfer、Triton）→ 2025-03 FA3、FlashMLA、页大小 &gt; 1 → 2025-08 v0.5.0rc0 十几个 → 2026-10 三十多个后端文件；layers/attention/ 139 个文件</text>
  <text x="360.0" y="232.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">接口的生长：CUDA Graph 的捕获 / 回放元数据（2024-09）→ 投机解码的 draft / verify 元数据 → forward_mixed → 共享前缀读 → 可分段的图捕获 → 稀疏索引元数据</text>
  <text x="360.0" y="262.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">页大小：初版每页 1 个 token（树可任意切分）；#4356（2025-03-12）新分配器 + 页对齐的树，随后每个功能逐一适配（PD、FA3、EAGLE、撤回、HiCache）</text>
  <text x="360.0" y="284.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">多硬件：2024-09 第一个 AMD 提交 → 散落的 is_hip() 分支 → hardware_backend/（95 个文件）与 platforms/ 集中平台逻辑</text>
</svg>
