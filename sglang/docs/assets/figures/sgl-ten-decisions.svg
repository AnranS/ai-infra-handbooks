  <text x="590.0" y="197.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">⑩ worker / mixin 不碰主干 (#2150/#4654)</text>
  <text x="360.0" y="282.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">蓝：初始提交就定下、没动过；绿：2024 下半年的性能工程期；橙：2025 年起反复验证的方法论</text>
  <text x="360.0" y="300.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">被换掉的决定（rpyc、nonzero 分配、自研 jump-forward、vLLM 层、VerlEngine）不在图上</text>
  <text x="360.0" y="318.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">依赖：① 撑起后来的所有池；③ + ④ 决定了 ⑥ 只能靠线程级重叠；⑤ 之后才有 ⑦ 和 ⑩；⑧ 之后才有大规模 EP 的 kernel 归宿</text>
</svg>
