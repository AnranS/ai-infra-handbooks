<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" role="img" aria-label="EAGLEWorker 的一步 decode：草稿模型跑 num_steps 步展开成树，目标模型一次前向验证整棵树，接受最长路径后草稿模型再 extend 一次；调度器只看到“一步返回多个 token”">
  <rect x="20.0" y="40.0" width="150.0" height="50.0" rx="8" class="green" stroke-width="1.3"/>
  <text x="95.0" y="65.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="95.0" dy="-5.6">Scheduler</tspan><tspan x="95.0" dy="11.2">forward_batch_generation(batch)</tspan></text>
  <line x1="170.0" y1="65.0" x2="210.0" y2="65.0" class="ln" stroke-width="1.4"/>
  <polygon points="215.0,65.0 208.9,68.4 208.9,61.6" class="ah"/>
  <rect x="215.0" y="28.0" width="485.0" height="180.0" rx="10" class="bx" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="457.0" y="44.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EAGLEWorker(TpModelWorker)</text>
  <rect x="230.0" y="62.0" width="130.0" height="48.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="295.0" y="86.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="295.0" dy="-10.9">draft</tspan><tspan x="295.0" dy="10.9">草稿模型 × num_steps</tspan><tspan x="295.0" dy="10.9">每步 top-k → 树</tspan></text>
  <line x1="360.0" y1="86.0" x2="390.0" y2="86.0" class="ln" stroke-width="1.4"/>
  <polygon points="395.0,86.0 388.9,89.4 388.9,82.6" class="ah"/>
  <rect x="395.0" y="62.0" width="140.0" height="48.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="465.0" y="86.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="465.0" dy="-10.9">verify</tspan><tspan x="465.0" dy="10.9">目标模型一次前向</tspan><tspan x="465.0" dy="10.9">树形掩码、取最长接受路径</tspan></text>
  <line x1="535.0" y1="86.0" x2="565.0" y2="86.0" class="ln" stroke-width="1.4"/>
  <polygon points="570.0,86.0 563.9,89.4 563.9,82.6" class="ah"/>
  <rect x="570.0" y="62.0" width="120.0" height="48.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="630.0" y="86.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="630.0" dy="-10.9">draft extend</tspan><tspan x="630.0" dy="10.9">用接受的 token</tspan><tspan x="630.0" dy="10.9">更新草稿模型状态</tspan></text>
  <rect x="230.0" y="128.0" width="460.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="460.0" y="143.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">槽位：草稿前一次申请 batch × topk × num_steps 个并备份分配器状态，验证后只保留接受路径、其余回滚</text>
  <rect x="230.0" y="166.0" width="220.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="340.0" y="181.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">目标 TpModelWorker + 草稿 ModelRunner</text>
  <rect x="470.0" y="166.0" width="220.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="580.0" y="181.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle">草稿模型自己的 CUDA Graph</text>
  <line x1="215.0" y1="120.0" x2="175.0" y2="120.0" class="ln" stroke-width="1.4"/>
  <polygon points="170.0,120.0 176.1,116.6 176.1,123.4" class="ah"/>
  <text x="192.5" y="132.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">logits、接受的 token、接受数</text>
  <text x="360.0" y="234.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">part 1 草稿模型文件（#2640）→ part 2 修 CUDA Graph 与 DP attention（#2684）→ part 3 调度器处理“一步多 token”（#2709）→ part 4 worker（#2150，2025-01-02）</text>
  <text x="360.0" y="256.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">同一接口后来接入 MTP / NextN（#3582）、n-gram、spec v2（草稿与验证纳入重叠调度）以及 2026 年的新方法：speculative/ 下 60 多个文件</text>
  <text x="360.0" y="278.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">撤回要连树上的槽位一起释放（#2711）；DP attention 的 gather 形状要按 token 数而不是请求数（#2684）</text>
</svg>
