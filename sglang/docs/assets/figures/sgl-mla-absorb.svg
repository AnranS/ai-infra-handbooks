<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" role="img" aria-label="MLA decode 的两条路径：解压路径把每个历史 token 的潜向量还原成 K、V；吸收路径把解压矩阵挪到 query 与输出两侧，注意力直接在潜空间算">
  <text x="180.0" y="24.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">解压路径（prefill 常用）</text>
  <rect x="30.0" y="44.0" width="130.0" height="34.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="95.0" y="61.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="95.0" dy="-5.6">历史 L 个潜向量</tspan><tspan x="95.0" dy="11.2">[L, 512 + 64]</tspan></text>
  <line x1="160.0" y1="61.0" x2="195.0" y2="61.0" class="ln" stroke-width="1.4"/>
  <polygon points="200.0,61.0 193.9,64.4 193.9,57.6" class="ah"/>
  <text x="180.0" y="51.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">× W_UK, W_UV</text>
  <rect x="200.0" y="36.0" width="130.0" height="50.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="265.0" y="61.0" class="tx" font-size="8.6" text-anchor="middle" dominant-baseline="middle"><tspan x="265.0" dy="-10.7">还原 K、V</tspan><tspan x="265.0" dy="10.7">[L, 128 头, 128]</tspan><tspan x="265.0" dy="10.7">每 token 128×512×128 乘加</tspan></text>
  <line x1="265.0" y1="86.0" x2="265.0" y2="107.0" class="ln" stroke-width="1.4"/>
  <polygon points="265.0,112.0 261.6,105.9 268.4,105.9" class="ah"/>
  <rect x="200.0" y="112.0" width="130.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="265.0" y="129.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="265.0" dy="-5.6">普通多头注意力</tspan><tspan x="265.0" dy="11.2">q [128 头, 128]</tspan></text>
  <text x="180.0" y="170.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">代价 ∝ 历史长度 L</text>
  <text x="540.0" y="24.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">吸收路径（decode）</text>
  <rect x="400.0" y="44.0" width="120.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="460.0" y="61.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="460.0" dy="-5.6">q_nope</tspan><tspan x="460.0" dy="11.2">[128 头, 128]</tspan></text>
  <line x1="520.0" y1="61.0" x2="555.0" y2="61.0" class="ln" stroke-width="1.4"/>
  <polygon points="560.0,61.0 553.9,64.4 553.9,57.6" class="ah"/>
  <text x="540.0" y="51.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">× w_kc（bmm）</text>
  <rect x="560.0" y="44.0" width="130.0" height="34.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="625.0" y="61.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="625.0" dy="-5.6">潜空间的 q</tspan><tspan x="625.0" dy="11.2">[128 头, 512]</tspan></text>
  <line x1="625.0" y1="78.0" x2="625.0" y2="99.0" class="ln" stroke-width="1.4"/>
  <polygon points="625.0,104.0 621.6,97.9 628.4,97.9" class="ah"/>
  <rect x="560.0" y="104.0" width="130.0" height="34.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="625.0" y="121.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="625.0" dy="-5.5">对 L 个潜向量做注意力</tspan><tspan x="625.0" dy="10.9">（相当于 MQA）</tspan></text>
  <line x1="625.0" y1="138.0" x2="625.0" y2="159.0" class="ln" stroke-width="1.4"/>
  <polygon points="625.0,164.0 621.6,157.9 628.4,157.9" class="ah"/>
  <rect x="560.0" y="164.0" width="130.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="625.0" y="181.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="625.0" dy="-5.5">× w_vc（bmm）→ 输出</tspan><tspan x="625.0" dy="10.9">[128 头, 128]</tspan></text>
  <text x="540.0" y="222.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">变换 query 的代价与 L 无关；历史只存潜向量，KV 缓存只有 576 维</text>
  <text x="360.0" y="252.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">#905（2024-08-05）：MLATokenToKVPool + 支持 kv_lora_rank 的 Triton kernel + 加载时拆出 w_kc / w_vc；#1138 分组 decode kernel；#1285 FP8 bmm</text>
</svg>
