  <text x="360.0" y="168.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">read_text = decode(ids[5:]) → " of France is"     surr_text = decode(ids[5:7]) → " of"</text>
  <text x="360.0" y="190.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">new_text = read_text[len(surr_text):] → " France is"   不以 � 结尾才确认：surr_offset ← 7，read_offset ← 9</text>
  <text x="360.0" y="226.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">每步只 decode 窗口里的几个 token，开销与已生成长度无关；周围 token 让空格和多字节字符的边界和整体 decode 一致（#517，2024-06-12）</text>
</svg>
