  <text x="360.0" y="158.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">核对：check_code.py 在克隆上重跑每个脚本、按 title="路径 @ 提交 L起-止" 重新截取引用的代码，逐行比对——换一个 REF，数字更新；换一个仓库，方法不变</text>
