<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" role="img" aria-label="重叠调度的时间线：调度线程发射第 N 批后不等结果，先处理第 N−1 批的结果、再组第 N+1 批；第 N+1 批里还没采样出的 token 用负数占位，前向线程在 GPU 上解析">
  <text x="60.0" y="60.0" class="tx" font-size="10.5" text-anchor="start" dominant-baseline="middle" font-weight="600">调度线程</text>
  <text x="60.0" y="150.0" class="tx" font-size="10.5" text-anchor="start" dominant-baseline="middle" font-weight="600"><tspan x="60.0" dy="-6.5">前向线程</tspan><tspan x="60.0" dy="13.0">（GPU 流）</tspan></text>
  <rect x="150.0" y="44.0" width="95.0" height="32.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="197.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">处理 N−1 结果</text>
  <rect x="250.0" y="44.0" width="75.0" height="32.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="287.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">组 N+1</text>
  <rect x="330.0" y="44.0" width="65.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="362.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">发射 N+1</text>
  <rect x="400.0" y="44.0" width="95.0" height="32.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="447.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">处理 N 结果</text>
  <rect x="500.0" y="44.0" width="75.0" height="32.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="537.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">组 N+2</text>
  <rect x="580.0" y="44.0" width="65.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="612.5" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">发射 N+2</text>
  <rect x="150.0" y="134.0" width="175.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="237.5" y="150.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">前向 N（GPU 计算）</text>
  <rect x="330.0" y="134.0" width="245.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="452.5" y="150.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">前向 N+1</text>
  <rect x="580.0" y="134.0" width="120.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="640.0" y="150.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">前向 N+2 …</text>
  <line x1="395.0" y1="76.0" x2="395.0" y2="129.0" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="395.0,134.0 391.6,127.9 398.4,127.9" class="ah"/>
  <text x="406.0" y="100.0" class="mu" font-size="8.5" text-anchor="start" dominant-baseline="middle">input_queue</text>
  <line x1="325.0" y1="166.0" x2="396.8" y2="79.8" class="ln" stroke-width="1.4" stroke-dasharray="3 2"/>
  <polygon points="400.0,76.0 398.7,82.9 393.5,78.6" class="ah"/>
  <text x="318.0" y="112.0" class="mu" font-size="8.5" text-anchor="end" dominant-baseline="middle">copy_done 事件</text>
  <rect x="150.0" y="196.0" width="550.0" height="80.0" rx="8" class="bx" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="425.0" y="214.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">未来 token：组 N+1 时第 N 批的采样结果还没出来</text>
  <text x="425.0" y="246.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan x="425.0" dy="-5.6">调度线程把 −(ct+1) … −(ct+bs) 写进 N+1 的 input_ids；前向线程算完 N 把真实 token 写进 future_token_ids_map，</tspan><tspan x="425.0" dy="11.2">前向 N+1 之前用 where(ids &lt; 0, map[−ids], ids) 替换</tspan></text>
  <text x="360.0" y="300.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">GPU 在整个过程中没有空隙；代价是所有读 token 的逻辑都要能处理占位符（撤回、约束解码、logprob、混批各修了一遍）</text>
</svg>
