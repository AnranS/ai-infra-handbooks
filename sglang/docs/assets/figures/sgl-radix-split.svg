<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" role="img" aria-label="匹配到边的中间：修复前继续往下递归，把别的上下文的 KV 当成命中；修复后在分叉点分裂并停止">
