  <text x="160.0" y="256.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">分叉在边中间，却递归进了孩子：world 的 KV 来自另一条序列</text>
  <text x="520.0" y="30.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">修复后（#7，2024-01-16）</text>
