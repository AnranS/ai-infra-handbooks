<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" role="img" aria-label="大规模 EP 的两套配置：prefill 用 normal dispatch + contiguous GEMM + 大 batch，decode 用 low-latency dispatch + masked GEMM + CUDA Graph；TBO 让两个 micro-batch 的通信与计算交错；EPLB 用冗余专家平衡负载">
  <rect x="20.0" y="36.0" width="330.0" height="118.0" rx="9" class="blue" stroke-width="1.3"/>
  <text x="185.0" y="54.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">prefill（博客：4 节点，EP32）</text>
  <text x="185.0" y="104.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="185.0" dy="-16.7">DeepEP normal dispatch：按实际 token 数 all-to-all，动态形状</tspan><tspan x="185.0" dy="11.2">DeepGEMM contiguous：Triton permute 后的连续布局</tspan><tspan x="185.0" dy="11.2">每卡 16384 token 的大 batch；不能进 CUDA Graph</tspan><tspan x="185.0" dy="11.2">先提交 GPU 计算、再做阻塞 CPU 的 dispatch</tspan></text>
  <rect x="370.0" y="36.0" width="330.0" height="118.0" rx="9" class="green" stroke-width="1.3"/>
  <text x="535.0" y="54.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-weight="600">decode（博客：9 节点，EP72）</text>
  <text x="535.0" y="104.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="535.0" dy="-16.7">DeepEP low-latency：固定大小的 RDMA 缓冲区</tspan><tspan x="535.0" dy="11.2">DeepGEMM masked：固定形状 + 掩码</tspan><tspan x="535.0" dy="11.2">每卡 128–256 序列；CUDA Graph 回放</tspan><tspan x="535.0" dy="11.2">DeepEPMode.AUTO 按角色选模式（PD 分离是前提）</tspan></text>
  <rect x="20.0" y="172.0" width="330.0" height="58.0" rx="8" class="orange" stroke-width="1.3"/>
  <text x="185.0" y="188.0" class="tx" font-size="9.8" text-anchor="middle" dominant-baseline="middle" font-weight="600">TBO 双 batch 重叠（two_batch_overlap.py，#4068）</text>
  <text x="185.0" y="212.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="185.0" dy="-5.5">batch 切两半；A 算 attention / MLP 时 B 做 dispatch / combine</tspan><tspan x="185.0" dy="10.9">prefill +27–35%，decode +25.5%；峰值显存减半</tspan></text>
  <rect x="370.0" y="172.0" width="330.0" height="58.0" rx="8" class="purple" stroke-width="1.3"/>
  <text x="535.0" y="188.0" class="tx" font-size="9.8" text-anchor="middle" dominant-baseline="middle" font-weight="600">EPLB 专家负载均衡（eplb/，#6387 → #6469）</text>
  <text x="535.0" y="212.0" class="tx" font-size="8.8" text-anchor="middle" dominant-baseline="middle"><tspan x="535.0" dy="-5.5">统计每个专家的 token 数 → 冗余专家（256 → 288）→ 重排映射</tspan><tspan x="535.0" dy="10.9">静态一次 / 动态周期重平衡；prefill 1.49×、decode 2.54×</tspan></text>
  <text x="360.0" y="256.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">2025-05-05 博客：96 张 H100 上的 DeepSeek-V3，每节点每秒 52.3k 输入 / 22.3k 输出 token，输出 $0.20 / 百万 token，比纯 TP 快最多 5 倍</text>
  <text x="360.0" y="278.0" class="mu" font-size="9.3" text-anchor="middle" dominant-baseline="middle">三个库都来自 DeepSeek 开源周（DeepEP、DeepGEMM、EPLB 算法），SGLang 做的是调度与集成：三个月从 EP 支持（#3602）到博客</text>
</svg>
