  <text x="360.0" y="216.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">2025-03 #4032 删掉了调度器里的这条路径；xgrammar 等语法库在 C++ 里提供 find_jump_forward_string，SGLang 只保留接口</text>
