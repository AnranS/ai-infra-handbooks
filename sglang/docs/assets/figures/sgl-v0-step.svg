<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" role="img" aria-label="初版调度的一步：先尝试组一个新的 extend batch，组不出来就对运行中的 batch 连做 10 步 decode；准入靠预估未来需求">
  <rect x="20.0" y="30.0" width="120.0" height="44.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="52.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-6.2">收到的新请求</tspan><tspan x="80.0" dy="12.4">→ forward_queue</tspan></text>
  <line x1="140.0" y1="52.0" x2="180.0" y2="52.0" class="ln" stroke-width="1.4"/>
  <polygon points="185.0,52.0 178.9,55.4 178.9,48.6" class="ah"/>
  <rect x="185.0" y="24.0" width="180.0" height="56.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="275.0" y="52.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="275.0" dy="-12.4">get_new_fill_batch</tspan><tspan x="275.0" dy="12.4">前缀匹配 → 按策略排序</tspan><tspan x="275.0" dy="12.4">→ 逐个判断能否接纳</tspan></text>
  <line x1="365.0" y1="52.0" x2="410.0" y2="52.0" class="ln" stroke-width="1.4"/>
  <polygon points="415.0,52.0 408.9,55.4 408.9,48.6" class="ah"/>
  <text x="390.0" y="43.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">组出来了</text>
  <rect x="415.0" y="30.0" width="140.0" height="44.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="485.0" y="52.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="485.0" dy="-6.2">forward_fill_batch</tspan><tspan x="485.0" dy="12.4">EXTEND 前向 + 采样</tspan></text>
  <line x1="555.0" y1="52.0" x2="590.0" y2="52.0" class="ln" stroke-width="1.4"/>
  <polygon points="595.0,52.0 588.9,55.4 588.9,48.6" class="ah"/>
  <rect x="595.0" y="30.0" width="105.0" height="44.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="647.5" y="52.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="647.5" dy="-6.2">并入</tspan><tspan x="647.5" dy="12.4">running_batch</tspan></text>
  <line x1="275.0" y1="80.0" x2="275.0" y2="113.0" class="ln" stroke-width="1.4"/>
  <polygon points="275.0,118.0 271.6,111.9 278.4,111.9" class="ah"/>
  <text x="313.0" y="99.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">组不出来</text>
  <rect x="185.0" y="118.0" width="180.0" height="44.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="275.0" y="140.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="275.0" dy="-6.2">forward_decode_batch × 10</tspan><tspan x="275.0" dy="12.4">每步一个 token</tspan></text>
  <line x1="365.0" y1="140.0" x2="410.0" y2="140.0" class="ln" stroke-width="1.4"/>
  <polygon points="415.0,140.0 408.9,143.4 408.9,136.6" class="ah"/>
  <rect x="415.0" y="118.0" width="140.0" height="44.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="485.0" y="140.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="485.0" dy="-6.2">handle_finished_requests</tspan><tspan x="485.0" dy="12.4">插回树、释放槽位</tspan></text>
  <line x1="555.0" y1="140.0" x2="590.0" y2="140.0" class="ln" stroke-width="1.4"/>
  <polygon points="595.0,140.0 588.9,143.4 588.9,136.6" class="ah"/>
  <rect x="595.0" y="118.0" width="105.0" height="44.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="647.5" y="140.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="647.5" dy="-6.2">发给</tspan><tspan x="647.5" dy="12.4">反分词进程</tspan></text>
  <rect x="20.0" y="190.0" width="680.0" height="70.0" rx="9" class="bx" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="360.0" y="207.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">准入判断（model_rpc.py 236–285）</text>
  <text x="360.0" y="228.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">可用空间 = 空闲槽位 + 树上可淘汰的 token − Σ 运行中请求的（剩余 max_new_tokens × 0.4）</text>
  <text x="360.0" y="248.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">新请求的 新增 token + max_new_tokens 放得下才接纳；接纳时锁住命中的树节点（inc_ref_counter），锁完发现放不下就立刻解锁放弃</text>
</svg>
