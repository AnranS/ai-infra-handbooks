<!doctype html>
<!-- README 与 GitHub 社交预览用的封面（1280×640）。改完用无头浏览器截图：
     chromium --headless --hide-scrollbars --window-size=1280,640 --screenshot=cover.png cover.html -->
<html lang="zh-CN"><head><meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; }
  body {
    font-family: "Noto Sans CJK SC", sans-serif; color: #fff; overflow: hidden; position: relative;
    background:
      radial-gradient(circle at 12% 18%, rgba(10,132,255,.35), transparent 42%),
      radial-gradient(circle at 92% 88%, rgba(175,82,222,.35), transparent 45%),
      linear-gradient(135deg, #0a0f1f 0%, #121834 55%, #1a1433 100%);
  }
  .grid { position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px); background-size: 26px 26px; }
  .left { position: absolute; left: 80px; top: 78px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 108px; height: 108px; filter: drop-shadow(0 10px 30px rgba(10,132,255,.45)); }
  h1 { font-size: 74px; font-weight: 700; line-height: 1.05; letter-spacing: -1px; }
  h1 .en { background: linear-gradient(90deg, #5ac8fa, #0a84ff 45%, #bf5af2); -webkit-background-clip: text; color: transparent; }
  .sub { margin-top: 34px; font-size: 30px; line-height: 1.55; color: #cbd5e1; }
  .sub b { color: #fff; font-weight: 700; }
  .chips { margin-top: 34px; display: flex; flex-wrap: wrap; gap: 12px; width: 600px; }
  .chip { font-size: 19px; padding: 7px 16px; border-radius: 999px; color: #e2e8f0;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); }
  .chip i { font-style: normal; color: #ffb340; margin-right: 6px; }
  .url { position: absolute; left: 80px; bottom: 44px; font-size: 20px; color: #94a3b8; letter-spacing: .3px; }
  .right { position: absolute; right: 64px; top: 56px; width: 468px; }
  .rt { font-size: 18px; color: #94a3b8; margin: 0 0 4px 2px; letter-spacing: 1px; }
  .grp { font-size: 14px; color: #7c8aa0; margin: 16px 0 8px 2px; letter-spacing: 2px; }
  .books { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .book { display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 12px 0 9px; border-radius: 14px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); }
  .ico { width: 32px; height: 32px; flex: none; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
  .name { font-size: 19px; font-weight: 700; white-space: nowrap; }
</style></head>
<body>
  <div class="grid"></div>
  <div class="left">
    <div class="brand"><img src="logo.svg" alt=""><h1><span class="en">AI Infra</span><br>学习手册</h1></div>
    <p class="sub">从 Python、大模型原理、CUDA 到推理系统<br><b>一条线学到大模型推理</b></p>
    <div class="chips">
      <span class="chip"><i>●</i>示例代码全部自动验证</span>
      <span class="chip"><i>●</i>从零实现推理引擎</span>
      <span class="chip"><i>●</i>对照 vLLM / SGLang 源码</span>
      <span class="chip"><i>●</i>浏览器里做练习题</span>
    </div>
  </div>
  <div class="url">anrans.github.io/ai-infra-handbooks</div>
  <div class="right">
    <div class="rt">十二本手册 · 一条学习路线</div>
    <div class="grp">基础 · 打底与按需查</div>
      <div class="books">
        <div class="book"><img class="ico" src="../../python/docs/assets/favicon.svg" alt=""><span class="name">Python 进阶</span></div>
        <div class="book"><img class="ico" src="../../cpp/docs/assets/favicon.svg" alt=""><span class="name">C++ 进阶</span></div>
        <div class="book"><img class="ico" src="../../cs/docs/assets/favicon.svg" alt=""><span class="name">计算机基础</span></div>
        <div class="book"><img class="ico" src="../../math/docs/assets/favicon.svg" alt=""><span class="name">数学基础</span></div>
      </div>
    <div class="grp">主线 · 从模型到引擎</div>
      <div class="books">
        <div class="book"><img class="ico" src="../../llm/docs/assets/favicon.svg" alt=""><span class="name">大模型原理</span></div>
        <div class="book"><img class="ico" src="../../cuda/docs/assets/favicon.svg" alt=""><span class="name">CUDA 进阶</span></div>
        <div class="book"><img class="ico" src="../../serving/docs/assets/favicon.svg" alt=""><span class="name">推理系统</span></div>
        <div class="book"><img class="ico" src="../../minisgl/docs/assets/favicon.svg" alt=""><span class="name">手写 mini-sglang</span></div>
      </div>
    <div class="grp">进阶与扩展</div>
      <div class="books">
        <div class="book"><img class="ico" src="../../scratch/docs/assets/favicon.svg" alt=""><span class="name">从零训练一个小模型</span></div>
        <div class="book"><img class="ico" src="../../train/docs/assets/favicon.svg" alt=""><span class="name">分布式训练</span></div>
        <div class="book"><img class="ico" src="../../media/docs/assets/favicon.svg" alt=""><span class="name">图像与视频生成</span></div>
        <div class="book"><img class="ico" src="../../sglang/docs/assets/favicon.svg" alt=""><span class="name">SGLang 设计演进</span></div>
      </div>
  </div>
</body></html>
