<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" role="img" aria-label="gradient accumulation: cut a large batch into micro-batches, run a forward and backward pass for each and accumulate the gradients, and only then optimizer.step(). The memory is a micro-batch's, and it is equivalent to the large batch">
  <rect x="40.0" y="50.0" width="100.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="90.0" y="63.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">micro 1 forward</text>
  <rect x="40.0" y="80.0" width="100.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="90.0" y="93.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">backward, grad +=</text>
  <line x1="140.0" y1="78.0" x2="155.0" y2="78.0" class="ln" stroke-width="1.1"/>
  <polygon points="160.0,78.0 153.9,81.4 153.9,74.6" class="ah"/>
  <rect x="160.0" y="50.0" width="100.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="210.0" y="63.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">micro 2 forward</text>
  <rect x="160.0" y="80.0" width="100.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="210.0" y="93.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">backward, grad +=</text>
  <line x1="260.0" y1="78.0" x2="275.0" y2="78.0" class="ln" stroke-width="1.1"/>
  <polygon points="280.0,78.0 273.9,81.4 273.9,74.6" class="ah"/>
  <rect x="280.0" y="50.0" width="100.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="330.0" y="63.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">micro 3 forward</text>
  <rect x="280.0" y="80.0" width="100.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="330.0" y="93.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">backward, grad +=</text>
  <line x1="380.0" y1="78.0" x2="395.0" y2="78.0" class="ln" stroke-width="1.1"/>
  <polygon points="400.0,78.0 393.9,81.4 393.9,74.6" class="ah"/>
  <rect x="400.0" y="50.0" width="100.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="450.0" y="63.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">micro 4 forward</text>
  <rect x="400.0" y="80.0" width="100.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="450.0" y="93.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">backward, grad +=</text>
  <rect x="530.0" y="50.0" width="140.0" height="56.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="600.0" y="78.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-6.2">optimizer.step()</tspan><tspan x="600.0" dy="12.4">zero_grad()</tspan></text>
  <line x1="500.0" y1="78.0" x2="525.0" y2="78.0" class="ln" stroke-width="1.3"/>
  <polygon points="530.0,78.0 523.9,81.4 523.9,74.6" class="ah"/>
  <text x="350.0" y="134.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">the activation memory is one micro-batch's; divide the loss by the accumulation steps, and under DDP synchronise only on the last (no_sync)</text>
  <text x="350.0" y="158.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the premise: a layer with batch statistics such as BatchNorm differs (a Transformer has none); the learning rate follows the global batch</text>
  <text x="350.0" y="182.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">one level up: DDP spreads the micro-batches over the cards and all-reduces once each has computed, the same equivalence</text>
</svg>
