site_name: 从零训练一个小模型
site_url: https://anrans.github.io/ai-infra-handbooks/scratch/
site_description: 在自己的电脑上从空目录开始：语料、分词器、模型、训练循环，再到一张消费级卡能训出什么
copyright: 四章的代码接力运行，页面上的每一段输出都来自真实运行
repo_url: https://github.com/AnranS/ai-infra-handbooks
repo_name: AnranS/ai-infra-handbooks
edit_uri: edit/main/scratch/docs/

theme:
  name: material
  custom_dir: ../theme
  language: zh
  font: false
  icon:
    logo: material/school
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换到暗色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra:
  book: scratch

hooks:
  - ../hooks/figures.py
  - ../hooks/notebooks.py
  - ../hooks/crosslinks.py
  - ../hooks/practice.py
  - ../hooks/bookhero.py
  - ../hooks/meta.py
  - ../hooks/fence_attrs.py
  - ../hooks/i18n.py

plugins:
  - search:
      lang:
        - zh
        - en

extra_css:
  - assets/stylesheets/aig.css
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - 首页: index.md
  - （一）语料与分词器: data.md
  - （二）模型与训练循环: model.md
  - （三）训得更快、更大: scale.md
  - 一张消费级卡能训出什么：文本与图像生成: one-gpu.md
