<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" role="img" aria-label="梯度累积：把一个大 batch 切成几个 micro-batch，前向反向各跑一次、梯度累加，最后才 optimizer.step()——显存按 micro-batch 算，等价于大 batch">
  <rect x="40.0" y="50.0" width="100.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="90.0" y="63.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">micro 1 前向</text>
  <rect x="40.0" y="80.0" width="100.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="90.0" y="93.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">反向，梯度 +=</text>
  <line x1="140.0" y1="78.0" x2="155.0" y2="78.0" class="ln" stroke-width="1.1"/>
  <polygon points="160.0,78.0 153.9,81.4 153.9,74.6" class="ah"/>
  <rect x="160.0" y="50.0" width="100.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="210.0" y="63.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">micro 2 前向</text>
  <rect x="160.0" y="80.0" width="100.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="210.0" y="93.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">反向，梯度 +=</text>
  <line x1="260.0" y1="78.0" x2="275.0" y2="78.0" class="ln" stroke-width="1.1"/>
  <polygon points="280.0,78.0 273.9,81.4 273.9,74.6" class="ah"/>
  <rect x="280.0" y="50.0" width="100.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="330.0" y="63.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">micro 3 前向</text>
  <rect x="280.0" y="80.0" width="100.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="330.0" y="93.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">反向，梯度 +=</text>
  <line x1="380.0" y1="78.0" x2="395.0" y2="78.0" class="ln" stroke-width="1.1"/>
  <polygon points="400.0,78.0 393.9,81.4 393.9,74.6" class="ah"/>
  <rect x="400.0" y="50.0" width="100.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="450.0" y="63.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">micro 4 前向</text>
  <rect x="400.0" y="80.0" width="100.0" height="26.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="450.0" y="93.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">反向，梯度 +=</text>
  <rect x="530.0" y="50.0" width="140.0" height="56.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="600.0" y="78.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-6.2">optimizer.step()</tspan><tspan x="600.0" dy="12.4">zero_grad()</tspan></text>
  <line x1="500.0" y1="78.0" x2="525.0" y2="78.0" class="ln" stroke-width="1.3"/>
  <polygon points="530.0,78.0 523.9,81.4 523.9,74.6" class="ah"/>
  <text x="350.0" y="134.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">激活显存只有一个 micro-batch 的量；损失要除以累积步数，DDP 下只在最后一个 micro-batch 同步梯度（no_sync），否则通信翻几倍</text>
  <text x="350.0" y="158.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">等价的前提：BatchNorm 这类按 batch 统计的层会不一样（Transformer 没有）；学习率按全局 batch 定，不按 micro-batch</text>
  <text x="350.0" y="182.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">再往上：多张卡做 DDP 是把 micro-batch 摊到卡上，各卡算完 all-reduce——同样的等价关系</text>
</svg>
