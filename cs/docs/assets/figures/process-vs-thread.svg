  <text x="350.0" y="236.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">进程之间什么都不共享，靠 IPC 交换数据：管道、socket、共享内存、CUDA IPC（共享显存句柄）</text>
  <text x="350.0" y="258.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">线程切换只换栈和寄存器（几微秒内）；进程切换还要换页表、冲掉 TLB。fork 复制整个地址空间，CUDA 上下文不能跨 fork，所以 GPU 程序的子进程要用 spawn</text>
