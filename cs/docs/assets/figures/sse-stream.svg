<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="流式输出：每生成一个 token 就作为一个 SSE 事件写出去——中间任何一层的缓冲都会把"逐字出现"变成"一次全出"">
  <rect x="30.0" y="50.0" width="140.0" height="56.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="100.0" y="78.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="100.0" dy="-5.9">推理引擎</tspan><tspan x="100.0" dy="11.8">每步一个 token</tspan></text>
  <line x1="170.0" y1="78.0" x2="195.0" y2="78.0" class="ln" stroke-width="1.3"/>
  <polygon points="200.0,78.0 193.9,81.4 193.9,74.6" class="ah"/>
  <text x="185.0" y="69.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">chunk</text>
  <rect x="200.0" y="50.0" width="140.0" height="56.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="270.0" y="78.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="270.0" dy="-5.9">API 服务</tspan><tspan x="270.0" dy="11.8">序列化成 data: {...}</tspan></text>
  <line x1="340.0" y1="78.0" x2="365.0" y2="78.0" class="ln" stroke-width="1.3"/>
  <polygon points="370.0,78.0 363.9,81.4 363.9,74.6" class="ah"/>
  <text x="355.0" y="69.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">chunk</text>
  <rect x="370.0" y="50.0" width="140.0" height="56.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="440.0" y="78.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="440.0" dy="-5.9">反向代理</tspan><tspan x="440.0" dy="11.8">nginx / 网关</tspan></text>
  <line x1="510.0" y1="78.0" x2="535.0" y2="78.0" class="ln" stroke-width="1.3"/>
  <polygon points="540.0,78.0 533.9,81.4 533.9,74.6" class="ah"/>
  <text x="525.0" y="69.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">chunk</text>
  <rect x="540.0" y="50.0" width="140.0" height="56.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="610.0" y="78.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="610.0" dy="-5.9">客户端</tspan><tspan x="610.0" dy="11.8">按事件边界解析</tspan></text>
  <text x="350.0" y="130.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">三个常见的缓冲点：框架的响应缓冲（要用流式响应、每条 flush）、代理的 proxy_buffering（要关）、客户端一次性 read 整个 body</text>
  <text x="350.0" y="154.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">HTTP/1.1 用分块传输（chunked），HTTP/2 用帧，gRPC 用服务端流；SSE 是纯文本协议，"data: ...\n\n" 一行一个事件，最省事</text>
  <text x="350.0" y="178.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">工程细节：首 token 延迟从客户端看是"连接 + 排队 + prefill"；断连要能取消请求、释放 KV；心跳事件防止中间设备超时</text>
  <text x="350.0" y="202.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">吞吐和延迟的矛盾：每个 token 一个 chunk 开销大，攒几个再发延迟高；多数引擎按步发、不攒</text>
</svg>
