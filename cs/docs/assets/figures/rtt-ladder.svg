<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" width="640" role="img" aria-label="一个请求要花几个往返：新建连接 vs 复用连接">
  <text x="170.0" y="22.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600">第一次请求：4 个往返</text>
  <text x="70.0" y="44.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">客户端</text>
  <text x="270.0" y="44.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">服务端</text>
  <line x1="70.0" y1="56.0" x2="70.0" y2="284.0" class="ln" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="270.0" y1="56.0" x2="270.0" y2="284.0" class="ln" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="73.0" y1="72.0" x2="262.0" y2="87.6" class="blue-l" stroke-width="1.8"/>
  <polygon points="267.0,88.0 260.6,90.9 261.2,84.1" class="blue-s"/>
  <line x1="267.0" y1="92.0" x2="78.0" y2="107.6" class="blue-l" stroke-width="1.8"/>
  <polygon points="73.0,108.0 78.8,104.1 79.4,110.9" class="blue-s"/>
  <text x="170.0" y="66.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">DNS 查询</text>
  <line x1="73.0" y1="128.0" x2="262.0" y2="143.6" class="blue-l" stroke-width="1.8"/>
  <polygon points="267.0,144.0 260.6,146.9 261.2,140.1" class="blue-s"/>
  <line x1="267.0" y1="148.0" x2="78.0" y2="163.6" class="blue-l" stroke-width="1.8"/>
  <polygon points="73.0,164.0 78.8,160.1 79.4,166.9" class="blue-s"/>
  <text x="170.0" y="122.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">TCP 三次握手</text>
  <line x1="73.0" y1="184.0" x2="262.0" y2="199.6" class="blue-l" stroke-width="1.8"/>
  <polygon points="267.0,200.0 260.6,202.9 261.2,196.1" class="blue-s"/>
  <line x1="267.0" y1="204.0" x2="78.0" y2="219.6" class="blue-l" stroke-width="1.8"/>
  <polygon points="73.0,220.0 78.8,216.1 79.4,222.9" class="blue-s"/>
  <text x="170.0" y="178.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">TLS 1.3 握手</text>
  <line x1="73.0" y1="240.0" x2="262.0" y2="255.6" class="orange-l" stroke-width="1.8"/>
  <polygon points="267.0,256.0 260.6,258.9 261.2,252.1" class="orange-s"/>
  <line x1="267.0" y1="260.0" x2="78.0" y2="275.6" class="orange-l" stroke-width="1.8"/>
  <polygon points="73.0,276.0 78.8,272.1 79.4,278.9" class="orange-s"/>
  <text x="170.0" y="234.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">发请求 → 第一个字节</text>
  <rect x="66.0" y="300.0" width="208.0" height="30.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="170.0" y="315.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">跨城 RTT 30 ms → 120 ms</text>
  <text x="170.0" y="350.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">每一段都是一个完整的来回</text>
  <text x="480.0" y="22.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600">连接复用 + DNS 缓存：1 个往返</text>
  <text x="380.0" y="44.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">客户端</text>
  <text x="580.0" y="44.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">服务端</text>
  <line x1="380.0" y1="56.0" x2="380.0" y2="116.0" class="ln" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="580.0" y1="56.0" x2="580.0" y2="116.0" class="ln" stroke-width="1.2" stroke-opacity="0.5"/>
  <line x1="383.0" y1="72.0" x2="572.0" y2="87.6" class="orange-l" stroke-width="1.8"/>
  <polygon points="577.0,88.0 570.6,90.9 571.2,84.1" class="orange-s"/>
  <line x1="577.0" y1="92.0" x2="388.0" y2="107.6" class="orange-l" stroke-width="1.8"/>
  <polygon points="383.0,108.0 388.8,104.1 389.4,110.9" class="orange-s"/>
  <text x="480.0" y="66.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">发请求 → 第一个字节</text>
  <rect x="376.0" y="300.0" width="208.0" height="30.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="480.0" y="315.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">跨城 RTT 30 ms → 30 ms</text>
  <text x="480.0" y="350.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">省掉的 90 ms 是白送的</text>
</svg>
