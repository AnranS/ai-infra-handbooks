<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="一次 write 的旅程：用户缓冲区 → 页缓存 → 块层 → 设备；O_DIRECT 绕过页缓存，mmap 把文件直接映射进地址空间">
  <rect x="20.0" y="40.0" width="120.0" height="56.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="68.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.9">用户缓冲区</tspan><tspan x="80.0" dy="11.8">（进程内存）</tspan></text>
  <line x1="140.0" y1="68.0" x2="151.0" y2="68.0" class="ln" stroke-width="1.3"/>
  <polygon points="156.0,68.0 149.9,71.4 149.9,64.6" class="ah"/>
  <rect x="156.0" y="40.0" width="120.0" height="56.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="216.0" y="68.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="216.0" dy="-5.9">系统调用 write</tspan><tspan x="216.0" dy="11.8">拷贝进内核</tspan></text>
  <line x1="276.0" y1="68.0" x2="287.0" y2="68.0" class="ln" stroke-width="1.3"/>
  <polygon points="292.0,68.0 285.9,71.4 285.9,64.6" class="ah"/>
  <rect x="292.0" y="40.0" width="120.0" height="56.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="352.0" y="68.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-5.9">页缓存</tspan><tspan x="352.0" dy="11.8">（脏页，延迟回写）</tspan></text>
  <line x1="412.0" y1="68.0" x2="423.0" y2="68.0" class="ln" stroke-width="1.3"/>
  <polygon points="428.0,68.0 421.9,71.4 421.9,64.6" class="ah"/>
  <rect x="428.0" y="40.0" width="120.0" height="56.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="488.0" y="68.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-5.9">块层：合并、排队</tspan><tspan x="488.0" dy="11.8">I/O 调度</tspan></text>
  <line x1="548.0" y1="68.0" x2="559.0" y2="68.0" class="ln" stroke-width="1.3"/>
  <polygon points="564.0,68.0 557.9,71.4 557.9,64.6" class="ah"/>
  <rect x="564.0" y="40.0" width="120.0" height="56.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="624.0" y="68.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" dy="-5.9">设备驱动 → NVMe</tspan><tspan x="624.0" dy="11.8">DMA 写盘</tspan></text>
  <rect x="20.0" y="130.0" width="120.0" height="44.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="152.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.9">用户缓冲区</tspan><tspan x="80.0" dy="11.8">（对齐的）</tspan></text>
  <line x1="140.0" y1="152.0" x2="423.0" y2="152.0" class="orange-l" stroke-width="1.6"/>
  <polygon points="428.0,152.0 421.9,155.4 421.9,148.6" class="orange-s"/>
  <text x="284.0" y="166.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">O_DIRECT：跳过页缓存，直接 DMA（数据库、模型文件加载常用）</text>
  <line x1="428.0" y1="152.0" x2="559.3" y2="101.8" class="orange-l" stroke-width="1.6"/>
  <polygon points="564.0,100.0 559.5,105.3 557.1,99.0" class="orange-s"/>
  <text x="350.0" y="200.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">write 返回只代表数据进了页缓存；fsync 才等它真正落盘。读也经过页缓存：第二次读同一个文件快得多，是因为还在内存里</text>
  <text x="350.0" y="224.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">mmap：把文件页映射进地址空间，读写就是访问内存，缺页时内核从页缓存填——safetensors 加载权重用的就是它，零拷贝、按需读</text>
  <text x="350.0" y="248.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">模型加载慢，先查哪一层：是盘的带宽（NVMe 几 GB/s）、是页缓存没命中、还是 Python 在一个个小文件地 open</text>
</svg>
