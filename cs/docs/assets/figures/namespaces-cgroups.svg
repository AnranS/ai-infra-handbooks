<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="容器 = namespace（看得到什么）+ cgroup（能用多少）+ 挂进来的设备；没有虚拟机那层，内核是同一个">
  <rect x="30.0" y="40.0" width="300.0" height="150.0" rx="10" class="blue" stroke-width="1.2"/>
  <text x="180.0" y="58.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">namespace：隔离视图</text>
  <rect x="45.0" y="70.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="180.0" y="81.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">pid：只看到自己的进程</text>
  <rect x="45.0" y="98.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="180.0" y="109.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">net：自己的网卡、端口</text>
  <rect x="45.0" y="126.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="180.0" y="137.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">mnt：自己的文件系统树</text>
  <rect x="45.0" y="154.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="180.0" y="165.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">ipc / uts / user</text>
  <rect x="370.0" y="40.0" width="300.0" height="150.0" rx="10" class="orange" stroke-width="1.2"/>
  <text x="520.0" y="58.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">cgroup：限制资源</text>
  <rect x="385.0" y="70.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="520.0" y="81.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">cpu：配额 + 周期 → 超了就节流</text>
  <rect x="385.0" y="98.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="520.0" y="109.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">memory：上限，超了 OOM kill</text>
  <rect x="385.0" y="126.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="520.0" y="137.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">io / pids</text>
  <rect x="385.0" y="154.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="520.0" y="165.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">devices：允许哪些设备文件</text>
  <text x="350.0" y="212.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">GPU 进容器：把 /dev/nvidia* 和驱动库挂进去（nvidia-container-toolkit），RDMA 网卡同理；/dev/shm 默认只有 64 MB，多进程共享张量要放大</text>
  <text x="350.0" y="232.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">常见的坑：容器里 os.cpu_count() 看到的是宿主机的核数，线程池开太大被 cgroup 节流；内存上限不含页缓存却含 /dev/shm</text>
</svg>
