<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="LRU = 哈希表 + 双向链表：哈希表 O(1) 找到节点，链表 O(1) 把它挪到头部或淘汰尾部">
  <text x="120.0" y="24.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">哈希表：key → 节点</text>
