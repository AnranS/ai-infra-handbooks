<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="可分页内存要先拷到锁页的中转区再 DMA；锁页内存直接 DMA；GPUDirect 让网卡 / NVMe 直接读写显存">
  <text x="130.0" y="24.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">可分页内存（默认的 malloc）</text>
  <rect x="30.0" y="40.0" width="90.0" height="40.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="75.0" y="60.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="75.0" dy="-5.6">用户内存</tspan><tspan x="75.0" dy="11.2">（可换出）</tspan></text>
  <line x1="120.0" y1="60.0" x2="145.0" y2="60.0" class="ln" stroke-width="1.2"/>
  <polygon points="150.0,60.0 143.9,63.4 143.9,56.6" class="ah"/>
  <text x="135.0" y="51.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">CPU 拷贝</text>
  <rect x="150.0" y="40.0" width="90.0" height="40.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="195.0" y="60.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">锁页中转区</text>
  <line x1="240.0" y1="60.0" x2="265.0" y2="60.0" class="ln" stroke-width="1.2"/>
  <polygon points="270.0,60.0 263.9,63.4 263.9,56.6" class="ah"/>
  <text x="255.0" y="51.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">DMA</text>
  <rect x="270.0" y="40.0" width="70.0" height="40.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="305.0" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">显存</text>
  <text x="185.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">两步、CPU 参与、cudaMemcpyAsync 退化成同步；带宽掉一半以上</text>
  <text x="130.0" y="140.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">锁页内存（cudaHostAlloc / pin_memory）</text>
  <rect x="30.0" y="156.0" width="150.0" height="40.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="105.0" y="176.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-5.6">锁页内存</tspan><tspan x="105.0" dy="11.2">（不会被换出）</tspan></text>
  <line x1="180.0" y1="176.0" x2="265.0" y2="176.0" class="ln" stroke-width="1.4"/>
  <polygon points="270.0,176.0 263.9,179.4 263.9,172.6" class="ah"/>
  <text x="225.0" y="167.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">DMA，PCIe 全速，异步</text>
  <rect x="270.0" y="156.0" width="70.0" height="40.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="305.0" y="176.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">显存</text>
  <text x="185.0" y="216.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">DataLoader 的 pin_memory=True、权重预取、KV 卸载都靠它</text>
  <text x="520.0" y="24.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">GPUDirect</text>
  <rect x="420.0" y="40.0" width="80.0" height="40.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="460.0" y="60.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">网卡 / NVMe</text>
  <line x1="500.0" y1="60.0" x2="585.0" y2="60.0" class="ln" stroke-width="1.4"/>
  <polygon points="590.0,60.0 583.9,63.4 583.9,56.6" class="ah"/>
  <text x="545.0" y="51.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">直接 DMA</text>
  <rect x="590.0" y="40.0" width="80.0" height="40.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="630.0" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">显存</text>
  <text x="545.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="545.0" dy="-5.6">不经过主机内存：PD 分离传 KV、</tspan><tspan x="545.0" dy="11.2">从存储直接加载权重</tspan></text>
  <text x="520.0" y="140.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">NUMA：内存也分远近</text>
  <rect x="420.0" y="156.0" width="110.0" height="40.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="475.0" y="176.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="475.0" dy="-5.3">CPU0 + 本地内存</tspan><tspan x="475.0" dy="10.5">+ GPU0-3</tspan></text>
  <rect x="560.0" y="156.0" width="110.0" height="40.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="615.0" y="176.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="615.0" dy="-5.3">CPU1 + 本地内存</tspan><tspan x="615.0" dy="10.5">+ GPU4-7</tspan></text>
  <line x1="535.0" y1="176.0" x2="555.0" y2="176.0" class="ln" stroke-width="1.2"/>
  <polygon points="560.0,176.0 553.9,179.4 553.9,172.6" class="ah"/>
  <polygon points="530.0,176.0 536.1,172.6 536.1,179.4" class="ah"/>
  <text x="545.0" y="216.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="545.0" dy="-5.6">跨节点访问慢几成：进程要绑在</tspan><tspan x="545.0" dy="11.2">自己 GPU 所在的 NUMA 节点上</tspan></text>
</svg>
