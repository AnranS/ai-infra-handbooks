  <polygon points="60.0,120.0 65.6,115.8 66.5,122.5" class="ah"/>
  <text x="95.0" y="94.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="95.0" dy="-5.3">AppendEntries</tspan><tspan x="95.0" dy="10.5">（心跳 + 日志）</tspan></text>
  <rect x="125.0" y="120.0" width="90.0" height="36.0" rx="6" class="blue" stroke-width="1.3"/>
