  <rect x="485.0" y="120.0" width="90.0" height="36.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="530.0" y="138.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">跟随者</text>
  <line x1="350.0" y1="80.0" x2="525.1" y2="118.9" class="ln" stroke-width="1.1"/>
  <polygon points="530.0,120.0 523.3,122.0 524.7,115.4" class="ah"/>
  <rect x="595.0" y="120.0" width="90.0" height="36.0" rx="6" class="gray" stroke-width="1.3"/>
