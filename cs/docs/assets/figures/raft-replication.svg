<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" role="img" aria-label="Raft：多数派选出领导者，领导者把日志复制到多数派才算提交；法定人数的读写交集保证不会读到旧值">
  <rect x="280.0" y="40.0" width="140.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="350.0" y="60.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">领导者（任期 3）</text>
