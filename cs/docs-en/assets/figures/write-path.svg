<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="one write's journey: the user buffer, the page cache, the block layer, the device. O_DIRECT bypasses the page cache and mmap maps the file into the address space">
  <rect x="20.0" y="40.0" width="120.0" height="56.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="68.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.9">user buffer</tspan><tspan x="80.0" dy="11.8">(process memory)</tspan></text>
  <line x1="140.0" y1="68.0" x2="151.0" y2="68.0" class="ln" stroke-width="1.3"/>
  <polygon points="156.0,68.0 149.9,71.4 149.9,64.6" class="ah"/>
  <rect x="156.0" y="40.0" width="120.0" height="56.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="216.0" y="68.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="216.0" dy="-5.9">the write system call</tspan><tspan x="216.0" dy="11.8">copies into the kernel</tspan></text>
  <line x1="276.0" y1="68.0" x2="287.0" y2="68.0" class="ln" stroke-width="1.3"/>
  <polygon points="292.0,68.0 285.9,71.4 285.9,64.6" class="ah"/>
  <rect x="292.0" y="40.0" width="120.0" height="56.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="352.0" y="68.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="352.0" dy="-5.9">page cache</tspan><tspan x="352.0" dy="11.8">(dirty, written back later)</tspan></text>
  <line x1="412.0" y1="68.0" x2="423.0" y2="68.0" class="ln" stroke-width="1.3"/>
  <polygon points="428.0,68.0 421.9,71.4 421.9,64.6" class="ah"/>
  <rect x="428.0" y="40.0" width="120.0" height="56.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="488.0" y="68.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-5.9">block layer:</tspan><tspan x="488.0" dy="11.8">merge, queue, schedule</tspan></text>
  <line x1="548.0" y1="68.0" x2="559.0" y2="68.0" class="ln" stroke-width="1.3"/>
  <polygon points="564.0,68.0 557.9,71.4 557.9,64.6" class="ah"/>
  <rect x="564.0" y="40.0" width="120.0" height="56.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="624.0" y="68.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="624.0" dy="-5.9">the device driver to NVMe</tspan><tspan x="624.0" dy="11.8">DMA to the disk</tspan></text>
  <rect x="20.0" y="130.0" width="120.0" height="44.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="152.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-5.9">user buffer</tspan><tspan x="80.0" dy="11.8">(aligned)</tspan></text>
  <line x1="140.0" y1="152.0" x2="423.0" y2="152.0" class="orange-l" stroke-width="1.6"/>
  <polygon points="428.0,152.0 421.9,155.4 421.9,148.6" class="orange-s"/>
  <text x="284.0" y="166.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">O_DIRECT: skip the page cache, DMA straight to the device</text>
  <line x1="428.0" y1="152.0" x2="559.3" y2="101.8" class="orange-l" stroke-width="1.6"/>
  <polygon points="564.0,100.0 559.5,105.3 557.1,99.0" class="orange-s"/>
  <text x="350.0" y="200.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">a write that returns only means the data reached the page cache; fsync waits for the disk. Reads go through it too, so a second read is far faster</text>
  <text x="350.0" y="224.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">mmap: map the file's pages into the address space, so reading is memory access and the kernel fills from the page cache on a fault; safetensors uses it</text>
  <text x="350.0" y="248.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">when model loading is slow, find the layer first: the disk's bandwidth (a few GB/s on NVMe), a page-cache miss, or Python opening small files one at a time</text>
</svg>
