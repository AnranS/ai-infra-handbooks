<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" role="img" aria-label="Raft: a majority elects the leader, and an entry commits once the leader has replicated it to a majority; the quorum's read-write intersection keeps stale values out">
  <rect x="280.0" y="40.0" width="140.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="350.0" y="60.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">leader (term 3)</text>
  <rect x="15.0" y="120.0" width="90.0" height="36.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="60.0" y="138.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">follower</text>
  <line x1="350.0" y1="80.0" x2="65.0" y2="119.3" class="ln" stroke-width="1.1"/>
  <polygon points="60.0,120.0 65.6,115.8 66.5,122.5" class="ah"/>
  <text x="95.0" y="94.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="95.0" dy="-5.3">AppendEntries</tspan><tspan x="95.0" dy="10.5">(heartbeat + log)</tspan></text>
  <rect x="125.0" y="120.0" width="90.0" height="36.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="170.0" y="138.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">follower</text>
  <line x1="350.0" y1="80.0" x2="174.9" y2="118.9" class="ln" stroke-width="1.1"/>
  <polygon points="170.0,120.0 175.3,115.4 176.7,122.0" class="ah"/>
  <rect x="485.0" y="120.0" width="90.0" height="36.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="530.0" y="138.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">follower</text>
  <line x1="350.0" y1="80.0" x2="525.1" y2="118.9" class="ln" stroke-width="1.1"/>
  <polygon points="530.0,120.0 523.3,122.0 524.7,115.4" class="ah"/>
  <rect x="595.0" y="120.0" width="90.0" height="36.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="640.0" y="138.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">follower (lagging)</text>
  <line x1="350.0" y1="80.0" x2="635.0" y2="119.3" class="ln" stroke-width="1.1"/>
  <polygon points="640.0,120.0 633.5,122.5 634.4,115.8" class="ah"/>
  <text x="60.0" y="176.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 2 3 4</text>
  <text x="170.0" y="176.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 2 3 4</text>
  <text x="350.0" y="176.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 2 3 4</text>
  <text x="530.0" y="176.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 2 3 4</text>
  <text x="640.0" y="176.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1 2 3</text>
  <text x="350.0" y="100.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">log [1 2 3 4], committed to 4</text>
  <text x="350.0" y="206.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">a write: the leader appends, sends to all, and commits and replies once a majority (3/5) acknowledges; a lagging follower does not hurt availability</text>
  <text x="350.0" y="230.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the election: a follower that times out calls a vote, a majority elects the new leader and the term increments; an old leader seeing a higher term steps down</text>
  <text x="350.0" y="254.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">in an inference cluster: the routing table, instance registration and the prefill-decode ratio live in etcd (Raft); the data path does not use consensus</text>
</svg>
