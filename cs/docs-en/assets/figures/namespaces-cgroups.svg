<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="a container is namespaces (what it sees) plus cgroups (how much it may use) plus the devices mounted in; there is no virtual-machine layer and the kernel is the same one">
  <rect x="30.0" y="40.0" width="300.0" height="150.0" rx="10" class="blue" stroke-width="1.2"/>
  <text x="180.0" y="58.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">namespaces: isolate the view</text>
  <rect x="45.0" y="70.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="180.0" y="81.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">pid: it sees only its own processes</text>
  <rect x="45.0" y="98.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="180.0" y="109.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">net: its own cards and ports</text>
  <rect x="45.0" y="126.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="180.0" y="137.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">mnt: its own filesystem tree</text>
  <rect x="45.0" y="154.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="180.0" y="165.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">ipc / uts / user</text>
  <rect x="370.0" y="40.0" width="300.0" height="150.0" rx="10" class="orange" stroke-width="1.2"/>
  <text x="520.0" y="58.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">cgroups: limit the resources</text>
  <rect x="385.0" y="70.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="520.0" y="81.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">cpu: a quota and a period, throttled past it</text>
  <rect x="385.0" y="98.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="520.0" y="109.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">memory: a cap, OOM-killed past it</text>
  <rect x="385.0" y="126.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="520.0" y="137.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">io / pids</text>
  <rect x="385.0" y="154.0" width="270.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="520.0" y="165.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">devices: which device files are allowed</text>
  <text x="350.0" y="212.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">a GPU in a container: mount /dev/nvidia* and the driver libraries in with nvidia-container-toolkit, an RDMA card likewise; raise /dev/shm above 64 MB</text>
  <text x="350.0" y="232.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">a trap: os.cpu_count() in a container sees the host's cores, so a big thread pool gets throttled; the memory cap skips the page cache, counts /dev/shm</text>
</svg>
