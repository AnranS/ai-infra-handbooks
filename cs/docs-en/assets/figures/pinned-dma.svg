<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="pageable memory is copied to a pinned staging area before the DMA; pinned memory DMAs directly; GPUDirect lets a card or NVMe read and write device memory">
  <text x="130.0" y="24.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">pageable memory (the default malloc)</text>
  <rect x="30.0" y="40.0" width="90.0" height="40.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="75.0" y="60.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="75.0" dy="-5.6">user memory</tspan><tspan x="75.0" dy="11.2">(swappable)</tspan></text>
  <line x1="120.0" y1="60.0" x2="145.0" y2="60.0" class="ln" stroke-width="1.2"/>
  <polygon points="150.0,60.0 143.9,63.4 143.9,56.6" class="ah"/>
  <text x="135.0" y="51.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">CPU copy</text>
  <rect x="150.0" y="40.0" width="90.0" height="40.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="195.0" y="60.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">pinned staging</text>
  <line x1="240.0" y1="60.0" x2="265.0" y2="60.0" class="ln" stroke-width="1.2"/>
  <polygon points="270.0,60.0 263.9,63.4 263.9,56.6" class="ah"/>
  <text x="255.0" y="51.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">DMA</text>
  <rect x="270.0" y="40.0" width="70.0" height="40.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="305.0" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">GPU memory</text>
  <text x="185.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">two CPU-involved steps, cudaMemcpyAsync turns sync, half the bandwidth gone</text>
  <text x="130.0" y="140.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">pinned memory (cudaHostAlloc / pin_memory)</text>
  <rect x="30.0" y="156.0" width="150.0" height="40.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="105.0" y="176.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-5.6">pinned memory</tspan><tspan x="105.0" dy="11.2">(never swapped out)</tspan></text>
  <line x1="180.0" y1="176.0" x2="265.0" y2="176.0" class="ln" stroke-width="1.4"/>
  <polygon points="270.0,176.0 263.9,179.4 263.9,172.6" class="ah"/>
  <text x="225.0" y="167.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">DMA, full PCIe speed</text>
  <rect x="270.0" y="156.0" width="70.0" height="40.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="305.0" y="176.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">GPU memory</text>
  <text x="185.0" y="216.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">DataLoader's pin_memory=True, weight prefetch and KV offload all rest on it</text>
  <text x="520.0" y="24.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">GPUDirect</text>
  <rect x="420.0" y="40.0" width="80.0" height="40.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="460.0" y="60.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">NIC / NVMe</text>
  <line x1="500.0" y1="60.0" x2="585.0" y2="60.0" class="ln" stroke-width="1.4"/>
  <polygon points="590.0,60.0 583.9,63.4 583.9,56.6" class="ah"/>
  <text x="545.0" y="51.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">a direct DMA</text>
  <rect x="590.0" y="40.0" width="80.0" height="40.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="630.0" y="60.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">GPU memory</text>
  <text x="545.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="545.0" dy="-5.6">host memory not involved: KV transfer under disaggregation,</tspan><tspan x="545.0" dy="11.2">and loading weights straight from storage</tspan></text>
  <text x="520.0" y="140.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">NUMA: memory is near or far too</text>
  <rect x="420.0" y="156.0" width="110.0" height="40.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="475.0" y="176.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="475.0" dy="-5.3">CPU0 + local memory</tspan><tspan x="475.0" dy="10.5">+ GPU0-3</tspan></text>
  <rect x="560.0" y="156.0" width="110.0" height="40.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="615.0" y="176.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle"><tspan x="615.0" dy="-5.3">CPU1 + local memory</tspan><tspan x="615.0" dy="10.5">+ GPU4-7</tspan></text>
  <line x1="535.0" y1="176.0" x2="555.0" y2="176.0" class="ln" stroke-width="1.2"/>
  <polygon points="560.0,176.0 553.9,179.4 553.9,172.6" class="ah"/>
  <polygon points="530.0,176.0 536.1,172.6 536.1,179.4" class="ah"/>
  <text x="545.0" y="216.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="545.0" dy="-5.6">across nodes it is tens of percent slower: bind a process to</tspan><tspan x="545.0" dy="11.2">the NUMA node its GPU is on</tspan></text>
</svg>
