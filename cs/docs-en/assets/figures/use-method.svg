<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" role="img" aria-label="the USE method: ask three questions of every resource, utilisation, saturation and errors">
  <rect x="30.0" y="40.0" width="160.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="110.0" y="52.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">resource</text>
  <rect x="195.0" y="40.0" width="160.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="275.0" y="52.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">utilisation</text>
  <rect x="360.0" y="40.0" width="160.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="440.0" y="52.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">saturation</text>
  <rect x="525.0" y="40.0" width="160.0" height="24.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="605.0" y="52.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">errors</text>
  <rect x="30.0" y="66.0" width="160.0" height="22.0" rx="3" class="orange" stroke-width="0.6"/>
  <text x="110.0" y="77.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">CPU</text>
  <rect x="195.0" y="66.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="275.0" y="77.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">%user in top / mpstat</text>
  <rect x="360.0" y="66.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="440.0" y="77.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">the run-queue length (load)</text>
  <rect x="525.0" y="66.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="605.0" y="77.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">—</text>
  <rect x="30.0" y="90.0" width="160.0" height="22.0" rx="3" class="orange" stroke-width="0.6"/>
  <text x="110.0" y="101.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">memory</text>
  <rect x="195.0" y="90.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="275.0" y="101.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">free, the page cache's share</text>
  <rect x="360.0" y="90.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="440.0" y="101.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">swap, reclaim activity</text>
  <rect x="525.0" y="90.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="605.0" y="101.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">OOM kill</text>
  <rect x="30.0" y="114.0" width="160.0" height="22.0" rx="3" class="orange" stroke-width="0.6"/>
  <text x="110.0" y="125.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">the disk</text>
  <rect x="195.0" y="114.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="275.0" y="125.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">iostat %util</text>
  <rect x="360.0" y="114.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="440.0" y="125.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">the queue depth, await</text>
  <rect x="525.0" y="114.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="605.0" y="125.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">I/O errors</text>
  <rect x="30.0" y="138.0" width="160.0" height="22.0" rx="3" class="orange" stroke-width="0.6"/>
  <text x="110.0" y="149.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">the network</text>
  <rect x="195.0" y="138.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="275.0" y="149.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">the share of bandwidth</text>
  <rect x="360.0" y="138.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="440.0" y="149.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">loss, retransmission</text>
  <rect x="525.0" y="138.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="605.0" y="149.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">error counts</text>
  <rect x="30.0" y="162.0" width="160.0" height="22.0" rx="3" class="orange" stroke-width="0.6"/>
  <text x="110.0" y="173.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">GPU</text>
  <rect x="195.0" y="162.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="275.0" y="173.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">nvidia-smi's util (coarse)</text>
  <rect x="360.0" y="162.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="440.0" y="173.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">waiting kernels, the queue</text>
  <rect x="525.0" y="162.0" width="160.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="605.0" y="173.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">Xid errors</text>
  <text x="350.0" y="194.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">ask which resource is saturated before reaching for a tool; 100% GPU utilisation is not full compute, so look at SM occupancy and the roofline</text>
</svg>
