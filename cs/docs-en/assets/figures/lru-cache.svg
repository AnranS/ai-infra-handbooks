<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="LRU is a hash table plus a doubly linked list: the table finds a node in O(1), the list moves it to the head or evicts the tail in O(1)">
  <text x="120.0" y="24.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">the hash table: key to node</text>
  <rect x="40.0" y="44.0" width="60.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="70.0" y="57.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">k7</text>
  <line x1="100.0" y1="57.0" x2="435.0" y2="99.4" class="ln" stroke-width="1" stroke-opacity="0.5"/>
  <polygon points="440.0,100.0 433.5,102.6 434.3,95.9" class="ah"/>
  <rect x="40.0" y="80.0" width="60.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="70.0" y="93.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">k3</text>
  <line x1="100.0" y1="93.0" x2="195.0" y2="99.7" class="ln" stroke-width="1" stroke-opacity="0.5"/>
  <polygon points="200.0,100.0 193.6,102.9 194.1,96.2" class="ah"/>
  <rect x="40.0" y="116.0" width="60.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="70.0" y="129.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">k9</text>
  <line x1="100.0" y1="129.0" x2="555.0" y2="100.3" class="ln" stroke-width="1" stroke-opacity="0.5"/>
  <polygon points="560.0,100.0 554.1,103.8 553.7,97.0" class="ah"/>
  <rect x="40.0" y="152.0" width="60.0" height="26.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="70.0" y="165.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">k1</text>
  <line x1="100.0" y1="165.0" x2="315.2" y2="101.4" class="ln" stroke-width="1" stroke-opacity="0.5"/>
  <polygon points="320.0,100.0 315.1,105.0 313.2,98.5" class="ah"/>
  <text x="430.0" y="24.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">the doubly linked list: most recently used at the head, least at the tail</text>
  <rect x="130.0" y="86.0" width="40.0" height="28.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="150.0" y="100.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">head</text>
  <rect x="200.0" y="86.0" width="60.0" height="28.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="230.0" y="100.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">k3</text>
  <line x1="175.0" y1="100.0" x2="195.0" y2="100.0" class="ln" stroke-width="1.2"/>
  <polygon points="200.0,100.0 193.9,103.4 193.9,96.6" class="ah"/>
  <polygon points="170.0,100.0 176.1,96.6 176.1,103.4" class="ah"/>
  <rect x="320.0" y="86.0" width="60.0" height="28.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="350.0" y="100.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">k1</text>
  <line x1="265.0" y1="100.0" x2="315.0" y2="100.0" class="ln" stroke-width="1.2"/>
  <polygon points="320.0,100.0 313.9,103.4 313.9,96.6" class="ah"/>
  <polygon points="260.0,100.0 266.1,96.6 266.1,103.4" class="ah"/>
  <rect x="440.0" y="86.0" width="60.0" height="28.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="470.0" y="100.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">k7</text>
  <line x1="385.0" y1="100.0" x2="435.0" y2="100.0" class="ln" stroke-width="1.2"/>
  <polygon points="440.0,100.0 433.9,103.4 433.9,96.6" class="ah"/>
  <polygon points="380.0,100.0 386.1,96.6 386.1,103.4" class="ah"/>
  <rect x="560.0" y="86.0" width="60.0" height="28.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="590.0" y="100.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">k9</text>
  <line x1="505.0" y1="100.0" x2="555.0" y2="100.0" class="ln" stroke-width="1.2"/>
  <polygon points="560.0,100.0 553.9,103.4 553.9,96.6" class="ah"/>
  <polygon points="500.0,100.0 506.1,96.6 506.1,103.4" class="ah"/>
  <rect x="640.0" y="86.0" width="40.0" height="28.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="660.0" y="100.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">tail</text>
  <line x1="625.0" y1="100.0" x2="635.0" y2="100.0" class="ln" stroke-width="1.2"/>
  <polygon points="640.0,100.0 633.9,103.4 633.9,96.6" class="ah"/>
  <polygon points="620.0,100.0 626.1,96.6 626.1,103.4" class="ah"/>
  <text x="230.0" y="140.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">get(k3): a hit, so unlink it and insert at the head</text>
  <text x="560.0" y="140.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">put when full: delete the tail k9, and from the table too</text>
  <text x="350.0" y="180.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">the two point at each other: the table holds node pointers, a node its key for the reverse lookup; dummy head and tail nodes drop the empty checks</text>
  <text x="350.0" y="204.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">an engine's prefix cache is this scaled up: block hash to block, LRU decides what goes; a radix tree makes match and eviction O(prefix length)</text>
  <text x="350.0" y="228.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">in Python, OrderedDict.move_to_end is "move to the head" and popitem(last=False) is "evict the tail"; an interview asks for the linked-list version below</text>
</svg>
