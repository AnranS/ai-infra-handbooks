<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="700" role="img" aria-label="streaming output: each generated token goes out as one server-sent event. Buffering at any layer turns character-by-character into everything at once">
  <rect x="30.0" y="50.0" width="140.0" height="56.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="100.0" y="78.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="100.0" dy="-5.9">the inference engine</tspan><tspan x="100.0" dy="11.8">one token per step</tspan></text>
  <line x1="170.0" y1="78.0" x2="195.0" y2="78.0" class="ln" stroke-width="1.3"/>
  <polygon points="200.0,78.0 193.9,81.4 193.9,74.6" class="ah"/>
  <text x="185.0" y="69.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">chunk</text>
  <rect x="200.0" y="50.0" width="140.0" height="56.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="270.0" y="78.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="270.0" dy="-5.9">the API service</tspan><tspan x="270.0" dy="11.8">serialises to data: {...}</tspan></text>
  <line x1="340.0" y1="78.0" x2="365.0" y2="78.0" class="ln" stroke-width="1.3"/>
  <polygon points="370.0,78.0 363.9,81.4 363.9,74.6" class="ah"/>
  <text x="355.0" y="69.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">chunk</text>
  <rect x="370.0" y="50.0" width="140.0" height="56.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="440.0" y="78.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="440.0" dy="-5.9">the reverse proxy</tspan><tspan x="440.0" dy="11.8">nginx / gateway</tspan></text>
  <line x1="510.0" y1="78.0" x2="535.0" y2="78.0" class="ln" stroke-width="1.3"/>
  <polygon points="540.0,78.0 533.9,81.4 533.9,74.6" class="ah"/>
  <text x="525.0" y="69.0" class="mu" font-size="8.5" text-anchor="middle" dominant-baseline="middle">chunk</text>
  <rect x="540.0" y="50.0" width="140.0" height="56.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="610.0" y="78.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="610.0" dy="-5.9">the client</tspan><tspan x="610.0" dy="11.8">parses on event boundaries</tspan></text>
  <text x="350.0" y="130.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">three buffering points: the framework's response buffer (flush each event), the proxy's proxy_buffering, and a client reading the whole body</text>
  <text x="350.0" y="154.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">HTTP/1.1 uses chunked transfer, HTTP/2 uses frames, gRPC uses server streaming; server-sent events is plain text, one event per "data: ..." line</text>
  <text x="350.0" y="178.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">details: the time to first token is connection + queue + prefill; a disconnect must cancel the request and free the KV; heartbeats stop timeouts</text>
  <text x="350.0" y="202.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">throughput against latency: a chunk per token costs a lot, and batching a few adds delay; most engines send per step without batching</text>
</svg>
