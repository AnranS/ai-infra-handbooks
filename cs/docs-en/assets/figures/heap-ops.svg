<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" width="700" role="img" aria-label="a heap: a complete binary tree in an array, where node i's children are 2i+1 and 2i+2; an insert sifts up, and after popping the top the last element goes on top and sifts down">
  <line x1="160.0" y1="50.0" x2="90.0" y2="110.0" class="ln" stroke-width="1.2"/>
  <line x1="160.0" y1="50.0" x2="230.0" y2="110.0" class="ln" stroke-width="1.2"/>
  <line x1="90.0" y1="110.0" x2="55.0" y2="170.0" class="ln" stroke-width="1.2"/>
  <line x1="90.0" y1="110.0" x2="125.0" y2="170.0" class="ln" stroke-width="1.2"/>
  <line x1="230.0" y1="110.0" x2="195.0" y2="170.0" class="ln" stroke-width="1.2"/>
  <line x1="230.0" y1="110.0" x2="265.0" y2="170.0" class="ln" stroke-width="1.2"/>
  <circle cx="160.0" cy="50.0" r="16.0" class="orange" stroke-width="1.3"/>
  <text x="160.0" y="50.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">3</text>
  <text x="160.0" y="78.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">[0]</text>
  <circle cx="90.0" cy="110.0" r="16.0" class="blue" stroke-width="1.3"/>
  <text x="90.0" y="110.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">7</text>
  <text x="90.0" y="138.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">[1]</text>
  <circle cx="230.0" cy="110.0" r="16.0" class="blue" stroke-width="1.3"/>
  <text x="230.0" y="110.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">5</text>
  <text x="230.0" y="138.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">[2]</text>
  <circle cx="55.0" cy="170.0" r="16.0" class="blue" stroke-width="1.3"/>
  <text x="55.0" y="170.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">12</text>
  <text x="55.0" y="198.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">[3]</text>
  <circle cx="125.0" cy="170.0" r="16.0" class="blue" stroke-width="1.3"/>
  <text x="125.0" y="170.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">9</text>
  <text x="125.0" y="198.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">[4]</text>
  <circle cx="195.0" cy="170.0" r="16.0" class="blue" stroke-width="1.3"/>
  <text x="195.0" y="170.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">8</text>
  <text x="195.0" y="198.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">[5]</text>
  <circle cx="265.0" cy="170.0" r="16.0" class="blue" stroke-width="1.3"/>
  <text x="265.0" y="170.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">15</text>
  <text x="265.0" y="198.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">[6]</text>
  <text x="160.0" y="222.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the array: [3, 7, 5, 12, 9, 8, 15]</text>
  <text x="160.0" y="244.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">a min-heap: every parent &lt;= its children; no pointers, cache-friendly</text>
  <text x="500.0" y="40.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" dy="-5.9">push(4): put it last at [7], compare with the parent [3]=12, swap if smaller,</tspan><tspan x="500.0" dy="11.8">and sift up until it is not smaller: O(log n)</tspan></text>
  <text x="500.0" y="100.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" dy="-5.9">pop(): take the top 3, move the last 15 to the top,</tspan><tspan x="500.0" dy="11.8">swap with the smaller child and sift down: O(log n)</tspan></text>
  <text x="500.0" y="160.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" dy="-5.9">heapify: sift down from the last non-leaf backwards, O(n),</tspan><tspan x="500.0" dy="11.8">faster than O(n log n) of pushing one by one</tspan></text>
  <text x="500.0" y="215.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" dy="-5.9">where it is used: top-k (a heap of size k), merging k sorted streams,</tspan><tspan x="500.0" dy="11.8">scheduling by deadline (an engine taking requests by estimated finish time is a heap)</tspan></text>
</svg>
