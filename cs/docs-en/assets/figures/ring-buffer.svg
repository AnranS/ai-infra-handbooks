<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="A shared-memory ring buffer: the producer writes head and the consumer reads tail, reusing one block with no copy and no kernel">
  <path d="M 160.0 45.0 A 70 70 0 0 1 195.0 54.4 L 180.0 80.4 A 40 40 0 0 0 160.0 75.0 Z" class="gray" stroke-width="0.8"/>
  <path d="M 195.0 54.4 A 70 70 0 0 1 220.6 80.0 L 194.6 95.0 A 40 40 0 0 0 180.0 80.4 Z" class="gray" stroke-width="0.8"/>
  <path d="M 220.6 80.0 A 70 70 0 0 1 230.0 115.0 L 200.0 115.0 A 40 40 0 0 0 194.6 95.0 Z" class="gray" stroke-width="0.8"/>
  <path d="M 230.0 115.0 A 70 70 0 0 1 220.6 150.0 L 194.6 135.0 A 40 40 0 0 0 200.0 115.0 Z" class="orange" stroke-width="0.8"/>
  <path d="M 220.6 150.0 A 70 70 0 0 1 195.0 175.6 L 180.0 149.6 A 40 40 0 0 0 194.6 135.0 Z" class="orange" stroke-width="0.8"/>
  <path d="M 195.0 175.6 A 70 70 0 0 1 160.0 185.0 L 160.0 155.0 A 40 40 0 0 0 180.0 149.6 Z" class="orange" stroke-width="0.8"/>
  <path d="M 160.0 185.0 A 70 70 0 0 1 125.0 175.6 L 140.0 149.6 A 40 40 0 0 0 160.0 155.0 Z" class="orange" stroke-width="0.8"/>
  <path d="M 125.0 175.6 A 70 70 0 0 1 99.4 150.0 L 125.4 135.0 A 40 40 0 0 0 140.0 149.6 Z" class="orange" stroke-width="0.8"/>
  <path d="M 99.4 150.0 A 70 70 0 0 1 90.0 115.0 L 120.0 115.0 A 40 40 0 0 0 125.4 135.0 Z" class="gray" stroke-width="0.8"/>
  <path d="M 90.0 115.0 A 70 70 0 0 1 99.4 80.0 L 125.4 95.0 A 40 40 0 0 0 120.0 115.0 Z" class="gray" stroke-width="0.8"/>
  <path d="M 99.4 80.0 A 70 70 0 0 1 125.0 54.4 L 140.0 80.4 A 40 40 0 0 0 125.4 95.0 Z" class="gray" stroke-width="0.8"/>
  <path d="M 125.0 54.4 A 70 70 0 0 1 160.0 45.0 L 160.0 75.0 A 40 40 0 0 0 140.0 80.4 Z" class="gray" stroke-width="0.8"/>
  <text x="160.0" y="115.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">the cycle</text>
  <text x="255.0" y="60.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">head (producer)</text>
  <text x="230.0" y="185.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">tail (consumer)</text>
  <text x="480.0" y="50.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">full = (head + 1) % n == tail; empty = head == tail</text>
  <text x="480.0" y="80.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="480.0" dy="-5.9">One producer and one consumer need only atomic reads and writes of two indices,</tspan><tspan x="480.0" dy="11.8">no lock; several producers need a CAS to claim a slot</tspan></text>
  <text x="480.0" y="125.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="480.0" dy="-5.9">In an inference engine: the scheduler process writes the batch metadata into shared memory</tspan><tspan x="480.0" dy="11.8">for the GPU worker to read; large tensors share a device memory handle over CUDA IPC</tspan></text>
  <text x="480.0" y="170.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="480.0" dy="-5.9">A pipe or socket costs two kernel copies and a wakeup per message,</tspan><tspan x="480.0" dy="11.8">tens of µs; shared memory is one write and one read, below a microsecond</tspan></text>
  <text x="350.0" y="215.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">ZMQ is the message bus (and works across machines), shared memory the fast path within one; vLLM and SGLang use both</text>
</svg>
