name: Deploy handbooks to Cloudflare Pages

# 仓库设为私有后，网站改由 Cloudflare Pages 托管，前面挡一层 Cloudflare Access（只放行自己的邮箱）。
# 需要两个仓库机密：CLOUDFLARE_API_TOKEN（权限 Account / Cloudflare Pages / Edit）和 CLOUDFLARE_ACCOUNT_ID；
# 没配之前这个工作流只构建、检查链接，不部署。
# 产物放在 dist/ai-infra-handbooks/ 下、根目录 302 过去，和 GitHub Pages 时的路径一样，打卡文档里的链接只需换域名。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-docs.txt
      - run: ./build.sh
      - name: 检查站内链接和锚点
        run: python3 tools/check_links.py _site
      - name: 打包：保留 /ai-infra-handbooks/ 前缀，根目录跳过去
        run: |
          mkdir -p dist
          mv _site dist/ai-infra-handbooks
          printf '/ /ai-infra-handbooks/ 302\n' > dist/_redirects
      - name: 部署到 Cloudflare Pages
        if: env.HAS_TOKEN == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create ai-infra-handbooks --production-branch main || true
          npx --yes wrangler@4 pages deploy dist --project-name ai-infra-handbooks --branch main --commit-dirty=true
