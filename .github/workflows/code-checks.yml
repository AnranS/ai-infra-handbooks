# 九本不依赖模型权重的手册（python、cpp、cs、torch、scratch、train、media、sglang、omni）：把正文里的示例代码真的跑一遍，输出和页面上贴的逐行比对。
# media 的示例用随机初始化的小模型，不下载权重。
# （依赖模型权重的三本在 code-checks-models.yml 里每周跑；CUDA 手册要 nvcc，只在本机跑）
on:
  push:
    branches: [main]
    paths:
      - "sglang/docs/**"
      - "sglang/tools/**"
      - "omni/docs/**"
      - "omni/tools/**"
      - "omni/requirements-check.txt"
      - "python/docs/**"
      - "python/tools/**"
      - "cpp/docs/**"
      - "cpp/tools/**"
      - "cs/docs/**"
      - "cs/tools/**"
      - "torch/docs/**"
      - "torch/tools/**"
      - "scratch/docs/**"
      - "scratch/tools/**"
      - "train/docs/**"
      - "train/tools/**"
      - "media/docs/**"
      - "media/tools/**"
      - ".github/workflows/code-checks.yml"
  pull_request:
    paths:
      - "sglang/docs/**"
      - "sglang/tools/**"
      - "omni/docs/**"
      - "omni/tools/**"
      - "omni/requirements-check.txt"
      - "python/docs/**"
      - "python/tools/**"
      - "cpp/docs/**"
      - "cpp/tools/**"
      - "cs/docs/**"
      - "cs/tools/**"
      - "torch/docs/**"
      - "torch/tools/**"
      - "scratch/docs/**"
      - "scratch/tools/**"
      - "train/docs/**"
      - "train/tools/**"
      - "media/docs/**"
      - "media/tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 进阶手册
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install pytest hypothesis rich httpx numpy
      - name: 运行全部示例，输出与页面逐行比对
        working-directory: python
        run: python tools/check_examples.py
      - name: 「用 pytest 写测试」一章的测试块
        working-directory: python
        run: python tools/check_pytest_blocks.py docs/engineering/testing.md

  cpp:
    name: C++ 进阶手册
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      # pybind11 / PyTorch 扩展一章要在 Python 里编译并加载扩展，CPU 版 torch 就够
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install pybind11 ninja numpy
      # ThreadSanitizer 在地址随机化位数较高的新内核上会报 "unexpected memory mapping"
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - name: 编译并运行全部 C++ 程序（ASan / UBSan / TSan），输出与页面逐行比对
        working-directory: cpp
        run: PYTHON="$(which python)" python tools/check_code.py

  cs:
    name: 计算机基础手册
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install numpy pyzmq
      - name: 运行全部 C 程序与 Python 脚本，输出与页面逐行比对
        working-directory: cs
        run: PYTHON="$(which python)" python tools/check_code.py

  torch:
    name: PyTorch 速成
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install numpy
      - name: 八章的代码跑一遍，输出与页面逐行比对
        env:
          OMP_NUM_THREADS: "2"
        run: PYTHON="$(which python)" python torch/tools/check_code.py

  scratch:
    name: 从零训练一个小模型
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install tokenizers numpy
      - name: 六章接力跑一遍，输出与页面逐行比对
        env:
          OMP_NUM_THREADS: "2"
        run: PYTHON="$(which python)" python scratch/tools/check_code.py

  train:
    name: 分布式训练手册
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install tokenizers numpy
      - name: 运行全部脚本（多进程用 torchrun + gloo），输出与页面逐行比对
        working-directory: train
        env:
          OMP_NUM_THREADS: "2"
        run: PYTHON="$(which python)" python tools/check_code.py

  media:
    name: 图像与视频生成推理手册
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install diffusers transformers accelerate safetensors numpy pillow sentencepiece
      - name: 运行全部示例（最小配置随机初始化，不下载权重），输出与页面逐行比对
        working-directory: media
        env:
          OMP_NUM_THREADS: "2"
        run: PYTHON="$(which python)" python tools/check_code.py

  sglang:
    name: SGLang 设计演进手册
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # 要完整对象库（约 400 MB）：书里有 git log -S 这类要读每个提交内容的命令，blob:none 的克隆会按需逐个取 blob，半小时也跑不完
      - name: 克隆 SGLang 仓库（完整历史，不要工作区）
        run: git clone --quiet --no-checkout https://github.com/sgl-project/sglang.git ~/sglang-src
      - name: 在克隆上重跑所有命令、重新截取所有引用的历史代码，与页面逐行比对
        working-directory: sglang
        run: python tools/check_code.py

  omni:
    name: SGLang-Omni 源码导读
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 克隆 sglang-omni（完整历史）与 SGLang v0.5.21（只要这个 tag）
        run: |
          git clone --quiet https://github.com/sgl-project/sglang-omni.git ~/sglang-omni-src
          git clone --quiet --depth 1 --branch v0.5.21 https://github.com/sgl-project/sglang.git ~/sglang-src
      - name: 本书的环境：CPU 版 PyTorch + 只装 Python 部分的 SGLang
        run: |
          python -m venv omni/.venv-omni
          omni/.venv-omni/bin/pip install -q --index-url https://download.pytorch.org/whl/cpu torch==2.13.0 torchvision==0.28.0 torchaudio==2.11.0
          omni/.venv-omni/bin/pip install -q -r omni/requirements-check.txt
          omni/.venv-omni/bin/pip install -q --no-deps sglang==0.5.21
      - name: 重跑实验、重新截取引用的源码，与页面逐行比对（第十章会构建 Rust router）
        working-directory: omni
        run: python tools/check_code.py
