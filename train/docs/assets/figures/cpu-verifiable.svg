<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="没有多卡时能学什么：逻辑和数值正确性在 CPU 上用 gloo 多进程 100% 验证，性能数字一个都不能信">
  <rect x="30.0" y="40.0" width="400.0" height="150.0" rx="10" class="green" stroke-width="1.2"/>
  <text x="230.0" y="58.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">CPU 上能验证（torchrun + gloo，4 个进程）</text>
  <rect x="45.0" y="70.0" width="370.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="230.0" y="81.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">集合通信的语义、环形 all-reduce 的通信量</text>
  <rect x="45.0" y="98.0" width="370.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="230.0" y="109.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">DDP 的分桶与重叠逻辑、ZeRO 的切分与 all-gather 时机</text>
  <rect x="45.0" y="126.0" width="370.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="230.0" y="137.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">TP / SP 的切法、流水线的 1F1B 气泡、Ulysses / Ring 注意力</text>
  <rect x="45.0" y="154.0" width="370.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="230.0" y="165.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">专家并行的 all-to-all 与负载统计；α-β 时间模型纯算</text>
  <rect x="460.0" y="40.0" width="210.0" height="150.0" rx="10" class="red" stroke-width="1.2"/>
  <text x="565.0" y="58.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">必须真卡</text>
  <rect x="475.0" y="70.0" width="180.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="565.0" y="81.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">实测带宽与拓扑</text>
  <rect x="475.0" y="98.0" width="180.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="565.0" y="109.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">重叠的真实收益、scaling 曲线</text>
  <rect x="475.0" y="126.0" width="180.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="565.0" y="137.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">NCCL 调参、多机 RDMA</text>
  <rect x="475.0" y="154.0" width="180.0" height="22.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="565.0" y="165.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">故障恢复、弹性训练</text>
  <text x="350.0" y="212.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">最重要的一招：每种并行都写一个单进程参考实现，多进程版本和它逐元素对齐；一张卡能多补的是 kernel 级的 profiling 和混合精度</text>
</svg>
