<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" role="img" aria-label="环形 all-reduce：reduce-scatter 之后接 all-gather">
  <line x1="159.1" y1="69.1" x2="199.4" y2="109.4" class="ln" stroke-width="1.5"/>
  <polygon points="202.9,112.9 196.2,111.0 201.0,106.2" class="ah"/>
  <line x1="202.9" y1="151.1" x2="162.6" y2="191.4" class="ln" stroke-width="1.5"/>
  <polygon points="159.1,194.9 161.0,188.2 165.8,193.0" class="ah"/>
  <line x1="120.9" y1="194.9" x2="80.6" y2="154.6" class="ln" stroke-width="1.5"/>
  <polygon points="77.1,151.1 83.8,153.0 79.0,157.8" class="ah"/>
  <line x1="77.1" y1="112.9" x2="117.4" y2="72.6" class="ln" stroke-width="1.5"/>
  <polygon points="120.9,69.1 119.0,75.8 114.2,71.0" class="ah"/>
  <circle cx="140.0" cy="50.0" r="27.0" class="blue" stroke-width="1.3"/>
  <text x="140.0" y="50.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">GPU 0</text>
  <circle cx="222.0" cy="132.0" r="27.0" class="blue" stroke-width="1.3"/>
  <text x="222.0" y="132.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">GPU 1</text>
  <circle cx="140.0" cy="214.0" r="27.0" class="blue" stroke-width="1.3"/>
  <text x="140.0" y="214.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">GPU 2</text>
  <circle cx="58.0" cy="132.0" r="27.0" class="blue" stroke-width="1.3"/>
  <text x="58.0" y="132.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">GPU 3</text>
  <text x="280.0" y="36.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle">数据切成 N 份，沿环传 2(N−1) 步：</text>
  <text x="280.0" y="74.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle"><tspan x="280.0" dy="-14.3">① reduce-scatter（N−1 步）：每步把收到的一份累加进</tspan><tspan x="280.0" dy="14.3">   自己的对应份，再传给下一张卡；结束时每张卡各有</tspan><tspan x="280.0" dy="14.3">   一份完整的和</tspan></text>
  <text x="280.0" y="138.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle"><tspan x="280.0" dy="-7.1">② all-gather（N−1 步）：把各自那一份沿环传一圈，</tspan><tspan x="280.0" dy="14.3">   每张卡都拿到全部的和</tspan></text>
  <text x="280.0" y="184.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">每张卡收发的数据量 ≈ 2(N−1)/N × 数据大小：</text>
  <text x="280.0" y="206.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">几乎与卡数无关，带宽用满，只有启动延迟随 N 增长</text>
  <text x="340.0" y="252.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">DDP 的梯度同步、张量并行每层的输出都靠它（或者它的树形、分层变体）</text>
</svg>
