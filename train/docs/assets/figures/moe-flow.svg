<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="专家并行的一次前向：路由 → 按目标专家排序 → 交换数量 → dispatch（all-to-all）→ 各卡的专家分组 GEMM → combine（反向的 all-to-all）→ 加权求和">
  <rect x="20.0" y="50.0" width="100.0" height="70.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="70.0" y="85.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="70.0" dy="-11.2">路由</tspan><tspan x="70.0" dy="11.2">每个 token 选 top-k</tspan><tspan x="70.0" dy="11.2">专家 + 门控权重</tspan></text>
  <line x1="120.0" y1="85.0" x2="127.0" y2="85.0" class="ln" stroke-width="1.2"/>
  <polygon points="132.0,85.0 125.9,88.4 125.9,81.6" class="ah"/>
  <rect x="132.0" y="50.0" width="100.0" height="70.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="182.0" y="85.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="182.0" dy="-11.2">排序</tspan><tspan x="182.0" dy="11.2">按目标专家把</tspan><tspan x="182.0" dy="11.2">(token, 专家) 排好</tspan></text>
  <line x1="232.0" y1="85.0" x2="239.0" y2="85.0" class="ln" stroke-width="1.2"/>
  <polygon points="244.0,85.0 237.9,88.4 237.9,81.6" class="ah"/>
  <rect x="244.0" y="50.0" width="100.0" height="70.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="294.0" y="85.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="294.0" dy="-11.2">交换数量</tspan><tspan x="294.0" dy="11.2">小 all-to-all：</tspan><tspan x="294.0" dy="11.2">各卡要收多少</tspan></text>
  <line x1="344.0" y1="85.0" x2="351.0" y2="85.0" class="ln" stroke-width="1.2"/>
  <polygon points="356.0,85.0 349.9,88.4 349.9,81.6" class="ah"/>
  <rect x="356.0" y="50.0" width="100.0" height="70.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="406.0" y="85.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="406.0" dy="-11.2">dispatch</tspan><tspan x="406.0" dy="11.2">all-to-all 把 token</tspan><tspan x="406.0" dy="11.2">送到专家所在的卡</tspan></text>
  <line x1="456.0" y1="85.0" x2="463.0" y2="85.0" class="ln" stroke-width="1.2"/>
  <polygon points="468.0,85.0 461.9,88.4 461.9,81.6" class="ah"/>
  <rect x="468.0" y="50.0" width="100.0" height="70.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="518.0" y="85.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="518.0" dy="-11.2">专家计算</tspan><tspan x="518.0" dy="11.2">分组 GEMM：每个</tspan><tspan x="518.0" dy="11.2">专家算自己那批</tspan></text>
  <line x1="568.0" y1="85.0" x2="575.0" y2="85.0" class="ln" stroke-width="1.2"/>
  <polygon points="580.0,85.0 573.9,88.4 573.9,81.6" class="ah"/>
  <rect x="580.0" y="50.0" width="100.0" height="70.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="630.0" y="85.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="630.0" dy="-11.2">combine</tspan><tspan x="630.0" dy="11.2">反向 all-to-all 送回，</tspan><tspan x="630.0" dy="11.2">按门控权重求和</tspan></text>
  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">两次 all-to-all 每层都有，每次约 top-k × s·b·h 字节：EP 的通信在机内走 NVLink、跨机走 IB，DeepEP 这类库专门优化它</text>
  <text x="350.0" y="174.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">负载均衡：路由器偏心时某张卡的专家被挤爆、其他卡空等——辅助损失 E·Σ f_e·P_e 或无辅助损失的偏置调节，加上容量上限和 EPLB 的副本</text>
  <text x="350.0" y="198.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">反向传播正好反过来：combine 的反向是 dispatch、dispatch 的反向是 combine，带 autograd 的 all_to_all_single 自动处理</text>
  <text x="350.0" y="222.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">和其他并行的组合：注意力部分用 DP / TP，专家部分用 EP；专家数远大于卡数时每张卡放多个专家，分组 GEMM 一次算完</text>
  <text x="350.0" y="246.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">推理时同一套流程，只是没有反向；大规模 EP（每卡一个专家）时 all-to-all 的延迟成了 decode 的主要开销</text>
</svg>
