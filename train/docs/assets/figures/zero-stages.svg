<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" width="700" role="img" aria-label="ZeRO：把优化器状态、梯度、参数依次切到各个数据并行 rank 上">
  <text x="430.0" y="18.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">每张卡上保存的内容（4 张卡，按字节数画宽度：2 + 2 + 12 字节 / 参数）</text>
