  <text x="174.0" y="107.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">参数</text>
  <rect x="204.0" y="90.0" width="48.0" height="34.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="228.0" y="107.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">梯度</text>
  <rect x="258.0" y="90.0" width="72.0" height="34.0" rx="4" class="green" stroke-width="1.3"/>
