  <text x="680.0" y="107.0" class="mu" font-size="12" text-anchor="end" dominant-baseline="middle">7 字节 / 参数</text>
  <text x="80.0" y="161.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">ZeRO-2</text>
  <rect x="150.0" y="144.0" width="48.0" height="34.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="174.0" y="161.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">参数</text>
  <rect x="204.0" y="144.0" width="12.0" height="34.0" rx="4" class="orange" stroke-width="1.3"/>
  <rect x="222.0" y="144.0" width="72.0" height="34.0" rx="4" class="green" stroke-width="1.3"/>
  <text x="258.0" y="161.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">优化器状态</text>
