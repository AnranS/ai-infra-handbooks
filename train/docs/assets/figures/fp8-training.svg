<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" role="img" aria-label="FP8 训练的数据流：矩阵乘的输入量化成 FP8（前向 E4M3、反向梯度 E5M2），累加和主权重仍在高精度">
  <rect x="30.0" y="50.0" width="120.0" height="44.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="90.0" y="72.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">激活 x（bf16）</text>
  <rect x="30.0" y="120.0" width="120.0" height="44.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="90.0" y="142.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">权重 W（bf16 副本）</text>
  <line x1="150.0" y1="72.0" x2="195.0" y2="72.0" class="ln" stroke-width="1.2"/>
  <polygon points="200.0,72.0 193.9,75.4 193.9,68.6" class="ah"/>
  <text x="175.0" y="62.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">× 缩放 → E4M3</text>
  <line x1="150.0" y1="142.0" x2="195.0" y2="142.0" class="ln" stroke-width="1.2"/>
  <polygon points="200.0,142.0 193.9,145.4 193.9,138.6" class="ah"/>
  <text x="175.0" y="132.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">× 缩放 → E4M3</text>
  <rect x="200.0" y="60.0" width="130.0" height="94.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="265.0" y="107.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="265.0" dy="-12.4">FP8 GEMM</tspan><tspan x="265.0" dy="12.4">Tensor Core</tspan><tspan x="265.0" dy="12.4">累加在 fp32</tspan></text>
  <line x1="330.0" y1="107.0" x2="375.0" y2="107.0" class="ln" stroke-width="1.2"/>
  <polygon points="380.0,107.0 373.9,110.4 373.9,103.6" class="ah"/>
  <text x="355.0" y="97.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">反量化</text>
  <rect x="380.0" y="85.0" width="110.0" height="44.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="435.0" y="107.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">输出 y（bf16）</text>
  <rect x="520.0" y="50.0" width="150.0" height="44.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="595.0" y="72.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="595.0" dy="-5.9">反向：梯度用 E5M2</tspan><tspan x="595.0" dy="11.8">（范围大、精度低）</tspan></text>
  <rect x="520.0" y="120.0" width="150.0" height="44.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="595.0" y="142.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="595.0" dy="-5.9">主权重 + 优化器状态</tspan><tspan x="595.0" dy="11.8">fp32，从不量化</tspan></text>
  <text x="350.0" y="192.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">缩放因子怎么定：逐张量（延迟缩放，用上几步的 amax）简单但一个离群值毁一整张；细粒度（激活 1×128、权重 128×128，DeepSeek-V3）把影响局限在一小块</text>
  <text x="350.0" y="216.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">E4M3 最大 448、相对精度 1/8：数值必须先缩放进范围；E5M2 范围到 57344，给动态范围更大的梯度用</text>
  <text x="350.0" y="240.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">能省的是矩阵乘的时间和激活显存（存 FP8 版本）；归一化、softmax、优化器步骤仍在 fp32 / bf16，所以端到端加速通常 1.2～1.5 倍</text>
  <text x="350.0" y="264.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">FP4 训练再往下走：缩放更细、随机舍入、Hadamard 变换把离群值摊开——每一步都在和"少数几个大数"作斗争</text>
</svg>
