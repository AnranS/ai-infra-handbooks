<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" role="img" aria-label="the data flow of FP8 training: the matrix multiplies' inputs quantised to FP8 (E4M3 forward, E5M2 for the backward gradients) while the accumulation and the master weights stay in high precision">
  <rect x="30.0" y="50.0" width="120.0" height="44.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="90.0" y="72.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">the activations x (bf16)</text>
  <rect x="30.0" y="120.0" width="120.0" height="44.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="90.0" y="142.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">the weights W (bf16)</text>
  <line x1="150.0" y1="72.0" x2="195.0" y2="72.0" class="ln" stroke-width="1.2"/>
  <polygon points="200.0,72.0 193.9,75.4 193.9,68.6" class="ah"/>
  <text x="175.0" y="62.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">x scale → E4M3</text>
  <line x1="150.0" y1="142.0" x2="195.0" y2="142.0" class="ln" stroke-width="1.2"/>
  <polygon points="200.0,142.0 193.9,145.4 193.9,138.6" class="ah"/>
  <text x="175.0" y="132.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">x scale → E4M3</text>
  <rect x="200.0" y="60.0" width="130.0" height="94.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="265.0" y="107.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="265.0" dy="-12.4">the FP8 GEMM</tspan><tspan x="265.0" dy="12.4">on Tensor Cores</tspan><tspan x="265.0" dy="12.4">accumulating in fp32</tspan></text>
  <line x1="330.0" y1="107.0" x2="375.0" y2="107.0" class="ln" stroke-width="1.2"/>
  <polygon points="380.0,107.0 373.9,110.4 373.9,103.6" class="ah"/>
  <text x="355.0" y="97.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">dequantise</text>
  <rect x="380.0" y="85.0" width="110.0" height="44.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="435.0" y="107.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">the output y (bf16)</text>
  <rect x="520.0" y="50.0" width="150.0" height="44.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="595.0" y="72.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="595.0" dy="-5.9">backward: gradients in E5M2</tspan><tspan x="595.0" dy="11.8">(more range, less precision)</tspan></text>
  <rect x="520.0" y="120.0" width="150.0" height="44.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="595.0" y="142.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="595.0" dy="-5.9">master weights + optimizer</tspan><tspan x="595.0" dy="11.8">states in fp32, never quantised</tspan></text>
  <text x="350.0" y="192.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the scaling factor: per tensor (delayed, from recent amax) is simple but one outlier ruins it; fine-grained (1x128, 128x128) confines the damage</text>
  <text x="350.0" y="216.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">E4M3 maxes at 448 with a relative precision of 1/8, so values have to be scaled into range; E5M2 reaches 57344, for gradients with a wider dynamic range</text>
  <text x="350.0" y="240.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">what is saved is the matrix multiplies' time and the activation memory; normalisation, softmax and the optimizer stay higher, so 1.2 to 1.5 times</text>
  <text x="350.0" y="264.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">FP4 training goes further: finer scaling, stochastic rounding, a Hadamard transform to spread the outliers. Every step fights the same few large numbers</text>
</svg>
