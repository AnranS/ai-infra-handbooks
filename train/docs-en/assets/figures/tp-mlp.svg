  <rect x="330.0" y="150.0" width="100.0" height="56.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="380.0" y="178.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle"><tspan x="380.0" dy="-7.4">H1</tspan><tspan x="380.0" dy="14.9">(half the cols)</tspan></text>
