<text class="dg-t2" x="80" y="280.0" font-size="12" text-anchor="start">前提：下一轮的输入由上一轮的采样结果在 GPU 上写进 token pool；请求状态在发射时就推进（complete_one）。</text>
<text class="dg-t2" x="80" y="302.0" font-size="12" text-anchor="start">代价：处理第 N 轮时 CPU 状态已领先一轮；在第 N 轮遇到 EOS 的请求会被多调度一轮。</text></svg>
