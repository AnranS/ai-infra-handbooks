<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" class="dg-svg" style="max-width:980px" role="img"><defs><marker id="overlap-hazard-a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-blue" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-blue" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-green" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-green" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-orange" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-orange" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-purple" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-purple" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-pink" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-pink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-pink" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-teal" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-teal" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-teal" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-red" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-red" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-yellow" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-yellow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-yellow" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-gray" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-gray" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-gray" d="M10 1 0 5 10 9z"/></marker></defs><text class="dg-t" x="20" y="24.0" font-size="13" text-anchor="start" font-weight="600">请求 X 在第 N 轮采样出 EOS</text>
<rect class="dg-fill-orange" x="40" y="46" width="170" height="56" rx="8"/>
<text class="dg-t" x="125.0" y="68.6" font-size="12" text-anchor="middle" font-weight="600">发射 N+1</text>
<text class="dg-t2" x="125.0" y="83.6" font-size="10" text-anchor="middle">（含 X）</text>
<rect class="dg-fill-blue" x="240" y="46" width="170" height="56" rx="8"/>
<text class="dg-t" x="325.0" y="68.6" font-size="12" text-anchor="middle" font-weight="600">处理 N：</text>
<text class="dg-t2" x="325.0" y="83.6" font-size="10" text-anchor="middle">X 结束、释放</text>
<rect class="dg-fill-orange" x="440" y="46" width="170" height="56" rx="8"/>
<text class="dg-t" x="525.0" y="68.6" font-size="12" text-anchor="middle" font-weight="600">调度 N+2：</text>
<text class="dg-t2" x="525.0" y="83.6" font-size="10" text-anchor="middle">请求槽可以复用吗？</text>
<rect class="dg-fill-blue" x="680" y="46" width="170" height="56" rx="8"/>
<text class="dg-t" x="765.0" y="68.6" font-size="12" text-anchor="middle" font-weight="600">处理 N+1：</text>
<text class="dg-t2" x="765.0" y="83.6" font-size="10" text-anchor="middle">X 的结果是过期的</text>
<rect class="dg-fill-purple" x="40" y="132" width="560" height="34" rx="8"/>
<text class="dg-t" x="320.0" y="153.2" font-size="12" text-anchor="middle">GPU：第 N+1 轮计算中（会往 X 那一行 token pool 写采样结果）</text>
<rect class="dg-fill-purple" x="600" y="132" width="250" height="34" rx="8"/>
<text class="dg-t" x="725.0" y="153.2" font-size="12" text-anchor="middle">第 N+2 轮</text>
<line class="dg-ln-red" x1="605" y1="108" x2="520" y2="128" stroke-width="1.6" marker-end="url(#overlap-hazard-a-red)"/>
<text class="dg-tc-red" x="470" y="196.0" font-size="12" text-anchor="middle">官方：立即把 X 的请求槽分给新请求 → 调度器 stream 与引擎 stream 写同一行，没有先后保证</text>
<text class="dg-tc-green" x="470" y="220.0" font-size="12" text-anchor="middle">本书：推迟到&quot;处理 N+1&quot;（在途 batch 已算完）再归还请求槽；X 的过期结果整体丢弃</text>
<text class="dg-t2" x="470" y="256.0" font-size="12" text-anchor="middle">同一套逻辑也修正了：finished 提前一个 token、过期消息、prefill 在途时 abort 导致页重复释放</text></svg>
