<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 230" class="dg-svg" style="max-width:980px" role="img"><defs><marker id="cache-regions-a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-blue" d="M0 1 10 5 0 9z"/></marker><marker id="cache-regions-s-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-blue" d="M10 1 0 5 10 9z"/></marker><marker id="cache-regions-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-green" d="M0 1 10 5 0 9z"/></marker><marker id="cache-regions-s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-green" d="M10 1 0 5 10 9z"/></marker><marker id="cache-regions-a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-orange" d="M0 1 10 5 0 9z"/></marker><marker id="cache-regions-s-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-orange" d="M10 1 0 5 10 9z"/></marker><marker id="cache-regions-a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-purple" d="M0 1 10 5 0 9z"/></marker><marker id="cache-regions-s-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-purple" d="M10 1 0 5 10 9z"/></marker><marker id="cache-regions-a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-pink" d="M0 1 10 5 0 9z"/></marker><marker id="cache-regions-s-pink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-pink" d="M10 1 0 5 10 9z"/></marker><marker id="cache-regions-a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-teal" d="M0 1 10 5 0 9z"/></marker><marker id="cache-regions-s-teal" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-teal" d="M10 1 0 5 10 9z"/></marker><marker id="cache-regions-a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-red" d="M0 1 10 5 0 9z"/></marker><marker id="cache-regions-s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-red" d="M10 1 0 5 10 9z"/></marker><marker id="cache-regions-a-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-yellow" d="M0 1 10 5 0 9z"/></marker><marker id="cache-regions-s-yellow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-yellow" d="M10 1 0 5 10 9z"/></marker><marker id="cache-regions-a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-gray" d="M0 1 10 5 0 9z"/></marker><marker id="cache-regions-s-gray" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-gray" d="M10 1 0 5 10 9z"/></marker></defs><rect class="dg-fill-gray" x="40" y="60" width="198.0" height="70" rx="0"/>
<text class="dg-t" x="139.0" y="89.2" font-size="13" text-anchor="middle" font-weight="600">接纳时命中的前缀</text>
<text class="dg-t2" x="139.0" y="105.4" font-size="11" text-anchor="middle">锁着 → 解锁即可</text>
<text class="dg-t2 dg-mono" x="40" y="48.0" font-size="11" text-anchor="start">0</text>
<rect class="dg-fill-red" x="238.0" y="60" width="180.0" height="70" rx="0"/>
<text class="dg-t" x="328.0" y="89.2" font-size="13" text-anchor="middle" font-weight="600">自己算的，但缓存里已有</text>
<text class="dg-t2" x="328.0" y="105.4" font-size="11" text-anchor="middle">重复的一份 → 释放</text>
<text class="dg-t2 dg-mono" x="238.0" y="48.0" font-size="11" text-anchor="middle">old.cached_len</text>
<rect class="dg-fill-green" x="418.0" y="60" width="342.0" height="70" rx="0"/>
<text class="dg-t" x="589.0" y="89.2" font-size="13" text-anchor="middle" font-weight="600">本次插入缓存</text>
<text class="dg-t2" x="589.0" y="105.4" font-size="11" text-anchor="middle">所有权交给 Radix Cache</text>
<text class="dg-t2 dg-mono" x="418.0" y="48.0" font-size="11" text-anchor="middle">cached_len</text>
<rect class="dg-fill-orange" x="760.0" y="60" width="180.0" height="70" rx="0"/>
<text class="dg-t" x="850.0" y="89.2" font-size="13" text-anchor="middle" font-weight="600">不足一页的尾巴</text>
<text class="dg-t2" x="850.0" y="105.4" font-size="11" text-anchor="middle">结束时释放，否则保留</text>
<text class="dg-t2 dg-mono" x="760.0" y="48.0" font-size="11" text-anchor="middle">new.cached_len</text>
<text class="dg-t2 dg-mono" x="940" y="48.0" font-size="11" text-anchor="end">req.cached_len</text>
<text class="dg-t2" x="40" y="170.0" font-size="12" text-anchor="start">CacheManager.cache_req(req, finished)：prefill 刚结束时 finished=False，请求结束时 finished=True。</text>
<text class="dg-t2" x="40" y="192.0" font-size="12" text-anchor="start">红色段来自&quot;两个前缀相同的请求同时 prefill&quot;：先结束的已把前缀插入缓存，后结束的那份就是多余的。</text></svg>
