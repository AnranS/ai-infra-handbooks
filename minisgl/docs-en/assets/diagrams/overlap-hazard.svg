<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" class="dg-svg" style="max-width:980px" role="img"><defs><marker id="overlap-hazard-a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-blue" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-blue" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-green" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-green" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-orange" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-orange" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-purple" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-purple" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-pink" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-pink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-pink" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-teal" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-teal" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-teal" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-red" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-red" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-yellow" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-yellow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-yellow" d="M10 1 0 5 10 9z"/></marker><marker id="overlap-hazard-a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-gray" d="M0 1 10 5 0 9z"/></marker><marker id="overlap-hazard-s-gray" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-gray" d="M10 1 0 5 10 9z"/></marker></defs><text class="dg-t" x="20" y="24.0" font-size="13" text-anchor="start" font-weight="600">request X samples EOS at step N</text>
<rect class="dg-fill-orange" x="40" y="46" width="170" height="56" rx="8"/>
<text class="dg-t" x="125.0" y="68.6" font-size="12" text-anchor="middle" font-weight="600">launch N+1</text>
<text class="dg-t2" x="125.0" y="83.6" font-size="10" text-anchor="middle">(X included)</text>
<rect class="dg-fill-blue" x="240" y="46" width="170" height="56" rx="8"/>
<text class="dg-t" x="325.0" y="68.6" font-size="12" text-anchor="middle" font-weight="600">handle N:</text>
<text class="dg-t2" x="325.0" y="83.6" font-size="10" text-anchor="middle">X ends, slot freed</text>
<rect class="dg-fill-orange" x="440" y="46" width="170" height="56" rx="8"/>
<text class="dg-t" x="525.0" y="68.6" font-size="12" text-anchor="middle" font-weight="600">schedule N+2:</text>
<text class="dg-t2" x="525.0" y="83.6" font-size="10" text-anchor="middle">can the slot be reused?</text>
<rect class="dg-fill-blue" x="680" y="46" width="170" height="56" rx="8"/>
<text class="dg-t" x="765.0" y="68.6" font-size="12" text-anchor="middle" font-weight="600">handle N+1:</text>
<text class="dg-t2" x="765.0" y="83.6" font-size="10" text-anchor="middle">X&#x27;s result is stale</text>
<rect class="dg-fill-purple" x="40" y="132" width="560" height="34" rx="8"/>
<text class="dg-t" x="320.0" y="153.2" font-size="12" text-anchor="middle">GPU: running step N+1 (it will write its sample into X&#x27;s token-pool row)</text>
<rect class="dg-fill-purple" x="600" y="132" width="250" height="34" rx="8"/>
<text class="dg-t" x="725.0" y="153.2" font-size="12" text-anchor="middle">step N+2</text>
<line class="dg-ln-red" x1="605" y1="108" x2="520" y2="128" stroke-width="1.6" marker-end="url(#overlap-hazard-a-red)"/>
<text class="dg-tc-red" x="470" y="196.0" font-size="12" text-anchor="middle">upstream: X&#x27;s slot goes to a new request at once → the scheduler stream and the engine stream write the same row with no ordering</text>
<text class="dg-tc-green" x="470" y="220.0" font-size="12" text-anchor="middle">this book: the slot is returned only at &quot;handle N+1&quot;, once the in-flight batch is done, and X&#x27;s stale result is dropped whole</text>
<text class="dg-t2" x="470" y="256.0" font-size="12" text-anchor="middle">the same logic also fixes: finished one token early, stale messages, and pages freed twice when a request aborts mid-prefill</text></svg>
