<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 380" class="dg-svg" style="max-width:980px" role="img"><defs><marker id="cuda-graph-a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-blue" d="M0 1 10 5 0 9z"/></marker><marker id="cuda-graph-s-blue" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-blue" d="M10 1 0 5 10 9z"/></marker><marker id="cuda-graph-a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-green" d="M0 1 10 5 0 9z"/></marker><marker id="cuda-graph-s-green" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-green" d="M10 1 0 5 10 9z"/></marker><marker id="cuda-graph-a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-orange" d="M0 1 10 5 0 9z"/></marker><marker id="cuda-graph-s-orange" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-orange" d="M10 1 0 5 10 9z"/></marker><marker id="cuda-graph-a-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-purple" d="M0 1 10 5 0 9z"/></marker><marker id="cuda-graph-s-purple" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-purple" d="M10 1 0 5 10 9z"/></marker><marker id="cuda-graph-a-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-pink" d="M0 1 10 5 0 9z"/></marker><marker id="cuda-graph-s-pink" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-pink" d="M10 1 0 5 10 9z"/></marker><marker id="cuda-graph-a-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-teal" d="M0 1 10 5 0 9z"/></marker><marker id="cuda-graph-s-teal" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-teal" d="M10 1 0 5 10 9z"/></marker><marker id="cuda-graph-a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-red" d="M0 1 10 5 0 9z"/></marker><marker id="cuda-graph-s-red" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-red" d="M10 1 0 5 10 9z"/></marker><marker id="cuda-graph-a-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-yellow" d="M0 1 10 5 0 9z"/></marker><marker id="cuda-graph-s-yellow" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-yellow" d="M10 1 0 5 10 9z"/></marker><marker id="cuda-graph-a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="dg-mk-gray" d="M0 1 10 5 0 9z"/></marker><marker id="cuda-graph-s-gray" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="dg-mk-gray" d="M10 1 0 5 10 9z"/></marker></defs><text class="dg-t" x="20" y="24.0" font-size="13" text-anchor="start" font-weight="600">capture (once per batch size)</text>
<rect class="dg-fill-gray" x="20" y="40" width="200" height="70" rx="8"/>
<text class="dg-t" x="120.0" y="69.2" font-size="13" text-anchor="middle" font-weight="600">dummy batch</text>
<text class="dg-t2" x="120.0" y="85.4" font-size="11" text-anchor="middle">bs dummy requests</text>
<rect class="dg-fill-teal" x="290" y="40" width="300" height="70" rx="8"/>
<text class="dg-t" x="440.0" y="69.2" font-size="13" text-anchor="middle" font-weight="600">fixed buffers</text>
<text class="dg-t2" x="440.0" y="85.4" font-size="11" text-anchor="middle">input_ids · positions · out_loc · logits</text>
<rect class="dg-fill-teal" x="660" y="40" width="300" height="70" rx="8"/>
<text class="dg-t" x="810.0" y="69.2" font-size="13" text-anchor="middle" font-weight="600">the attention backend&#x27;s captured buffers</text>
<text class="dg-t2" x="810.0" y="85.4" font-size="11" text-anchor="middle">seq_lens · page_table (or the FlashInfer wrapper)</text>
<line class="dg-ln-gray" x1="222" y1="75" x2="288" y2="75" stroke-width="1.6" marker-end="url(#cuda-graph-a-gray)"/>
<text class="dg-t2" x="255.0" y="69.0" font-size="12" text-anchor="middle">points to</text>
<line class="dg-ln-gray" x1="592" y1="75" x2="658" y2="75" stroke-width="1.6" marker-end="url(#cuda-graph-a-gray)"/>
<rect class="dg-fill-purple" x="290" y="140" width="670" height="50" rx="8"/>
<text class="dg-t" x="625.0" y="169.6" font-size="13" text-anchor="middle">torch.cuda.graph: records every kernel of model.forward() (pointers fixed)</text>
<text class="dg-t" x="20" y="230.0" font-size="13" text-anchor="start" font-weight="600">replay (every decode step)</text>
<rect class="dg-fill-blue" x="20" y="246" width="200" height="70" rx="8"/>
<text class="dg-t" x="120.0" y="275.1" font-size="13" text-anchor="middle" font-weight="600">current batch</text>
<text class="dg-t2" x="120.0" y="291.4" font-size="11" text-anchor="middle">3 requests → padded to 4</text>
<rect class="dg-fill-blue" x="290" y="246" width="300" height="70" rx="8"/>
<text class="dg-t" x="440.0" y="275.1" font-size="13" text-anchor="middle" font-weight="600">copy_from</text>
<text class="dg-t2" x="440.0" y="291.4" font-size="11" text-anchor="middle">copy the inputs into the fixed buffers</text>
<rect class="dg-fill-blue" x="660" y="246" width="300" height="70" rx="8"/>
<text class="dg-t" x="810.0" y="275.1" font-size="13" text-anchor="middle" font-weight="600">prepare_for_replay</text>
<text class="dg-t2" x="810.0" y="291.4" font-size="11" text-anchor="middle">copy the metadata into the captured buffers</text>
<line class="dg-ln-blue" x1="222" y1="281" x2="288" y2="281" stroke-width="1.6" marker-end="url(#cuda-graph-a-blue)"/>
<line class="dg-ln-blue" x1="592" y1="281" x2="658" y2="281" stroke-width="1.6" marker-end="url(#cuda-graph-a-blue)"/>
<line class="dg-ln-purple" x1="810" y1="244" x2="810" y2="192" stroke-width="1.6" marker-end="url(#cuda-graph-a-purple)"/>
<text class="dg-tc-purple" x="870" y="222.0" font-size="12" text-anchor="middle">graph.replay()</text>
<text class="dg-tc-red" x="20" y="356.0" font-size="12" text-anchor="start">Miss one input and the graph silently reads the old value. The CPU emulation EmulatedGraph exists to catch exactly this.</text></svg>
