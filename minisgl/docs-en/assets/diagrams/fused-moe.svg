<text class="dg-t2" x="20" y="300.0" font-size="12" text-anchor="start">A whole MoE layer takes just two kernel launches; the top_k results are then summed per token.</text>
<text class="dg-t2" x="20" y="322.0" font-size="12" text-anchor="start">A bigger block wastes more on padding, clearest during decode; a smaller one makes the matmul less efficient.</text></svg>
