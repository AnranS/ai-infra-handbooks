  <polygon points="250.0,180.0 243.8,176.8 249.3,173.0" class="ah"/>
  <line x1="400.0" y1="66.0" x2="432.9" y2="108.1" class="ln" stroke-width="1.4"/>
  <polygon points="436.0,112.0 429.6,109.2 434.9,105.1" class="ah"/>
  <line x1="400.0" y1="182.0" x2="433.0" y2="138.0" class="ln" stroke-width="1.4"/>
