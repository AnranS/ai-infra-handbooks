<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" role="img" aria-label="Rust router 里一条请求的路径：同质池直接流式转发，异构池先在有界预算里分类，再准入、选择、转发">
  <rect x="14.0" y="100.0" width="76.0" height="46.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="52.0" y="123.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">客户端</text>
  <rect x="120.0" y="100.0" width="96.0" height="46.0" rx="7" class="bx" stroke-width="1.3"/>
  <text x="168.0" y="123.0" class="tx" font-size="9.4" text-anchor="middle" dominant-baseline="middle"><tspan x="168.0" dy="-5.8">有界监听器</tspan><tspan x="168.0" dy="11.7">HTTP / WS 路由</tspan></text>
  <rect x="250.0" y="40.0" width="150.0" height="46.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="325.0" y="63.0" class="tx" font-size="9.4" text-anchor="middle" dominant-baseline="middle"><tspan x="325.0" dy="-5.8">直接路径</tspan><tspan x="325.0" dy="11.7">同质池：不读请求体</tspan></text>
  <rect x="250.0" y="160.0" width="150.0" height="46.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="325.0" y="183.0" class="tx" font-size="9.4" text-anchor="middle" dominant-baseline="middle"><tspan x="325.0" dy="-5.8">分类路径</tspan><tspan x="325.0" dy="11.7">异构池：读一次、分类</tspan></text>
  <rect x="436.0" y="100.0" width="116.0" height="46.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="494.0" y="123.0" class="tx" font-size="9.4" text-anchor="middle" dominant-baseline="middle"><tspan x="494.0" dy="-5.8">准入（信号量）</tspan><tspan x="494.0" dy="11.7">选择 worker</tspan></text>
  <rect x="586.0" y="100.0" width="120.0" height="46.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="646.0" y="123.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">转发（背压）</text>
