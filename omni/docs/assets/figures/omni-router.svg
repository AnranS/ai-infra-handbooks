  <rect x="672.0" y="186.0" width="30.0" height="26.0" rx="7" class="bx" stroke-width="1.3"/>
  <text x="687.0" y="199.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">w3</text>
  <line x1="646.0" y1="146.0" x2="683.4" y2="182.5" class="ln" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="687.0,186.0 680.3,184.1 685.0,179.3" class="ah"/>
  <rect x="436.0" y="200.0" width="116.0" height="34.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="494.0" y="217.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">健康检查（串行探测）</text>
  <line x1="494.0" y1="200.0" x2="494.0" y2="151.0" class="ln" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="494.0,146.0 497.4,152.1 490.6,152.1" class="ah"/>
  <text x="360.0" y="254.0" class="mu" font-size="9.6" text-anchor="middle" dominant-baseline="middle">连接失败：502 upstream_protocol_error + 立即探测；当前不重试（RFC #1623 的待办项）</text>
</svg>
