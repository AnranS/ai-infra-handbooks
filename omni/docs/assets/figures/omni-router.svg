  <line x1="552.0" y1="123.0" x2="581.0" y2="123.0" class="ln" stroke-width="1.4"/>
  <polygon points="586.0,123.0 579.9,126.4 579.9,119.6" class="ah"/>
  <rect x="600.0" y="186.0" width="30.0" height="26.0" rx="7" class="bx" stroke-width="1.3"/>
  <text x="615.0" y="199.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">w1</text>
  <line x1="646.0" y1="146.0" x2="618.1" y2="182.0" class="ln" stroke-width="1.4" stroke-opacity="0.6"/>
  <polygon points="615.0,186.0 616.1,179.1 621.4,183.2" class="ah"/>
  <rect x="636.0" y="186.0" width="30.0" height="26.0" rx="7" class="bx" stroke-width="1.3"/>
  <text x="651.0" y="199.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">w2</text>
  <line x1="646.0" y1="146.0" x2="650.4" y2="181.0" class="ln" stroke-width="1.4" stroke-opacity="0.6"/>
