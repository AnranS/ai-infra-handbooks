<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" role="img" aria-label="Stage 的两个线程：asyncio 事件循环做 IO，调度器线程做计算，两者之间只有 inbox / outbox 两个队列">
  <rect x="110.0" y="26.0" width="500.0" height="196.0" rx="12" class="bx" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="360.0" y="42.0" class="mu" font-size="9.8" text-anchor="middle" dominant-baseline="middle">一个 OS 进程（可以住多个 stage，共享事件循环）</text>
  <rect x="130.0" y="58.0" width="190.0" height="140.0" rx="10" class="blue" stroke-width="1.3"/>
  <text x="225.0" y="76.0" class="tx" font-size="10.8" text-anchor="middle" dominant-baseline="middle" font-weight="600">asyncio 事件循环：Stage</text>
  <text x="225.0" y="132.0" class="tx" font-size="9.8" text-anchor="middle" dominant-baseline="middle"><tspan x="225.0" dy="-18.2">收 ZMQ 控制消息</tspan><tspan x="225.0" dy="12.2">读写 relay、回 ACK</tspan><tspan x="225.0" dy="12.2">扇入攒齐（AggregatedInput）</tspan><tspan x="225.0" dy="12.2">路由结果、转发流式块</tspan></text>
  <rect x="400.0" y="58.0" width="190.0" height="140.0" rx="10" class="orange" stroke-width="1.3"/>
  <text x="495.0" y="76.0" class="tx" font-size="10.8" text-anchor="middle" dominant-baseline="middle" font-weight="600">调度器线程：scheduler.start()</text>
  <text x="495.0" y="132.0" class="tx" font-size="9.8" text-anchor="middle" dominant-baseline="middle"><tspan x="495.0" dy="-18.2">从 inbox 取消息</tspan><tspan x="495.0" dy="12.2">算一个函数 / 组一批</tspan><tspan x="495.0" dy="12.2">发射一次 GPU 前向</tspan><tspan x="495.0" dy="12.2">结果放进 outbox</tspan></text>
  <line x1="320.0" y1="100.0" x2="395.0" y2="100.0" class="ln" stroke-width="1.4"/>
  <polygon points="400.0,100.0 393.9,103.4 393.9,96.6" class="ah"/>
  <text x="360.0" y="92.0" class="mu" font-size="9.6" text-anchor="middle" dominant-baseline="middle">inbox</text>
  <line x1="400.0" y1="160.0" x2="325.0" y2="160.0" class="ln" stroke-width="1.4"/>
  <polygon points="320.0,160.0 326.1,156.6 326.1,163.4" class="ah"/>
  <text x="360.0" y="174.0" class="mu" font-size="9.6" text-anchor="middle" dominant-baseline="middle">outbox</text>
  <line x1="30.0" y1="128.0" x2="125.0" y2="128.0" class="ln" stroke-width="1.4"/>
  <polygon points="130.0,128.0 123.9,131.4 123.9,124.6" class="ah"/>
  <text x="60.0" y="116.0" class="mu" font-size="9.2" text-anchor="middle" dominant-baseline="middle"><tspan x="60.0" dy="-5.7">上游 /</tspan><tspan x="60.0" dy="11.4">Coordinator</tspan></text>
  <line x1="590.0" y1="128.0" x2="685.0" y2="128.0" class="ln" stroke-width="1.4"/>
  <polygon points="690.0,128.0 683.9,131.4 683.9,124.6" class="ah"/>
  <text x="655.0" y="116.0" class="mu" font-size="9.2" text-anchor="middle" dominant-baseline="middle"><tspan x="655.0" dy="-5.7">下游 /</tspan><tspan x="655.0" dy="11.4">Coordinator</tspan></text>
  <text x="360.0" y="242.0" class="mu" font-size="9.6" text-anchor="middle" dominant-baseline="middle">inbox / outbox 都是线程安全的 queue.Queue；outbox 用 run_in_executor 阻塞读，不卡事件循环</text>
  <text x="360.0" y="260.0" class="mu" font-size="9.6" text-anchor="middle" dominant-baseline="middle">Stage 不按调度器类型分支：SimpleScheduler、OmniScheduler、流式调度器呈现同一个接口</text>
</svg>
