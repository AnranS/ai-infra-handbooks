<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" role="img" aria-label="SGLang 与 SGLang-Omni 的分工：omni 管多阶段流水线，自回归的 stage 借用 SGLang 的调度和执行">
  <text x="133.0" y="20.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">SGLang：一个进程组服务一个自回归模型</text>
  <rect x="28.0" y="38.0" width="210.0" height="38.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="133.0" y="57.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">TokenizerManager（分词）</text>
  <rect x="28.0" y="96.0" width="210.0" height="38.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="133.0" y="115.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">Scheduler（调度、KV、Radix）</text>
  <line x1="133.0" y1="76.0" x2="133.0" y2="91.0" class="ln" stroke-width="1.4"/>
  <polygon points="133.0,96.0 129.6,89.9 136.4,89.9" class="ah"/>
  <rect x="28.0" y="154.0" width="210.0" height="38.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="133.0" y="173.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">TpModelWorker / ModelRunner</text>
  <line x1="133.0" y1="134.0" x2="133.0" y2="149.0" class="ln" stroke-width="1.4"/>
  <polygon points="133.0,154.0 129.6,147.9 136.4,147.9" class="ah"/>
  <rect x="28.0" y="212.0" width="210.0" height="38.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="133.0" y="231.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">Detokenizer（反分词）</text>
  <line x1="133.0" y1="192.0" x2="133.0" y2="207.0" class="ln" stroke-width="1.4"/>
  <polygon points="133.0,212.0 129.6,205.9 136.4,205.9" class="ah"/>
  <text x="133.0" y="282.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">输出：文本 token</text>
  <text x="497.0" y="20.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle" font-weight="600">SGLang-Omni：多个 stage 组成的流水线</text>
  <rect x="318.0" y="36.0" width="358.0" height="32.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="497.0" y="52.0" class="tx" font-size="9.6" text-anchor="middle" dominant-baseline="middle">HTTP API → Client → Coordinator（请求生命周期、多终点合并、abort）</text>
  <rect x="300.0" y="104.0" width="88.0" height="50.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="344.0" y="129.0" class="tx" font-size="9.6" text-anchor="middle" dominant-baseline="middle"><tspan x="344.0" dy="-6.0">编码器</tspan><tspan x="344.0" dy="11.9">SimpleScheduler</tspan></text>
  <rect x="396.0" y="104.0" width="88.0" height="50.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="440.0" y="129.0" class="tx" font-size="9.6" text-anchor="middle" dominant-baseline="middle"><tspan x="440.0" dy="-6.0">thinker</tspan><tspan x="440.0" dy="11.9">OmniScheduler</tspan></text>
  <rect x="492.0" y="104.0" width="88.0" height="50.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="536.0" y="129.0" class="tx" font-size="9.6" text-anchor="middle" dominant-baseline="middle"><tspan x="536.0" dy="-6.0">talker</tspan><tspan x="536.0" dy="11.9">OmniScheduler</tspan></text>
  <rect x="588.0" y="104.0" width="88.0" height="50.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="632.0" y="129.0" class="tx" font-size="9.6" text-anchor="middle" dominant-baseline="middle"><tspan x="632.0" dy="-6.0">声码器</tspan><tspan x="632.0" dy="11.9">流式调度器</tspan></text>
  <line x1="388.0" y1="129.0" x2="391.0" y2="129.0" class="ln" stroke-width="1.4"/>
  <polygon points="396.0,129.0 389.9,132.4 389.9,125.6" class="ah"/>
  <line x1="484.0" y1="129.0" x2="487.0" y2="129.0" class="ln" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="492.0,129.0 485.9,132.4 485.9,125.6" class="ah"/>
  <line x1="580.0" y1="129.0" x2="583.0" y2="129.0" class="ln" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="588.0,129.0 581.9,132.4 581.9,125.6" class="ah"/>
  <line x1="344.0" y1="68.0" x2="344.0" y2="99.0" class="ln" stroke-width="1.4"/>
  <polygon points="344.0,104.0 340.6,97.9 347.4,97.9" class="ah"/>
  <line x1="632.0" y1="104.0" x2="632.0" y2="73.0" class="ln" stroke-width="1.4"/>
  <polygon points="632.0,68.0 635.4,74.1 628.6,74.1" class="ah"/>
  <text x="540.0" y="168.0" class="mu" font-size="9.4" text-anchor="middle" dominant-baseline="middle">虚线：边生成边推的流式通道</text>
  <rect x="396.0" y="194.0" width="184.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="488.0" y="214.0" class="tx" font-size="9.6" text-anchor="middle" dominant-baseline="middle"><tspan x="488.0" dy="-6.0">借 SGLang：调度、KV 池、</tspan><tspan x="488.0" dy="11.9">ModelRunner、CUDA Graph</tspan></text>
  <line x1="440.0" y1="194.0" x2="440.0" y2="161.0" class="ln" stroke-width="1.4" stroke-dasharray="4 3" stroke-opacity="0.7"/>
  <polygon points="440.0,156.0 443.4,162.1 436.6,162.1" class="ah"/>
  <line x1="536.0" y1="194.0" x2="536.0" y2="161.0" class="ln" stroke-width="1.4" stroke-dasharray="4 3" stroke-opacity="0.7"/>
  <polygon points="536.0,156.0 539.4,162.1 532.6,162.1" class="ah"/>
  <path d="M 396.0 214.0 L 300.0 214.0 L 300.0 115.0 L 238.0 115.0" class="ln" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="238.0,115.0 244.1,111.6 244.1,118.4" class="ah"/>
  <path d="M 396.0 226.0 L 270.0 226.0 L 270.0 173.0 L 238.0 173.0" class="ln" stroke-width="1.4" stroke-dasharray="4 3"/>
  <polygon points="238.0,173.0 244.1,169.6 244.1,176.4" class="ah"/>
  <text x="332.0" y="244.0" class="mu" font-size="9.4" text-anchor="middle" dominant-baseline="middle">组合 · 继承</text>
  <text x="497.0" y="270.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">omni 自己管：拓扑、stage 生命周期、stage 间传输、OpenAI 兼容 API</text>
  <text x="497.0" y="290.0" class="mu" font-size="9.6" text-anchor="middle" dominant-baseline="middle">输出：文本 + 音频（多个终点）；也有模型完全不用 SGLang</text>
</svg>
