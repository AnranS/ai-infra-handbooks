<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" role="img" aria-label="数据面按每条边选择传输方式：从上往下判断，第一个满足的条件决定这条边怎么传">
  <rect x="16.0" y="30.0" width="196.0" height="70.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="114.0" y="65.0" class="tx" font-size="9.8" text-anchor="middle" dominant-baseline="middle"><tspan x="114.0" dy="-12.2">控制面：ZMQ</tspan><tspan x="114.0" dy="12.2">Submit / DataReady / Ack</tspan><tspan x="114.0" dy="12.2">Complete / Stream / Abort</tspan></text>
  <rect x="16.0" y="120.0" width="196.0" height="70.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="114.0" y="155.0" class="tx" font-size="9.8" text-anchor="middle" dominant-baseline="middle"><tspan x="114.0" dy="-12.2">数据面：relay</tspan><tspan x="114.0" dy="12.2">张量拼成一个 uint8 缓冲区</tspan><tspan x="114.0" dy="12.2">发送方拥有，接收方 ACK 后释放</tspan></text>
  <text x="114.0" y="214.0" class="mu" font-size="9.6" text-anchor="middle" dominant-baseline="middle"><tspan x="114.0" dy="-6.0">小于 16 KB 的 CPU 流式块：</tspan><tspan x="114.0" dy="11.9">直接内联进控制消息</tspan></text>
  <rect x="250.0" y="22.0" width="220.0" height="44.0" rx="7" class="bx" stroke-width="1.3"/>
  <text x="360.0" y="44.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">目标在另一台机器？</text>
  <line x1="470.0" y1="44.0" x2="505.0" y2="44.0" class="ln" stroke-width="1.4"/>
  <polygon points="510.0,44.0 503.9,47.4 503.9,40.6" class="ah"/>
  <text x="490.0" y="37.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">是</text>
  <rect x="510.0" y="22.0" width="196.0" height="44.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="608.0" y="44.0" class="tx" font-size="9.6" text-anchor="middle" dominant-baseline="middle">Mooncake（RDMA）</text>
  <line x1="360.0" y1="66.0" x2="360.0" y2="83.0" class="ln" stroke-width="1.4"/>
  <polygon points="360.0,88.0 356.6,81.9 363.4,81.9" class="ah"/>
  <text x="370.0" y="77.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">否</text>
  <rect x="250.0" y="88.0" width="220.0" height="44.0" rx="7" class="bx" stroke-width="1.3"/>
  <text x="360.0" y="110.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">目标在同一个进程？</text>
  <line x1="470.0" y1="110.0" x2="505.0" y2="110.0" class="ln" stroke-width="1.4"/>
  <polygon points="510.0,110.0 503.9,113.4 503.9,106.6" class="ah"/>
  <text x="490.0" y="103.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">是</text>
  <rect x="510.0" y="88.0" width="196.0" height="44.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="608.0" y="110.0" class="tx" font-size="9.6" text-anchor="middle" dominant-baseline="middle">直接传 Python 对象（不进通信层）</text>
  <line x1="360.0" y1="132.0" x2="360.0" y2="149.0" class="ln" stroke-width="1.4"/>
  <polygon points="360.0,154.0 356.6,147.9 363.4,147.9" class="ah"/>
  <text x="370.0" y="143.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">否</text>
  <rect x="250.0" y="154.0" width="220.0" height="44.0" rx="7" class="bx" stroke-width="1.3"/>
  <text x="360.0" y="176.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">张量在 GPU，且双方都是 GPU stage？</text>
  <line x1="470.0" y1="176.0" x2="505.0" y2="176.0" class="ln" stroke-width="1.4"/>
  <polygon points="510.0,176.0 503.9,179.4 503.9,172.6" class="ah"/>
  <text x="490.0" y="169.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">是</text>
  <rect x="510.0" y="154.0" width="196.0" height="44.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="608.0" y="176.0" class="tx" font-size="9.6" text-anchor="middle" dominant-baseline="middle"><tspan x="608.0" dy="-6.0">同一张卡：PyTorch CUDA IPC 句柄</tspan><tspan x="608.0" dy="11.9">不同的卡：CUDA IPC 显存池</tspan></text>
  <line x1="360.0" y1="198.0" x2="360.0" y2="215.0" class="ln" stroke-width="1.4"/>
  <polygon points="360.0,220.0 356.6,213.9 363.4,213.9" class="ah"/>
  <text x="370.0" y="209.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">否</text>
  <rect x="250.0" y="220.0" width="220.0" height="44.0" rx="7" class="bx" stroke-width="1.3"/>
  <text x="360.0" y="242.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">其他（CPU 张量……）</text>
  <line x1="470.0" y1="242.0" x2="505.0" y2="242.0" class="ln" stroke-width="1.4"/>
  <polygon points="510.0,242.0 503.9,245.4 503.9,238.6" class="ah"/>
  <text x="490.0" y="235.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">是</text>
  <rect x="510.0" y="220.0" width="196.0" height="44.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="608.0" y="242.0" class="tx" font-size="9.6" text-anchor="middle" dominant-baseline="middle">SHM 共享内存</text>
  <text x="478.0" y="296.0" class="mu" font-size="9.4" text-anchor="middle" dominant-baseline="middle">CPU 平台上，大的 CPU 流式块发给非 GPU 的 stage 会报错（第六章的实验）</text>
</svg>
