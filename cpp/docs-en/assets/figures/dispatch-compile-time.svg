<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="A run-time parameter into a compile-time constant: one switch on the value, after which the template instance in each branch treats it as a constant, unrolling loops and removing branches">
  <rect x="30.0" y="70.0" width="120.0" height="44.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="90.0" y="92.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="90.0" dy="-5.9">head_dim at run time</tspan><tspan x="90.0" dy="11.8">(64 / 128 / 256)</tspan></text>
  <line x1="150.0" y1="92.0" x2="195.0" y2="92.0" class="ln" stroke-width="1.3"/>
  <polygon points="200.0,92.0 193.9,95.4 193.9,88.6" class="ah"/>
  <text x="175.0" y="83.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">switch</text>
  <rect x="200.0" y="40.0" width="120.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="260.0" y="55.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">kernel&lt;64&gt;</text>
  <rect x="200.0" y="77.0" width="120.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="260.0" y="92.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">kernel&lt;128&gt;</text>
  <rect x="200.0" y="114.0" width="120.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="260.0" y="129.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">kernel&lt;256&gt;</text>
  <line x1="320.0" y1="55.0" x2="365.0" y2="55.0" class="ln" stroke-width="1.1"/>
  <polygon points="370.0,55.0 363.9,58.4 363.9,51.6" class="ah"/>
  <line x1="320.0" y1="92.0" x2="365.0" y2="92.0" class="ln" stroke-width="1.1"/>
  <polygon points="370.0,92.0 363.9,95.4 363.9,88.6" class="ah"/>
  <line x1="320.0" y1="129.0" x2="365.0" y2="129.0" class="ln" stroke-width="1.1"/>
  <polygon points="370.0,129.0 363.9,132.4 363.9,125.6" class="ah"/>
  <rect x="370.0" y="40.0" width="300.0" height="104.0" rx="8" class="orange" stroke-width="1.3"/>
  <text x="520.0" y="92.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="520.0" dy="-17.7">head_dim is constexpr here:</tspan><tspan x="520.0" dy="11.8">array sizes, trip counts and registers</tspan><tspan x="520.0" dy="11.8">are settled at compile time</tspan><tspan x="520.0" dy="11.8">if constexpr cuts the other branches</tspan></text>
  <text x="350.0" y="170.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">The cost: one copy of the code per value, so the set has to be finite - which is why a kernel supports only a few head_dims</text>
  <text x="350.0" y="194.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Templates vs virtual functions: a template dispatches at compile time and inlines but grows the code; a virtual call dispatches at run time, one copy, one jump</text>
  <text x="350.0" y="216.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">concepts give template parameters an "interface", turning hundreds of lines of error into one "X is not satisfied"</text>
</svg>
