<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="pybind11's boundary: Python and C++ objects are converted; a large array is passed as a pointer, not copied; long C++ work releases the GIL">
  <rect x="30.0" y="50.0" width="180.0" height="110.0" rx="9" class="orange" stroke-width="1.2"/>
  <text x="120.0" y="68.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">Python</text>
  <rect x="45.0" y="80.0" width="150.0" height="24.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="120.0" y="92.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">torch.Tensor / numpy</text>
  <rect x="45.0" y="110.0" width="150.0" height="24.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="120.0" y="122.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">int / str / list</text>
  <rect x="490.0" y="50.0" width="180.0" height="110.0" rx="9" class="blue" stroke-width="1.2"/>
  <text x="580.0" y="68.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">C++</text>
  <rect x="505.0" y="80.0" width="150.0" height="24.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="580.0" y="92.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">float* + shape (no copy)</text>
  <rect x="505.0" y="110.0" width="150.0" height="24.0" rx="4" class="gray" stroke-width="1.3"/>
  <text x="580.0" y="122.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">int / std::string / vector</text>
  <rect x="260.0" y="60.0" width="180.0" height="90.0" rx="8" class="green" stroke-width="1.3"/>
  <text x="350.0" y="105.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="350.0" dy="-17.7">the pybind11 layer</tspan><tspan x="350.0" dy="11.8">type conversion (copies)</tspan><tspan x="350.0" dy="11.8">refcounts, exceptions</tspan><tspan x="350.0" dy="11.8">gil_scoped_release</tspan></text>
  <line x1="210.0" y1="92.0" x2="255.0" y2="92.0" class="ln" stroke-width="1.3"/>
  <polygon points="260.0,92.0 253.9,95.4 253.9,88.6" class="ah"/>
  <line x1="440.0" y1="92.0" x2="485.0" y2="92.0" class="ln" stroke-width="1.3"/>
  <polygon points="490.0,92.0 483.9,95.4 483.9,88.6" class="ah"/>
  <line x1="490.0" y1="122.0" x2="445.0" y2="122.0" class="ln" stroke-width="1.3"/>
  <polygon points="440.0,122.0 446.1,118.6 446.1,125.4" class="ah"/>
  <line x1="260.0" y1="122.0" x2="215.0" y2="122.0" class="ln" stroke-width="1.3"/>
  <polygon points="210.0,122.0 216.1,118.6 216.1,125.4" class="ah"/>
  <text x="350.0" y="184.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">Three things at the boundary: who owns the memory, how exceptions cross, and when the GIL is released and retaken</text>
  <text x="350.0" y="208.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">A PyTorch extension works the same way: take data_ptr(), compute, return a tensor; a call costs microseconds, so do not cross over for one addition</text>
</svg>
