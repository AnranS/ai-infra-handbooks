<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="RAII: a resource's lifetime is bound to a stack object, and leaving the scope (by return or by unwinding) runs the destructors in reverse order of construction">
  <rect x="30.0" y="40.0" width="300.0" height="170.0" rx="10" class="gray" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="180.0" y="58.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">the function's scope</text>
  <rect x="45.0" y="72.0" width="160.0" height="30.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="125.0" y="87.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">std::ifstream f(...)</text>
  <text x="265.0" y="87.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">construction: open the file</text>
  <rect x="45.0" y="114.0" width="160.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="125.0" y="129.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">std::lock_guard g(m)</text>
  <text x="265.0" y="129.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">construction: take the lock</text>
  <rect x="45.0" y="156.0" width="160.0" height="30.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="125.0" y="171.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">auto buf = make_unique&lt;...&gt;</text>
  <text x="265.0" y="171.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">construct: allocate memory</text>
  <text x="180.0" y="200.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">a return or a throw ...</text>
  <line x1="330.0" y1="125.0" x2="375.0" y2="125.0" class="ln" stroke-width="1.4"/>
  <polygon points="380.0,125.0 373.9,128.4 373.9,121.6" class="ah"/>
  <text x="355.0" y="115.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">leaving the scope</text>
  <rect x="380.0" y="40.0" width="290.0" height="170.0" rx="10" class="gray" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="525.0" y="58.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">destruction: the reverse of construction</text>
  <rect x="395.0" y="72.0" width="160.0" height="30.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="475.0" y="87.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">make_unique&lt;...&gt; destroyed</text>
  <text x="615.0" y="87.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">free the device / host memory</text>
  <rect x="395.0" y="114.0" width="160.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="475.0" y="129.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">std::lock_guard g destroyed</text>
  <text x="615.0" y="129.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">unlock</text>
  <rect x="395.0" y="156.0" width="160.0" height="30.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="475.0" y="171.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">std::ifstream f destroyed</text>
  <text x="615.0" y="171.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">close the file</text>
  <text x="525.0" y="200.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">it runs during unwinding too: nothing is missed</text>
  <text x="350.0" y="236.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">So no close / unlock / free is written: wrap each resource in a class and either forbid copying or spell it out, with a scope guard for one-off cleanup</text>
</svg>
