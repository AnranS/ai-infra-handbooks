<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" role="img" aria-label="The standard way to deadlock: two threads take two locks in opposite orders, each holding one and waiting for the other - lock in a fixed global order, or take both with std::scoped_lock">
  <text x="180.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">thread A</text>
  <rect x="40.0" y="40.0" width="120.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="100.0" y="55.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">(1) took lock 1</text>
  <line x1="100.0" y1="70.0" x2="100.0" y2="89.0" class="ln" stroke-width="1.2"/>
  <polygon points="100.0,94.0 96.6,87.9 103.4,87.9" class="ah"/>
  <rect x="40.0" y="94.0" width="120.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="100.0" y="109.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">(2) waiting for lock 2 ...</text>
  <rect x="200.0" y="40.0" width="120.0" height="30.0" rx="6" class="red" stroke-width="1.3"/>
  <text x="260.0" y="55.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">lock 2 is held by the other</text>
  <text x="520.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">thread B</text>
  <rect x="380.0" y="40.0" width="120.0" height="30.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="440.0" y="55.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">(1) took lock 2</text>
  <line x1="440.0" y1="70.0" x2="440.0" y2="89.0" class="ln" stroke-width="1.2"/>
  <polygon points="440.0,94.0 436.6,87.9 443.4,87.9" class="ah"/>
  <rect x="380.0" y="94.0" width="120.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="440.0" y="109.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">(2) waiting for lock 1 ...</text>
  <rect x="540.0" y="40.0" width="120.0" height="30.0" rx="6" class="red" stroke-width="1.3"/>
  <text x="600.0" y="55.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">lock 1 is held by the other</text>
  <line x1="160.0" y1="109.0" x2="375.1" y2="56.2" class="red-l" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="380.0,55.0 374.8,59.7 373.2,53.2" class="red-s"/>
  <line x1="500.0" y1="109.0" x2="164.9" y2="55.8" class="red-l" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="160.0,55.0 166.6,52.6 165.5,59.3" class="red-s"/>
  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">All four conditions are necessary: mutual exclusion, hold and wait, no preemption, circular wait - breaking the last is easiest: lock in one order</text>
  <text x="350.0" y="174.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">std::scoped_lock(m1, m2) takes both without deadlocking; a condition variable's wait rechecks its predicate in a loop</text>
  <text x="350.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Keep the locked region small: copy the data out and work on it, never do I/O while holding it; read-mostly data takes a shared_mutex</text>
</svg>
