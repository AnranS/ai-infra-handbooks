<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" role="img" aria-label="An arena: one large block, allocation pushes a pointer forward, nothing is freed singly and the block goes at once - O(1), no fragmentation, no lock">
  <rect x="40.0" y="50.0" width="620.0" height="40.0" rx="6" class="gray" stroke-width="1.2"/>
  <rect x="42.0" y="52.0" width="87.0" height="36.0" rx="4" class="blue" stroke-width="0.8"/>
  <text x="85.5" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">object 0</text>
  <rect x="132.0" y="52.0" width="137.0" height="36.0" rx="4" class="green" stroke-width="0.8"/>
  <text x="200.5" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">object 1</text>
  <rect x="272.0" y="52.0" width="57.0" height="36.0" rx="4" class="orange" stroke-width="0.8"/>
  <text x="300.5" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">object 2</text>
  <rect x="332.0" y="52.0" width="107.0" height="36.0" rx="4" class="purple" stroke-width="0.8"/>
  <text x="385.5" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">object 3</text>
  <line x1="444.0" y1="110.0" x2="444.0" y2="97.0" class="ln" stroke-width="1.4"/>
  <polygon points="444.0,92.0 447.4,98.1 440.6,98.1" class="ah"/>
  <text x="584.0" y="115.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">the bump pointer: the next allocation starts here</text>
  <text x="560.0" y="72.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">free</text>
  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">Every small object over one request's life comes from the arena, and the whole block goes back at the end; alignment rounds the pointer up</text>
  <text x="350.0" y="176.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">A block allocator cuts memory into fixed-size blocks on a free list, which is the paged KV cache; a caching allocator keeps what it frees, as PyTorch's pool does</text>
</svg>
