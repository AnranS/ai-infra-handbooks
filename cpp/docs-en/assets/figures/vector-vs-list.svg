<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" role="img" aria-label="A vector's elements are contiguous and several fit one cache line; a list's nodes are scattered on the heap and every step is a cache miss - an order of magnitude slower to traverse">
  <text x="170.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">vector&lt;int&gt;</text>
  <rect x="40.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="51.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">0</text>
  <rect x="64.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="75.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">1</text>
  <rect x="88.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="99.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">2</text>
  <rect x="112.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="123.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">3</text>
  <rect x="136.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="147.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">4</text>
  <rect x="160.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="171.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">5</text>
  <rect x="184.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="195.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">6</text>
  <rect x="208.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="219.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">7</text>
  <rect x="232.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="243.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">8</text>
  <rect x="256.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="267.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">9</text>
  <rect x="280.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="291.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">10</text>
  <rect x="304.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="315.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">11</text>
  <rect x="38.0" y="36.0" width="192.0" height="30.0" rx="4" class="orange" stroke-width="1.2"/>
  <text x="170.0" y="86.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="170.0" dy="-11.8">A 64-byte line holds 16 ints;</tspan><tspan x="170.0" dy="11.8">the prefetcher sees the pattern</tspan><tspan x="170.0" dy="11.8">and fetches the next line early</tspan></text>
  <text x="520.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">list&lt;int&gt;</text>
  <rect x="376.0" y="40.0" width="48.0" height="20.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="400.0" y="50.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">0  →</text>
  <line x1="424.0" y1="50.0" x2="491.0" y2="40.7" class="ln" stroke-width="1" stroke-opacity="0.6"/>
  <polygon points="496.0,40.0 490.4,44.2 489.5,37.5" class="ah"/>
  <rect x="496.0" y="30.0" width="48.0" height="20.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="520.0" y="40.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">1  →</text>
  <line x1="544.0" y1="40.0" x2="450.5" y2="87.7" class="ln" stroke-width="1" stroke-opacity="0.6"/>
  <polygon points="446.0,90.0 449.9,84.2 453.0,90.2" class="ah"/>
  <rect x="446.0" y="80.0" width="48.0" height="20.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="470.0" y="90.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">2  →</text>
  <line x1="494.0" y1="90.0" x2="591.2" y2="61.4" class="ln" stroke-width="1" stroke-opacity="0.6"/>
  <polygon points="596.0,60.0 591.1,65.0 589.2,58.5" class="ah"/>
  <rect x="596.0" y="50.0" width="48.0" height="20.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="620.0" y="60.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">3  →</text>
  <line x1="644.0" y1="60.0" x2="540.7" y2="98.3" class="ln" stroke-width="1" stroke-opacity="0.6"/>
  <polygon points="536.0,100.0 540.6,94.7 542.9,101.0" class="ah"/>
  <rect x="536.0" y="90.0" width="48.0" height="20.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="560.0" y="100.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">4  →</text>
  <line x1="584.0" y1="100.0" x2="621.0" y2="100.0" class="ln" stroke-width="1" stroke-opacity="0.6"/>
  <polygon points="626.0,100.0 619.9,103.4 619.9,96.6" class="ah"/>
  <rect x="626.0" y="90.0" width="48.0" height="20.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="650.0" y="100.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">5  →</text>
  <text x="520.0" y="134.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="520.0" dy="-11.8">Every node is newed at a random</tspan><tspan x="520.0" dy="11.8">address; each step waits on</tspan><tspan x="520.0" dy="11.8">memory (~100 ns)</tspan></text>
  <text x="350.0" y="170.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">Use vector by default: amortized O(1) at the end, fast to traverse and search; a list only wins when iterators must stay valid</text>
  <text x="350.0" y="194.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">Likewise an unordered_map's buckets are lists of scattered nodes; a small table is faster as a sorted vector, or a flat hash</text>
</svg>
