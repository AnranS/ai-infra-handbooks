<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 245" width="700" role="img" aria-label="A C++ component's layout: the public headers, the implementation, the tests and the CMake targets each in place, with dependencies pointing inward only">
  <rect x="40.0" y="40.0" width="140.0" height="150.0" rx="8" class="blue" stroke-width="1.2"/>
  <text x="110.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">include/kv/</text>
  <text x="110.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="110.0" dy="-11.2">the public headers</tspan><tspan x="110.0" dy="11.2">interface only</tspan><tspan x="110.0" dy="11.2">#included by other targets</tspan></text>
  <rect x="220.0" y="40.0" width="140.0" height="150.0" rx="8" class="orange" stroke-width="1.2"/>
  <text x="290.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">src/</text>
  <text x="290.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="290.0" dy="-11.2">the .cpp implementation</tspan><tspan x="290.0" dy="11.2">private headers</tspan><tspan x="290.0" dy="11.2">built into the library target</tspan></text>
  <rect x="400.0" y="40.0" width="140.0" height="150.0" rx="8" class="green" stroke-width="1.2"/>
  <text x="470.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">tests/</text>
  <text x="470.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="470.0" dy="-11.2">GoogleTest / Catch2</tspan><tspan x="470.0" dy="11.2">one executable per test</tspan><tspan x="470.0" dy="11.2">all run by ctest</tspan></text>
  <rect x="580.0" y="40.0" width="100.0" height="150.0" rx="8" class="purple" stroke-width="1.2"/>
  <text x="630.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">python/</text>
  <text x="630.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="630.0" dy="-5.6">pybind11 bindings</tspan><tspan x="630.0" dy="11.2">-&gt; a .so module</tspan></text>
  <line x1="360.0" y1="150.0" x2="225.0" y2="150.0" class="ln" stroke-width="1.2"/>
  <polygon points="220.0,150.0 226.1,146.6 226.1,153.4" class="ah"/>
  <line x1="400.0" y1="160.0" x2="185.0" y2="160.0" class="ln" stroke-width="1.2"/>
  <polygon points="180.0,160.0 186.1,156.6 186.1,163.4" class="ah"/>
  <line x1="580.0" y1="170.0" x2="185.0" y2="170.0" class="ln" stroke-width="1.2"/>
  <polygon points="180.0,170.0 186.1,166.6 186.1,173.4" class="ah"/>
  <text x="350.0" y="210.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">CMakeLists.txt: add_library(kv) + target_include_directories(PUBLIC include) + target_link_libraries; the sanitizers as an option</text>
  <text x="350.0" y="230.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">An arrow = who #includes whom: everything depends only on the public headers; ccache, precompiled headers and smaller units cut the build time</text>
</svg>
