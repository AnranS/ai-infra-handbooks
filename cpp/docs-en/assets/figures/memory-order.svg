<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" role="img" aria-label="relaxed vs release/acquire: when the other thread sees the flag, has the data arrived">
  <text x="192.0" y="24.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">relaxed: a data race</text>
  <text x="108.0" y="52.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">thread A (writing)</text>
  <text x="276.0" y="52.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">thread B (reading)</text>
  <rect x="52.0" y="68.0" width="112.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="108.0" y="84.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">write config</text>
  <rect x="52.0" y="114.0" width="112.0" height="32.0" rx="5" class="red" stroke-width="1.3"/>
  <text x="108.0" y="130.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="108.0" dy="-6.5">ready = true</tspan><tspan x="108.0" dy="13.0">relaxed</tspan></text>
  <rect x="220.0" y="68.0" width="112.0" height="32.0" rx="5" class="red" stroke-width="1.3"/>
  <text x="276.0" y="84.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="276.0" dy="-6.5">read ready</tspan><tspan x="276.0" dy="13.0">relaxed</tspan></text>
  <rect x="220.0" y="114.0" width="112.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="276.0" y="130.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">read config</text>
  <line x1="108.0" y1="100.0" x2="108.0" y2="109.0" class="ln" stroke-width="1.4"/>
  <polygon points="108.0,114.0 104.6,107.9 111.4,107.9" class="ah"/>
  <line x1="276.0" y1="100.0" x2="276.0" y2="109.0" class="ln" stroke-width="1.4"/>
  <polygon points="276.0,114.0 272.6,107.9 279.4,107.9" class="ah"/>
  <path d="M 42 76 C 18 92 18 122 42 138" class="red-l" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="192.0" y="172.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="192.0" dy="-6.8">nothing constrains the two writes,</tspan><tspan x="192.0" dy="13.6">so the compiler and the CPU may swap them</tspan></text>
  <rect x="52.0" y="212.0" width="280.0" height="32.0" rx="5" class="red" stroke-width="1.3"/>
  <text x="192.0" y="228.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">may see ready first and still read the old config</text>
  <text x="528.0" y="24.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">release / acquire: a synchronizing edge</text>
  <text x="444.0" y="52.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">thread A (writing)</text>
  <text x="612.0" y="52.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">thread B (reading)</text>
  <rect x="388.0" y="68.0" width="112.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="444.0" y="84.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">write config</text>
  <rect x="388.0" y="114.0" width="112.0" height="32.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="444.0" y="130.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="444.0" dy="-6.5">ready = true</tspan><tspan x="444.0" dy="13.0">release</tspan></text>
  <rect x="556.0" y="68.0" width="112.0" height="32.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="612.0" y="84.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="612.0" dy="-6.5">read ready</tspan><tspan x="612.0" dy="13.0">acquire</tspan></text>
  <rect x="556.0" y="114.0" width="112.0" height="32.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="612.0" y="130.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">read config</text>
  <line x1="444.0" y1="100.0" x2="444.0" y2="109.0" class="ln" stroke-width="1.4"/>
  <polygon points="444.0,114.0 440.6,107.9 447.4,107.9" class="ah"/>
  <line x1="612.0" y1="100.0" x2="612.0" y2="109.0" class="ln" stroke-width="1.4"/>
  <polygon points="612.0,114.0 608.6,107.9 615.4,107.9" class="ah"/>
  <line x1="504.0" y1="128.0" x2="548.2" y2="89.3" class="green-l" stroke-width="2"/>
  <polygon points="552.0,86.0 549.6,92.6 545.2,87.5" class="green-s"/>
  <text x="528.0" y="172.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="528.0" dy="-6.8">every write before the release</tspan><tspan x="528.0" dy="13.6">is visible to whoever reads it</tspan></text>
  <rect x="388.0" y="212.0" width="280.0" height="32.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="528.0" y="228.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">the config read is certainly the new one</text>
  <text x="340.0" y="274.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">Atomicity only keeps this one variable from being torn; order across variables comes from the memory order.</text>
  <text x="340.0" y="300.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">acquire / release constrains only this pair of variables, is cheaper than seq_cst, and is the default for publish-subscribe.</text>
</svg>
