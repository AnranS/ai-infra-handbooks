<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="拷贝要分配新 buffer 并逐个复制；移动只是把指针接过来，再把源对象置空——源对象之后只保证"可析构、可赋值"">
  <text x="180.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">拷贝 b = a</text>
  <rect x="40.0" y="44.0" width="80.0" height="34.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="61.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">a：ptr, len</text>
  <rect x="40.0" y="110.0" width="80.0" height="34.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="127.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">b：ptr, len</text>
  <rect x="200.0" y="44.0" width="120.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="260.0" y="61.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">buffer（堆上，很大）</text>
  <line x1="120.0" y1="61.0" x2="195.0" y2="61.0" class="ln" stroke-width="1.3"/>
  <polygon points="200.0,61.0 193.9,64.4 193.9,57.6" class="ah"/>
  <rect x="200.0" y="110.0" width="120.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="260.0" y="127.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">新 buffer（复制一份）</text>
  <line x1="120.0" y1="127.0" x2="195.0" y2="127.0" class="ln" stroke-width="1.3"/>
  <polygon points="200.0,127.0 193.9,130.4 193.9,123.6" class="ah"/>
  <text x="180.0" y="170.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">O(n) 的内存分配 + 复制</text>
  <text x="520.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">移动 b = std::move(a)</text>
  <rect x="380.0" y="44.0" width="80.0" height="34.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="420.0" y="61.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">a：ptr, len</text>
  <rect x="380.0" y="110.0" width="80.0" height="34.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="420.0" y="127.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">b：ptr, len</text>
  <rect x="540.0" y="44.0" width="120.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="600.0" y="61.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">buffer（堆上，很大）</text>
  <line x1="460.0" y1="61.0" x2="535.0" y2="61.0" class="ln" stroke-width="1.3"/>
  <polygon points="540.0,61.0 533.9,64.4 533.9,57.6" class="ah"/>
  <line x1="460.0" y1="127.0" x2="535.7" y2="80.6" class="ln" stroke-width="1.3"/>
  <polygon points="540.0,78.0 536.5,84.1 533.0,78.3" class="ah"/>
  <text x="420.0" y="92.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a.ptr = nullptr</text>
  <text x="520.0" y="170.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">O(1)：搬几个指针，源对象置空</text>
  <text x="350.0" y="205.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">右值引用 T&amp;&amp; 就是"允许被掏空的对象"的标记：临时对象天然是右值，具名变量要显式 std::move；完美转发 forward&lt;T&gt; 保留实参本来的左右值性</text>
</svg>
