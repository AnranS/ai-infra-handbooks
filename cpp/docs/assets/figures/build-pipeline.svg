<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" width="700" role="img" aria-label="从源码到可执行文件：每个 .cpp 单独预处理、编译、汇编成目标文件，最后链接——头文件里的东西会被复制进每个翻译单元">
  <rect x="30.0" y="50.0" width="130.0" height="40.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="95.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">a.cpp + 头文件</text>
  <text x="95.0" y="112.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">预处理：展开 #include、宏</text>
  <line x1="160.0" y1="70.0" x2="195.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="200.0,70.0 193.9,73.4 193.9,66.6" class="ah"/>
  <rect x="200.0" y="50.0" width="130.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="265.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">翻译单元</text>
  <text x="265.0" y="112.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">编译：语法树 → IR → 汇编</text>
  <line x1="330.0" y1="70.0" x2="365.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="370.0,70.0 363.9,73.4 363.9,66.6" class="ah"/>
  <rect x="370.0" y="50.0" width="130.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="435.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">a.o</text>
  <text x="435.0" y="112.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">汇编：机器码 + 符号表</text>
  <line x1="500.0" y1="70.0" x2="535.0" y2="70.0" class="ln" stroke-width="1.3"/>
  <polygon points="540.0,70.0 533.9,73.4 533.9,66.6" class="ah"/>
  <rect x="540.0" y="50.0" width="130.0" height="40.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="605.0" y="70.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">可执行 / .so</text>
  <text x="605.0" y="112.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">链接：解析符号、合并段</text>
  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">单一定义规则：函数在多个翻译单元里各有一份定义就链接报错；头文件里的函数要 inline（模板和 constexpr 隐含 inline）</text>
  <text x="350.0" y="174.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">名字修饰：C++ 把参数类型编进符号名以支持重载；extern "C" 关掉它，才能被 C / Python 的 ctypes 找到</text>
  <text x="350.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">未定义行为不是"会崩"而是"编译器可以假设它不发生"：有符号溢出、悬垂引用、严格别名——开 sanitizer 当默认</text>
</svg>
