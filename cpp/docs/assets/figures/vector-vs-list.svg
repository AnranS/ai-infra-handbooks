  <text x="243.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">8</text>
  <rect x="256.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="267.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">9</text>
  <rect x="280.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="291.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">10</text>
  <rect x="304.0" y="40.0" width="22.0" height="22.0" rx="2" class="blue" stroke-width="0.6"/>
  <text x="315.0" y="51.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">11</text>
  <rect x="38.0" y="36.0" width="192.0" height="30.0" rx="4" class="orange" stroke-width="1.2"/>
  <text x="170.0" y="86.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">一个 64 字节的缓存行装 16 个 int；预取器看懂顺序访问，提前把下一行拉来</text>
  <text x="520.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">list&lt;int&gt;</text>
  <rect x="376.0" y="40.0" width="48.0" height="20.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="400.0" y="50.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">0  →</text>
  <line x1="424.0" y1="50.0" x2="491.0" y2="40.7" class="ln" stroke-width="1" stroke-opacity="0.6"/>
