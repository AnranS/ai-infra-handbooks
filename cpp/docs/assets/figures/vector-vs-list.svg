<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" role="img" aria-label="vector 的元素连续，一次缓存行装进好几个；list 的节点散落在堆上，每走一步都是一次缓存未命中——遍历慢一个数量级">
  <text x="170.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">vector&lt;int&gt;</text>
