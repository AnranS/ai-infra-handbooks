  <text x="470.0" y="90.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">2  →</text>
  <line x1="494.0" y1="90.0" x2="591.2" y2="61.4" class="ln" stroke-width="1" stroke-opacity="0.6"/>
  <polygon points="596.0,60.0 591.1,65.0 589.2,58.5" class="ah"/>
  <rect x="596.0" y="50.0" width="48.0" height="20.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="620.0" y="60.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">3  →</text>
  <line x1="644.0" y1="60.0" x2="540.7" y2="98.3" class="ln" stroke-width="1" stroke-opacity="0.6"/>
  <polygon points="536.0,100.0 540.6,94.7 542.9,101.0" class="ah"/>
  <rect x="536.0" y="90.0" width="48.0" height="20.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="560.0" y="100.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">4  →</text>
  <line x1="584.0" y1="100.0" x2="621.0" y2="100.0" class="ln" stroke-width="1" stroke-opacity="0.6"/>
  <polygon points="626.0,100.0 619.9,103.4 619.9,96.6" class="ah"/>
  <rect x="626.0" y="90.0" width="48.0" height="20.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="650.0" y="100.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">5  →</text>
  <text x="520.0" y="134.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">每个节点单独 new，地址随机；每走一步等一次内存（~100 ns）</text>
  <text x="350.0" y="170.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">默认用 vector：末尾插入摊还 O(1)，中间插入 O(n) 但常数极小，遍历和二分都快；list 只在"持有迭代器且频繁中间插删"时才赢</text>
  <text x="350.0" y="194.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">同理：unordered_map 的桶是链表，节点分散；小表用排序过的 vector + 二分，或开放寻址的哈希（absl::flat_hash_map）更快</text>
</svg>
