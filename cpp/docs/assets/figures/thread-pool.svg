<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" role="img" aria-label="线程池：任务进队列，固定数量的工作线程循环取任务——条件变量唤醒、停止标志退出、future 取回结果">
  <rect x="30.0" y="70.0" width="110.0" height="40.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="85.0" y="90.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="85.0" dy="-5.9">submit(task)</tspan><tspan x="85.0" dy="11.8">→ future</tspan></text>
  <line x1="140.0" y1="90.0" x2="185.0" y2="90.0" class="ln" stroke-width="1.3"/>
  <polygon points="190.0,90.0 183.9,93.4 183.9,86.6" class="ah"/>
  <rect x="190.0" y="60.0" width="180.0" height="60.0" rx="7" class="orange" stroke-width="1.2"/>
  <text x="280.0" y="76.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">任务队列（互斥锁保护）</text>
  <rect x="200.0" y="90.0" width="28.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="214.0" y="101.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">t0</text>
  <rect x="233.0" y="90.0" width="28.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="247.0" y="101.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">t1</text>
  <rect x="266.0" y="90.0" width="28.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="280.0" y="101.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">t2</text>
  <rect x="299.0" y="90.0" width="28.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="313.0" y="101.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">t3</text>
  <rect x="332.0" y="90.0" width="28.0" height="22.0" rx="3" class="gray" stroke-width="0.6"/>
  <text x="346.0" y="101.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">t4</text>
  <line x1="370.0" y1="90.0" x2="415.0" y2="90.0" class="ln" stroke-width="1.3"/>
  <polygon points="420.0,90.0 413.9,93.4 413.9,86.6" class="ah"/>
  <text x="395.0" y="81.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle">notify_one</text>
  <rect x="420.0" y="44.0" width="110.0" height="28.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="475.0" y="58.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">worker 0：取 → 执行</text>
  <rect x="420.0" y="80.0" width="110.0" height="28.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="475.0" y="94.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">worker 1：取 → 执行</text>
  <rect x="420.0" y="116.0" width="110.0" height="28.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="475.0" y="130.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">worker 2：取 → 执行</text>
  <text x="600.0" y="60.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan x="600.0" dy="-11.2">while (!stop)</tspan><tspan x="600.0" dy="11.2">  wait(有任务 || stop)</tspan><tspan x="600.0" dy="11.2">  pop → run</tspan></text>
  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">坑：析构时要先置 stop 再 notify_all 再 join，否则工作线程永远等在条件变量上；任务抛的异常要存进 future，别让线程死掉</text>
  <text x="350.0" y="174.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">任务里再 submit 并等待会把池子等死（所有 worker 都在等）；线程数按 CPU 核数定，I/O 多的任务可以多一些</text>
  <text x="350.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">推理引擎里：分词、反分词、HTTP 处理在线程池里，GPU 工作在单独的进程里（CUDA 上下文不喜欢多线程乱发 kernel）</text>
</svg>
