<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 245" width="700" role="img" aria-label="一个 C++ 组件的工程结构：公开头文件、实现、测试、CMake 目标各在其位，依赖方向只能从外向内">
  <rect x="40.0" y="40.0" width="140.0" height="150.0" rx="8" class="blue" stroke-width="1.2"/>
  <text x="110.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">include/kv/</text>
  <text x="110.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="110.0" dy="-11.2">公开头文件</tspan><tspan x="110.0" dy="11.2">只放接口</tspan><tspan x="110.0" dy="11.2">被别的目标 #include</tspan></text>
  <rect x="220.0" y="40.0" width="140.0" height="150.0" rx="8" class="orange" stroke-width="1.2"/>
  <text x="290.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">src/</text>
  <text x="290.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="290.0" dy="-11.2">实现 .cpp</tspan><tspan x="290.0" dy="11.2">私有头文件</tspan><tspan x="290.0" dy="11.2">编译成库目标</tspan></text>
  <rect x="400.0" y="40.0" width="140.0" height="150.0" rx="8" class="green" stroke-width="1.2"/>
  <text x="470.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">tests/</text>
  <text x="470.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="470.0" dy="-11.2">GoogleTest / Catch2</tspan><tspan x="470.0" dy="11.2">每个测试一个可执行文件</tspan><tspan x="470.0" dy="11.2">ctest 统一跑</tspan></text>
  <rect x="580.0" y="40.0" width="100.0" height="150.0" rx="8" class="purple" stroke-width="1.2"/>
  <text x="630.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">python/</text>
  <text x="630.0" y="100.0" class="mu" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="630.0" dy="-5.6">pybind11 绑定</tspan><tspan x="630.0" dy="11.2">→ .so 模块</tspan></text>
  <line x1="360.0" y1="150.0" x2="225.0" y2="150.0" class="ln" stroke-width="1.2"/>
  <polygon points="220.0,150.0 226.1,146.6 226.1,153.4" class="ah"/>
  <line x1="400.0" y1="160.0" x2="185.0" y2="160.0" class="ln" stroke-width="1.2"/>
  <polygon points="180.0,160.0 186.1,156.6 186.1,163.4" class="ah"/>
  <line x1="580.0" y1="170.0" x2="185.0" y2="170.0" class="ln" stroke-width="1.2"/>
  <polygon points="180.0,170.0 186.1,166.6 186.1,173.4" class="ah"/>
  <text x="350.0" y="210.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">CMakeLists.txt：add_library(kv) + target_include_directories(PUBLIC include) + target_link_libraries；sanitizer 作为一个 option</text>
  <text x="350.0" y="230.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">箭头 = 谁 #include 谁：实现、测试、绑定都只依赖公开头文件；编译时间靠 ccache、预编译头和拆分翻译单元</text>
</svg>
