<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" width="700" role="img" aria-label="共享内存环形缓冲区：生产者写 head、消费者读 tail，一块内存反复用，不拷贝、不走内核">
  <path d="M 160.0 45.0 A 70 70 0 0 1 195.0 54.4 L 180.0 80.4 A 40 40 0 0 0 160.0 75.0 Z" class="gray" stroke-width="0.8"/>
  <path d="M 195.0 54.4 A 70 70 0 0 1 220.6 80.0 L 194.6 95.0 A 40 40 0 0 0 180.0 80.4 Z" class="gray" stroke-width="0.8"/>
  <path d="M 220.6 80.0 A 70 70 0 0 1 230.0 115.0 L 200.0 115.0 A 40 40 0 0 0 194.6 95.0 Z" class="gray" stroke-width="0.8"/>
  <path d="M 230.0 115.0 A 70 70 0 0 1 220.6 150.0 L 194.6 135.0 A 40 40 0 0 0 200.0 115.0 Z" class="orange" stroke-width="0.8"/>
  <path d="M 220.6 150.0 A 70 70 0 0 1 195.0 175.6 L 180.0 149.6 A 40 40 0 0 0 194.6 135.0 Z" class="orange" stroke-width="0.8"/>
  <path d="M 195.0 175.6 A 70 70 0 0 1 160.0 185.0 L 160.0 155.0 A 40 40 0 0 0 180.0 149.6 Z" class="orange" stroke-width="0.8"/>
  <path d="M 160.0 185.0 A 70 70 0 0 1 125.0 175.6 L 140.0 149.6 A 40 40 0 0 0 160.0 155.0 Z" class="orange" stroke-width="0.8"/>
  <path d="M 125.0 175.6 A 70 70 0 0 1 99.4 150.0 L 125.4 135.0 A 40 40 0 0 0 140.0 149.6 Z" class="orange" stroke-width="0.8"/>
  <path d="M 99.4 150.0 A 70 70 0 0 1 90.0 115.0 L 120.0 115.0 A 40 40 0 0 0 125.4 135.0 Z" class="gray" stroke-width="0.8"/>
  <path d="M 90.0 115.0 A 70 70 0 0 1 99.4 80.0 L 125.4 95.0 A 40 40 0 0 0 120.0 115.0 Z" class="gray" stroke-width="0.8"/>
  <path d="M 99.4 80.0 A 70 70 0 0 1 125.0 54.4 L 140.0 80.4 A 40 40 0 0 0 125.4 95.0 Z" class="gray" stroke-width="0.8"/>
  <path d="M 125.0 54.4 A 70 70 0 0 1 160.0 45.0 L 160.0 75.0 A 40 40 0 0 0 140.0 80.4 Z" class="gray" stroke-width="0.8"/>
  <text x="160.0" y="115.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">环</text>
  <text x="255.0" y="60.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">head（生产者写）</text>
  <text x="230.0" y="185.0" class="mu" font-size="9.5" text-anchor="start" dominant-baseline="middle">tail（消费者读）</text>
  <text x="480.0" y="50.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">满 = (head + 1) % n == tail；空 = head == tail</text>
  <text x="480.0" y="80.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="480.0" dy="-5.9">单生产者单消费者只要原子读写两个下标，</tspan><tspan x="480.0" dy="11.8">不需要锁；多生产者要 CAS 抢位置</tspan></text>
  <text x="480.0" y="125.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="480.0" dy="-5.9">推理引擎里：调度进程把 batch 元数据写进共享内存，</tspan><tspan x="480.0" dy="11.8">GPU 工作进程直接读；大张量走 CUDA IPC 共享显存句柄</tspan></text>
  <text x="480.0" y="170.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="480.0" dy="-5.9">管道 / socket 每条消息要两次内核拷贝 + 一次唤醒，</tspan><tspan x="480.0" dy="11.8">几十 µs；共享内存一次写一次读，亚微秒</tspan></text>
  <text x="350.0" y="215.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">ZMQ 是消息总线（跨机器也能用），共享内存是同机的快速路；两者在 vLLM / SGLang 里都在用</text>
</svg>
