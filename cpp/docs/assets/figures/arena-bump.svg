<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" role="img" aria-label="arena：一大块内存，一个指针往前推就是分配，不单独释放，用完整块一起扔——分配 O(1)、没有碎片、没有锁">
  <rect x="40.0" y="50.0" width="620.0" height="40.0" rx="6" class="gray" stroke-width="1.2"/>
  <rect x="42.0" y="52.0" width="87.0" height="36.0" rx="4" class="blue" stroke-width="0.8"/>
  <text x="85.5" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">对象 0</text>
  <rect x="132.0" y="52.0" width="137.0" height="36.0" rx="4" class="green" stroke-width="0.8"/>
  <text x="200.5" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">对象 1</text>
  <rect x="272.0" y="52.0" width="57.0" height="36.0" rx="4" class="orange" stroke-width="0.8"/>
  <text x="300.5" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">对象 2</text>
  <rect x="332.0" y="52.0" width="107.0" height="36.0" rx="4" class="purple" stroke-width="0.8"/>
  <text x="385.5" y="70.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">对象 3</text>
  <line x1="444.0" y1="110.0" x2="444.0" y2="97.0" class="ln" stroke-width="1.4"/>
  <polygon points="444.0,92.0 447.4,98.1 440.6,98.1" class="ah"/>
  <text x="584.0" y="115.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">bump 指针：下一次分配从这里开始</text>
  <text x="560.0" y="72.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">空闲</text>
  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">一次请求的生命周期内（解析 → 调度 → 采样）所有小对象都从 arena 里拿，请求结束整块归还；对齐靠把指针向上取整</text>
  <text x="350.0" y="176.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">块分配器把内存切成固定大小的块、空闲链表管理——分页 KV Cache 就是它；缓存分配器释放了也不还给系统，PyTorch 的显存池就是这种</text>
</svg>
