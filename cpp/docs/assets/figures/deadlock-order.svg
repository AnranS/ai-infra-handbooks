<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 220" width="700" role="img" aria-label="死锁的标准姿势：两个线程以相反的顺序拿两把锁，各持一把、等另一把——按固定的全局顺序加锁，或者 std::scoped_lock 一次锁两把">
  <text x="180.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">线程 A</text>
  <rect x="40.0" y="40.0" width="120.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="100.0" y="55.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">① 拿到 锁 1</text>
  <line x1="100.0" y1="70.0" x2="100.0" y2="89.0" class="ln" stroke-width="1.2"/>
  <polygon points="100.0,94.0 96.6,87.9 103.4,87.9" class="ah"/>
  <rect x="40.0" y="94.0" width="120.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="100.0" y="109.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">② 等 锁 2 ……</text>
  <rect x="200.0" y="40.0" width="120.0" height="30.0" rx="6" class="red" stroke-width="1.3"/>
  <text x="260.0" y="55.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">锁 2 被对方持有</text>
  <text x="520.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">线程 B</text>
  <rect x="380.0" y="40.0" width="120.0" height="30.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="440.0" y="55.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">① 拿到 锁 2</text>
  <line x1="440.0" y1="70.0" x2="440.0" y2="89.0" class="ln" stroke-width="1.2"/>
  <polygon points="440.0,94.0 436.6,87.9 443.4,87.9" class="ah"/>
  <rect x="380.0" y="94.0" width="120.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="440.0" y="109.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">② 等 锁 1 ……</text>
  <rect x="540.0" y="40.0" width="120.0" height="30.0" rx="6" class="red" stroke-width="1.3"/>
  <text x="600.0" y="55.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">锁 1 被对方持有</text>
  <line x1="160.0" y1="109.0" x2="375.1" y2="56.2" class="red-l" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="380.0,55.0 374.8,59.7 373.2,53.2" class="red-s"/>
  <line x1="500.0" y1="109.0" x2="164.9" y2="55.8" class="red-l" stroke-width="1.4" stroke-dasharray="5 3"/>
  <polygon points="160.0,55.0 166.6,52.6 165.5,59.3" class="red-s"/>
  <text x="350.0" y="150.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">四个条件缺一不可：互斥、持有并等待、不可抢占、循环等待——打破"循环等待"最容易：所有线程按同一个顺序加锁</text>
  <text x="350.0" y="174.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">std::scoped_lock(m1, m2) 用避免死锁的算法同时锁两把；条件变量的 wait 要放在循环里检查谓词（虚假唤醒、多消费者）</text>
  <text x="350.0" y="196.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">锁住的区域越小越好：拷贝出数据再处理，别在持锁时做 I/O 或等别的锁；读多写少用 shared_mutex</text>
</svg>
