<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="RAII：资源的生命周期绑在栈对象上，离开作用域（正常返回或异常展开）都会调用析构，释放顺序和构造相反">
  <rect x="30.0" y="40.0" width="300.0" height="170.0" rx="10" class="gray" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="180.0" y="58.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">函数作用域</text>
  <rect x="45.0" y="72.0" width="160.0" height="30.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="125.0" y="87.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">std::ifstream f(...)</text>
  <text x="265.0" y="87.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">构造：打开文件</text>
  <rect x="45.0" y="114.0" width="160.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="125.0" y="129.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">std::lock_guard g(m)</text>
  <text x="265.0" y="129.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">构造：加锁</text>
  <rect x="45.0" y="156.0" width="160.0" height="30.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="125.0" y="171.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">auto buf = make_unique&lt;...&gt;</text>
  <text x="265.0" y="171.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">构造：分配显存 / 内存</text>
  <text x="180.0" y="200.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">return 或 throw ……</text>
  <line x1="330.0" y1="125.0" x2="375.0" y2="125.0" class="ln" stroke-width="1.4"/>
  <polygon points="380.0,125.0 373.9,128.4 373.9,121.6" class="ah"/>
  <text x="355.0" y="115.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">离开作用域</text>
  <rect x="380.0" y="40.0" width="290.0" height="170.0" rx="10" class="gray" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="525.0" y="58.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">析构：和构造相反的顺序</text>
  <rect x="395.0" y="72.0" width="160.0" height="30.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="475.0" y="87.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">make_unique&lt;...&gt; 析构</text>
  <text x="615.0" y="87.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">释放显存 / 内存</text>
  <rect x="395.0" y="114.0" width="160.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="475.0" y="129.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">std::lock_guard g 析构</text>
  <text x="615.0" y="129.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">解锁</text>
  <rect x="395.0" y="156.0" width="160.0" height="30.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="475.0" y="171.0" class="tx" font-size="8.5" text-anchor="middle" dominant-baseline="middle">std::ifstream f 析构</text>
  <text x="615.0" y="171.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">关闭文件</text>
  <text x="525.0" y="200.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">异常展开时同样执行：不会漏掉</text>
  <text x="350.0" y="236.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">所以不写 close / unlock / free：每种资源包成一个类，拷贝要么禁掉、要么写清楚（零法则 / 五法则），作用域守卫处理"离开时做什么"的临时需求</text>
</svg>
