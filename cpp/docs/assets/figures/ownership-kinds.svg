<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="三种所有权：unique_ptr 独占（只能移动）；shared_ptr 共享（控制块计数）；weak_ptr 观察（不计数，打破循环）">
  <text x="120.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">unique_ptr&lt;T&gt;</text>
  <rect x="40.0" y="40.0" width="90.0" height="34.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="85.0" y="57.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">owner</text>
  <line x1="130.0" y1="57.0" x2="185.0" y2="57.0" class="ln" stroke-width="1.4"/>
  <polygon points="190.0,57.0 183.9,60.4 183.9,53.6" class="ah"/>
  <rect x="190.0" y="40.0" width="60.0" height="34.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="220.0" y="57.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">T</text>
  <text x="145.0" y="100.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="145.0" dy="-11.8">只有一个指针指向它；</tspan><tspan x="145.0" dy="11.8">拷贝被禁止，std::move 转交；</tspan><tspan x="145.0" dy="11.8">离开作用域就 delete；零开销</tspan></text>
  <text x="440.0" y="24.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">shared_ptr&lt;T&gt; + weak_ptr&lt;T&gt;</text>
  <rect x="330.0" y="40.0" width="70.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="365.0" y="57.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">A 持有</text>
  <rect x="330.0" y="90.0" width="70.0" height="34.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="365.0" y="107.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">B 持有</text>
  <rect x="450.0" y="56.0" width="110.0" height="50.0" rx="6" class="purple" stroke-width="1.3"/>
  <text x="505.0" y="81.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle"><tspan x="505.0" dy="-5.6">控制块</tspan><tspan x="505.0" dy="11.2">strong = 2，weak = 1</tspan></text>
  <line x1="400.0" y1="57.0" x2="445.2" y2="68.7" class="ln" stroke-width="1.3"/>
  <polygon points="450.0,70.0 443.2,71.7 444.9,65.2" class="ah"/>
  <line x1="400.0" y1="107.0" x2="445.2" y2="93.4" class="ln" stroke-width="1.3"/>
  <polygon points="450.0,92.0 445.1,97.0 443.2,90.5" class="ah"/>
  <line x1="560.0" y1="81.0" x2="595.0" y2="81.0" class="ln" stroke-width="1.3"/>
  <polygon points="600.0,81.0 593.9,84.4 593.9,77.6" class="ah"/>
  <rect x="600.0" y="64.0" width="60.0" height="34.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="630.0" y="81.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">T</text>
  <rect x="330.0" y="140.0" width="70.0" height="34.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="365.0" y="157.0" class="tx" font-size="9" text-anchor="middle" dominant-baseline="middle">weak 观察</text>
  <line x1="400.0" y1="157.0" x2="446.5" y2="109.6" class="ln" stroke-width="1.2" stroke-dasharray="4 3"/>
  <polygon points="450.0,106.0 448.1,112.7 443.3,108.0" class="ah"/>
  <text x="500.0" y="150.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle"><tspan x="500.0" dy="-5.9">strong 归零才 delete T；</tspan><tspan x="500.0" dy="11.8">weak 只能 lock() 后临时升级</tspan></text>
  <text x="350.0" y="206.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">循环引用：A 和 B 互相 shared_ptr，strong 永远不归零——把其中一条边改成 weak_ptr（父 → 子 shared，子 → 父 weak）</text>
  <text x="350.0" y="230.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">函数参数：只是用一下就传 T&amp; / const T&amp; / T*；要拿走所有权才传 unique_ptr 按值；要共享所有权才传 shared_ptr（每次拷贝都是一次原子计数）</text>
</svg>
