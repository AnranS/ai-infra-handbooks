<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="Chunked parallelism: 64 steps within a chunk become one triangular solve plus two matrix products; only the table S is passed between chunks">
  <text x="350.0" y="18.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600">T tokens cut into chunks of 64</text>
  <rect x="40.0" y="34.0" width="140.0" height="30.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="110.0" y="49.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">chunk 0: tokens 0–63</text>
  <rect x="200.0" y="34.0" width="140.0" height="30.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="270.0" y="49.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">chunk 1: tokens 64–127</text>
  <rect x="360.0" y="34.0" width="140.0" height="30.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="430.0" y="49.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">chunk 2: tokens 128–191</text>
  <rect x="520.0" y="34.0" width="140.0" height="30.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="590.0" y="49.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">chunk 3: tokens 192–255</text>
  <text x="350.0" y="82.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">Within a chunk (parallel)</text>
  <rect x="60.0" y="96.0" width="260.0" height="54.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="190.0" y="123.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="190.0" dy="-6.8">solve the lower-triangular system (I + A) U = β ⊙ V</tspan><tspan x="190.0" dy="13.6">→ U, what each token really writes (one solve_triangular)</tspan></text>
  <rect x="380.0" y="96.0" width="260.0" height="54.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="510.0" y="123.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="510.0" dy="-6.8">output = Q S₀ (read the chunk-start state)</tspan><tspan x="510.0" dy="13.6">+ (Q Kᵀ)_causal U (read the new writes within the chunk)</tspan></text>
  <text x="350.0" y="170.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">Between chunks (sequential, like the recurrence)</text>
  <circle cx="110.0" cy="200.0" r="16.0" class="purple" stroke-width="1.3"/>
  <text x="110.0" y="200.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">S0</text>
  <line x1="128.0" y1="200.0" x2="247.0" y2="200.0" class="ln" stroke-width="1.4"/>
  <polygon points="252.0,200.0 245.9,203.4 245.9,196.6" class="ah"/>
  <text x="190.0" y="188.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">decay + Kᵀ U</text>
  <circle cx="270.0" cy="200.0" r="16.0" class="purple" stroke-width="1.3"/>
  <text x="270.0" y="200.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">S1</text>
  <line x1="288.0" y1="200.0" x2="407.0" y2="200.0" class="ln" stroke-width="1.4"/>
  <polygon points="412.0,200.0 405.9,203.4 405.9,196.6" class="ah"/>
  <text x="350.0" y="188.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">decay + Kᵀ U</text>
  <circle cx="430.0" cy="200.0" r="16.0" class="purple" stroke-width="1.3"/>
  <text x="430.0" y="200.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">S2</text>
  <line x1="448.0" y1="200.0" x2="567.0" y2="200.0" class="ln" stroke-width="1.4"/>
  <polygon points="572.0,200.0 565.9,203.4 565.9,196.6" class="ah"/>
  <text x="510.0" y="188.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">decay + Kᵀ U</text>
  <circle cx="590.0" cy="200.0" r="16.0" class="purple" stroke-width="1.3"/>
  <text x="590.0" y="200.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">S3</text>
  <text x="350.0" y="236.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">Recurrent: T steps of small operations; chunked: T/64 steps of matrix products. Identical element by element, an order of magnitude faster on long inputs</text>
</svg>
