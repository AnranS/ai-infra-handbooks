  <rect x="332.0" y="168.0" width="16.0" height="16.0" rx="2" class="gray" stroke-width="0.7"/>
  <rect x="350.0" y="168.0" width="16.0" height="16.0" rx="2" class="gray" stroke-width="0.7"/>
  <rect x="368.0" y="168.0" width="16.0" height="16.0" rx="2" class="gray" stroke-width="0.7"/>
  <rect x="386.0" y="168.0" width="16.0" height="16.0" rx="2" class="gray" stroke-width="0.7"/>
  <rect x="296.0" y="186.0" width="16.0" height="16.0" rx="2" class="gray" stroke-width="0.7"/>
  <rect x="314.0" y="186.0" width="16.0" height="16.0" rx="2" class="gray" stroke-width="0.7"/>
  <rect x="332.0" y="186.0" width="16.0" height="16.0" rx="2" class="gray" stroke-width="0.7"/>
