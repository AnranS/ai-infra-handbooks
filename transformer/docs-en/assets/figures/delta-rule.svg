  <rect x="314.0" y="132.0" width="16.0" height="16.0" rx="2" class="gray" stroke-width="0.7"/>
  <rect x="332.0" y="132.0" width="16.0" height="16.0" rx="2" class="gray" stroke-width="0.7"/>
