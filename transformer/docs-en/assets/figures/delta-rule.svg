<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" role="img" aria-label="One step of Gated DeltaNet: each head keeps a 128 × 128 memory table S, rewritten once by the delta rule">
  <rect x="296.0" y="96.0" width="16.0" height="16.0" rx="2" class="gray" stroke-width="0.7"/>
