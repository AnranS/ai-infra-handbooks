  <text x="28.0" y="276.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">Verified by: stateful == stateless · hand-written template == official · batch == single · speculative == greedy</text>
  <text x="28.0" y="293.0" class="tx" font-size="10.5" text-anchor="start" dominant-baseline="middle">You hold: a single-process engine that streams a chat, batches and decodes speculatively (decode 2 → 20 tok/s)</text>
