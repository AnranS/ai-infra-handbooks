  <rect x="528.0" y="47.0" width="18.0" height="9.0" rx="1.5" class="green" stroke-width="0.7"/>
  <rect x="468.0" y="58.0" width="18.0" height="9.0" rx="1.5" class="green" stroke-width="0.7"/>
  <rect x="488.0" y="58.0" width="18.0" height="9.0" rx="1.5" class="green" stroke-width="0.7"/>
  <rect x="508.0" y="58.0" width="18.0" height="9.0" rx="1.5" class="green" stroke-width="0.7"/>
