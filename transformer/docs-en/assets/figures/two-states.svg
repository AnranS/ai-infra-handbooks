  <rect x="560.0" y="36.0" width="60.0" height="44.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="590.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="590.0" dy="-6.5">conv</tspan><tspan x="590.0" dy="13.0">×3</tspan></text>
  <text x="520.0" y="96.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">19.3 MB across 18 layers, independent of the token count</text>
  <text x="350.0" y="126.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">Context length → state size (fp32)</text>
  <text x="70.0" y="156.0" class="tx" font-size="11.5" text-anchor="end" dominant-baseline="middle">1K token</text>
