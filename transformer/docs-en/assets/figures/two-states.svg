  <rect x="90.0" y="158.0" width="3.0" height="10.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="95.6" y="151.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">24 full-attention layers: 0.09 GB</text>
  <text x="154.0" y="163.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">Qwen3.5: 0.02 GB + 19 MB fixed</text>
  <text x="70.0" y="192.0" class="tx" font-size="11.5" text-anchor="end" dominant-baseline="middle">10K token</text>
  <rect x="90.0" y="182.0" width="16.1" height="10.0" rx="2" class="gray" stroke-width="0.6"/>
  <rect x="90.0" y="194.0" width="4.0" height="10.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="110.1" y="187.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">24 full-attention layers: 0.92 GB</text>
  <text x="154.0" y="199.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">Qwen3.5: 0.23 GB + 19 MB fixed</text>
  <text x="70.0" y="228.0" class="tx" font-size="11.5" text-anchor="end" dominant-baseline="middle">262K token</text>
  <rect x="90.0" y="218.0" width="420.0" height="10.0" rx="2" class="gray" stroke-width="0.6"/>
  <rect x="90.0" y="230.0" width="105.0" height="10.0" rx="2" class="orange" stroke-width="0.6"/>
  <text x="514.0" y="223.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">24 full-attention layers: 24 GB</text>
  <text x="199.0" y="235.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">Qwen3.5: 6 GB + 19 MB fixed</text>
  <text x="350.0" y="268.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">GQA cuts each layer's KV from 8 groups to 2 and linear attention makes 18 layers' state constant: long-context memory is an order of magnitude smaller</text>
</svg>
