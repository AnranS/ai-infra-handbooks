<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" role="img" aria-label="Two kinds of state: the KV cache of the 6 full-attention layers grows with length, the memory tables of the 18 linear-attention layers are a fixed 19 MB">
  <text x="180.0" y="20.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600">Full-attention layers: the KV cache</text>
  <rect x="40.0" y="40.0" width="30.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="55.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
  <rect x="76.0" y="40.0" width="30.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="91.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
  <rect x="112.0" y="40.0" width="30.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="127.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
  <rect x="148.0" y="40.0" width="30.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="163.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
  <rect x="184.0" y="40.0" width="30.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="199.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
  <rect x="220.0" y="40.0" width="30.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="235.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
  <rect x="256.0" y="40.0" width="30.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="271.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
  <rect x="292.0" y="40.0" width="30.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="307.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
  <text x="180.0" y="80.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">24 KB added per token (6 layers × 2 × 2 groups × 256 × 4 B)</text>
  <text x="520.0" y="20.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600">Linear-attention layers: memory table + convolution window</text>
  <rect x="468.0" y="36.0" width="18.0" height="9.0" rx="1.5" class="green" stroke-width="0.7"/>
  <rect x="488.0" y="36.0" width="18.0" height="9.0" rx="1.5" class="green" stroke-width="0.7"/>
