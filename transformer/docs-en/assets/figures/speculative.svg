<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" role="img" aria-label="Speculative decoding with the MTP draft head: the draft head guesses one token, the main model verifies two at once, and a hit is a free token">
  <rect x="30.0" y="40.0" width="150.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="105.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-6.8">the main model has decided token a</tspan><tspan x="105.0" dy="13.6">(hidden state h)</tspan></text>
  <line x1="180.0" y1="60.0" x2="225.0" y2="60.0" class="ln" stroke-width="1.4"/>
  <polygon points="230.0,60.0 223.9,63.4 223.9,56.6" class="ah"/>
  <rect x="232.0" y="40.0" width="170.0" height="40.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="317.0" y="60.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="317.0" dy="-6.5">draft head: fc(norm(e_a) ‖ norm(h))</tspan><tspan x="317.0" dy="13.0">→ one attention layer → guess b</tspan></text>
  <line x1="402.0" y1="60.0" x2="447.0" y2="60.0" class="ln" stroke-width="1.4"/>
  <polygon points="452.0,60.0 445.9,63.4 445.9,56.6" class="ah"/>
  <rect x="454.0" y="40.0" width="236.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="572.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="572.0" dy="-6.8">the main model computes [a, b] at once:</tspan><tspan x="572.0" dy="13.6">position 1 gives a′, position 2 gives c</tspan></text>
  <rect x="40.0" y="130.0" width="300.0" height="46.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="190.0" y="153.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="190.0" dy="-6.5">a′ == b: hit → accept b and c, two tokens from one pass</tspan><tspan x="190.0" dy="13.0">the draft head guesses the next from (c, h_b)</tspan></text>
  <rect x="380.0" y="130.0" width="300.0" height="46.0" rx="7" class="red" stroke-width="1.3"/>
  <text x="530.0" y="153.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="530.0" dy="-6.5">a′ ≠ b: miss → accept only a′, roll the state back</tspan><tspan x="530.0" dy="13.0">truncate the KV cache, restore the memory tables from the snapshot</tspan></text>
  <line x1="540.0" y1="80.0" x2="194.9" y2="129.3" class="ln" stroke-width="1.4"/>
  <polygon points="190.0,130.0 195.6,125.8 196.5,132.5" class="ah"/>
  <line x1="600.0" y1="80.0" x2="534.1" y2="127.1" class="ln" stroke-width="1.4"/>
  <polygon points="530.0,130.0 533.0,123.7 537.0,129.2" class="ah"/>
  <text x="360.0" y="206.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">Under greedy decoding the output matches plain decoding token by token; the acceptance rate depends on the text: about 50% for short answers, about 90% for smooth long text</text>
  <text x="360.0" y="232.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">On a CPU a 2-token pass costs 1.35× a 1-token pass, so the gain is limited; on a GPU they cost about the same and the same acceptance rate buys 1.5× or more</text>
  <text x="360.0" y="256.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">A recurrent state cannot be truncated like a KV cache: copy the 18 memory tables (19 MB) before verifying</text>
</svg>
