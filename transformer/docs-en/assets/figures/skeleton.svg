  <text x="345.0" y="95.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">layers[i]</text>
  <line x1="340.0" y1="48.0" x2="475.0" y2="80.0" class="ln" stroke-width="1"/>
  <rect x="420.0" y="80.0" width="110.0" height="30.0" rx="7" class="gray" stroke-width="1.3"/>
