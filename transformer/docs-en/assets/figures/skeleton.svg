  <text x="215.0" y="124.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">chapter 5</text>
  <line x1="340.0" y1="48.0" x2="345.0" y2="80.0" class="ln" stroke-width="1"/>
