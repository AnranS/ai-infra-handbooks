  <text x="605.0" y="124.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">chapter 2</text>
  <line x1="345.0" y1="110.0" x2="100.0" y2="160.0" class="ln" stroke-width="1"/>
  <rect x="30.0" y="160.0" width="140.0" height="30.0" rx="7" class="gray" stroke-width="1.3"/>
