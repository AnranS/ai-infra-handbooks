  <text x="260.0" y="204.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">chapters 6 / 7, 8</text>
  <line x1="345.0" y1="110.0" x2="420.0" y2="160.0" class="ln" stroke-width="1"/>
  <rect x="350.0" y="160.0" width="140.0" height="30.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="420.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">post_attention_layernorm</text>
