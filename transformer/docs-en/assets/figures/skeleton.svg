  <line x1="345.0" y1="110.0" x2="580.0" y2="160.0" class="ln" stroke-width="1"/>
  <rect x="510.0" y="160.0" width="140.0" height="30.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="580.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">mlp</text>
  <text x="580.0" y="204.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">chapter 4</text>
  <text x="340.0" y="236.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">Each chapter writes one module and runs a small experiment to see what it does; our modules use the same names, so the weights load by name</text>
  <text x="340.0" y="262.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">Chapter 9: layer.py + model.py assemble the parts, the whole model is checked against HF's logits, and transformers is never imported again</text>
  <text x="340.0" y="286.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">The book compares with HF exactly once, in chapter 9 (logits within 1e-5): if that matches, every part before it is right</text>
</svg>
