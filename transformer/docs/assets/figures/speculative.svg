<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" role="img" aria-label="用 MTP 草稿头做投机解码：草稿头猜一个，主模型一次验证两个，猜中白赚一个">
  <rect x="30.0" y="40.0" width="150.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="105.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="105.0" dy="-6.8">主模型已确定 token a</tspan><tspan x="105.0" dy="13.6">（隐状态 h）</tspan></text>
  <line x1="180.0" y1="60.0" x2="225.0" y2="60.0" class="ln" stroke-width="1.4"/>
  <polygon points="230.0,60.0 223.9,63.4 223.9,56.6" class="ah"/>
  <rect x="232.0" y="40.0" width="170.0" height="40.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="317.0" y="60.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="317.0" dy="-6.5">草稿头：fc(norm(e_a) ‖ norm(h))</tspan><tspan x="317.0" dy="13.0">→ 一层注意力 → 猜 b</tspan></text>
  <line x1="402.0" y1="60.0" x2="447.0" y2="60.0" class="ln" stroke-width="1.4"/>
  <polygon points="452.0,60.0 445.9,63.4 445.9,56.6" class="ah"/>
  <rect x="454.0" y="40.0" width="236.0" height="40.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="572.0" y="60.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="572.0" dy="-6.8">主模型一次算 [a, b]：</tspan><tspan x="572.0" dy="13.6">位置 1 给 a′，位置 2 给 c</tspan></text>
  <rect x="40.0" y="130.0" width="300.0" height="46.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="190.0" y="153.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="190.0" dy="-6.5">a′ == b：猜中 → 收下 b 和 c，一次前向两个 token</tspan><tspan x="190.0" dy="13.0">草稿头再从 (c, h_b) 猜下一个</tspan></text>
  <rect x="380.0" y="130.0" width="300.0" height="46.0" rx="7" class="red" stroke-width="1.3"/>
  <text x="530.0" y="153.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="530.0" dy="-6.5">a′ ≠ b：猜错 → 只收 a′，状态退回验证前</tspan><tspan x="530.0" dy="13.0">KV cache 截断，记忆表从快照恢复</tspan></text>
  <line x1="540.0" y1="80.0" x2="194.9" y2="129.3" class="ln" stroke-width="1.4"/>
  <polygon points="190.0,130.0 195.6,125.8 196.5,132.5" class="ah"/>
  <line x1="600.0" y1="80.0" x2="534.1" y2="127.1" class="ln" stroke-width="1.4"/>
  <polygon points="530.0,130.0 533.0,123.7 537.0,129.2" class="ah"/>
  <text x="360.0" y="206.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">贪心下输出和普通解码逐 token 相同；接受率看文本：短回答约 50%，顺的长文约 90%</text>
  <text x="360.0" y="232.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">CPU 上 2 个 token 的前向是 1 个的 1.35 倍，加速有限；GPU 上几乎一样贵，同样的接受率能换 1.5 倍以上</text>
  <text x="360.0" y="256.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">递推状态不能像 KV cache 那样截断：验证前复制 18 张记忆表（19 MB）</text>
</svg>
