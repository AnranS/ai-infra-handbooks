  <text x="199.0" y="235.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">Qwen3.5：6 GB + 19 MB 固定</text>
  <text x="350.0" y="268.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">GQA 把每层 KV 从 8 组压到 2 组，线性注意力把 18 层的状态变成常数：长上下文的显存小一个量级</text>
</svg>
