  <text x="199.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
  <rect x="220.0" y="40.0" width="30.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="235.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
  <rect x="256.0" y="40.0" width="30.0" height="24.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="271.0" y="52.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">K,V</text>
