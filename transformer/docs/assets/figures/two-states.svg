  <rect x="90.0" y="218.0" width="420.0" height="10.0" rx="2" class="gray" stroke-width="0.6"/>
  <rect x="90.0" y="230.0" width="105.0" height="10.0" rx="2" class="orange" stroke-width="0.6"/>
