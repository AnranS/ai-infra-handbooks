<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" width="700" role="img" aria-label="分块并行：块内 64 步合成一次三角求解加两个矩阵乘，块间只传一张表 S">
  <text x="350.0" y="18.0" class="tx" font-size="13" text-anchor="middle" dominant-baseline="middle" font-weight="600">T 个 token 切成 64 一块</text>
  <rect x="40.0" y="34.0" width="140.0" height="30.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="110.0" y="49.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">块 0：token 0–63</text>
  <rect x="200.0" y="34.0" width="140.0" height="30.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="270.0" y="49.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">块 1：token 64–127</text>
  <rect x="360.0" y="34.0" width="140.0" height="30.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="430.0" y="49.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">块 2：token 128–191</text>
  <rect x="520.0" y="34.0" width="140.0" height="30.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="590.0" y="49.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">块 3：token 192–255</text>
  <text x="350.0" y="82.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">块内（并行）</text>
  <rect x="60.0" y="96.0" width="260.0" height="54.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="190.0" y="123.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="190.0" dy="-6.8">解下三角方程组 (I + A) U = β ⊙ V</tspan><tspan x="190.0" dy="13.6">→ 每个 token 真正写入的 U（一次 solve_triangular）</tspan></text>
  <rect x="380.0" y="96.0" width="260.0" height="54.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="510.0" y="123.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="510.0" dy="-6.8">输出 = Q S₀（读块首状态）</tspan><tspan x="510.0" dy="13.6">+ (Q Kᵀ)_因果 U（读块内新写入）</tspan></text>
  <text x="350.0" y="170.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">块间（串行，和递推一样）</text>
  <circle cx="110.0" cy="200.0" r="16.0" class="purple" stroke-width="1.3"/>
  <text x="110.0" y="200.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">S0</text>
  <line x1="128.0" y1="200.0" x2="247.0" y2="200.0" class="ln" stroke-width="1.4"/>
  <polygon points="252.0,200.0 245.9,203.4 245.9,196.6" class="ah"/>
  <text x="190.0" y="188.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">衰减 + Kᵀ U</text>
  <circle cx="270.0" cy="200.0" r="16.0" class="purple" stroke-width="1.3"/>
  <text x="270.0" y="200.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">S1</text>
  <line x1="288.0" y1="200.0" x2="407.0" y2="200.0" class="ln" stroke-width="1.4"/>
  <polygon points="412.0,200.0 405.9,203.4 405.9,196.6" class="ah"/>
  <text x="350.0" y="188.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">衰减 + Kᵀ U</text>
  <circle cx="430.0" cy="200.0" r="16.0" class="purple" stroke-width="1.3"/>
  <text x="430.0" y="200.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">S2</text>
  <line x1="448.0" y1="200.0" x2="567.0" y2="200.0" class="ln" stroke-width="1.4"/>
  <polygon points="572.0,200.0 565.9,203.4 565.9,196.6" class="ah"/>
  <text x="510.0" y="188.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">衰减 + Kᵀ U</text>
  <circle cx="590.0" cy="200.0" r="16.0" class="purple" stroke-width="1.3"/>
  <text x="590.0" y="200.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">S3</text>
  <text x="350.0" y="236.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">递推：T 步小运算；分块：T/64 步矩阵乘。结果逐位一致，长输入快一个数量级</text>
</svg>
