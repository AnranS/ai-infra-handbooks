  <text x="215.0" y="95.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">rotary_emb</text>
  <text x="215.0" y="124.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">第 5 章</text>
  <line x1="340.0" y1="48.0" x2="345.0" y2="80.0" class="ln" stroke-width="1"/>
  <rect x="290.0" y="80.0" width="110.0" height="30.0" rx="7" class="bx" stroke-width="1.3"/>
  <text x="345.0" y="95.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">layers[i]</text>
  <line x1="340.0" y1="48.0" x2="475.0" y2="80.0" class="ln" stroke-width="1"/>
  <rect x="420.0" y="80.0" width="110.0" height="30.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="475.0" y="95.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">norm</text>
  <text x="475.0" y="124.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">第 3 章</text>
  <line x1="340.0" y1="48.0" x2="605.0" y2="80.0" class="ln" stroke-width="1"/>
  <rect x="550.0" y="80.0" width="110.0" height="30.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="605.0" y="95.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">lm_head</text>
  <text x="605.0" y="124.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">第 2 章</text>
  <line x1="345.0" y1="110.0" x2="100.0" y2="160.0" class="ln" stroke-width="1"/>
  <rect x="30.0" y="160.0" width="140.0" height="30.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="100.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">input_layernorm</text>
  <text x="100.0" y="204.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">第 3 章</text>
  <line x1="345.0" y1="110.0" x2="260.0" y2="160.0" class="ln" stroke-width="1"/>
  <rect x="190.0" y="160.0" width="140.0" height="30.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="260.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">self_attn / linear_attn</text>
  <text x="260.0" y="204.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">第 6 / 7、8 章</text>
  <line x1="345.0" y1="110.0" x2="420.0" y2="160.0" class="ln" stroke-width="1"/>
  <rect x="350.0" y="160.0" width="140.0" height="30.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="420.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">post_attention_layernorm</text>
