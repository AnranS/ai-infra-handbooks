  <rect x="30.0" y="80.0" width="110.0" height="30.0" rx="7" class="purple" stroke-width="1.3"/>
  <text x="85.0" y="95.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">embed_tokens</text>
  <text x="85.0" y="124.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">第 2 章</text>
  <line x1="340.0" y1="48.0" x2="215.0" y2="80.0" class="ln" stroke-width="1"/>
