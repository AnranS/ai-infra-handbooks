<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" role="img" aria-label="拆黑盒：HF 模型是一棵模块树，第 2–8 章逐个换成自己写的，第 9 章整棵树都是自己的">
