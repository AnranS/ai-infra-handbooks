  <line x1="345.0" y1="110.0" x2="580.0" y2="160.0" class="ln" stroke-width="1"/>
  <rect x="510.0" y="160.0" width="140.0" height="30.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="580.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">mlp</text>
  <text x="580.0" y="204.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">第 4 章</text>
  <text x="340.0" y="236.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">每换一块就和替换前的 logits 对一次：查表、归一化、前馈、RoPE 差 0，注意力和线性注意力差 1e-5</text>
  <text x="340.0" y="262.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">第 9 章：layer.py + model.py 把这些零件拼起来，不再 import transformers</text>
  <text x="340.0" y="286.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">适配器（harness.py）只翻译 HF 的调用方式，不参与计算</text>
</svg>
