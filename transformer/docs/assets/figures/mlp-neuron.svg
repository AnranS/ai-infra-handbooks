<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 616" width="760" role="img" aria-label="前馈网络是干什么的：每个 token 自己的规则本">
  <text x="380.0" y="22.0" class="tx" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="700">前馈网络（MLP）是干什么的：每个 token 自己的"规则本"</text>
  <text x="20.0" y="58.0" class="tx" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700">① 一层里的分工：注意力在 token 之间搬信息，前馈网络让每个 token 关起门来自己加工</text>
  <rect x="60.0" y="74.0" width="70.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="95.0" y="89.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle">「中国」</text>
  <rect x="60.0" y="150.0" width="70.0" height="30.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="95.0" y="165.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">MLP</text>
  <line x1="95.0" y1="104.0" x2="95.0" y2="148.0" class="ln" stroke-width="1.2" stroke-opacity="0.35"/>
  <polygon points="95.0,148.0 94.7,141.0 100.8,144.0" class="ah"/>
  <rect x="150.0" y="74.0" width="70.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="185.0" y="89.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle">「的」</text>
  <rect x="150.0" y="150.0" width="70.0" height="30.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="185.0" y="165.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">MLP</text>
  <line x1="185.0" y1="104.0" x2="185.0" y2="148.0" class="ln" stroke-width="1.2" stroke-opacity="0.35"/>
  <polygon points="185.0,148.0 184.7,141.0 190.8,144.0" class="ah"/>
  <rect x="240.0" y="74.0" width="70.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="275.0" y="89.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle">「首都」</text>
  <rect x="240.0" y="150.0" width="70.0" height="30.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="275.0" y="165.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">MLP</text>
  <line x1="275.0" y1="104.0" x2="275.0" y2="148.0" class="ln" stroke-width="1.2" stroke-opacity="0.35"/>
  <polygon points="275.0,148.0 274.7,141.0 280.8,144.0" class="ah"/>
  <rect x="330.0" y="74.0" width="70.0" height="30.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="365.0" y="89.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle">「是」</text>
  <rect x="330.0" y="150.0" width="70.0" height="30.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="365.0" y="165.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">MLP</text>
  <line x1="365.0" y1="104.0" x2="365.0" y2="148.0" class="ln" stroke-width="1.2" stroke-opacity="0.35"/>
  <polygon points="365.0,148.0 364.7,141.0 370.8,144.0" class="ah"/>
  <path d="M 95 104 C 95 130 365 130 365 106" class="blue-l" stroke-width="1.6"/>
  <path d="M 185 104 C 185 130 365 130 365 106" class="blue-l" stroke-width="1.6"/>
  <path d="M 275 104 C 275 130 365 130 365 106" class="blue-l" stroke-width="1.6"/>
  <text x="440.0" y="84.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle">注意力 = 开会交流，搬运信息</text>
  <text x="440.0" y="104.0" class="mu" font-size="11.5" text-anchor="start" dominant-baseline="middle">（蓝线：「是」去前文里找它要的）</text>
  <text x="440.0" y="128.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle">前馈网络 = 回到自己工位上消化：</text>
  <text x="440.0" y="148.0" class="mu" font-size="12" text-anchor="start" dominant-baseline="middle">同一个前馈网络，每个 token 各算各的，</text>
  <text x="440.0" y="168.0" class="mu" font-size="12" text-anchor="start" dominant-baseline="middle">打乱顺序结果只跟着打乱（第 4 章实测）</text>
  <line x1="20.0" y1="200.0" x2="740.0" y2="200.0" class="ln" stroke-width="0.6" stroke-opacity="0.3"/>
  <text x="20.0" y="222.0" class="tx" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700">② 里面是 3584 条"如果……就……"的规则：1024 维展开成 3584 个神经元，再收回 1024 维</text>
  <rect x="20.0" y="240.0" width="120.0" height="54.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="80.0" y="267.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle"><tspan x="80.0" dy="-7.1">这个 token 的</tspan><tspan x="80.0" dy="14.3">向量 x（1024 维）</tspan></text>
  <line x1="140.0" y1="267.0" x2="163.0" y2="267.0" class="ln" stroke-width="1.4"/>
  <polygon points="168.0,267.0 161.9,270.4 161.9,263.6" class="ah"/>
  <rect x="170.0" y="240.0" width="170.0" height="54.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="255.0" y="267.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="255.0" dy="-6.8">条件（key）：gate、up 的一行</tspan><tspan x="255.0" dy="13.6">和 x 对得上，这个神经元就亮</tspan></text>
  <line x1="340.0" y1="267.0" x2="363.0" y2="267.0" class="ln" stroke-width="1.4"/>
  <polygon points="368.0,267.0 361.9,270.4 361.9,263.6" class="ah"/>
  <rect x="370.0" y="240.0" width="150.0" height="54.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="445.0" y="267.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="445.0" dy="-6.8">开关：silu(gate) × up</tspan><tspan x="445.0" dy="13.6">对不上的≈0（非线性）</tspan></text>
  <line x1="520.0" y1="267.0" x2="543.0" y2="267.0" class="ln" stroke-width="1.4"/>
  <polygon points="548.0,267.0 541.9,270.4 541.9,263.6" class="ah"/>
  <rect x="550.0" y="240.0" width="190.0" height="54.0" rx="7" class="green" stroke-width="1.3"/>
  <text x="645.0" y="267.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="645.0" dy="-6.8">结论（value）：down 的一列</tspan><tspan x="645.0" dy="13.6">亮了就把它加回残差流</tspan></text>
  <text x="380.0" y="316.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">研究里把这叫 key-value memory：模型的很多知识就存在前馈网络的这些规则里</text>
  <line x1="20.0" y1="334.0" x2="740.0" y2="334.0" class="ln" stroke-width="0.6" stroke-opacity="0.3"/>
  <text x="20.0" y="356.0" class="tx" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700">③ 真模型里的两条规则（Qwen3.5-0.8B，输入"中国的首都是"，下一个词是"北京"的概率 18.6%）</text>
  <rect x="20.0" y="372.0" width="350.0" height="92.0" rx="8" class="orange" stroke-width="1.0"/>
  <text x="195.0" y="392.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="700">第 23 层第 275 号神经元：激活 +5.86</text>
  <text x="195.0" y="416.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">它写回的方向最像这些词：</text>
  <text x="195.0" y="440.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle">杭州 重庆 广州 南京 Shanghai 成都 天津 武汉</text>
  <rect x="390.0" y="372.0" width="350.0" height="92.0" rx="8" class="blue" stroke-width="1.0"/>
  <text x="565.0" y="392.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="700">第 18 层第 2065 号神经元：激活 +3.30</text>
  <text x="565.0" y="416.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">它写回的方向最像这些词：</text>
  <text x="565.0" y="440.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle">London  Paris  Washington  伦敦  华盛顿</text>
  <text x="195.0" y="482.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">一个"中国城市"神经元</text>
  <text x="565.0" y="482.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">一个"各国首都"神经元</text>
  <text x="20.0" y="516.0" class="tx" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="700">④ 把规则拿掉试试：只把第 23 层第 275 号神经元的激活置 0</text>
  <text x="190.0" y="543.0" class="tx" font-size="12" text-anchor="end" dominant-baseline="middle">原模型</text>
  <rect x="200.0" y="532.0" width="372.0" height="22.0" rx="3" class="green" stroke-width="0.8"/>
  <text x="578.0" y="543.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">P(北京) = 18.6%</text>
  <text x="190.0" y="573.0" class="tx" font-size="12" text-anchor="end" dominant-baseline="middle">关掉这 1 个神经元</text>
  <rect x="200.0" y="562.0" width="34.0" height="22.0" rx="3" class="orange" stroke-width="0.8"/>
  <text x="240.0" y="573.0" class="tx" font-size="12" text-anchor="start" dominant-baseline="middle">P(北京) = 1.7%</text>
  <text x="380.0" y="604.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">拿掉一条规则，模型就不往"北京"上说了："哪个"升到 29.5%，它把这句当成了问句的开头</text>
</svg>
