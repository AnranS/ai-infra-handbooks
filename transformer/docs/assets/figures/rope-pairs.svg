<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 290" width="700" role="img" aria-label="一个头的 256 维：前 64 维参与旋转，第 j 维和第 j + 32 维是一对；后 192 维不转">
  <text x="270.0" y="18.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">前 64 维参与旋转（partial_rotary_factor = 0.25）</text>
  <text x="605.0" y="18.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">后 192 维</text>
  <rect x="30.0" y="46.0" width="230.0" height="34.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="145.0" y="63.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">第 0–31 维（前一半）</text>
  <rect x="280.0" y="46.0" width="230.0" height="34.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="395.0" y="63.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">第 32–63 维（后一半）</text>
  <rect x="530.0" y="46.0" width="150.0" height="34.0" rx="7" class="gray" stroke-width="1.3"/>
  <text x="605.0" y="63.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">第 64–255 维</text>
  <text x="605.0" y="102.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle"><tspan x="605.0" dy="-6.8">原样不动，</tspan><tspan x="605.0" dy="13.6">做和位置无关的匹配</tspan></text>
  <text x="33.6" y="37.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">0</text>
  <text x="256.4" y="37.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">31</text>
  <text x="283.6" y="37.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">32</text>
  <text x="506.4" y="37.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">63</text>
  <path d="M 33.6 80 C 33.6 176 283.6 176 283.6 80" class="blue-l" stroke-width="1.8"/>
  <path d="M 256.4 80 C 256.4 140 506.4 140 506.4 80" class="orange-l" stroke-width="1.8"/>
  <text x="36.0" y="167.0" class="tx" font-size="11" text-anchor="start" dominant-baseline="middle">第 0 对（0 和 32）：6.28 个位置转一圈，最快</text>
  <text x="381.4" y="140.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">第 31 对（31 和 63）：3800 万个位置一圈，最慢</text>
  <text x="350.0" y="206.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">第 j 维和第 j + 32 维是一对，转同一个角：位置 p × θ_j</text>
  <text x="350.0" y="230.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">rotate_half(x) = [ −x[32:64],  x[0:32] ]</text>
  <text x="350.0" y="254.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">x·cos + rotate_half(x)·sin：第 j 维 → a·cos − b·sin，第 j + 32 维 → b·cos + a·sin</text>
  <text x="350.0" y="276.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">（a = x[j]，b = x[j + 32]，就是二维旋转）</text>
</svg>
