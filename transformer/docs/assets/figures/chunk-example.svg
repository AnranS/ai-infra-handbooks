<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" role="img" aria-label="分块并行">
  <text x="360.0" y="18.0" class="tx" font-size="13.5" text-anchor="middle" dominant-baseline="middle" font-weight="700">分块并行：一块里的 64 步循环，变成一次三角求解加几个矩阵乘（这里用 3 个 token 演示）</text>
  <text x="176.0" y="50.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="700">逐 token 递推：一个等一个</text>
  <rect x="16.0" y="76.0" width="320.0" height="34.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="176.0" y="93.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">u₁ = β₁·v₁   = [1, 0]</text>
  <line x1="176.0" y1="110.0" x2="176.0" y2="117.0" class="ln" stroke-width="1.4"/>
  <polygon points="176.0,122.0 172.6,115.9 179.4,115.9" class="ah"/>
  <rect x="16.0" y="122.0" width="320.0" height="34.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="176.0" y="139.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">u₂ = β₂·( v₂ − (k₁·k₂)·u₁ )   = [−0.6, 1]</text>
  <line x1="176.0" y1="156.0" x2="176.0" y2="163.0" class="ln" stroke-width="1.4"/>
  <polygon points="176.0,168.0 172.6,161.9 179.4,161.9" class="ah"/>
  <rect x="16.0" y="168.0" width="320.0" height="34.0" rx="7" class="orange" stroke-width="1.3"/>
  <text x="176.0" y="185.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">u₃ = β₃·( v₃ − (k₁·k₃)·u₁ − (k₂·k₃)·u₂ )   = [1.24, 0.6]</text>
  <text x="176.0" y="230.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">uₜ 是第 t 个 token 真正写进表里的量。</text>
  <text x="176.0" y="249.0" class="mu" font-size="11.5" text-anchor="middle" dominant-baseline="middle">要算 u₃，得先有 u₁、u₂：3 步只能串行</text>
  <text x="536.0" y="50.0" class="tx" font-size="12.5" text-anchor="middle" dominant-baseline="middle" font-weight="700">分块：把这串依赖写成一个方程组</text>
  <rect x="400.0" y="80.0" width="27.0" height="27.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="413.5" y="93.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">1</text>
  <rect x="430.0" y="80.0" width="27.0" height="27.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="443.5" y="93.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">0</text>
  <rect x="460.0" y="80.0" width="27.0" height="27.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="473.5" y="93.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">0</text>
  <rect x="400.0" y="110.0" width="27.0" height="27.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="413.5" y="123.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">0.6</text>
  <rect x="430.0" y="110.0" width="27.0" height="27.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="443.5" y="123.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">1</text>
  <rect x="460.0" y="110.0" width="27.0" height="27.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="473.5" y="123.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">0</text>
  <rect x="400.0" y="140.0" width="27.0" height="27.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="413.5" y="153.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">0</text>
  <rect x="430.0" y="140.0" width="27.0" height="27.0" rx="3" class="blue" stroke-width="1.3"/>
  <text x="443.5" y="153.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">0.4</text>
  <rect x="460.0" y="140.0" width="27.0" height="27.0" rx="3" class="gray" stroke-width="1.3"/>
  <text x="473.5" y="153.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">1</text>
  <text x="500.0" y="125.0" class="tx" font-size="16" text-anchor="middle" dominant-baseline="middle" font-weight="700">·</text>
  <rect x="512.0" y="80.0" width="34.0" height="27.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="529.0" y="93.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">u₁</text>
  <rect x="512.0" y="110.0" width="34.0" height="27.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="529.0" y="123.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">u₂</text>
  <rect x="512.0" y="140.0" width="34.0" height="27.0" rx="3" class="orange" stroke-width="1.3"/>
  <text x="529.0" y="153.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">u₃</text>
  <text x="560.0" y="125.0" class="tx" font-size="14" text-anchor="middle" dominant-baseline="middle" font-weight="700">=</text>
  <rect x="572.0" y="80.0" width="48.0" height="27.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="596.0" y="93.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">β₁v₁</text>
  <rect x="572.0" y="110.0" width="48.0" height="27.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="596.0" y="123.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">β₂v₂</text>
  <rect x="572.0" y="140.0" width="48.0" height="27.0" rx="3" class="green" stroke-width="1.3"/>
  <text x="596.0" y="153.5" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">β₃v₃</text>
  <text x="536.0" y="186.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">蓝格 = βₜ·(kₜ·kⱼ)：前面写的会"抵消"后面多少</text>
  <text x="536.0" y="210.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">一次 solve_triangular 同时解出 u₁、u₂、u₃</text>
  <text x="536.0" y="236.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">输出 O = (Q·Kᵀ 只留下三角) · U</text>
  <text x="536.0" y="256.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">块末的表 S = S₀ + Kᵀ·U</text>
  <text x="536.0" y="276.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">都是矩阵乘，GPU 一次算完</text>
  <line x1="16.0" y1="300.0" x2="704.0" y2="300.0" class="ln" stroke-width="0.6" stroke-opacity="0.3"/>
  <text x="16.0" y="322.0" class="tx" font-size="12.5" text-anchor="start" dominant-baseline="middle" font-weight="700">块间：和递推一样只传一张表</text>
  <rect x="30.0" y="340.0" width="120.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="90.0" y="360.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">块 0：64 个 token</text>
  <line x1="150.0" y1="360.0" x2="195.0" y2="360.0" class="ln" stroke-width="1.4"/>
  <polygon points="200.0,360.0 193.9,363.4 193.9,356.6" class="ah"/>
  <text x="175.0" y="350.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">S</text>
  <rect x="202.0" y="340.0" width="120.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="262.0" y="360.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">块 1：64 个 token</text>
  <line x1="322.0" y1="360.0" x2="367.0" y2="360.0" class="ln" stroke-width="1.4"/>
  <polygon points="372.0,360.0 365.9,363.4 365.9,356.6" class="ah"/>
  <text x="347.0" y="350.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">S</text>
  <rect x="374.0" y="340.0" width="120.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="434.0" y="360.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">块 2：64 个 token</text>
  <line x1="494.0" y1="360.0" x2="539.0" y2="360.0" class="ln" stroke-width="1.4"/>
  <polygon points="544.0,360.0 537.9,363.4 537.9,356.6" class="ah"/>
  <text x="519.0" y="350.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">S</text>
  <rect x="546.0" y="340.0" width="120.0" height="40.0" rx="7" class="blue" stroke-width="1.3"/>
  <text x="606.0" y="360.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">……</text>
  <text x="360.0" y="404.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">块内并行（矩阵乘），块间串行（只传 S）：T 步循环变成 T / 64 步</text>
  <text x="360.0" y="428.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">第 8 章实测：一层线性注意力过 279 个 token，分块比递推快将近十倍；两种算法的输出只差 1e-7 量级</text>
  <text x="360.0" y="452.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">加上衰减时，每一项再乘上两个 token 之间的累计衰减，就是代码里那几个 G.exp()</text>
</svg>
