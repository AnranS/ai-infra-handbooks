  <text x="170.0" y="150.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">DeepSeek-V3 规模：128 头 × 128 维 × 2 = 32768 个数 / token / 层</text>
  <text x="520.0" y="22.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">MLA：只缓存潜向量 c</text>
  <rect x="400.0" y="44.0" width="60.0" height="28.0" rx="5" class="gray" stroke-width="1.3"/>
  <text x="430.0" y="58.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">h</text>
  <line x1="460.0" y1="58.0" x2="495.0" y2="58.0" class="ln" stroke-width="1.2"/>
  <polygon points="500.0,58.0 493.9,61.4 493.9,54.6" class="ah"/>
  <text x="480.0" y="49.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">W_DKV</text>
  <rect x="500.0" y="44.0" width="90.0" height="28.0" rx="5" class="green" stroke-width="1.8"/>
  <text x="545.0" y="58.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">c（512 维）</text>
  <text x="545.0" y="88.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle"><tspan x="545.0" dy="-6.2">KV Cache 里只有它</tspan><tspan x="545.0" dy="12.4">（+ 64 维 RoPE 键）</tspan></text>
  <line x1="545.0" y1="102.0" x2="545.0" y2="123.0" class="ln" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.6"/>
  <polygon points="545.0,128.0 541.6,121.9 548.4,121.9" class="ah"/>
  <rect x="470.0" y="128.0" width="150.0" height="26.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="545.0" y="141.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">k⁽ⁱ⁾ = c·W_UK⁽ⁱ⁾，v⁽ⁱ⁾ = c·W_UV⁽ⁱ⁾</text>
  <text x="545.0" y="168.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">需要时每个头各自从 c 还原（朴素做法）</text>
  <text x="350.0" y="206.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="600">权重吸收：不还原 K、V，把 W_UK 并进 query、W_UV 并进输出投影</text>
  <rect x="60.0" y="228.0" width="150.0" height="30.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="135.0" y="243.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">q̃⁽ⁱ⁾ = W_UK⁽ⁱ⁾ᵀ q⁽ⁱ⁾</text>
  <line x1="210.0" y1="243.0" x2="255.0" y2="243.0" class="ln" stroke-width="1.2"/>
  <polygon points="260.0,243.0 253.9,246.4 253.9,239.6" class="ah"/>
  <text x="235.0" y="234.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">点积</text>
  <rect x="260.0" y="228.0" width="110.0" height="30.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="315.0" y="243.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">缓存的 c_j</text>
  <line x1="370.0" y1="243.0" x2="415.0" y2="243.0" class="ln" stroke-width="1.2"/>
  <polygon points="420.0,243.0 413.9,246.4 413.9,239.6" class="ah"/>
  <text x="395.0" y="234.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">softmax</text>
  <rect x="420.0" y="228.0" width="110.0" height="30.0" rx="6" class="green" stroke-width="1.3"/>
  <text x="475.0" y="243.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Σ pⱼ c_j</text>
  <line x1="530.0" y1="243.0" x2="575.0" y2="243.0" class="ln" stroke-width="1.2"/>
  <polygon points="580.0,243.0 573.9,246.4 573.9,239.6" class="ah"/>
  <text x="555.0" y="234.0" class="mu" font-size="10" text-anchor="middle" dominant-baseline="middle">W_UV</text>
  <rect x="580.0" y="228.0" width="100.0" height="30.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="630.0" y="243.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">输出</text>
  <text x="350.0" y="282.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">decode 时相当于 128 个 query 头共享同一份 512 维的 K = V：缓存 576 个数 / token / 层，是 MHA 的 1/57</text>
</svg>
