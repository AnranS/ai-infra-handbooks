  <line x1="220.0" y1="150.0" x2="330.0" y2="71.0" class="ln" stroke-width="0.8" stroke-opacity="0.18"/>
  <rect x="330.0" y="90.0" width="110.0" height="24.0" rx="5" class="orange" stroke-width="1.6"/>
