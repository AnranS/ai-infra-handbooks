  <polygon points="500.0,150.0 493.1,148.8 497.3,143.5" class="orange-s"/>
  <rect x="330.0" y="121.0" width="110.0" height="24.0" rx="5" class="gray" stroke-width="1"/>
  <text x="385.0" y="133.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">expert 4 (small FFN)</text>
  <line x1="220.0" y1="150.0" x2="330.0" y2="133.0" class="ln" stroke-width="0.8" stroke-opacity="0.18"/>
