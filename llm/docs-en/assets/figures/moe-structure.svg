  <text x="625.0" y="150.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">y = Σ wᵢ·Expertᵢ(x)</text>
  <text x="250.0" y="232.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="250.0" dy="-6.5">top-2: only 2 experts compute;</tspan><tspan x="250.0" dy="13.0">the other 6 sit this step out</tspan></text>
  <text x="600.0" y="215.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" dy="-6.5">active ≈ k experts + shared expert</tspan><tspan x="600.0" dy="13.0">total = all E experts</tspan></text>
</svg>
