  <text x="55.0" y="150.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle">embed</text>
  <rect x="90.0" y="140.0" width="500.0" height="20.0" rx="10" class="green" stroke-width="1.2"/>
  <text x="340.0" y="150.0" class="tx" font-size="11.5" text-anchor="middle" dominant-baseline="middle" font-weight="600">residual stream x  [T, d]</text>
  <rect x="610.0" y="134.0" width="70.0" height="32.0" rx="6" class="gray" stroke-width="1.3"/>
  <text x="645.0" y="150.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle"><tspan x="645.0" dy="-6.5">Norm</tspan><tspan x="645.0" dy="13.0">LM Head</tspan></text>
  <line x1="590.0" y1="150.0" x2="605.0" y2="150.0" class="ln" stroke-width="1.2"/>
  <polygon points="610.0,150.0 603.9,153.4 603.9,146.6" class="ah"/>
  <line x1="130.0" y1="140.0" x2="130.0" y2="99.0" class="ln" stroke-width="1.1"/>
  <polygon points="130.0,94.0 133.4,100.1 126.6,100.1" class="ah"/>
  <text x="94.0" y="117.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">read (Norm)</text>
  <rect x="134.0" y="62.0" width="52.0" height="32.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="160.0" y="78.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">attention</text>
  <line x1="190.0" y1="94.0" x2="190.0" y2="135.0" class="ln" stroke-width="1.1"/>
  <polygon points="190.0,140.0 186.6,133.9 193.4,133.9" class="ah"/>
  <text x="224.0" y="117.0" class="mu" font-size="9.5" text-anchor="middle" dominant-baseline="middle">add (+)</text>
  <line x1="270.0" y1="140.0" x2="270.0" y2="99.0" class="ln" stroke-width="1.1"/>
  <polygon points="270.0,94.0 273.4,100.1 266.6,100.1" class="ah"/>
  <rect x="274.0" y="62.0" width="52.0" height="32.0" rx="6" class="orange" stroke-width="1.3"/>
  <text x="300.0" y="78.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">FFN</text>
  <line x1="330.0" y1="94.0" x2="330.0" y2="135.0" class="ln" stroke-width="1.1"/>
  <polygon points="330.0,140.0 326.6,133.9 333.4,133.9" class="ah"/>
  <line x1="410.0" y1="140.0" x2="410.0" y2="99.0" class="ln" stroke-width="1.1"/>
  <polygon points="410.0,94.0 413.4,100.1 406.6,100.1" class="ah"/>
  <rect x="414.0" y="62.0" width="52.0" height="32.0" rx="6" class="blue" stroke-width="1.3"/>
  <text x="440.0" y="78.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">attention</text>
  <line x1="470.0" y1="94.0" x2="470.0" y2="135.0" class="ln" stroke-width="1.1"/>
  <polygon points="470.0,140.0 466.6,133.9 473.4,133.9" class="ah"/>
  <text x="300.0" y="36.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">layers 1 … N: each layer only "edits" the residual stream a little, never rebuilds it</text>
  <line x1="200.0" y1="160.0" x2="200.0" y2="189.0" class="purple-l" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="200.0,194.0 196.6,187.9 203.4,187.9" class="purple-s"/>
  <rect x="158.0" y="194.0" width="84.0" height="22.0" rx="5" class="purple" stroke-width="1.3"/>
  <text x="200.0" y="205.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">'s (0.21)</text>
  <line x1="360.0" y1="160.0" x2="360.0" y2="189.0" class="purple-l" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="360.0,194.0 356.6,187.9 363.4,187.9" class="purple-s"/>
  <rect x="318.0" y="194.0" width="84.0" height="22.0" rx="5" class="purple" stroke-width="1.3"/>
  <text x="360.0" y="205.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">cap (0.33)</text>
  <line x1="520.0" y1="160.0" x2="520.0" y2="189.0" class="purple-l" stroke-width="1.2" stroke-dasharray="3 3"/>
  <polygon points="520.0,194.0 516.6,187.9 523.4,187.9" class="purple-s"/>
  <rect x="478.0" y="194.0" width="84.0" height="22.0" rx="5" class="purple" stroke-width="1.3"/>
  <text x="520.0" y="205.0" class="tx" font-size="10" text-anchor="middle" dominant-baseline="middle">capital (0.72)</text>
  <text x="360.0" y="242.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">logit lens: decode the residual stream midway with the final Norm + LM head; the guess after "Beijing is China's" sharpens layer by layer</text>
  <text x="360.0" y="268.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">attention moves information between tokens, the FFN processes each token on its own; both talk through the same residual stream</text>
</svg>
