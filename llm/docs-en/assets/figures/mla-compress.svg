  <text x="330.0" y="58.0" class="mu" font-size="12" text-anchor="middle" dominant-baseline="middle">…</text>
  <text x="30.0" y="104.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">V</text>
  <rect x="44.0" y="90.0" width="30.0" height="28.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="59.0" y="104.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">h1</text>
  <rect x="78.0" y="90.0" width="30.0" height="28.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="93.0" y="104.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">h2</text>
  <rect x="112.0" y="90.0" width="30.0" height="28.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="127.0" y="104.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">h3</text>
  <rect x="146.0" y="90.0" width="30.0" height="28.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="161.0" y="104.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">h4</text>
  <rect x="180.0" y="90.0" width="30.0" height="28.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="195.0" y="104.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">h5</text>
  <rect x="214.0" y="90.0" width="30.0" height="28.0" rx="4" class="orange" stroke-width="1.3"/>
  <text x="229.0" y="104.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">h6</text>
  <rect x="248.0" y="90.0" width="30.0" height="28.0" rx="4" class="orange" stroke-width="1.3"/>
