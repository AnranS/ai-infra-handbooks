  <rect x="214.0" y="44.0" width="30.0" height="28.0" rx="4" class="blue" stroke-width="1.3"/>
  <text x="229.0" y="58.0" class="tx" font-size="9.5" text-anchor="middle" dominant-baseline="middle">h6</text>
