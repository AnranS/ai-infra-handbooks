<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" role="img" aria-label="Training computes the predictions of all positions in one forward pass (teacher forcing); inference can only generate one token at a time">
  <text x="30.0" y="22.0" class="tx" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600">Training: sentence known, one pass, all positions</text>
  <rect x="40.0" y="70.0" width="58.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="69.0" y="85.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">Beijing</text>
  <rect x="40.0" y="160.0" width="58.0" height="30.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="69.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">→ is China</text>
  <line x1="69.0" y1="100.0" x2="69.0" y2="155.0" class="ln" stroke-width="1.2"/>
  <polygon points="69.0,160.0 65.6,153.9 72.4,153.9" class="ah"/>
  <rect x="104.0" y="70.0" width="58.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="133.0" y="85.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">is China</text>
  <rect x="104.0" y="160.0" width="58.0" height="30.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="133.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">→ 's</text>
  <line x1="133.0" y1="100.0" x2="133.0" y2="155.0" class="ln" stroke-width="1.2"/>
  <polygon points="133.0,160.0 129.6,153.9 136.4,153.9" class="ah"/>
  <rect x="168.0" y="70.0" width="58.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="197.0" y="85.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">'s</text>
  <rect x="168.0" y="160.0" width="58.0" height="30.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="197.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">→ capital</text>
  <line x1="197.0" y1="100.0" x2="197.0" y2="155.0" class="ln" stroke-width="1.2"/>
  <polygon points="197.0,160.0 193.6,153.9 200.4,153.9" class="ah"/>
  <rect x="232.0" y="70.0" width="58.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="261.0" y="85.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">capital</text>
  <rect x="232.0" y="160.0" width="58.0" height="30.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="261.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">→ ,</text>
  <line x1="261.0" y1="100.0" x2="261.0" y2="155.0" class="ln" stroke-width="1.2"/>
  <polygon points="261.0,160.0 257.6,153.9 264.4,153.9" class="ah"/>
  <rect x="296.0" y="70.0" width="58.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="325.0" y="85.0" class="tx" font-size="12" text-anchor="middle" dominant-baseline="middle">，</text>
  <rect x="296.0" y="160.0" width="58.0" height="30.0" rx="5" class="green" stroke-width="1.3"/>
  <text x="325.0" y="175.0" class="tx" font-size="10.5" text-anchor="middle" dominant-baseline="middle">→ …</text>
  <line x1="325.0" y1="100.0" x2="325.0" y2="155.0" class="ln" stroke-width="1.2"/>
  <polygon points="325.0,160.0 321.6,153.9 328.4,153.9" class="ah"/>
  <rect x="32.0" y="62.0" width="330.0" height="76.0" rx="8" class="gray" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="200.0" y="128.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">one forward pass: position t sees only the first t tokens (causal mask)</text>
  <text x="200.0" y="215.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">loss = mean over 5 positions of −log P(true next token)</text>
  <text x="200.0" y="240.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">compute grows with length, but the weights are read once</text>
  <text x="390.0" y="22.0" class="tx" font-size="13" text-anchor="start" dominant-baseline="middle" font-weight="600">Inference: each token waits for the previous one</text>
  <text x="392.0" y="71.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">step 1</text>
  <rect x="440.0" y="56.0" width="46.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="463.0" y="71.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Beijing</text>
  <rect x="490.0" y="56.0" width="46.0" height="30.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="513.0" y="71.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">is China</text>
  <line x1="544.0" y1="71.0" x2="561.0" y2="71.0" class="ln" stroke-width="1.2"/>
  <polygon points="566.0,71.0 559.9,74.4 559.9,67.6" class="ah"/>
  <text x="586.0" y="71.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">fwd</text>
  <path d="M 586 80 C 586 106 568 106 566 118" class="ln" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="392.0" y="133.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">step 2</text>
  <rect x="440.0" y="118.0" width="46.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="463.0" y="133.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Beijing</text>
  <rect x="490.0" y="118.0" width="46.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="513.0" y="133.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">is China</text>
  <rect x="540.0" y="118.0" width="46.0" height="30.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="563.0" y="133.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">'s</text>
  <line x1="594.0" y1="133.0" x2="611.0" y2="133.0" class="ln" stroke-width="1.2"/>
  <polygon points="616.0,133.0 609.9,136.4 609.9,129.6" class="ah"/>
  <text x="636.0" y="133.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">fwd</text>
  <path d="M 636 142 C 636 168 618 168 616 180" class="ln" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="392.0" y="195.0" class="mu" font-size="10.5" text-anchor="start" dominant-baseline="middle">step 3</text>
  <rect x="440.0" y="180.0" width="46.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="463.0" y="195.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">Beijing</text>
  <rect x="490.0" y="180.0" width="46.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="513.0" y="195.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">is China</text>
  <rect x="540.0" y="180.0" width="46.0" height="30.0" rx="5" class="blue" stroke-width="1.3"/>
  <text x="563.0" y="195.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">'s</text>
  <rect x="590.0" y="180.0" width="46.0" height="30.0" rx="5" class="orange" stroke-width="1.3"/>
  <text x="613.0" y="195.0" class="tx" font-size="11" text-anchor="middle" dominant-baseline="middle">capital</text>
  <line x1="644.0" y1="195.0" x2="661.0" y2="195.0" class="ln" stroke-width="1.2"/>
  <polygon points="666.0,195.0 659.9,198.4 659.9,191.6" class="ah"/>
  <text x="686.0" y="195.0" class="mu" font-size="10.5" text-anchor="middle" dominant-baseline="middle">fwd</text>
  <text x="540.0" y="250.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">every step reads all the weights to compute one token:</text>
  <text x="540.0" y="272.0" class="mu" font-size="11" text-anchor="middle" dominant-baseline="middle">500 tokens = 500 forward passes: decode's memory bottleneck</text>
</svg>
